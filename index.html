内部反复表扬」。他还说明致歉视频是恩塔主动拍的，并回了一句：「老登并不让人反感，有些人的登味儿才让人厌恶，少一些对00后的口诛笔伐。」最后给出承诺：恩塔依然会站在发布会上。","traits":["先抢定性","用内部事实举证","把道歉说成主动","反手把批评者推到对立面","给承诺不给处分"],"methods":["不争「老登」是否冒犯，直接改掉指向：它自始至终是「产品团队对内部核心负责人的调侃」，没有指向外部用户","用内部事实举证：几位被叫作「老登」的高管「没一个不悦，反而在内部反复表扬」","把道歉解释成主动行为：恩塔「看到有没完整看直播的朋友产生误解，觉得是自己措辞有疏漏，才主动拍了视频」","反打一句：「少一些对00后的口诛笔伐」——把批评者放到欺负年轻人的位置上","用自嘲拆掉这个词的杀伤力：把董事长何小鹏称作「老登代表」，让「老登」回到玩笑语境","给承诺不给处分：「恩塔依然会站在发布会上」，明确不处理人"],"story":[{"t":"2026-10-15","d":"小鹏 MONA L05 预售发布会，董事长何小鹏在巴黎连线，把舞台交给 MONA 团队；产品经理恩塔登台，说出「老登怎么会懂年轻人想要什么」「太老登了」"},{"t":"2026-10-22","d":"恩塔发布视频公开致歉，称「有些话说得不合适，心里一直挺内疚的」"},{"t":"2026-10-24","d":"副总裁于涛在社交账号发长文，重新定性事件、说明致歉是恩塔主动提出，并表态恩塔仍会登台"}],"quotes":["「老登」称呼自始至终是产品团队对内部核心负责人的调侃，完全没有指向任何外部用户。","几位被称为「老登」的内部负责人，没一个不悦，反而在内部反复表扬。","老登并不让人反感，有些人的登味儿才让人厌恶，少一些对00后的口诛笔伐。","真正的互联网同学文化，可能不是其它企业上下有别等级森严，而是年轻人敢开老板玩笑的松弛。"],"writingUse":"写「高管的危机回应」用这个。他的手法很标准：不纠缠对错，先改定性；改完定性立刻给证据（当事高管没生气、还表扬）；再把当事人的道歉说成主动；最后反手一句，把批评者放到「欺负年轻人」的位置上。整篇没有一句道歉，却把姿态摆得很低。写法上注意他的顺序——先定性、再举证、再自嘲、最后承诺，一步都不乱。适合写成主角最难对付的那类对手：他不否认事实，只重新解释事实。","sources":[{"publisher":"瑞财经","title":"小鹏副总裁于涛回应“老登”争议：系团队内部调侃，未指向外部用户","url":"https://m.rccaijing.com/news-7519740620547225003.html"},{"publisher":"钛媒体","title":"小鹏的“老登”风波，为什么道歉之后还没结束？","url":"https://www.tmtpost.com/8181004.html"}]},{"id":"zhu-zhiwen-reporter","name":"朱之文","alias":"大衣哥","identity":"农民歌手，山东单县朱楼村人","category":"社会切片","date":"2026-10-26","heat":84,"headline":"山东“大衣哥”朱之文长期遭黑粉举报,十几场演出取消,回家种地:他就是看不得别人好,“攻击我好几年了,敢说你的真名不?”","summary":"2026年10月，山东单县农民歌手朱之文说自己被有组织的黑粉盯了几年：只要他去外地商演，对方就往文旅部门和主办方集中投诉，统一口径称他是「劣迹艺人」。一个月里十几个城市的演出临时叫停，有人已经上了高铁又被通知取消。他从没被任何官方部门认定违规。这一次他不再忍：拒绝接受道歉，说证据已在固定、准备起诉；还在镜头前报出自己的真名、村子和门牌，反问对方敢不敢报姓名和单位。","traits":["认死理","不搬离原地","把证据攒够再动手","公开对赌","拒绝和解"],"methods":["被举报不辩解，先把证据固定下来：截图、录屏、公证保全，攒够再一次性起诉","把对方的匿名优势拆掉：在镜头前报出真名、村名、门牌，反问「你敢说你真实的地址不？你敢说你的真名，报你的工作单位不？」","不接道歉：明确「不接受道歉，该怎么判就怎么判，损失该赔就赔」","用退路压价：反复说「大不了不挣钱，我在家种地」，把经济威胁归零，谈判里剩下的就只是是非","不搬走：爆红后仍住村里，修路、装水泵、添健身器材，把「我没有变」做成别人能看见的事实","只做本职：不碰直播带货，商演报价多年不变，一场十万上下唱三首"],"story":[{"t":"2011","d":"因一曲《滚滚长江东逝水》走红，此后长期住在单县郭村镇朱楼村，家门口常年有人举着手机拍摄"},{"t":"2020-04","d":"有「粉丝」酒后求见，用脚踹开他家大门，因涉嫌寻衅滋事被行政拘留 10 天"},{"t":"2025-11","d":"长期发侮辱诽谤视频的孙某一审被判有期徒刑六个月，当庭羁押"},{"t":"2026-09~10","d":"青岛、郑州、泰安等多地演出因举报临时取消，有的已付定金；有人建群盯他行程，走到哪举报跟到哪"},{"t":"2026-10-25","d":"受访喊话黑粉「不要像老鼠屎一样」，称已固定大量证据，这次不接受道歉、准备起诉"}],"quotes":["「不要像老鼠屎一样，举报这个举报那个，那是男子汉做的事情吗？」","「我的艺名叫大衣哥，我的真名叫朱之文，我家住在山东省菏泽市单县郭村镇朱楼村。你敢说你真实的地址不？你敢说你的真名，报你的工作单位不？」","「我朱之文，宁愿站着死，不要躺着亡。」","「我唱不了歌，咱大不了不挣钱，我在家，你看喂的鸡这么大，我还有几亩田，我在家种地好不好。我不欠你的，不吃你的不喝你的。」"],"writingUse":"写「被围猎的老实人怎么反击」。他的反击不是情绪爆发，是程序：先攒证据，再把真名住址摆上台面和对方对赌，然后拒绝任何和解，最后反复强调自己有条退路。这套顺序的关键在最后一步——把「我不靠这个吃饭」说出口，对方的威胁就全部失效了。适合写成那种看着木讷、其实每一步都算准了的角色；也适合写「老实人一旦认真起来，比狠人更难缠」。","sources":[{"publisher":"澎湃新闻","title":"最新 | 知名艺人喊话:不要像老鼠屎一样!","url":"https://m.thepaper.cn/newsDetail_forward_34331518"},{"publisher":"九派新闻","title":"“大衣哥”朱之文长期遭黑粉举报,十几场演出取消,已回家种地:宁愿站着死,不要躺着亡,大不了不挣钱,但得争口气,这次绝对不会放过你","url":"https://news.qq.com/rain/a/20261026A04ERU00"},{"publisher":"红星新闻","title":"山东“大衣哥”朱之文长期遭黑粉举报,十几场演出取消,回家种地:他就是看不得别人好,“攻击我好几年了,敢说你的真名不?”","url":"https://www.toutiao.com/article/7700775793391960610"},{"publisher":"中华网","title":"大衣哥遭黑粉举报十几场演出取消 坚决维权讨公道","url":"https://3g.china.com/act/ent/11005281/20261026/49816972.html"}]},{"id":"li-ziqi-offer8","name":"李子祺","alias":"「盲猜哥」","identity":"福建医科大学神经外科专业博士生，《令人心动的offer》第八季实习生","category":"社会切片","date":"2026-10-26","heat":80,"headline":"李子祺盲猜是颅咽管瘤,校方称不上临床系误解并已完成18个月临床轮转","summary":"10月21日《令人心动的offer》第八季医学季开播，福建医科大学神经外科博士生李子祺被包装成「10篇SCI、参与四级手术」的大神。读片考核中他说「我盲猜是颅咽管瘤」，被带教老师当场打断；此前还说过「博士期间不上临床」。校方回应称后者是表达不当造成的误解，该生已完成18个月临床轮转，纪委暂未收到学术造假举报。网友逐篇查论文，认为第一作者仅一篇。人民日报发锐评《临床不是秀场，医学不容盲猜》。","traits":["把不确定说成确定","用玩笑挡专业","被追问才改口","认态度不认事实","话说得比判断快"],"methods":["给结论前先加一句「我盲猜」，等于提前给自己留退路，说错了也只是猜错","把专业流程降格成套路：「写病历只是套路，一天就能学会」，用轻描淡写消掉门槛","用身份豁免责任：以「博士」身份说出「博士期间不上临床」，把不在场解释成制度安排","被带教老师当场打断「你不能盲猜」后不硬顶，上台重新看片、把结论再走一遍流程","事后只认态度不认事实：「一开始我就是抱着玩的心情来的」，把问题框在「不认真」而不是「不专业」","回应集中在综艺表现，不碰 SCI 数量与作者位次"],"story":[{"t":"2026-10-21","d":"《令人心动的offer8》首播，读片考核中说出「我盲猜，以我们的特色来说，他肯定是颅咽管瘤」，带教老师当场打断「你不能盲猜」"},{"t":"2026-10-21","d":"福建医科大学回应：「博士期间不上临床」系表达不当造成的误解，该生已完成 18 个月临床轮转，纪委暂未收到学术造假举报"},{"t":"2026-10-22","d":"中青评论发文《尊重生命永远是医疗行业的核心》；网传其请假时称去广州参加培训，校方未证实"},{"t":"2026-10-25","d":"人民日报发表锐评《临床不是秀场，医学不容盲猜》，讨论从个人转向医学教育评价体系重论文轻临床"},{"t":"2026-10-25","d":"他在看片会上承认起初态度不端正，「一开始我就是抱着玩的心情来的」"}],"quotes":["「我盲猜，以我们的特色来说，他肯定是颅咽管瘤。」","「写病历只是套路，一天就能学会。」","「博士期间不上临床。」","「一开始我就是抱着玩的心情来的。」"],"writingUse":"写「被包装出来的天才怎么露馅」。他不是骗子，也没有伪造，只是在镜头前把「大概」说成了「肯定」，把「没做过」说成了「不用做」。真正塌的是别人给他搭的那层壳。写这个角色时，让他每一句狂话都有个听起来合理的出处——节目给的简历、学校给的学制、同行默认的沉默——壳塌的时候，他自己也愣住。适合写行业里那种「论文很漂亮、手上的活很生」的年轻人，以及一个把人推上台、再看着他摔下去的系统。","sources":[{"publisher":"新浪新闻","title":"李子祺盲猜是颅咽管瘤,校方称不上临床系误解并已完成18个月临床轮转","url":"https://k.sina.com.cn/article_7857201851_1d45362bb06801k3n6.html"},{"publisher":"凤凰网","title":"医学博士生“不上临床”、盲猜癌症…《令人心动的offer》第八季这么烧心吗?","url":"https://news.ifeng.com/c/8xTpbU9G8Xx"},{"publisher":"潮新闻","title":"医学生自称“手握10篇SCI”上综艺,博士期间不上临床,引争议!所在高校回应了","url":"https://www.toutiao.com/article/7700541410520351275/"},{"publisher":"搜狐","title":"人民日报批评\"盲猜\"读片:你手里的CT报告,也可能是初步判断","url":"https://yule.sohu.com/a/1092243821_122660546"}]},{"id":"fang-wei-hna","name":"方威","alias":"方大系掌门人","identity":"辽宁方大集团董事局主席、新海航实控人","category":"商界狠人","date":"2026-10-26","heat":72,"headline":"“这是你的本职工作,你不应该干吗?”新海航实控人方威严厉批评法务额外提奖","summary":"10月25日消息，新海航实控人方威在内部管理会议上点名批评祥鹏航空法务部门：一起事实清晰、依据充分的诉讼打赢了，法务申请专项奖励，他不批。「你拿着工资，这是你的本职工作，你不应该干吗？」他划了线：该你干的，干成了是本分；本来要输的官司赢下来才算额外，奖励比例可到 50% 甚至更高。公司自己管理出问题把自己拖进被动的，先问责、再谈奖励。","traits":["用「本职」划边界","先问责再谈奖","只考规模不考利润","承诺先行、考核后置","连坐式追责"],"methods":["用一句话把奖励申请打回：「你拿着工资，这是你的本职工作，你不应该干吗？」","给奖励划硬边界：该赢的赢下来是分内，本来要输的赢下来才算额外","反向定价：败诉风险高、靠专业能力把局面扭过来的案子，奖励比例可到 50% 甚至更高","先问责再奖励：公司自己管理出问题把自己拖进被动的，先免职、再谈奖励","卡流程：上报奖惩必须先自审合理性，只报奖励、不处理责任人的，不许报","连坐：审核把关缺位，从集团总裁开始，所有签过字的人一起担责","承诺先行：2021 年入主时先给「不派人、不裁员、不降薪、按时发工资」的承诺稳住人，再上考核"],"story":[{"t":"2021","d":"辽宁方大以 410 亿元总对价入主海航航空板块，方威成为实控人；第一次干部会上承诺不派任何人、不裁员、不降薪，2022 年 1 月起恢复所有福利"},{"t":"2022-01","d":"福利如期恢复；推行「赛马」排名，十多项业务各自排序，退步与末位企业代表上台汇报，严重的降职"},{"t":"2026-10","d":"有旅客在海航航班发现过期泡面，方威给旅客奖励 2000 元，并要求学胖东来，举报过期产品一律奖 2000 元"},{"t":"2026-10-25","d":"内部管理会议上批评祥鹏航空法务提奖，提出「本职工作」边界与签字连坐追责"}],"quotes":["「你拿着工资，这是你的本职工作，你不应该干吗？」","「所有的干部员工绝对不允许躺平。」","「干部不担当、占着位置不作为，不管老中青，都要免掉。」"],"writingUse":"写「老板怎么定义你的工资」。他不谈情怀，只做一件事：把「该你干的」和「超出该干的」切开，然后分别定价。切开之后，抱怨就失去了落点——你说累，他说这是工资里已经付过的。这套逻辑的杀伤力在于它自洽，而且他真有配套：该赢的赢下来不奖，几乎要输的赢下来奖 50%，自己管理出问题的先免职。写霸道型管理者时，别只写他骂人，写他这套账怎么算得比谁都清楚；也适合写「一个把组织当机器校准的人，最后会把人也当零件」。","sources":[{"publisher":"新浪财经","title":"“这是你的本职工作,你不应该干吗?”新海航实控人方威严厉批评法务额外提奖","url":"https://finance.sina.com.cn/tech/shenji/2026-10-25/doc-iniwmapc3411834.shtml"},{"publisher":"腾讯网","title":"“这是你的本职工作,你不应该干吗?”新海航实控人方威严厉批评法务额外提奖","url":"https://new.qq.com/rain/a/20261025A04QLK00"},{"publisher":"微信公众号·ANIX","title":"海航实控人怒斥法务申请额外奖励:你拿工资干本职工作,不应该干吗","url":"http://mp.weixin.qq.com/s?__biz=MzY5MzQ1NzY3OQ==&mid=2247483783&idx=1&sn=55cef6b9237d94c5352fbfa25db7231b"}]},{"id":"zhao-liying-guanzhu","name":"赵丽颖","alias":"颖宝","identity":"演员","category":"娱乐圈","date":"2026-10-26","heat":70,"headline":"赵丽颖直播称没有关注粉丝冲上热搜,连麦粉丝当事人辟谣:是断章取义","summary":"10月23日晚，赵丽颖缺席 VOGUE 时尚之力盛会，转而在《AI潮玩人气大赛》直播间露面。连麦时有粉丝说「我们默默关注你们很久啦」，她回了四个字：「没有关注。」片段被单独截出，#赵丽颖直播称没有关注粉丝# 冲上热搜，一部分人解读成冷淡。连麦的粉丝随后多次澄清，说那是两人之间的玩笑；#赵丽颖很爱粉丝# 随之登顶。同场造型也被粉丝吐槽「灾难级妆造」，工作室发出她对镜吹头发的视频应对。","traits":["不做情绪表演","直答不修饰","不解释","该配合的照做"],"methods":["面对「你是不是不爱我们」这种情感提问，直接给事实答案：「没有关注」，不补一句场面话","不写长文、不解释、不买热搜，让连麦当事人自己出面澄清","该配合的照做：连麦全程配合互动，还叮嘱粉丝照顾好自己","造型被骂不回应内容，改发一条「对镜吹头发」的视频，把话题从审美拉回日常","把关系留在私下：不把「关注」当成需要公示的凭证"],"story":[{"t":"2026-10-23","d":"缺席 VOGUE 时尚之力盛会，现身《AI潮玩人气大赛》直播，与谢娜、杜华同框"},{"t":"2026-10-23","d":"连麦粉丝表白「我们默默关注你们很久啦」，她回「没有关注」，片段被截出后登上热搜"},{"t":"2026-10-24","d":"连麦粉丝发声澄清是玩笑、指责断章取义；#赵丽颖很爱粉丝# 登顶；同场造型被批「灾难级妆造」"},{"t":"2026-10-24","d":"工作室发布她对镜吹头发的视频，回应妆造争议"}],"quotes":["「没有关注。」","「你们骂我我都不会哭，但是受到安慰就不行。」"],"writingUse":"写「不会营业的人怎么活在被解读里」。她没有任何公关动作，四个字就是全部回应，剩下的交给当事人和粉丝自己吵。这种处理在流量逻辑里是失分的，但它有一个副作用：所有替她说话的人都显得比她本人更用力。写这类角色时，把她的沉默写成一种选择而不是迟钝——她知道补一句场面话就能过关，但她不补。适合写那种被时代推着走、始终学不会表演亲密的人。","sources":[{"publisher":"搜狐娱乐","title":"赵丽颖直播称没有关注粉丝冲上热搜,连麦粉丝当事人辟谣:是断章取义","url":"https://yule.sohu.com/a/1092479090_121981587"}]},{"id":"chen-he-comment","name":"陈赫","alias":"","identity":"演员 · 歌手","category":"娱乐圈","date":"2026-10-27","heat":67,"headline":"陈赫直播回应争议：被骂容易祝福难，眼睛红了一块","summary":"10月26日，有网友发现陈赫在一个男主播的视频下留言「可爱」，被质疑是「忘切小号」，话题迅速发酵。当天下午陈赫工作室先发文划边界：欢迎拿新歌当 BGM 创作，「善意的分享我们都很欢迎」，但「有些人额外加戏、编造莫须有的传闻，我们就不欢迎了」。当晚陈赫本人开直播回应：看到自己的音乐被当作背景音乐他其实很高兴，但因为争议，对方把作品隐藏了；他反问「遇到一个帖子，大家是想骂一句还是祝福一下」，说事情被扭曲成很奇怪的方向，自己很伤心，直播里眼睛红了一块。","traits":["先划边界再示弱","把指控改写成误会","用反问代替辩解","在镜头前露情绪"],"methods":["工作室先定性、划边界：欢迎二创，「编造莫须有的传闻，我们就不欢迎了」——不解释截图，直接给对方的行为定性","把争议还原成一个具体场景：男主播用了他的新歌《瘦不回去的胖子》当 BGM，他只是去评论了听众的作品","本人随后出镜而不是发通稿：直播里说「看到自己的音乐被当作背景音乐，自己很高兴」","用反问把选择权交回观众：「遇到一个帖子，大家是想骂一句还是祝福一下」","把损失说出来：因为争议，对方把发布的作品隐藏了——把「我被冤枉」换成「别人被我连累」","在镜头前露情绪：说事情被扭曲很伤心，眼睛红了一块，但不掉眼泪、不控诉"],"story":[{"t":"2026-10-26 白天","d":"网友发现陈赫在一位男主播视频下留言「可爱」，质疑「忘切小号」，话题发酵；该男主播视频使用了陈赫新歌作为 BGM"},{"t":"2026-10-26 下午","d":"陈赫工作室发文：欢迎用新歌创作，「有些人额外加戏、编造莫须有的传闻，我们就不欢迎了」"},{"t":"2026-10-26 晚","d":"陈赫开直播回应，称事情被扭曲、很伤心，眼睛红了一块"}],"quotes":["遇到一个帖子，大家是想骂一句还是祝福一下。","事情被扭曲，被引导成很奇怪的方向，自己很伤心。","善意的分享我们都很欢迎……有些人额外加戏、编造莫须有的传闻，我们就不欢迎了。"],"writingUse":"写「被误读的公众人物」用这个。他的处理分两层：工作室负责硬的部分——不纠缠截图真假，直接给「编故事」定性；本人负责软的部分——直播里不辩解，只说「我很高兴有人用我的歌」「别人因为我把作品藏了」「我很伤心」。一硬一软，把「你是不是手滑」变成了「你们是不是过度解读」。写法上注意他全程没否认那条留言，因为否认就输了；他只改写了留言的动机。","sources":[{"publisher":"新浪新闻 · 现代快报","title":"陈赫直播回应争议：被骂容易祝福难，眼睛红了一块","url":"https://www.sina.cn/news/detail/5358370458435927.html"},{"publisher":"新浪娱乐（微博）","title":"陈赫工作室回应争议","url":"https://www.sina.cn/news/detail/5358334073112018.html"}]},{"id":"mbappe-apology","name":"姆巴佩","alias":"Kylian Mbappé","identity":"法国足球运动员","category":"社会切片","date":"2026-10-28","heat":78,"headline":"刚刚 | 姆巴佩，致歉！","summary":"10月27日晚，姆巴佩就近期一次采访中的言论发表声明致歉。他说，自己在采访中回应了一张以他为主角的图片，如今明白「这些话伤害了中国以及世界各地华人社区的许多人」，向所有被伤害的人道歉，并强调「这绝非我的本意」，同时表示「我对中国人民及其历史怀有深深的敬意，我真心感到抱歉」。此前，央视已全面叫停与姆巴佩相关的内容；当天上午 9 点 43 分，东鹏饮料发布声明终止与他的全部合作，其负责人称「昨晚 11 点多发生的事，12 点之前我们就关注到了」。","traits":["道歉不解释动机","先认伤害再谈本意","把敬意摆出来","一句话收尾不展开"],"methods":["先点明伤害的对象和范围：不是「如果冒犯了谁」，而是「伤害了中国以及世界各地华人社区的许多人」","把动机和后果切开：「这绝非我的本意」——承认结果，不为自己找理由","不解释当时采访的上下文，也不提那张图片是什么，直接进入道歉","搬出敬意当句子的落点：「我对中国人民及其历史怀有深深的敬意」","用一句「我真心感到抱歉」结束，不追加、不辩解、不要求原谅"],"story":[{"t":"2026-10 下旬","d":"在一次采访中回应了一张以自己为主角的图片，相关言论引发争议"},{"t":"2026-10-27 前后","d":"央视全面叫停与姆巴佩相关的内容"},{"t":"2026-10-27 上午 9:43","d":"东鹏饮料发布声明，终止与姆巴佩的全部合作；负责人称前一晚 12 点前已关注到事件"},{"t":"2026-10-27 晚","d":"姆巴佩发表声明致歉，承认言论欠妥、向被伤害的人道歉，并表示对中国历史怀有敬意"}],"quotes":["我的言论欠妥，如今我明白，这些话伤害了中国以及世界各地华人社区的许多人。","我向所有被我的言论所伤害的人道歉。这绝非我的本意。","我对中国人民及其历史怀有深深的敬意，我真心感到抱歉。"],"writingUse":"写「标准道歉」用这个。它的结构值得抄：先认伤害（而且是具体到「中国以及世界各地华人社区的许多人」，不是含糊的「大家」），再把动机切出去（「这绝非我的本意」），然后用一句敬意把姿态放低，最后以道歉收尾。整段没有一句解释，也没有一句「但是」。写法上注意他省略了什么——采访的上下文、那张图片、是谁先挑起——所有能引发二次争论的东西都被删掉了。适合写成主角在公关团队指导下发出的第一封声明，也适合写成「真诚但不走心」的反面教材：读者会问，他到底是为言论道歉，还是为商业损失道歉。","sources":[{"publisher":"澎湃新闻 · 天津广播","title":"刚刚 | 姆巴佩，致歉！","url":"https://m.thepaper.cn/newsDetail_forward_34344672"},{"publisher":"星島頭條","title":"麥巴比辱華風波｜發三語聲明致歉：言論欠妥 對中國歷史懷深深敬意","url":"https://www.stheadline.com/realtime-china/3630629/"}]},{"id":"le-zai-affair","name":"乐仔","alias":"乐仔Levi","identity":"带货网红 · 百万粉丝主播","category":"娱乐圈","date":"2026-10-29","heat":76,"headline":"百万粉丝网红乐仔被女友控诉出轨21人！乐仔公开道歉补偿50万","summary":"10 月下旬，带货网红乐仔（Levi）被相恋四年的女友发万字长文控诉，对方称四年间他出轨 21 人，并列出时间线：2022 年起她扶持他事业、挂职在他公司领薪；2024 年 8 月她第一次发现他与同楼女邻居的关系，因此患上严重的心理问题、靠抗抑郁药度日，但选择了原谅；2026 年 10 月两人临近见父母谈婚论嫁，她又在他手机里发现 6 位女性的转账记录。乐仔随后发文道歉，承认「做出了背叛感情的行为」，并给出补偿：50 万元现金、承担她每月 2.85 万元房租一年、每月 2.5 万元生活费至少半年。另据报道，他否认了「21 人」这一表述。","traits":["靠人设立身","认行为不认数量","用钱结案","把道歉做成一份补偿方案"],"methods":["先立一个和真实相反的人设：直播间主打「深情专一」，人设越具体，塌的时候越响","被控之后只认行为、不认数字：承认「做出了背叛感情的行为」，但否认「21 人」这个具体表述","把道歉换算成一笔账：50 万现金 + 一年房租（每月 2.85 万）+ 至少半年生活费（每月 2.5 万）","用转账代替解释：不交代时间线、不解释细节，直接给一份可执行的补偿清单","让女方替他公布时间线：万字长文、实名名单由对方发出，他只在结论处出现"],"story":[{"t":"2022 年起","d":"女友扶持其事业，挂职在他的公司领薪"},{"t":"2024-08","d":"女友第一次发现他与同楼女邻居的关系，对方承认这段关系已持续六七年；女友出现严重心理问题，但选择原谅"},{"t":"2026-10","d":"两人临近见父母谈婚论嫁，女友再次在其手机中发现 6 位女性的转账记录与大量不雅言论，选择全网曝光并分手"},{"t":"2026-10 下旬","d":"乐仔发文道歉，承认背叛感情，给出 50 万现金、一年房租、半年生活费的补偿方案；另据报道他否认「21 人」的表述"}],"quotes":["做出了背叛感情的行为。"],"writingUse":"写「用人设赚钱的人」用这个。他的塌房不是私德问题，是商业模式崩了：粉丝买的不是货，是「深情专一」这个设定。最值得写的一笔是他道歉的方式——不解释、不辩白，直接掏出一份补偿清单，把感情换算成房租和生活费。这种人在小说里很好用：他不是不会痛，他是习惯用钱把痛买断。写他时给他一个反差动作——一边转账，一边在直播间继续讲「专一」的段子。另外注意那个「否认 21 人」：他承认自己背叛，但拒绝接受对方给的数字，因为数字一认，性质就变了。","sources":[{"publisher":"网易","title":"百万粉丝网红乐仔被女友控诉出轨21人！乐仔公开道歉补偿50万","url":"https://www.163.com/dy/article/LAC3PG2B0517GPPO.html"},{"publisher":"腾讯新闻","title":"震碎三观！网红乐仔4年出轨21人，拿百万巨款求原谅，网友直呼：时间管理大师！","url":"https://view.inews.qq.com/a/20261028A0A6AB00"},{"publisher":"新浪新闻","title":"从原谅到曝光，她因长期背叛患上抑郁，男方否认 21 人","url":"https://www.sina.cn/news/detail/5359085056951130.html"}]},{"id":"wang-teng-thanks","name":"王腾","alias":"今日宜休创始人","identity":"ISHO「今日宜休」创始人 · 小米中国区市场部原总经理","category":"商界狠人","date":"2026-10-30","heat":72,"headline":"王腾发布会公开向小米、雷军致谢：真心实意感激过往这段经历，学到许多","summary":"10月29日晚，在 ISHO「今日宜休」AI 睡眠科技生态产品发布会的最后，创始人王腾公开向小米和雷军致谢，表示之前学到了许多。有人质疑他在蹭雷军流量，他回应称自己是真心实意感激过往这段经历，「虽然今天自己已经开始创业，但还是非常珍惜过往的这段经历」。王腾此前任小米中国区市场部总经理，兼任 REDMI 品牌总经理；去年 9 月小米发布内部公告，给予他辞退处分，他随后在微博写道：「过去犯了一些错误，接受该有的代价。」","traits":["在自家场子提旧主","认账不喊冤","把质疑翻译成动机","用「学到」收尾"],"methods":["在自己的产品发布会最后主动提旧主：不是被问到，是主动致谢小米和雷军","被质疑蹭流量时不否认受益，只强调动机：「真心实意感激过往这段经历」","把「创业」和「旧经历」摆在一起说：「虽然今天自己已经开始创业，但还是非常珍惜过往的这段经历」","认账在前：被辞退时就写「过去犯了一些错误，接受该有的代价」——不解释细节、不喊冤","把恩怨翻译成成长：反复用「学到许多」收尾，让这件事只能往正面解读"],"story":[{"t":"2025-09","d":"小米发布内部公告，给予时任中国区市场部总经理王腾辞退处分"},{"t":"2025-09","d":"王腾在微博发文：「过去犯了一些错误，接受该有的代价。」"},{"t":"2026-10-29 晚","d":"在 ISHO「今日宜休」发布会最后公开向小米、雷军致谢，回应「蹭流量」质疑称是真心感激"}],"quotes":["真心实意感激过往这段经历，学到许多。","虽然今天自己已经开始创业，但还是非常珍惜过往的这段经历。","过去犯了一些错误，接受该有的代价。"],"writingUse":"写「体面地离开、又体面地回头」用这个。他身上最值钱的一笔是「认账」：被辞退当天就说「接受该有的代价」，没有解释、没有喊冤；一年后在自家发布会上又主动提旧主，把这段经历说成「学到许多」。这种人最难被对手攻击，因为他把所有能被攻击的点都提前认了。写法上给他一个固定习惯：任何敏感话题都先认下自己那部分，再把话题转向「我从中得到什么」。适合写成主角身边那个摔过一跤、但从不装没事的合伙人。","sources":[{"publisher":"IT之家","title":"王腾发布会公开向小米、雷军致谢：真心实意感激过往这段经历，学到许多","url":"https://it.ithome.com/archiver/1/019/756.htm"},{"publisher":"同花顺","title":"王腾发布会公开向小米、雷军致谢：真心实意感激过往这段经历，学到许多","url":"https://stock.10jqka.com.cn/hks//20261029/c681259430.shtml"}]},{"id":"chen-yuxi-rumors","name":"陈芋汐","alias":"","identity":"跳水运动员 · 奥运冠军","category":"社会切片","date":"2026-10-31","heat":68,"headline":"陈芋汐：把无逻辑的谣言当笑话，但骂家人队友真的不能接受","summary":"近日，陈芋汐在一次采访里正面回应了围绕她的各种不实言论。她说自己「把那些当笑话看」，因为「有些言论没有发生过甚至没有逻辑」；但她划了一条明确的线——骂她自己的还好，「骂教练、领队、家人、队友的不能接受」。她也承认管不了：「一万个人有一万张嘴，没法保证全世界都统一，无法控制一些言论的发生。」被问到粉丝管理，她的回答是「没法做粉丝管理」，「没空管外界言论」。整段回应没有点名任何人，也没有逐条辟谣。","traits":["把谣言降级成笑话","把界线画在家人队友上","承认自己管不了","不点名、不逐条反驳"],"methods":["不逐条辟谣，只给一个总定性：那些言论「没有发生过甚至没有逻辑」，当笑话看","把界线从「我」挪到「我在乎的人」：骂自己的还好，骂教练、领队、家人、队友不能接受","主动承认能力边界：「一万个人有一万张嘴」，无法控制言论发生","明确拒绝承担不属于自己的责任：「没法做粉丝管理」","用「没空管」收尾：不解释、不教育、不呼吁，把注意力拉回训练"],"story":[{"t":"2026-10 下旬","d":"围绕陈芋汐及其队友的各类不实言论在网络传播，出现「声援」「队内关系」等猜测"},{"t":"2026-10-30 前后","d":"她在采访中正面回应：把无逻辑的谣言当笑话看，但骂教练、领队、家人、队友不能接受；并称没法做粉丝管理、没空管外界言论"}],"quotes":["把那些当笑话看，有些言论没有发生过甚至没有逻辑。","骂自己的还好，骂教练领队家人队友的不能接受。","一万个人有一万张嘴，没法保证全世界都统一，无法控制一些言论的发生。","没法做粉丝管理，没空管外界言论。"],"writingUse":"写「被围观的人怎么划界」用这个。她没有选择「逐条澄清」——那是把自己拖进对方的节奏；她做的是三件事：先给谣言降级（笑话、没逻辑），再把界线画在自己在乎的人身上（骂我可以，骂家人队友不行），最后承认自己管不了（一万个人有一万张嘴）。这三步走完，她既没有示弱，也没有把自己变成斗士。写法上注意她的语气始终是平的，没有一句狠话——真正的边界感，往往是用平静说出来的。","sources":[{"publisher":"新浪新闻","title":"陈芋汐：把无逻辑的谣言当笑话，但骂家人队友真的不能接受","url":"https://sina.cn/news/detail/5359748507501583.html"},{"publisher":"新浪新闻","title":"陈芋汐回应不实言论称把那些当笑话看","url":"https://k.sina.com.cn/article_1638781994_m61add42a06403yx2u.html"},{"publisher":"网易","title":"声援全红婵？陈芋汐：骂我自己还好 骂队友不太能接受 但管不了粉丝","url":"https://www.163.com/dy/article/LAGC7PV30553AOVQ.html"}]},{"id":"wang-hong","name":"王虹","alias":"首位中国籍女性菲尔兹奖得主","identity":"数学家 · 2026年菲尔兹奖得主 · 三维挂谷猜想证明者","category":"顶级人类","date":"2026-10-31","heat":94,"headline":"邻家女孩，王虹的逆袭","summary":"1991年生于广西桂林平乐县，16岁考入北大地球科学系，听了一堂数学课转系。2025年与Joshua Zahl用127页论文证明三维挂谷猜想；2026年7月获菲尔兹奖，成为首位中国籍女性得主、史上第三位女性得主。她不是奥赛神童，中途想转建筑，也说过自己一直挺迷茫。","traits":["不按神童剧本","允许自己迷茫","对「没用」的问题着迷","低调节奏","把难题拆成多米诺"],"methods":["听一堂课就转系：大一是地球科学，数学课上被一串公式击中，回去就申请转数学。","允许自己走弯路：在巴黎读硕士时停了半年数学，认真考虑转建筑，发现建筑更难，又回来。","选最「没用」的方向：纯数学里的傅里叶分析，不追热点，也不做能立刻变现的题。","不开发布会：2025年2月把127页证明直接挂上arXiv，没有新闻稿，让同行先看。","把百年难题拆成多米诺：沿用陶哲轩的思路，引入投影理论，让下界一步步自动推到3。","成名后仍按自己的节奏：全球巡讲、带学生，不接受「天才」叙事，反复说自己也迷茫过。"],"story":[{"t":"1991","d":"生于广西桂林平乐县沙子镇，父母都是中学教师"},{"t":"2007","d":"16岁考入北京大学地球与空间科学学院，后转入数学科学学院"},{"t":"2011","d":"北大数学学士，赴巴黎综合理工学院、巴黎萨克雷大学深造"},{"t":"2019","d":"在麻省理工学院获博士学位，师从Larry Guth"},{"t":"2021","d":"任加州大学洛杉矶分校助理教授；2023年加入纽约大学柯朗数学科学研究所"},{"t":"2025.2","d":"与Joshua Zahl在arXiv发布127页论文，证明三维挂谷猜想"},{"t":"2025.5","d":"成为法国高等科学研究所（IHES）数学领域终身教授"},{"t":"2026.4","d":"获突破奖数学新视野奖"},{"t":"2026.7.23","d":"在费城国际数学家大会上获菲尔兹奖，成为首位中国籍女性得主"}],"quotes":["我一直挺迷茫的，以前也真的放弃过。","数学好像还没有建筑那么难学。","我希望我们都能拥有勇气和毅力，去尝试那些激动人心的难题。"],"writingUse":"写「天才」最容易写成一路开挂。王虹的素材正好相反：她不是奥赛神童，转系、想转建筑、说自己迷茫。她的强大不是「从不怀疑」，是怀疑完了还回来。适合写那种看起来普通、心里有一根很硬的轴的女主；也适合写「被时代看见之前，她已经在冷板凳上坐了很多年」的前辈。","sources":[{"publisher":"腾讯新闻·南风窗","title":"邻家女孩，王虹的逆袭","url":"https://news.qq.com/rain/a/20260724A06VWA00"},{"publisher":"香港01","title":"菲爾茲獎｜中國90后數學家王虹登頂 為百年來首位中國籍女性得主","url":"https://global.hk01.com/%E5%8D%B3%E6%97%B6%E4%B8%AD%E5%9B%BD/60373052/%E8%8F%B2%E5%B0%94%E5%85%B9%E5%A5%96-%E4%B8%AD%E5%9B%BD90%E5%90%8E%E6%95%B0%E5%AD%A6%E5%AE%B6%E7%8E%8B%E8%99%B9%E7%99%BB%E9%A1%B6-%E4%B8%BA%E7%99%BE%E5%B9%B4%E6%9D%A5%E9%A6%96%E4%BD%8D%E4%B8%AD%E5%9B%BD%E7%B1%8D%E5%A5%B3%E6%80%A7%E5%BE%97%E4%B8%BB"},{"publisher":"量子位","title":"菲尔兹奖提前泄露！ 王虹邓煜双双在列","url":"https://www.qbitai.com/2026/07/449407.html"}],"novel":{"want":"追那个让她「被击中」的问题，把难题弄明白。","fear":"选错路、浪费时间；自己其实没有想象中那么适合数学。","contradiction":"看起来普通、迷茫、想放弃，却啃百年难题；不开发布会，却成了公众人物。","pressureChoice":"在巴黎停了半年数学，认真考虑转建筑，最后回来；2025年把127页证明直接挂arXiv，不开发布会。","scene":"大一的数学课，老师在黑板上写下一串公式，她突然被击中——「这才是我真正想要的东西」。","relations":"Joshua Zahl：一起证明挂谷猜想的合作者；Larry Guth：她的博士导师；那些说她「不像神童」的人：她一直在反驳的隐形对手。","confidence":"A"}},{"id":"yuan-junying","name":"袁钧瑛","alias":"程序性坏死发现者","identity":"细胞生物学家 · 中科院上海有机所生物与化学交叉研究中心主任 · 2026世界顶尖科学家奖得主","category":"顶级人类","date":"2026-10-31","heat":93,"headline":"喜报 | 热烈祝贺袁钧瑛院士荣获2026世界顶尖科学家奖","summary":"1980年代在哈佛读博时，细胞死亡是冷门方向，她问遍实验室没人研究；教授反问她「不去关心活着的细胞，研究死亡的细胞干什么」。她转到MIT，2005年首次提出「程序性坏死」，打破「坏死是被动死亡」的教科书结论。2026年获世界顶尖科学家奖，四十年只做一件事：把细胞死亡变成能治病的靶点。","traits":["认死理","不怕冷门","把失败当过程","长期主义","要落地"],"methods":["专挑没人做的题：读博时发现大家只观察细胞死亡，没人研究「死亡怎么发生」，就把这个当主攻方向。","被劝退也不改题：教授问她为什么不研究活细胞，她没被说服，转去MIT找能做这个问题的实验室。","走错方向不内耗：进实验室摸索半年发现方向跑偏，只说「错了就错了，没关系，我喜欢科研的这个过程」。","用化学撬开生物学：发现Nec-1后，靠化学生物学把靶点RIPK1挖出来，再回国建交叉研究中心。","四十年盯一个目标：从细胞凋亡到程序性坏死，再到RIPK1抑制剂进临床，始终围绕「变成药」。","不追热点：细胞凋亡最热的时候，她转身去开「细胞坏死」这个新领域，等于主动离开风口。"],"story":[{"t":"1958","d":"生于上海"},{"t":"1977","d":"恢复高考后以上海市第一名考入复旦大学生物系"},{"t":"1982","d":"赴哈佛大学医学院攻读博士"},{"t":"1989","d":"获哈佛博士学位，进入MIT Horvitz实验室做博士后"},{"t":"1990s","d":"发现半胱天冬酶（caspase）在哺乳动物细胞凋亡中的关键作用"},{"t":"2005","d":"首次发现并定义「程序性坏死」（necroptosis），打破坏死被动无序的传统观念"},{"t":"2012","d":"回国组建中科院上海有机化学研究所生物与化学交叉研究中心"},{"t":"2026.9","d":"获2026世界顶尖科学家奖「生命科学或医学奖」"}],"quotes":["错了就错了，没关系，我喜欢科研的这个过程。","得奖从来不是我研究的目标。我的目标是把我的研究发现变成治疗神经退行性疾病的新药，来帮助病人。","不要一味追随科学已有的发展方向，或是扎堆当下的热门领域。","找到一个有趣的而且很少有人关注的科学问题，坚持研究下去，也许你就能发现独特的风景。"],"writingUse":"写「坚持」很容易写成苦情。袁钧瑛不是苦熬型，她是「认死理但很快乐」：走错方向不内耗，被劝退不生气，四十年盯一个目标。适合写那种不声不响、把冷板凳坐热的女科学家；也适合写「所有人都去追风口，她偏要去开荒地」的团队主心骨。","sources":[{"publisher":"中科院生物与化学交叉研究中心","title":"喜报 | 热烈祝贺袁钧瑛院士荣获2026世界顶尖科学家奖","url":"https://ircbc.ac.cn/"},{"publisher":"第一财经","title":"颠覆百年“细胞坏死”传统观念：专访2026世界顶尖科学家奖“生命科学或医学奖”获奖者袁钧瑛教授","url":"https://www.yicai.com/news/103389864.html"},{"publisher":"中科院上海有机化学研究所","title":"专家人才库","url":"http://sioc.cas.cn/sourcedb/cn/expert/201312/t20131210_3994919.html"}],"novel":{"want":"把细胞死亡变成能治病的药；把一个冷门问题做到底。","fear":"一辈子做的研究最终没能落到病人身上。","contradiction":"离开最热的细胞凋亡领域去开冷门；说「得奖不是目标」，但承认得奖能让人理解她的工作。","pressureChoice":"教授问她「不去关心活着的细胞，研究死亡的细胞干什么」，她没改题，转去MIT找能做这个问题的实验室。","scene":"哈佛读博时问遍相关实验室，没有一个人研究细胞死亡；教授反问她那句话。","relations":"MIT的Horvitz实验室：接住她的人；那些劝她研究活细胞的教授：她没被说服的人。","confidence":"A"}},{"id":"cai-shuhui","name":"蔡书慧","alias":"嫦娥月壤古磁场研究者","identity":"地球物理学家 · 中科院地质与地球物理研究所研究员 · 2026科学探索奖得主","category":"顶级人类","date":"2026-10-31","heat":90,"headline":"蔡书慧等-Nature：嫦娥六号玄武岩揭示28亿年前增强的月球发电机","summary":"1985年生于河南开封，做的是「读石头里的磁场」：从考古陶片到嫦娥五号、六号月壤，建立微量、弱磁样品的高精度磁学方法。2024年从嫦娥六号28亿年前玄武岩里读出5–21微特古磁场，发现月球磁场在31亿年前大跌后曾反弹，成果登上《自然》封面。2026年获科学探索奖、陈嘉庚青年科学奖。","traits":["跟微小信号死磕","把方法做成基础设施","不挑样本","长期蹲一个方向","让数据说话"],"methods":["把「读不出来」变成「读得出来」：月壤只有毫米级、磁信号极弱，她先建高精度、低损耗的磁学方法体系。","不挑好做的样本：从考古陶片、烧土到月球玄武岩，材料越难，越要先把方法磨出来。","用多种方法交叉验证：非加热古强度、岩石磁学、显微学一起上，排除撞击、黏滞剩磁等干扰。","敢改教科书：嫦娥六号数据显示28亿年前磁场反弹，直接挑战「31亿年后一直低能量」的旧结论。","把成果送进封面：Nature、Science Advances都以封面文章发表，让方法本身成为领域标准。","拿奖之后继续蹲月球：从嫦娥五号到六号，再到后续深空样品，方向不换。"],"story":[{"t":"1985","d":"生于河南开封"},{"t":"2004–2008","d":"长安大学地球物理学本科"},{"t":"2008–2014","d":"中科院地质与地球物理研究所硕博连读，固体地球物理学博士"},{"t":"2015–2018","d":"在美国加州大学圣地亚哥分校Scripps海洋研究所做博士后"},{"t":"2018","d":"回到中科院地质与地球物理研究所，任副研究员"},{"t":"2024.12","d":"嫦娥六号月背玄武岩古磁场研究发表于《自然》，首次揭示28亿年前月球磁场反弹"},{"t":"2025.1","d":"嫦娥五号月壤研究发表于《科学进展》封面，揭示20亿年前月球仍存在弱磁场"},{"t":"2026","d":"获科学探索奖、陈嘉庚青年科学奖"}],"quotes":["月球在距今20亿年前仍存在一个较弱的「发电机」过程，所产生的磁场强度为2—4微特。","这是一项具有历史意义的研究，为人们对月球磁场的新认识作出重大贡献。"],"writingUse":"写「科学家」很容易写成穿白大褂讲术语。蔡书慧的素材是「手上功夫」：毫米级的石头、极弱的信号、一次次排除干扰。适合写那种不擅长表达、但一碰到样品就安静下来的技术型主角；也适合写「别人做不了的脏活累活，最后成了整个领域的地基」。","sources":[{"publisher":"中科院地质与地球物理研究所","title":"蔡书慧等-Nature：嫦娥六号玄武岩揭示28亿年前增强的月球发电机","url":"https://igg.cas.cn/xwzx/yjcg/202412/t20241219_7505159.html"},{"publisher":"中新网（中科院地质地球所转载）","title":"【中新网】嫦娥六号月壤研究获新成果 中国科学家首揭月球背面古磁场信息","url":"https://igg.cas.cn/kxcb/mtsm/202412/t20241221_7507752.html"},{"publisher":"陈嘉庚科学奖基金会","title":"历届获奖情况陈嘉庚青年科学奖按时间2026","url":"http://tsaf.cas.cn/ljhjqk/cjgqnkxj/asj/2026/202607/t20260710_5115279.html"}]},{"id":"li-jing","name":"李婧","alias":"给望远镜装眼睛的人","identity":"天文学家 · 北京大学物理学院教授 · 2026科学探索奖得主","category":"顶级人类","date":"2026-10-31","heat":88,"headline":"50位青年科学家深圳领奖","summary":"1978年生于青岛，做的是给天文望远镜装「眼睛」：太赫兹高灵敏度超导探测器。2020年拿过科学探索奖，2026年再次入选，是今年10位女性获奖人之一。颁奖礼上她带女儿走红毯，女儿说「长大后我要超越你」，她回：这么多年的努力，影响到一个正在成长的小科学家，很值。","traits":["长期主义","把冷门技术做到底","不急着证明","把女儿带进现场","接得住挑战"],"methods":["选一个「看不见」的方向：太赫兹探测是天文观测的底层硬件，不出圈，但缺了它望远镜就是瞎子。","把关键技术做成自主可控：超导混频、大规模阵列芯片、单片集成三维谱仪，一项项啃。","拿奖不改变节奏：2020年拿过一次科学探索奖，2026年再入选，仍在同一方向深耕。","把女儿带到颁奖现场：不把科研和家庭切开，让女儿看见妈妈在做什么。","用一句「你超越我」接住孩子的挑战：不谦虚也不打压，把竞争变成传承。"],"story":[{"t":"1978","d":"生于青岛，初中、高中均就读于青岛二中"},{"t":"2020","d":"获第二届科学探索奖，时任中科院紫金山天文台研究员"},{"t":"2026.9.20","d":"以北京大学物理学院教授身份再获科学探索奖，带女儿走红毯"},{"t":"2026","d":"成为2026年科学探索奖10位女性获奖人之一"}],"quotes":["自己这么多年的努力很值得，并且影响到了「一个正在成长的小小的科学家」。","长大后我要超越你。"],"writingUse":"写「女科学家」很容易写成牺牲家庭。李婧的细节正好相反：她带女儿走红毯，女儿向她下战书。适合写那种不把事业和母职对立起来的母亲；也适合写「孩子第一次看见妈妈的专业世界」这种安静的传承场面。","sources":[{"publisher":"深圳特区报","title":"50位青年科学家深圳领奖","url":"https://sztqb.sznews.com/PC/content/202609/21/content_3479769.html"},{"publisher":"北京大学教育基金会","title":"北京大学8位青年科学家和3位校友入选获2026年“科学探索奖”","url":"https://www.pkuef.org/info/1020/9334.htm"},{"publisher":"青岛新闻网","title":"第二届科学探索奖颁奖 青岛籍科学家李婧获300万奖金","url":"http://www.qingdaonews.com/app/content/2020-11/14/content_22441345.htm"}]},{"id":"su-xing-gua-suren","name":"苏醒","alias":"","identity":"歌手 · 音乐制作人 · 主持人","category":"娱乐圈","date":"2026-11-02","heat":70,"headline":"热搜第一！知名男歌手发文澄清：这属于诽谤","summary":"11月1日晚，话题「苏醒挂素人」登上热搜第一。起因是他在综艺《后会友期》观察室的点评被大量观众批评「居高临下」「爹味重」，有网友在小红书发帖吐槽，苏醒亲自到该笔记评论区回复，随后把帖子截图发到自己微博小号，动态很快被删除。当晚他发文澄清：「没有、不认，没暴露对方任何ID或可查询的信息。」他强调自己「向来都给素人打码，未暴露任何一次」，并把「第一位未查证事实便起此话题的人」定性为「诽谤」。","traits":["先否认再自证","用可核查的事实说话","把指控方反定为诽谤","不道歉只澄清"],"methods":["开口先给三个字的结论：「没有、不认」——不铺垫、不解释情绪","用可核查的事实自证：没暴露对方任何 ID 或可查询的信息；向来给素人打码，未暴露过任何一次","把举证责任推回去：把「第一位未查证事实便起此话题的人」定性为「诽谤」","不解释自己为什么去评论区、为什么截图，只谈「有没有越界」这一个点","先动手后收手：截图发在小号、很快删除，删除的动作不解释"],"story":[{"t":"2026-10 下旬","d":"在综艺《后会友期》观察室的点评被大量观众批评「居高临下」「爹味重」"},{"t":"2026-11-01 白天","d":"有网友在小红书发帖吐槽，苏醒到该笔记评论区回复，随后把帖子截图发到自己微博小号，动态很快删除"},{"t":"2026-11-01 晚","d":"「苏醒挂素人」登上热搜第一；他发文澄清没有暴露任何 ID，并称最早的发起者属诽谤"}],"quotes":["澄清一下：没有、不认，没暴露对方任何ID或可查询的信息。","上网以来发博无数截图N多，无论聊天玩笑还是话题探讨，向来都给素人打码，未暴露任何一次。","第一位未查证事实便起此话题的人，其实属于诽谤了。"],"writingUse":"写「用定义自证的人」用这个。他不解释自己为什么去评论区、为什么截图，只死守一个点：有没有暴露 ID。因为这个点他能赢，其他点他赢不了。这种回应方式在小说里特别好用——当事人越是只谈一个技术性事实，越显得心里有数，也越显得冷。写法上给他一个关键动作：先发截图、后删除，然后对删除只字不提。真正的老手不会把每一步都解释清楚，他只解释对自己有利的那一步。","sources":[{"publisher":"极目新闻 · 齐鲁晚报","title":"热搜第一！知名男歌手发文澄清：这属于诽谤","url":"https://www.ctdsb.net/c1742_202611/2893693.html"},{"publisher":"中华网","title":"苏醒发文否认挂素人 隐私保护引争议","url":"https://news.china.com/socialgd/10000169/20261101/49832043.html"}]},{"id":"li-liang-qinshuo","name":"李亮","alias":"","identity":"抖音集团副总裁","category":"商界狠人","date":"2026-11-03","heat":74,"headline":"秦朔起诉抖音集团副总裁李亮 李亮回应：将积极应诉","summary":"10 月下旬，秦朔发表《可怕的红果与中国互联网的字节时间》，援引数据称字节系占中国移动互联网使用时长 40.9%、抖音首次超过微信，并提出「字节时间」。10 月 27 日晚，抖音集团副总裁李亮公开反驳，称这个定性「极不严谨」：短视频属充分竞争行业，且统计只覆盖移动端 Top50、未纳入长尾应用与 PC 端。此后双方就数据口径来回论战。11 月 2 日，秦朔称已委托律师就名誉权起诉李亮；李亮回应「会积极应诉」，并在微博长文中说：「积极应诉，让社会明白那些『专家自媒体』的迷惑性和危害性，这个事情更重要。」","traits":["只打口径不打人","被起诉只说五个字","把法律战转成公共讨论","反手给对手贴标签"],"methods":["先拆对方的统计口径，而不是否认结论：短视频属充分竞争行业、格局变化快；Top50 移动端数据代表不了整个互联网大盘","用具体数字接招：对方换 8 月数据，他继续就同一批数据讨论","被起诉后不写长文喊冤，只回五个字：「会积极应诉」","把战场换掉：借一部红果短剧的故事谈价值观，把「数据之争」变成「谁在定义普通人」","反手定性对手：「让社会明白那些『专家自媒体』的迷惑性和危害性」"],"story":[{"t":"2026-10-26","d":"秦朔发表《可怕的红果与中国互联网的字节时间》，援引 QuestMobile 数据提出「字节时间」"},{"t":"2026-10-27 晚","d":"李亮公开反驳，称该定性「极不严谨」，质疑统计只覆盖移动端 Top50"},{"t":"2026-10-28","d":"秦朔以 8 月数据回应（字节系 41.8%、腾讯系 28.6%），强调这是趋势概括而非垄断判定"},{"t":"2026-11-02","d":"秦朔称已就名誉权起诉；李亮回应「会积极应诉」，并发布长文谈短剧价值观"}],"quotes":["会积极应诉。","积极应诉，让社会明白那些「专家自媒体」的迷惑性和危害性，这个事情更重要。"],"writingUse":"写「企业公关里的硬角色」用这个。他从不接「你是不是在打压批评」这种问题，只谈口径：样本覆盖哪些端、行业是不是充分竞争。这一招的厉害之处是——只要争论停在方法论层面，他就永远有话可说；一旦进入动机层面，他就输了。最值得写的是那句五个字的回应：「会积极应诉。」没有情绪、没有解释、没有道歉。这种人放在小说里，是主角最难缠的对手——他不跟你吵，他只纠正你的数据。","sources":[{"publisher":"腾讯新闻 · 新京报","title":"秦朔起诉抖音集团副总裁李亮 李亮回应：将积极应诉","url":"https://news.qq.com/rain/a/20261102A0BH9Y00"},{"publisher":"腾讯新闻 · 观察者网","title":"抖音集团副总裁李亮回应秦朔起诉：会积极应诉","url":"https://news.qq.com/rain/a/20261102A0CWPK00"}]},{"id":"yuen-lai-lam-speak","name":"袁澧林","alias":"Angela Yuen","identity":"香港演员","category":"娱乐圈","date":"2026-11-04","heat":71,"headline":"袁澧林強調公開冒犯事件非公審　涉事編輯已道歉：多謝佢有反思","summary":"11月3日，袁澧林在电影《第四幕》首映上首次回应自己公开发文讲述被冒犯的经历。她说发文时「当然是有少少愤怒在里面」，但经过讨论，最终想带出的结语是：这些冒犯和玩笑不是单一事件，也不只存在于某个行业。她强调没打算公审任何人——写的时候刻意保护了当事人，「不会找到主角是谁」；真正的原意是让大家看到背后「根深蒂固的制度」。涉事编辑已公开致歉，她的回应是：「这个不是很重要，事件不止关乎他道歉，但我很多谢他有一些反思。」","traits":["不公审只指制度","承认愤怒但给结论","写的时候先保护对方","开口前先算过反噬"],"methods":["写长文但一定给「结语」：不是情绪宣泄，而是把个案收成一句可被引用的判断","刻意保护当事人：不点名、不罗列全部事件，让想找「真凶」的人找不到","把矛头从个人挪到结构：「其实背后有很多根深蒂固的制度，这个才是我发文原意」","回应道歉时降温：「这个不是很重要」，把焦点从道歉移到反思","开口前先算代价：「所有事情的反噬都有想过」，仍然决定说"],"story":[{"t":"2025 前后","d":"在访问与片场经历被冒犯的事件；一年后因朋友鼓励决定公开"},{"t":"2026-10 下旬","d":"公开发长文讲述被冒犯的经历，强调这不是单一事件、也不只存在于某个行业"},{"t":"2026-11-03","d":"电影《第四幕》首映，首次见记者回应：并非公审，涉事编辑已致歉，她表示「多谢他有反思」"}],"quotes":["出文时当然是有少少愤怒在里面。","当时写没打算要公审任何人……不会找到主角是谁。","其实背后有很多根深蒂固的制度，这个才是我发文原意。","这个不是很重要，事件不止关乎他道歉，但我很多谢他有一些反思。"],"writingUse":"写「不公审的控诉者」用这个。她手握一件可以毁人的事，却刻意把对方的名字藏起来——不是软弱，是她要的不是一个人的下场，而是一套规则的松动。写法上注意她的三个动作：先承认情绪（有愤怒），再给结论（不是单一事件、是制度），最后保护对方（找不到主角是谁）。这种角色在小说里最有张力的地方是：所有人都盼她点名，她偏不点，于是舆论反过来审判她。适合写成主角身边那个「说了真话却不肯交人」的人。","sources":[{"publisher":"香港01","title":"袁澧林強調公開冒犯事件非公審　涉事編輯已道歉：多謝佢有反思","url":"https://www.hk01.com/%E9%9B%BB%E5%BD%B1/60406800/"},{"publisher":"星島頭條","title":"袁澧林性騷擾風波後首現身 盼女性勇於發聲 強調非斷人米路","url":"https://www.stheadline.com/film-drama/3633162/"}]},{"id":"zhang-miman","name":"张弥曼","alias":"古鱼王国里的“国民女神”","identity":"古脊椎动物学家 · 中国科学院院士 · 2018世界杰出女科学家奖得主","category":"顶级人类","date":"2026-11-05","heat":92,"headline":"张弥曼：82岁的“国民女神”","summary":"1936年生于南京，1960年从莫斯科大学地质系毕业，一辈子研究古鱼类。1980年代在瑞典，她把仅2.8厘米的杨氏鱼头骨磨成540多片蜡模型，得出“杨氏鱼没有内鼻孔”的结论，动摇了“总鳍鱼是四足动物祖先”的教科书判断。2018年获世界杰出女科学家奖，82岁在巴黎领奖，国内网友叫她“国民女神”。","traits":["被分配的专业，做成一生","把冷门坐热","手上功夫","不争镜头","八十岁还在开工"],"methods":["国家分配什么就做什么：1950年代报考北京地质学院，不是出于兴趣，后来说自己和古生物是“先结婚后恋爱”。","用最笨的办法做最细的活：把2.8厘米的杨氏鱼头骨连续磨片，亲手做成540多片蜡模型，一片一片看内部结构。","敢推翻教科书：从杨氏鱼没有内鼻孔得出结论，质疑“总鳍鱼类是四足动物祖先”的传统判断，引发国际讨论。","自己下野外：几十年背着30多公斤行囊在荒野找化石，队伍里唯一的女性，留短发，衣服长虱子就煮。","不靠奖项活着：82岁领奖时说“我成为科学家是历史的偶然”，转头继续做新生代鲤科鱼化石。","把时间用在下一个问题上：85岁说“这一块再不做，中国就赶不上了”，不退休、不总结，继续开工。"],"story":[{"t":"1936","d":"生于南京，籍贯浙江嵊县"},{"t":"1953","d":"考入北京地质学院"},{"t":"1960","d":"莫斯科大学地质系毕业，进入中科院古脊椎动物与古人类研究所"},{"t":"1980–1982","d":"在瑞典斯德哥尔摩大学攻读博士，研究杨氏鱼"},{"t":"1983–1990","d":"任中科院古脊椎所所长"},{"t":"1991","d":"当选中国科学院院士"},{"t":"1992–1996","d":"任国际古生物协会主席"},{"t":"2016","d":"获国际古脊椎动物学界最高奖罗美尔-辛普森终身成就奖"},{"t":"2018","d":"获世界杰出女科学家奖、何梁何利基金科学与技术成就奖"},{"t":"2021","d":"85岁，仍在做新生代鲤科鱼化石研究"}],"quotes":["我成为科学家是历史的偶然，荣获这一奖项也是历史的偶然，我只是比较早做了中国肉鳍鱼类化石研究，提出了一些看法而已。","克服困难是一件很快乐的事情。","到了我这个年纪，做什么项目都行，都可以试试看。","这一块再不做，中国就赶不上了。"],"writingUse":"写「女科学家」最容易写成两种：苦大仇深，或者不食人间烟火。张弥曼两种都不是。她被分配了一个不喜欢的专业，做完发现有意思；她不说自己苦，只说「克服困难很快乐」；82岁领奖，85岁还在开工。适合写那种不把「坚持」挂在嘴上、手上一直在做的人；也适合写「被时代安排，却把安排做成了自己的」角色。","novel":{"want":"把杨氏鱼的结构看清楚，把四足动物起源这件事弄明白；后来是「这一块再不做，中国就赶不上了」。","fear":"时间不够，手上的问题没做完；不怕冷门，也不怕野外苦。","contradiction":"最初并不喜欢古生物，却做了一辈子；说自己是「历史的偶然」，却把每个偶然都做成了必然。","pressureChoice":"1980年代在瑞典，用连续磨片法把2.8厘米的头骨做成540多片蜡模型，得出「杨氏鱼没有内鼻孔」的结论，直接挑战教科书。","scene":"瑞典实验室里，她守着2.8厘米的杨氏鱼头骨，一片一片磨、一片一片画；540多片蜡模型摆开，像把一颗头骨拆成了一座档案馆。","relations":"伍献文：建议她研究鱼化石的人；朱敏：接过她泥盆纪研究的学生；那些守着旧教科书的同行：她用540片磨片去反驳的人。","confidence":"A"},"sources":[{"publisher":"人民日报","title":"张弥曼：82岁的“国民女神”","url":"http://paper.people.com.cn/rmzk/html/2018-05/20/content_1859463.htm"},{"publisher":"人民政协网（新华社）","title":"张弥曼：在古生物学领域求索６０余载","url":"https://www.rmzxw.com.cn/c/2018-03-24/2005434.shtml"},{"publisher":"中科院古脊椎所","title":"张弥曼院士荣获2018年度欧莱雅–联合国教科文组织“世界杰出女科学家成就奖”","url":"http://ivpp.cas.cn/xwdt/zhxw/201711/t20171114_4894117.html"}]},{"id":"li-huanying","name":"李桓英","alias":"麻风寨里的“李妈妈”","identity":"麻风病防治专家 · 北京友谊医院北京热带医学研究所研究员 · “时代楷模”","category":"顶级人类","date":"2026-11-05","heat":93,"headline":"与麻风病人零距离接触“第一人”：要努力工作到100岁","summary":"1921年生于北京，29岁成为世卫组织首批官员。1958年瞒着移民美国的家人回国，1978年起做麻风病防治。1983年在云南勐腊麻风寨试点短程联合化疗，两年治愈、十年监测，1994年方案被世卫组织全球推广。她一辈子没结婚，95岁入党，说“我回国不后悔，一辈子做麻风不后悔，但不入党会后悔”。","traits":["自己选的路","不怕","不叫苦","把病人当人","干到一百岁"],"methods":["瞒着家人回国：1958年拒绝世卫组织续聘，绕道伦敦回国，说“我是中国人，我不忘本”。","主动握病人的手：进麻风寨先跟病人握手、拍肩、拥抱，喝病人家的水、吃病人家的饭，用身体拆掉歧视。","把药喂到嘴边：担心病人中断治疗，多次往返、长期住在勐腊，亲自喂药，盯着规则服药。","用两年试点换全球方案：1983年在勐腊做短程联合化疗试点，两年治疗有效率达到百分之百，1994年被WHO全球推广。","翻车也不叫苦：多次遇险，肋骨裂了七根，照X光才看出来；她不宣扬，缠着绷带继续工作。","95岁入党：2016年宣誓，说“不入党会后悔”；98岁仍每天去研究所上班，目标是工作到100岁。"],"story":[{"t":"1921","d":"生于北京"},{"t":"1945","d":"毕业于同济大学医学院"},{"t":"1946","d":"赴美国约翰斯·霍普金斯大学，学细菌学和公共卫生"},{"t":"1950","d":"成为世界卫生组织首批官员"},{"t":"1958","d":"拒绝世卫组织续聘，瞒着家人回国"},{"t":"1970","d":"下放到江苏一个麻风村"},{"t":"1978","d":"调北京友谊医院、北京热带医学研究所"},{"t":"1983","d":"在云南勐腊县麻风寨试点短程联合化疗"},{"t":"1994","d":"短程联合化疗方案被世界卫生组织在全球推广"},{"t":"1996","d":"提出麻风病垂直防治与基层防治网相结合的模式"},{"t":"2016","d":"95岁入党；获首届中国麻风病防治终身成就奖"},{"t":"2021","d":"获“时代楷模”称号"}],"quotes":["我是中国人，我是北京出生，我不忘本，我应该回，正当其时。要把我最好的年代，奉献给祖国。","我们做医生没有恐惧的，我走遍世界，恐惧对我不是个事。","我回国不后悔，一辈子做麻风不后悔，但不入党会后悔。","我不愿意这两年白活着，我愿意尽我所能，白坐在家里看小说，看电视，也是浪费。"],"writingUse":"写「奉献」最容易写成苦情劳模。李桓英不是苦熬，她是「自己选的」：瞒着家人回国、主动握病人的手、翻车了不叫苦、95岁入党。她的强大不是忍耐，是认定了就不回头。适合写那种不解释、不表功、把一件难事做成日常的人；也适合写「她救的不是病，是被人群扔掉的人」。","novel":{"want":"让麻风病人不被当成鬼，能治好、能回家、能像正常人一样活；后来是「要努力工作到100岁」。","fear":"病人被歧视、被隔离、被放弃；不怕传染，也不怕翻车。","contradiction":"出身优渥、做过世卫官员，却一辈子往最脏最偏的麻风寨跑；说「是给我的任务，不是我选的」，却比谁都认这条命。","pressureChoice":"1958年拒绝世卫组织续聘，瞒着已经移民美国的父母和四个弟妹，绕道伦敦回国。","scene":"麻风寨里，病人见她伸手，第一反应是把手往回撤；她主动上前握住，长时间不放，再拍拍肩膀、拥抱。","relations":"父母和四个弟妹：她瞒着他们回国的人；麻风寨的病人：叫她「李妈妈」的人；助手袁连潮：看着她握手的人。","confidence":"A"},"sources":[{"publisher":"科技日报（kedo转载）","title":"与麻风病人零距离接触“第一人”：要努力工作到100岁","url":"http://story.kedo.gov.cn/c/2019-07-17/977877.shtml"},{"publisher":"欧美同学会","title":"李桓英：毕生求索只为世上再无麻风","url":"http://www.wrsa.net/content_41663570.htm"},{"publisher":"李桓英医学基金会","title":"党史中的清廉故事丨李桓英：护佑苍生 赤诚报国","url":"http://lhyyxjjh-yl.54doctor.net/Html/News/Articles/596.html"}]},{"id":"gao-fenglin","name":"高凤林","alias":"焊接火箭“心脏”的人","identity":"特种熔融焊工 · 首都航天机械公司 · 全国劳动模范","category":"顶级人类","date":"2026-11-06","heat":92,"headline":"劳模风采·2015年全国劳模 | 高凤林：为火箭焊接“心脏”","summary":"1978年进技校，1980年分到发动机焊接车间，此后38年守着同一个工种。长三甲火箭发动机喷管，一个焊点宽0.16毫米、允许时间误差不超过0.1秒、管壁厚0.33毫米；他先后为90多发火箭焊接“心脏”，占我国火箭发射总数近四成。2018年时56岁，仍在一线。","traits":["手上极稳","把基本功拆成日常","用数学解决手上的活","敢盲焊","根在岗位上"],"methods":["把基本功拆成日常动作：吃饭拿筷子练送丝，喝水端满缸练稳定，休息举铁块练耐力，盯着铁水看流动规律。","练到十分钟不眨眼：为了焊接时手不抖、眼不眨，他把“稳定”练成身体记忆。","在几百摄氏度的焊件上操作：90年代焊“长二捆”振动塔，长时间在高温焊件上操作，手上留下伤疤；“七五”项目趴在产品上半年，被同事叫“跟产品结婚的人”。","用数学解决手上的问题：1996年提出“反变形补偿法”，用高次方程和线积分公式控制变形，获国家科技进步二等奖。","敢盲焊：10米外是随时可能爆炸的液氢储罐，脚下是几十米深的山涧，故障点看不见、操作空间极小，他靠经验盲焊，通过“国际级大考”。","两小时解决16国难题：2006年丁肇中牵头的反物质探测器项目，低温超导磁铁制造卡住，国内外专家束手无策，他两小时拿出方案。","把经验写成标准：主编首部型号发动机焊接技术操作手册，参与航天标准制定，主导并参与申报9项国家专利和国防专利。"],"story":[{"t":"1978","d":"进入211厂技术学校学习"},{"t":"1980","d":"毕业分配到首都航天机械公司发动机焊接车间"},{"t":"1990s","d":"参与“长二捆”全箭振动塔焊接；在“七五”攻关项目中趴在产品上半年解决熔焊难题"},{"t":"1996","d":"提出“反变形补偿法”，获国家科技进步二等奖"},{"t":"2006","d":"用两小时为丁肇中牵头的16国反物质探测器项目拿出低温超导磁铁制造方案"},{"t":"2015","d":"获全国劳动模范称号"},{"t":"2016","d":"获第二届中国质量奖，是唯一个人获奖者"},{"t":"2018","d":"38年间为90多发火箭焊接“心脏”，占我国火箭发射总数近四成"}],"quotes":["航天精神的核心就是爱国，能够用汗水报效祖国，是我的追求。","如果一段时间没有进步，我就会觉得恐惧。","航天是我的理想，我的根在焊接岗位上。","一名好的工匠，应该是“制造”和“智造”的结合。"],"writingUse":"写「工匠」最容易写成重复劳动、苦情奉献。高凤林不是。他的狠劲在「精度」：0.16毫米、0.1秒、0.33毫米；他的聪明在「用数学解决手上的问题」。适合写那种不爱讲话、手上极稳、心里有恐惧的人；也适合写「把一件事做到极致，最后成了标准」的角色。","novel":{"want":"把每一道焊缝焊到“完美”，让火箭发动机不因为一个焊点出事；后来是“我的根在焊接岗位上”。","fear":"手生、退步；他说“如果一段时间没有进步，我就会觉得恐惧”。","contradiction":"一个焊工，却用高次方程和线积分公式解决变形控制；手上是焊枪，脑子里是数学。","pressureChoice":"1990年代在“长二捆”振动塔上，几百摄氏度的焊件上长时间操作，手上留下伤疤；最险的一次在10米外是液氢储罐、脚下是山涧的地方盲焊。","scene":"车间里，他端着盛满水的缸子练稳定性，吃饭时拿筷子练送丝，盯着铁水看十分钟不眨眼。","relations":"师傅：告诉他“干得好、明白为什么、说出来、写出来”的人；丁肇中：2006年找他解决AMS难题的人；年轻焊工：他把“尊重产品”传下去的人。","confidence":"A"},"sources":[{"publisher":"工人日报·中工网","title":"劳模风采·2015年全国劳模 | 高凤林：为火箭焊接“心脏”","url":"https://www.workercn.cn/c/2018-10-16/2609449.shtml"},{"publisher":"中国新闻网","title":"焊接火箭“心脏”的人","url":"https://www.chinanews.com.cn/gn/2018/10-20/8654991.shtml"}]},{"id":"cao-ying","name":"草婴","alias":"托尔斯泰的“架桥人”","identity":"俄语翻译家 · 《托尔斯泰小说全集》译者","category":"顶级人类","date":"2026-11-06","heat":91,"headline":"著名翻译家草婴: 做一个文学的架桥人","summary":"1923年生于浙江镇海，自学俄语，1950年代开始翻译肖洛霍夫。文革中被批斗、劳教，1975年扛水泥包时第十二节胸椎压缩性骨折。1978年起，他用20年独自译完托尔斯泰全部小说，12卷；《战争与和平》559个人物，原著读了十来遍。2015年去世，享年93岁。","traits":["小草式韧性","一个人干到底","逐字斟酌","不屈服","把桥造平"],"methods":["自学俄语：1938年报上看到俄语广告，找俄国太太学，一元一小时；每月5元零花钱，4元学俄语，1元买书。","从战争通讯干起：1941年进《时代》周刊翻译苏德战争通讯，1942年发表第一篇译作，后来把翻译做成终生事业。","被批斗也不停：文革中被关押、劳教，1975年扛100斤水泥包压断第十二节胸椎，差点送命；文革后重新拿起笔。","20年只做一件事：1978—1997年独自译完托尔斯泰全部小说，12卷；《战争与和平》559个人物，原著读十来遍。","逐字斟酌：翻译肖洛霍夫《学会仇恨》时，为“仇恨的学问/科学”这个标题琢磨很久，最后译成“学会仇恨”。","把桥造平：他说“要在读者与托尔斯泰之间架一座桥，把桥造得平坦、宽阔，让人轻松走来不觉得累”。"],"story":[{"t":"1923","d":"生于浙江镇海"},{"t":"1938","d":"自学俄语，跟俄国太太上课"},{"t":"1941","d":"进《时代》周刊翻译苏德战争通讯"},{"t":"1942","d":"发表第一篇译作《老人》"},{"t":"1953","d":"开始翻译肖洛霍夫作品"},{"t":"1960s–70s","d":"文革中被批斗、关押、劳教；1975年扛水泥包压断第十二节胸椎"},{"t":"1978–1997","d":"用20年独自译完托尔斯泰全部小说，12卷"},{"t":"1987","d":"获苏联高尔基文学奖"},{"t":"2006","d":"获俄罗斯马克西姆·高尔基奖章"},{"t":"2015.10.24","d":"去世，享年93岁"}],"quotes":["我要努力在读者与托尔斯泰之间架一座桥，并且把这座桥造得平坦、宽阔，让人轻松走来不觉得累。","小草是渺小的，很容易被人践踏，也很容易被火烧掉，但是春风一吹，又会重新恢复生命力。","十来遍吧，有的更多，不看不行啊！","这套书的出版是我一生中最高兴的事。"],"writingUse":"写「翻译家」最容易写成安静的幕后英雄。草婴的素材里有真正的痛感：被批斗、扛水泥压断胸椎、20年一个人译完托尔斯泰。他的强大不是「忍」，是「小草」式的：被踩倒，春风一吹又起来。适合写那种看起来瘦弱、实则极硬的知识分子；也适合写「一个人用一辈子给两种语言造一座桥」的角色。","novel":{"want":"把托尔斯泰的全部小说译成中文，在读者和托翁之间造一座平坦的桥；后来是“这套书的出版是我一生中最高兴的事”。","fear":"桥造得不好，读者读得累；不怕被批斗，也不怕一个人干20年。","contradiction":"看起来是个手无缚鸡之力的书生，却在被压断胸椎后重新拿起笔；说自己渺小，却干了只有一个人干成的事。","pressureChoice":"1978年之后，用20年独自译完托尔斯泰全部小说12卷；在此之前，1975年扛水泥包压断第十二节胸椎，差点送命。","scene":"上海华东医院病房里，90岁的他接受采访，老伴盛天民在旁边替他补全细节；他说起托尔斯泰，先说的是“不看不行啊”。","relations":"盛天民：陪他60多年、替他记着翻译细节的老伴；巴金：他每译完一本就送书、互相鼓励的人；姜椿芳：把他领进翻译路的老师。","confidence":"A"},"sources":[{"publisher":"中国作家网（深圳特区报）","title":"著名翻译家草婴: 做一个文学的架桥人","url":"http://www.chinawriter.com.cn/2013/2013-03-05/155682.html"},{"publisher":"中国出版集团（光明日报）","title":"列夫·托尔斯泰和他的中国知音草婴","url":"http://www.cnpubg.com/news/2020/1202/53743.shtml"},{"publisher":"澎湃新闻","title":"翻译家草婴逝世：一个人翻译托尔斯泰，是翻译史上的壮举","url":"https://www.thepaper.cn/newsdetail_forward_1388745"}]},{"id":"zheng-xiaoying","name":"郑小瑛","alias":"新中国第一位女指挥","identity":"指挥家 · 音乐教育家 · 厦门爱乐乐团创团艺术总监","category":"顶级人类","date":"2026-11-07","heat":92,"headline":"郑小瑛：一腔爱国情 一生爱乐心","summary":"1929年生于上海，祖籍福建永定。1948年从家里偷跑去解放区，因为识谱被推上指挥台；1955年成为新中国第一位受过专业训练的女指挥，1962年在莫斯科指挥《托斯卡》，是第一个登上外国歌剧指挥台的中国人。1989年创办志愿者乐团“爱乐女”，1998年创建厦门爱乐乐团；93岁还在推广“洋戏中唱”。","traits":["从家里偷跑出来","把指挥台当讲台","阳春白雪，和者日众","不拿报酬也干","九十岁还在开工"],"methods":["从家里偷跑三次：1948年19岁，前两次被妈妈抓回，第三次才成功，坐船到中原解放区。","因为识谱被推上指挥台：文工团没人识谱，她学过钢琴，大家说“你来打拍子”，指挥生涯就这么开始。","把指挥台当讲台：每场歌剧开演前20分钟，在走廊给观众讲怎么听；这个“郑小瑛模式”坚持了40年。","不拿报酬也干：1989年和司徒志文、朱丽创办“爱乐女”，志愿者、非营利，六七年演出241场，观众23万。","去厦门从零建团：1998年创建厦门爱乐，公助民办，按艺术规律管理，15个音乐季演出近1200场。","让世界听到土楼：2000年请刘湲写《土楼回响》，带团在12国演出76场，拿下首届金钟奖作品金奖。","九十岁还在推广“洋戏中唱”：2021年创办郑小瑛歌剧艺术中心，用中文唱西方歌剧，让大众走进歌剧。"],"story":[{"t":"1929","d":"生于上海，祖籍福建永定"},{"t":"1948","d":"从家里偷跑去解放区，在文工团开始指挥"},{"t":"1952","d":"保送中央音乐学院"},{"t":"1955","d":"成为新中国第一位受过专业训练的女指挥"},{"t":"1960","d":"赴莫斯科柴可夫斯基音乐学院深造"},{"t":"1961","d":"在克里姆林宫指挥交响音乐会"},{"t":"1962","d":"在莫斯科指挥《托斯卡》，成为第一个登上外国歌剧指挥台的中国人"},{"t":"1963","d":"回国，在中央音乐学院任教"},{"t":"1966–1976","d":"文革下放，后到京剧团，补学中国传统戏曲"},{"t":"1989","d":"与司徒志文、朱丽创办志愿者乐团“爱乐女”"},{"t":"1998","d":"创建厦门爱乐乐团"},{"t":"2000","d":"《土楼回响》在龙岩首演"},{"t":"2017","d":"在国家大剧院指挥中文版马勒《尘世之歌》"},{"t":"2021","d":"创办郑小瑛歌剧艺术中心，推广“洋戏中唱”"}],"quotes":["我是从家里偷跑出来的。前两次都让妈妈给抓了回去，第三次才成功。","阳春白雪，和者日众。","我更愿意被看作是一名教师，一名音乐种子的传播者。","指挥这个职业对性别的要求并没有什么差异。但在现实中，女指挥确实需要有更加强大的内心。"],"writingUse":"写「女指挥家」最容易写成「打破偏见」的口号。郑小瑛的素材里，偏见不是靠喊解决的，是靠一场一场演、一句一句讲、一个团一个团建出来的。她最动人的地方是「把指挥台当讲台」：她真正想干的不是站在高处，是让台下的人听懂。适合写那种不控诉、不等待、自己动手搭台子的女性；也适合写「把高雅的东西翻译给普通人」的角色。","novel":{"want":"让更多人听懂歌剧和交响乐，让“阳春白雪，和者日众”；后来是“让歌剧贴近大众，让大众走进歌剧”。","fear":"音乐只留在小圈子里，年轻人没有机会听到好的音乐；不怕没报酬，也不怕从零建团。","contradiction":"她是新中国“第一位女指挥”，却总说“我更愿意被看作一名教师”；站在指挥台最高处，干的却是把门打开的事。","pressureChoice":"1948年19岁，前两次偷跑都被妈妈抓回，第三次还是走了；1989年和朋友创办不拿报酬的“爱乐女”。","scene":"歌剧开演前20分钟，观众在走廊里围着她，她讲今天这出戏该怎么听；讲完，转身走上指挥台。","relations":"司徒志文、朱丽：一起创办“爱乐女”的人；刘湲：《土楼回响》的作曲家；厦门的普通观众：把她选成“城市名片”的人。","confidence":"A"},"sources":[{"publisher":"北京周报","title":"郑小瑛：一腔爱国情 一生爱乐心","url":"http://www.beijingreview.cn/zhuanti/guoqing60/2009-09/17/content_217052.htm"},{"publisher":"中国文艺评论","title":"独乐乐不如众乐乐——访指挥家郑小瑛","url":"https://www.zgwypl.com/content/details79_58686.html"}]},{"id":"bu-xinsheng","name":"步鑫生","alias":"改革厂长","identity":"原海盐衬衫总厂厂长 · 1980年代城市经济体制改革典型","category":"顶级人类","date":"2026-11-07","heat":93,"headline":"改革开放风云人物访谈：西子湖畔再见步鑫生(图)","summary":"1934年生于浙江海盐，1980年前后出任海盐衬衫总厂厂长，砸掉大锅饭、铁饭碗，奖金上不封顶下不保底，把一个小厂做成全国样板。1983年胡耀邦批示，他成为全国最知名的改革厂长；1984年西装项目从6万套扩到30万套，市场逆转后资不抵债，1988年被免职。此后在上海、北京、盘锦、秦皇岛继续办厂，2015年去世。","traits":["敢为先","脾气火爆","一言堂","会造势","输得起"],"methods":["把“大锅饭”砸开：奖金上不封顶、下不保底；做坏一件衬衫赔两件；慵懒职工辞退。","把招待费做成生意：用处理衬衫废料的钱做招待费，“大客户大招待，小客户小招待，不做生意也要招待”。","把排场做成广告：县里只有一辆吉普，他租5辆轿车接客户；坐飞机参加订货会；办厂歌、厂旗、厂服、厂庆。","组全国第一支专业时装表演队：姑娘们穿自家衬衫走秀，把产品变成新闻。","接住上级的“最大”：西装项目从6万套加到30万套，预算从18万美元加到80万美元；市场逆转后资不抵债。","落难后继续办厂：上海、北京、盘锦、秦皇岛，1993年创办步鑫生制衣公司；2001年病退。","把失败摊开说：晚年说“对改革者，要宽容”，“这个社会既要鼓励人创新，也应允许人失败”。"],"story":[{"t":"1934","d":"生于浙江海盐"},{"t":"1980前后","d":"出任海盐衬衫总厂厂长，开始打破大锅饭、铁饭碗"},{"t":"1983","d":"新华社内参《一个有独创精神的厂长——步鑫生》获胡耀邦批示，全国党报转载"},{"t":"1984","d":"成为全国最知名的改革厂长；西装项目从6万套扩到30万套，预算从18万美元加到80万美元"},{"t":"1986–1987","d":"西装市场萎缩、宏观调控收紧，企业资不抵债"},{"t":"1988.1.16","d":"被免去厂长职务"},{"t":"1988后","d":"在上海、北京、辽宁盘锦、河北秦皇岛继续办厂"},{"t":"1993","d":"在秦皇岛创办步鑫生制衣有限公司"},{"t":"2001","d":"因肾癌切除肾脏、脾脏，退出商界，定居上海"},{"t":"2015.6.6","d":"在家乡海盐去世，享年81岁"}],"quotes":["人无我有，人有我创，人赶我转。","靠牌子吃饭能传代、靠关系吃饭要垮台。","谁砸我的牌子，我就砸谁的饭碗。","咱们是靠办厂子吃饭的，离开了这一点，真的一钱不值。"],"writingUse":"写「改革者」最容易写成两种：一路正确的英雄，或者被时代碾过的悲剧。步鑫生两种都不是。他真敢砸铁饭碗，也真搞一言堂；他被媒体捧成神，也被同一批媒体写成「粗暴专横」；他失败后还去外地接着办厂。适合写那种身上有真本事、也有真毛病的人；也适合写「时代需要一个典型，他刚好站在那里」的角色。","novel":{"want":"把海盐衬衫总厂从濒临破产做成全国样板；后来是“有机会再出山办厂”。","fear":"被时代落下、自己“一钱不值”；也怕被媒体捧成神、再被摔下来。","contradiction":"他打破大锅饭、砸铁饭碗，是改革先锋；但他自己也搞一言堂、撤工会主席、开除提意见的人。","pressureChoice":"1984年西装项目，上级要他做全国最大，预算从18万美元加到80万美元、产量从6万套加到30万套；市场逆转后，他扛下资不抵债，1988年被免职。","scene":"1984年，全国各地的人涌到海盐看他；有关方面规定只有师局级以上才能见他本人，其他人听录音。他自嘲：“干脆将我弄到动物园让大家买票参观算了！”","relations":"胡耀邦：三次批示、把他树为典型的人；鲁冠球：来取经、后来在他落难时按月寄500元的人；赵荣华：被他撤职开除的工会副主席。","confidence":"A"},"sources":[{"publisher":"中国新闻网","title":"改革开放风云人物访谈：西子湖畔再见步鑫生(图)","url":"http://www.chinanews.com.cn/cj/cjrw/news/2008/09-24/1393169.shtml"},{"publisher":"澎湃新闻","title":"81岁改革先锋步鑫生因病去世，其开拓精神曾获中央领导肯定","url":"https://www.thepaper.cn/newsDetail_forward_1339245"},{"publisher":"澎湃新闻","title":"【社论】向步鑫生们致敬","url":"https://www.thepaper.cn/newsDetail_forward_1339415"}]},{"id":"guo-jianmei","name":"郭建梅","alias":"中国第一位专职公益律师","identity":"公益律师 · 北京市千千律师事务所主任 · 妇女法律援助推动者","category":"顶级人类","date":"2026-11-08","heat":92,"headline":"要像宇芽一样勇敢","summary":"1961年生于河南滑县，奶奶因畏惧家暴饿死在卖馒头路上。1979年考入北大法律系，1995年参加世界妇女大会后辞职，1996年创办北大妇女法律研究与服务中心，成为中国第一位专职公益律师。25年提供免费法律咨询12万多人次、参与4000多起诉讼；中心2010年被撤销、2016年歇业，她2019年获“正确生活方式奖”，2021年获希拉里奖。","traits":["把私事变成案子","跟制度磨","不挑案子","认死理","被关了还做"],"methods":["把家里的痛变成职业：奶奶因家暴饿死，她后来做妇女法律援助，开口常说“在我代理的家暴案件中，沉默的是大多数”。","辞职做公益律师：1996年辞去《中国律师》杂志社主编助理的“铁饭碗”，去北大成立妇女法律研究与服务中心，第一笔钱是福特基金会3万美元。","什么案子都接：家暴、性骚扰、职场歧视、农村妇女土地权益、进城务工妇女；25年12万多人次咨询、4000多起诉讼。","用个案推动立法：参与《妇女权益保障法》起草，把一个个案子里的问题写成法律意见稿。","机构被关了就换一个：2010年北大中心被撤销，她成立北京众泽；2016年众泽歇业，她转到千千律师事务所继续做。","把国际奖当工具：2019年拿“正确生活方式奖”，她说“这个奖是国外颁发给我的，让我百感交集”；2021年希拉里奖，她没能到场，只写了致辞。"],"story":[{"t":"1961","d":"生于河南滑县"},{"t":"1979","d":"考入北京大学法律系"},{"t":"1983","d":"毕业，进入司法部研究室；后任职于全国妇联、中国律师协会"},{"t":"1992","d":"参与《妇女权益保障法》起草"},{"t":"1995","d":"参加北京世界妇女大会，听到“女权即人权”"},{"t":"1996","d":"辞去《中国律师》杂志社工作，创办北大法学院妇女法律研究与服务中心"},{"t":"2001","d":"患抑郁症，经治疗好转"},{"t":"2010","d":"北大妇女法律研究与服务中心被撤销"},{"t":"2016","d":"北京众泽妇女法律咨询服务中心歇业"},{"t":"2019","d":"获“正确生活方式奖”（Right Livelihood Award）"},{"t":"2021","d":"获希拉里·罗德姆·克林顿奖"}],"quotes":["在我代理的家暴案件中，沉默的是大多数。","《反家暴法》是一把剑，闪闪发亮，但是力量很弱。","这个奖是国外颁发给我的，让我百感交集。我受到了来自远方的鼓励和认可，却不是来自自己身边。","我们弱势的人在做强势的事。"],"writingUse":"写「公益律师」最容易写成两种：苦大仇深的斗士，或者自带光环的圣人。郭建梅两种都不是。她做的是最硬的法律工作，起点却是最私人的痛：奶奶因家暴饿死。她总说「沉默的是大多数」，自己却一直在说话；机构被关了两次，她换两个壳继续做。适合写那种不喊口号、只递名片的人；也适合写「她帮的人未必感谢她，她还是帮」的角色。","novel":{"want":"让没钱没势的女人也能用法律；让家暴不再被当成“家务事”。","fear":"受害者沉默，法律变成“闪闪发亮但力量很弱”的剑；不怕机构被关，也不怕重新开始。","contradiction":"她做的是最硬的法律工作，起点却是最私人的痛；她总说“沉默的是大多数”，自己却一直在说话。","pressureChoice":"1996年辞去《中国律师》杂志社主编助理的“铁饭碗”，去北大做没有编制的公益律师；2010年中心被撤销、2016年众泽歇业，她两次换壳继续做。","scene":"办公室里，她听一个从石家庄来的女人讲被打的经过；女人头上肿着包，身上青一块紫一块。她先问：“你报警了吗？”","relations":"奶奶：因家暴饿死的人，她做这行的起点；刘震云：她的丈夫；那些沉默的当事人：她替她们说话的人。","confidence":"A"},"sources":[{"publisher":"界面新闻·正午","title":"要像宇芽一样勇敢","url":"https://www.jiemian.com/article/3723012.html"},{"publisher":"华人·正确生活方式奖","title":"郭建梅是中国妇女权利领域最杰出的律师之一","url":"https://huaren.se/zh/activities/activitiesk/894-guojianmei2019"},{"publisher":"财新网","title":"原北大妇女法律中心回应被撤销事件","url":"https://china.caixin.com/2010-04-02/100131464.html"},{"publisher":"法国国际广播电台","title":"北京一婦女法律援助中心被關閉","url":"https://www.rfi.fr/tw/%E4%B8%AD%E5%9C%8B/20160202-%E5%8C%97%E4%BA%AC%E4%B8%80%E5%A9%A6%E5%A5%B3%E6%B3%95%E5%BE%8B%E6%8F%B4%E5%8A%A9%E4%B8%AD%E5%BF%83%E8%A2%AB%E9%97%9C%E9%96%89"}]},{"id":"xiao-shijian","name":"肖诗坚","alias":"田字格创始人","identity":"乡村教育者 · 田字格兴隆实验小学创办人 · 乡土人本教育推动者","category":"顶级人类","date":"2026-11-08","heat":90,"headline":"创造“有根”的乡村教育","summary":"北大社会学系第一届本科生。2017年在贵州正安县格林镇兴隆村办起田字格兴隆实验小学，做“乡土人本教育”：不照搬城市教材，把山川、民俗、傩戏、米皮店变成课程。现在有2所典范学校、60所项目校、500名“种籽教师”、1万多名学生；2020年北大基线调研显示，学生更幸福、更满意，33个孩子从县城转学回来。","traits":["从支教转办学","把乡土当教材","不追求规模化","相信本地教师","脚踏泥土，胸怀梦想"],"methods":["从支教转办学：做了多年助学、支教，发现“支教只是给奄奄一息的农村教育补充维生素”，2017年干脆自己办学校。","把乡土变成课程：带孩子徒步去县城博物馆、米皮店，用付账学数学，了解傩戏、婚丧礼俗，重建与乡土的联结。","做“1+5”课程：基础课 + 日修课、轴心课、共同生活课、自主修习课、行动与分享课。","培养“种籽教师”：不空降名师，培训本地教师，让他们成为“乡土教育家”；相信本地教师一旦被点燃，有长久的生命力。","不追求规模化：2所典范学校、60所项目校，目标不是开几百所，而是做“可调节、可复制”的模式。","用数据说话：2020年北大中国教育财政科学研究所基线调研，学生更幸福、更满意；33个孩子从县城转学回来。"],"story":[{"t":"1980s","d":"北京大学社会学系第一届本科生"},{"t":"2017","d":"与正安县教育局签约，办起田字格兴隆实验小学"},{"t":"2020","d":"北大中国教育财政科学研究所对“乡土村小”项目做基线调研"},{"t":"2022","d":"项目覆盖60所项目校、500名“种籽教师”、1万余名学生"},{"t":"2025","d":"《人民周刊》报道“乡土人本教育新探索”"}],"quotes":["有根的孩子才能走得更远，因为他们知道自己为什么走那么远。","脚踏泥土，胸怀梦想。","乡村教育要为千千万万普通的乡村孩子服务，要为乡村培养人才。","我们相信和尊重本地的教师，认为地方教师是扎根本土的生命，一旦被点燃，就拥有强大的爆发力和长久的生命力。"],"writingUse":"写「乡村教育」最容易写成两种：苦情支教，或者浪漫田园。肖诗坚两种都不是。她是北大毕业的「城里人」，却跑到贵州山沟里办村小；她不追求规模化，却想做出可复制的模式；她不做「补充维生素」式的支教，直接接手一所学校。适合写那种不抒情、只做事的知识分子；也适合写「她相信土地，但不把土地浪漫化」的角色。","novel":{"want":"让乡村孩子不必复制城市教育，也能在家乡的土地上长出自己的根；让“有根的孩子走得更远”。","fear":"乡村教育只剩“逃离农村”一条路，孩子既融不进城市、也回不了乡村；不怕慢，也不怕不规模化。","contradiction":"她是北大毕业的“城里人”，却跑到贵州山沟里办村小；她不追求规模化，却想做出可复制的模式。","pressureChoice":"做了多年支教后，她放弃“补维生素”式的公益，2017年直接接手一所村小，从零办一所“未来学校”。","scene":"兴隆村的课堂上，孩子带她去走山路、认草药、画自家村子；六年级学生手绘的兴隆村地图，挂在教室墙上。","relations":"正安县教育局：给她政策和空间的合作方；“种籽教师”：她培训的本地老师；阿富：那个写“我的家在爱里”的问题儿童。","confidence":"A"},"sources":[{"publisher":"人民政协网","title":"创造“有根”的乡村教育","url":"http://www.rmzxw.com.cn/c/2022-09-13/3201128.shtml"},{"publisher":"人民周刊","title":"乡土人本教育新探索","url":"http://paper.people.com.cn/rmzk/pc/content/202511/21/content_30116249.html"}]},{"id":"li-baoguo","name":"李保国","alias":"太行山上的新愚公","identity":"河北农业大学教授 · 山区生态开发与林果技术专家 · “人民楷模”","category":"顶级人类","date":"2026-11-09","heat":93,"headline":"李保国：太行山上的新愚公","summary":"1958年生于河北武邑农村，1981年从河北农业大学毕业留校，上班十几天就扎进太行山。35年里完成28项山区开发成果、推广36项林业技术，让140万亩荒山披绿、10万农民脱贫；前南峪森林覆盖率做到90.7%。2016年4月10日因心脏病突发去世，年仅58岁。","traits":["见不得老百姓穷","把课堂搬到地头","先学会当农民","有求必应","干到最后一息"],"methods":["上班十几天就进山：1981年毕业留校，响应学校号召去邢台县前南峪村，搞小流域立体开发。","跟石头山较劲：前南峪土层薄、不涵水，他跑遍沟沟坎坎，和课题组做了数千次爆破整地试验，提出聚集土壤、聚集径流的“两聚”造林理论。","把技术拆成工序：把富岗苹果栽培技术分解成128道工序，先集中培训，再单独辅导。","把农民教会：在果园手把手教果农区分“结果枝”和“不结果枝”，半小时讲完，乡亲们一拍手：“原来这么简单！”","培养本土专家：借邢台农校“送教下乡”，岗底村191人拿到职业技术证书，成了全国“持证下田”第一村。","不收钱、不占股：讲课不收一分钱，不拿企业股份；“只有不为名来、不为利去，一个心眼儿为百姓，农民才信你。”","把论文写在大地上：35年完成28项成果、推广36项技术，让140万亩荒山披绿、10万农民脱贫。"],"story":[{"t":"1958","d":"生于河北武邑县一个农村家庭"},{"t":"1981","d":"河北农业大学毕业后留校任教，十几天后扎进太行山前南峪村"},{"t":"1980s–1990s","d":"在前南峪做小流域立体开发，提出“两聚”造林理论"},{"t":"1990s–2000s","d":"在太行山推广板栗、苹果、核桃栽培技术，建立技术体系"},{"t":"2000s","d":"把富岗苹果栽培拆成128道工序，岗底村191人获职业技术证书"},{"t":"2016.4.10","d":"因心脏病突发去世，年仅58岁"},{"t":"2016.6","d":"习近平总书记对李保国先进事迹作出重要批示；事迹报告会在人民大会堂举行"},{"t":"2019","d":"被授予“人民楷模”国家荣誉称号"}],"quotes":["我是农村长大的，过去家里很穷，我见不得老百姓穷。","脱贫为科研出题，科研为脱贫解难。老百姓需要什么，我就研究什么。","让农民亲近科技、掌握科技，农业科技工作者先要学会当农民。","干点儿自己喜欢的事，干成点儿有益于人民的事，什么时候想起来，也是值得骄傲的。"],"writingUse":"写「扶贫干部/农业科学家」最容易写成两种：苦情奉献，或者高高在上的技术员。李保国两种都不是。他是大学教授，却常年在山沟里当「农民」；他教农民技术，自己先学会当农民；他不收钱、不占股，因为他知道农民信的不是道理，是人。适合写那种不抒情、只下地的人；也适合写「他把论文写在土地上，土地把他留在了58岁」的角色。","novel":{"want":"让太行山的老百姓不再受穷；让山绿起来，让农民富起来。","fear":"农民不信科技、听不懂他讲的东西；不怕山里苦，也不怕白干。","contradiction":"大学教授，却常年在山沟里当“农民”；他教农民技术，自己先学会当农民。","pressureChoice":"1981年毕业留校，上班十几天就扎进太行山；35年，140万亩荒山，10万农民。","scene":"核桃树下，他从上午10点盯到下午4点，中午啃两个馒头；村民想给他加两个菜，他拒绝。","relations":"前南峪村民：他蹲点的第一批人；岗底村果农：他教出128道工序的人；课题组的同事：和他一起进山做试验的人。","confidence":"A"},"sources":[{"publisher":"经济日报（新浪转载）","title":"李保国：太行山上的新愚公","url":"http://news.sina.com.cn/c/2019-10-16/doc-iicezzrr2511112.shtml"},{"publisher":"央视网（光明网转载）","title":"追光的你｜太行山上新愚公","url":"https://share.gmw.cn/dangjian/2026-08/07/content_38932584.htm"}]},{"id":"tai-liping","name":"邰立平","alias":"凤翔年画第20代传人","identity":"凤翔木版年画国家级非遗代表性传承人 · 中国工艺美术大师","category":"顶级人类","date":"2026-11-09","heat":90,"headline":"邰立平与凤翔木版年画的兴衰","summary":"凤翔木版年画第20代传人。9岁跟爷爷学画样，1984年父亲去世后32岁接手。文革抄家17次，两卡车画版被抄走；他从省群艺馆描回近100幅爷爷的年画，恢复《西游记》等版样，1992/1997出版两卷《凤翔年画选》。2006年成为首批国家级非遗代表性传承人、中国工艺美术大师；如今颈椎病严重，招徒6人只剩2个。","traits":["第20代","只做抢救","手上有真功夫","不追衍生品","一个人守一门手艺"],"methods":["9岁开始学：跟着爷爷邰世勤学画样，给印好的年画撒金粉；爷爷是西府三县有名的“全把式”。","从楼板上找回老版：文革抄家17次，家藏明清老版几乎尽失；后来在楼板上发现唯一幸存的明代老版“雄鹰镇宅”。","用铅笔把爷爷的画描回来：1978年得知省群艺馆藏有近100幅爷爷1954年手绘年画，连续几天用铅笔描、回家用毛笔画，《西游记》版就这样恢复。","把年画从地摊卖进博物馆：1987年改用宣纸、国画颜料，做精细印刷，面向收藏市场；1994年墨尔本、1999年巴黎文化周。","先抢救，再谈创新：“我的责任是抢救和恢复。先把前人的成果复制出来，至于创新，只有等后来人。”","刻到刻不动：2008年汶川地震在棚里刻了8个墨线版；2004—2015年和两个徒弟刻了100多幅小年画墨线版。"],"story":[{"t":"明初洪武","d":"邰氏家族开始从事木版年画生产"},{"t":"1950s","d":"邰立平出生，9岁跟爷爷学画样"},{"t":"1966–1968","d":"文革抄家17次，两卡车画版、皮影、线装书被抄走"},{"t":"1978","d":"村办工艺美术研究会成立，任艺术总监；从省群艺馆描回爷爷的年画"},{"t":"1984","d":"父亲邰怡去世，32岁的邰立平接手"},{"t":"1987","d":"改用宣纸、国画颜料，转向收藏市场"},{"t":"1992/1997","d":"出版两卷四本《凤翔年画选》，收录300多幅传统年画"},{"t":"2006","d":"凤翔木版年画入选首批国家级非遗，邰立平成为代表性传承人；获“中国工艺美术大师”"},{"t":"2003","d":"公开招徒，6人最后只剩2人"},{"t":"2024","d":"澎湃刊发《邰立平与凤翔木版年画的兴衰》"}],"quotes":["我的责任是抢救和恢复。先把前人的成果复制出来，至于创新，只有等后来人。","年画的生命力始终在地摊。","作品能留下十分之一就不错了。","连你的年画都没人要，年画再做衍生品能卖得快吗？"],"writingUse":"写「非遗传承人」最容易写成两种：苦守的老人，或者被包装成文化符号的大师。邰立平两种都不是。他有真功夫，也有真困境：国家有专项资金，他拿不到；招了6个徒弟，最后只剩2个，一个卖扯面、一个在工厂上班；儿子回来干了一年七个月，因为收入太低走了。适合写那种不喊口号、手上不停的人；也适合写「他守的不是年画，是一整套正在消失的活法」的角色。","novel":{"want":"把凤翔年画的传统版样抢救下来、复制出来，留给后人；让这门手艺不断。","fear":"自己刻不动了，年画在他这一代断掉；不怕穷，也不怕一个人干。","contradiction":"他是国家级非遗传承人、中国工艺美术大师，却要靠收藏市场勉强维持；国家有专项资金，他却拿不到。","pressureChoice":"1987年转宣纸、国画颜料，把年画从地摊卖进博物馆；2003年公开招徒，6人最后只剩2个。","scene":"宝鸡的工作室里，他为一对大门神手工填色；墙上挂着八大门神、六神、戏出画；颈椎病让他干几个小时就撑不住。","relations":"父亲邰怡：把年画坚持下来、1984年去世的人；两个徒弟：一个卖扯面、一个在工厂上班；儿子：回来干了一年七个月，因收入太低离开。","confidence":"A"},"sources":[{"publisher":"澎湃新闻","title":"邰立平与凤翔木版年画的兴衰","url":"https://www.thepaper.cn/newsDetail_forward_26343125"},{"publisher":"澎湃新闻·湃客","title":"年画匠人邰立平之哀：年画的生命力始终在地摊？","url":"https://www.thepaper.cn/newsDetail_forward_5585582"}]},{"id":"liu-changchun","name":"刘长春","alias":"中国奥运第一人","identity":"短跑运动员 · 第一个代表中国参加奥运会的选手 · 大连理工大学教授","category":"顶级人类","date":"2026-11-10","heat":93,"headline":"刘长春：代表中国奥运起跑的人","summary":"1909年生于大连旅顺，短跑全国冠军。1932年，伪满洲国想让他代表“满洲国”参加洛杉矶奥运会，他在《大公报》声明“我是中国人，我只代表中国”；张学良资助8000银圆，他在海上漂了二十多天，开幕式前一天赶到，成为第一个代表中国参加奥运会的选手。因旅途劳顿，100米、200米预赛即被淘汰。1983年去世。","traits":["闻枪而动","单刀赴会","不留后路","把国家背在身上","输了也不低头"],"methods":["公开登报拒绝：1932年伪满洲国通过报纸散布他将代表“满洲国”参赛，他在《大公报》声明“我是中国人，我只代表中国，绝不代表‘满洲国’出席第10届奥林匹克运动会”。","把话说死：“伪报所传，纯属虚构谎言。我的良心尚在，热血尚流，岂能忘掉祖国而为傀儡伪国做马牛。”","一个人上路：在张学良资助8000银圆后，他从上海出发，在海上漂了二十多天，赶在开幕式前一天到洛杉矶。","举旗入场：他是中国唯一选手，高擎国旗走在前面，身后是临时拼凑的5人代表队。","输了也不找借口：因舟车劳顿，100米、200米预赛即被淘汰；中国留美学生发来贺电“虽败犹荣”。","回国后继续练：1936年柏林奥运会，他又去了；两次都是二十多天航程，依然没拿到名次。","把“国强”讲给孩子：晚年他说“国运衰则体育衰”，教育6个子女“先强国，国强才能体育强”。"],"story":[{"t":"1909","d":"生于大连旅顺小平岛，父亲是修鞋匠"},{"t":"1920s","d":"百米成绩10秒8，成为全国冠军；被张学良办的东北大学破格录取"},{"t":"1932","d":"拒绝代表伪满洲国参赛，在《大公报》声明“我是中国人，我只代表中国”"},{"t":"1932.7","d":"获张学良资助8000银圆，从上海乘船赴洛杉矶，开幕式前一天到达"},{"t":"1932.7.31","d":"作为中国唯一选手参加洛杉矶奥运会，100米、200米预赛被淘汰"},{"t":"1936","d":"参加柏林奥运会，因23天航程体力不支，未取得名次"},{"t":"1949后","d":"任大连理工大学教授，第五届全国政协委员"},{"t":"1983","d":"去世"}],"quotes":["我是中国人，我只代表中国，绝不代表“满洲国”出席第10届奥林匹克运动会。","伪报所传，纯属虚构谎言。我的良心尚在，热血尚流，岂能忘掉祖国而为傀儡伪国做马牛。","国运衰则体育衰。","先强国，国强才能体育强。"],"writingUse":"写“民族英雄”最容易写成一路高光的胜利者。刘长春不是。他一个人代表一个国家，漂了二十多天，预赛就被淘汰；他输了，却成了“奥运第一人”。他的力量不在成绩，在“不留后路”：在日本人掌控大连、家人都在的情况下，他公开登报说“我只代表中国”。适合写那种明知道会输、还是站上跑道的人；也适合写“他跑的不是100米，是一个国家第一次出现在世界面前”。","novel":{"want":"代表中国站上奥运跑道，让世界看到中国人也能跑。","fear":"被当成“满洲国”的代表，被同胞误解；不怕路远，也不怕输。","contradiction":"他一个人代表一个国家，最后却连预赛都没过；输了，却成了民族英雄。","pressureChoice":"1932年拒绝伪满洲国的邀请，在《大公报》发声明“我是中国人，我只代表中国”；当时日本人掌控大连，家人都在。","scene":"洛杉矶奥运会开幕式前一天，他坐的船才到；第二天，他高擎国旗走在前面，身后是临时拼凑的5人代表队。","relations":"张学良：资助8000银圆的人；父亲：在日本人逼迫下写信劝他服从的人；刘鸿图：他的儿子，替他讲这段故事的人。","confidence":"A"},"sources":[{"publisher":"人民政协报（新浪转载）","title":"刘长春：代表中国奥运起跑的人","url":"https://finance.sina.com.cn/jjxw/2021-08-23/doc-ikqcfncc4390015.shtml"},{"publisher":"中国新闻网（解放日报）","title":"刘长春之子忆“一个人的奥林匹克”:国强则体育强","url":"https://www.chinanews.com/olympic/news/2008/08-04/1334541.shtml"}]},{"id":"wang-shunyou","name":"王顺友","alias":"马班邮路上的邮递员","identity":"四川省木里县邮政局邮递员 · 2005“感动中国”人物 · 全国优秀共产党员","category":"顶级人类","date":"2026-11-10","heat":92,"headline":"【民族脊梁】王顺友：“马班邮路”上的传奇","summary":"1984年，19岁的王顺友接过父亲的班，成为四川木里县邮递员。每月28天在路上，往返584公里；翻5000米雪山、下40℃河谷，睡山洞、啃冰块。1995年被马踢破大肠，仍把邮件送完；1998年泥石流冲断道路，他为两封大学录取通知书冒险出发。2005年当选“感动中国”人物。","traits":["一个人一条路","把信看得比命重","怕孤单","不叫苦","走到走不动"],"methods":["接过父亲的班：1984年，19岁的王顺友成为木里县邮政局邮递员，负责县城至白碉、三桷桠、倮波、卡拉四乡的邮路。","一个月28天在路上：往返584公里，先翻海拔5000米的察尔瓦梁子，再下海拔1000米、40℃的雅砻江河谷。","把邮包看得比命重：1988年溜索绳断，他从两米多高摔下，邮包掉进雅砻江；不懂水性的他抓起树枝跳进江里，把邮包捞上来。","被马踢破大肠也不停：1995年在“九十九道拐”被受惊的马踢中肚子，他坚持把所有邮件送完，回县城才发现大肠已破。","为两封录取通知书冒险：1998年泥石流冲毁路桥，按规定可以不跑，但邮件里有两封大学录取通知书，他骑马上路，送到时邮件干干净净、他一身泥血。","把山歌当伴：一个人走久了，他自言自语，后来变成山歌——“马班邮路无尽头，脚印蹄声谱春秋”。"],"story":[{"t":"1984","d":"19岁接过父亲的班，成为木里县邮政局邮递员"},{"t":"1988.7","d":"溜索绳断，从两米多高摔下，邮包落江，他跳江捞包"},{"t":"1995","d":"在“九十九道拐”被马踢破大肠，仍坚持送完邮件"},{"t":"1998.8","d":"泥石流冲毁路桥，他为两封大学录取通知书冒险出发"},{"t":"2005","d":"当选“感动中国”人物；登上万国邮联行政理事会讲坛"},{"t":"2013","d":"习近平总书记在同全国劳模代表座谈时提到王顺友"},{"t":"2016","d":"“马班邮路”已全部被通乡公路取代，他仍惦记邮路上的乡亲"}],"quotes":["乡亲们需要我，我也离不开他们。","只要自己在岗位上一天，就要一直把信送下去，把路走下去。","我对乡亲们的感情深，愿意一直走在邮路上，但是我不希望我的后人再走这条马班邮路了。"],"writingUse":"写“基层劳动者”最容易写成两种：苦情模范，或者被神化的好人。王顺友两种都不是。他怕孤单，喜欢热闹，一个人走久了就自言自语、唱山歌；他把邮包看得比命重，但也会说“不希望后人再走这条邮路”。适合写那种不喊口号、把一件小事做一辈子的人；也适合写“他送的不是信，是山里头跟外头的唯一一根线”。","novel":{"want":"把每一封信、每一份报纸送到乡亲手里；后来是“只要在岗位上一天，就要一直把信送下去”。","fear":"邮件丢了、班期误了；不怕雪山、河谷、泥石流，也不怕一个人。","contradiction":"他一个人走了20年，最怕的却是孤单；他喜欢热闹，可大多数时候只有马和山歌。","pressureChoice":"1998年泥石流冲毁路桥，按规定可以不跑，但邮件里有两封大学录取通知书，他骑马上路；1995年被马踢破大肠，仍坚持送完。","scene":"雅砻江边“九十九道拐”，山鸡突然飞起，马受惊踢中他的肚子；他弯着腰把邮件送完，回县城才知道大肠破了。","relations":"父亲：把邮包交给他的人；乡亲：他送录取通知书的人；马：他路上唯一的伴。","confidence":"A"},"sources":[{"publisher":"共产党员网（人民日报）","title":"【民族脊梁】王顺友：“马班邮路”上的传奇","url":"http://biaozhang.12371.cn/2016/06/22/ARTI1466542691545142.shtml"},{"publisher":"人民网（中国民族宗教网）","title":"“馬班郵路”王順友：情筑郵路，愛洒涼山","url":"http://cpc.people.com.cn/BIG5/n1/2021/0719/c437562-32162244.html"}]},{"id":"wang-zhenyi","name":"王贞仪","alias":"清代女天文学家","identity":"清代天文学家、数学家、诗人 · 《月食解》《地圆论》作者","category":"顶级人类","date":"2026-11-11","heat":91,"headline":"全能学霸！这位清代女科学家的经历有多传奇？","summary":"清乾隆年间生于安徽天长，祖父是精通历算的官员，家里有七十五橱藏书。11岁随祖母去吉林，此后游历十余省；18岁研究天文数学，用灯当太阳、圆桌当地球、镜子当月亮，写出《月食解》；也学骑射，能“跨马横戟，发必中的”。25岁嫁给詹枚，29岁病逝。2019年《自然》把她选入“为科学发展奠定基础的女科学家”。","traits":["不类女流","自己找书读","把天象做成实验","能文能武","二十九岁的一生"],"methods":["把家藏书读穿：祖父有七十五橱藏书，她11岁到吉林后几乎读遍；祖父去世、家里失火后，靠自学继续。","用日常物件做天文实验：灯当太阳、圆桌当地球、镜子当月亮，移动三者位置，观察月食成因，写成《月食解》。","敢改古书：读历代天文著作，发现谬误就一条条勘误、订正，不因为是古书就照抄。","论证地圆：在《地圆论》里从六个方面说明“地虽圆体”，反驳“天圆地方”。","学骑射：十几岁向蒙古将军夫人学骑射，“跨马横戟，往来如飞”“发必中的”。","公开主张男女同智：“同是人也，则同是心性”“男女非相殊，彝德各宜保”。","把数学写成书：《勾股三角解》《历算简存》《筹算易知》《象数窥余》。"],"story":[{"t":"清乾隆年间","d":"生于安徽天长，祖父王者辅是精通历算的官员"},{"t":"11岁","d":"随祖母赴吉林探望祖父，此后近五年读遍家中藏书"},{"t":"16岁","d":"从吉林返回金陵；后随家人游历京师、关中、荆楚、粤地"},{"t":"18岁","d":"开始研究天文、数学，做月食实验，写《月食解》"},{"t":"25岁","d":"嫁给宣城文人詹枚；婚后继续研究，收男弟子夏乐山"},{"t":"29岁","d":"病逝；著有《德风亭初集》"},{"t":"2019","d":"《自然》将她选入“为科学发展奠定基础的女科学家”"},{"t":"近年","d":"国际天文学联合会以她的名字命名金星上一个陨石坑"}],"quotes":["足行万里书万卷，尝拟雄心胜丈夫。","男女非相殊，彝德各宜保。","同是人也，则同是心性。","丈夫之志才子胸，谁言女儿不英雄！"],"writingUse":"写「古代女科学家」最容易写成「被时代压迫的悲剧」。王贞仪不是。她家有藏书、能游历、能骑射、能自由恋爱，29岁的一生像一支短的火箭；她不是等时代允许才做研究，是自己找书、自己做实验、自己写书。适合写那种「不跟时代讲道理，直接做给你看」的女性；也适合写「她活得太短，但每一件事都按自己的意思来」的角色。","novel":{"want":"把天上的事弄明白：月食怎么发生、地为什么是圆的、星星怎么走；也证明女子一样能做学问。","fear":"被“女子无才便是德”困住，被当成“不类女流”的异类；不怕别人说闲话，怕的是没书读、没时间。","contradiction":"她是清代闺秀，却骑马射箭、自由恋爱、公开主张男女同智；她写最硬的天文数学，也写最软的诗。","pressureChoice":"祖父去世、家里失火、藏书散尽后，她没有停下，靠自学继续研究，写出《月食解》《地圆论》。","scene":"屋里吊一盏灯当太阳，摆一张圆桌当地球，拿一面镜子当月亮；她慢慢移动三样东西，看影子怎么落到桌子上。","relations":"祖父王者辅：教她历算、给她七十五橱书的人；祖母董氏：带她游历的人；丈夫詹枚：她的丈夫。","confidence":"A"},"sources":[{"publisher":"中国青年报（中国新闻网）","title":"全能学霸！这位清代女科学家的经历有多传奇？","url":"https://s.cyol.com/articles/2020-12/10/content_k3dNWet0.html"},{"publisher":"安徽党媒云（安徽日报）","title":"声名远扬海外,国内鲜为人知,一位女版伽利略的传奇人生 安徽清代女子王贞仪“惊艳”世界200年","url":"http://sqr.ahnews.com.cn/news/2025/03/10/c_679903.htm"}]},{"id":"tang-feifan","name":"汤飞凡","alias":"衣原体之父","identity":"微生物学家、病毒学家 · 世界第一个分离沙眼病原的人 · 中国科学院院士","category":"顶级人类","date":"2026-11-11","heat":93,"headline":"用自己的眼睛做沙眼试验","summary":"1897年生于湖南醴陵，湘雅医学院首届学生，哈佛深造后回国。1955年用鸡胚分离出沙眼病原TE8，成为世界上第一个分离沙眼病原的人；1958年元旦，他让助手把病原滴进自己眼睛，红肿着工作40天，记录完整病程。他还研制了中国第一批青霉素、牛痘疫苗，被称为“衣原体之父”。1958年9月去世。","traits":["以身试毒","从零建系","不迷信权威","把实验室当战场","东方巴斯德"],"methods":["弃工学医：在萍乡煤矿看到颜福庆用显微镜查钩虫，决定改考湘雅医学院，成为首届学生。","从零建细菌学系：1929年回国，实验室简陋，他自己改装设备，把显微镜捐给实验室。","推翻权威：1933年用野口的“颗粒杆菌”做志愿者接种，证明它不致病，推翻“细菌病原说”。","跳到框架外：别人用兔子、猴子，他改用鸡胚，第8次实验分离出沙眼病原TE8。","把病原滴进自己眼睛：1958年元旦，让助手把沙眼病原植入自己一只眼，红肿着工作40多天，记录完整病程。","在炮火边救人：1937年淞沪会战，他在离炮火几百米处抢救伤员；1939年赴昆明主持中央防疫处，研制中国第一批青霉素、血清、疫苗。"],"story":[{"t":"1897","d":"生于湖南醴陵汤家坪"},{"t":"1914","d":"考入湘雅医学专门学校，成为首届学生"},{"t":"1921","d":"湘雅毕业；赴北京协和医院进修，后赴哈佛大学医学院深造"},{"t":"1929","d":"应颜福庆邀请回国，任中央大学医学院细菌学系副教授"},{"t":"1937","d":"淞沪会战爆发，在离炮火几百米处抢救伤员"},{"t":"1939","d":"赴昆明主持中央防疫处，研制中国第一批青霉素、血清和疫苗"},{"t":"1955","d":"用鸡胚分离出沙眼病原TE8，成为世界第一个分离沙眼病原的人"},{"t":"1957","d":"当选中国科学院院士"},{"t":"1958.1.1","d":"让助手将沙眼病原植入自己眼睛，红肿着工作40多天"},{"t":"1958.9","d":"去世"},{"t":"1980年代","d":"国际沙眼防治组织追授沙眼金质奖章"},{"t":"1992","d":"邮电部发行汤飞凡纪念邮票"}],"quotes":["祖国需要我，我有责任为祖国的科学事业做出贡献。","研究、研究、研究出再好的东西，作了亡国奴，又有什么用！","没错，没错，典型的沙眼症状！"],"writingUse":"写「科学家」最容易写成「实验室里的圣人」。汤飞凡的素材里有真正的狠：为了证明病原，他把沙眼滴进自己眼睛，红肿着工作40天；在炮火边抢救伤员，在昆明用皮鞋上的绿毛做青霉素。他的信念不是口号，是「祖国需要我」。适合写那种不声张、敢拿自己做实验的人；也适合写「他救的不是一个人，是一个国家的公共卫生」。","novel":{"want":"让亿万人不得传染病；把沙眼的病原找出来，结束70年的争论。","fear":"研究停在半路、病原找错；不怕失明，也不怕拿自己试。","contradiction":"他是最谨慎的科学家，却做最冒险的事：把沙眼病原滴进自己的眼睛；他救的是千万人，先拿自己一个人的眼睛去赌。","pressureChoice":"1958年元旦，他让助手把沙眼病原植入自己一只眼，红肿着工作40多天，记录完整病程，才接受治疗。","scene":"实验室里，他指着自己红肿的眼睛，激动地喊：“没错，没错，典型的沙眼症状！”","relations":"颜福庆：把他引上医学路、叫他回国的人；助手：替他滴病原的人；妻子何莲：陪他回国的人。","confidence":"A"},"sources":[{"publisher":"生命时报","title":"用自己的眼睛做沙眼试验","url":"https://www.lifetimes.cn/article/9CaKrnKrYtM"},{"publisher":"红网（新华网）","title":"诺奖遗珠汤飞凡的非凡人生——写在汤飞凡诞辰120周年之际","url":"https://moment.rednet.cn/rednetcms/news/20170918/989570.html"}]},{"id":"wang-shuqun","name":"王曙群","alias":"“太空之吻”总装组组长","identity":"中国航天特级技师 · 上海航天设备制造总厂对接机构总装组组长 · 大国工匠","category":"顶级人类","date":"2026-11-12","heat":92,"headline":"“太空之吻”背后的大国工匠","summary":"1989年技校毕业，进上海航天设备制造总厂当钳工。1996年参与对接机构研制，一啃16年；2011年11月3日，神舟八号与天宫一号首次“太空之吻”。对接机构有118个传感器、5个控制器、上千个齿轮轴承、上万个零件；他和团队做了1101次对接试验、647次分离试验，把总装周期从3个多月压到40天。","traits":["从拧螺丝开始","耐得住寂寞","把问题归零","相信数据","脚踏实地，仰望星空"],"methods":["从钳工基本功开始：1989年进厂，跟师傅单培林学錾削、锉削、锯切、画线、钻削。","破格进高级班：1996年工作才7年，因中级工考试全厂亚军，被破格送进高级技工培训班，正好赶上对接机构研制。","把16年拆成无数次归零：对接机构从1996年干到2011年，一次次失败、一次次归零。","用数据说话：16年积累150万个数据；牵头研发50多台套专用装备，总装周期从3个多月缩到40天。","做1101次对接、647次分离试验：神舟八号/天宫一号首次对接前，在地面把能做的试验做足。","把经验变成标准：总结“五零三化”质量管理模式，2018年获中国质量奖提名奖；培养42名高级工、17名技师。","把年轻人推上去：玉兔月球车项目启用3位90后主操作，自己在火山灰试验里带头滚一身泥。"],"story":[{"t":"1989","d":"技校毕业，进入上海航天设备制造总厂当钳工"},{"t":"1996","d":"破格进入高级技工培训班，参与对接机构研制"},{"t":"2011.11.3","d":"神舟八号与天宫一号首次“太空之吻”，对接机构总装成功"},{"t":"2011前","d":"完成1101次对接试验、647次分离试验；热真空试验中定位传动轴断裂故障"},{"t":"2018","d":"总结“五零三化”质量管理模式"},{"t":"2019","d":"成为航天领域的大国工匠；团队完成7次飞行试验、13次交会对接"}],"quotes":["我们的征途是星辰大海，我们的探索永无止境！","脚踏实地、仰望星空。","我儿子是1997年出生的。那时，我刚刚开始研制对接机构……陪伴这个孩子的时间，比陪伴我儿子的时间长得多。","99%以上的设备都是我们自己掌握核心技术的，我们的产品现在去交会对接，可以达到一百分。"],"writingUse":"写「大国工匠」最容易写成「苦干加奉献」的口号。王曙群不是。他的狠劲在「归零」：16年，一次次失败，一次次从头来；他的聪明在「数据」：150万个数据、50多台专用装备，把总装周期从3个多月压到40天。适合写那种不爱讲话、只认数据、出了问题先找自己原因的人；也适合写「他把一件事干了16年，最后5分钟才被看见」的角色。","novel":{"want":"把对接机构装到100分，让中国航天器在太空“天衣无缝”地对接。","fear":"一个数据不对、一个零件不到位，导致对接失败；不怕16年，怕的是“差一点”。","contradiction":"他是全国唯一的对接机构总装组组长，却说自己只是个“拧螺丝”的钳工；他做的是最精密的活，起点是最普通的技校钳工。","pressureChoice":"1996年进高级技工班，正好赶上对接机构研制；16年，1101次对接试验、647次分离试验，把总装周期从3个多月压到40天。","scene":"对接机构热真空试验最后一项，突然无法解锁分离；所有人找不到原因，他凭经验把问题定位到锁驱动里一根传动轴，判定已断裂。","relations":"师傅单培林：告诉他“很多工作都是从拧好一颗螺丝开始”的人；团队：跟他一起归零的人；儿子：1997年出生、被他“陪伴得比对接机构少”的人。","confidence":"A"},"sources":[{"publisher":"新华社","title":"“太空之吻”背后的大国工匠","url":"https://www.xinhuanet.com/politics/2019-04/08/c_1124337315.htm"},{"publisher":"人民网","title":"王曙群：缔造“太空之吻”的大国工匠","url":"http://dangjian.people.com.cn/n1/2019/1023/c427980-31416542.html"},{"publisher":"半月谈","title":"王曙群：用150万个数据换一次“太空之吻”","url":"http://www.banyuetan.org/chcontent/sz/szrw/2018312/246949.shtml"}]},{"id":"yang-yi","name":"杨苡","alias":"“呼啸山庄”译名首创者","identity":"翻译家 · 作家 · 《呼啸山庄》译者 · 《一百年，许多人，许多事》口述者","category":"顶级人类","date":"2026-11-12","heat":91,"headline":"杨苡：译《呼啸山庄》 铸文学传奇","summary":"1919年生于天津，西南联大外文系毕业。1953年丈夫赵瑞蕻去东德教书，她独自带孩子；一个风雨夜，她嘴里念着Wuthering Heights，忽然写下“呼啸山庄”四个字。1955年译本出版，这个译名沿用至今。2022年，103岁的她出版口述自传《一百年，许多人，许多事》；2023年1月27日去世。","traits":["好玩","不装","记得住人","把翻译当玩","活过一个世纪"],"methods":["给巴金写信：17岁被困在家里，给巴金写信说要像觉慧一样冲出“金丝笼”；巴金回信劝她先读书。","转系：听沈从文建议，从西南联大中文系转到外文系。","在风雨夜想出书名：1953年丈夫出国，她独自带孩子；窗外大风，她念着Wuthering Heights，忽然写下“呼啸山庄”。","把翻译当玩：她说“这就是种玩法，我一直觉得翻译就是好玩”，但稿子会一遍遍改。","用20年做口述：1996年起，在南京大学家属区十来平方米的客厅里，跟余斌聊了20多年，留下《一百年，许多人，许多事》。","不装：她烦别人写她“贵族”，希望自己是“不高不低”的普通人；记住的多是“好玩的事”。"],"story":[{"t":"1919","d":"生于天津，父亲杨毓璋是天津中国银行第一任行长"},{"t":"1937","d":"保送南开大学中文系；七七事变后，随校西迁"},{"t":"1938","d":"赴昆明，入西南联大外文系"},{"t":"1953","d":"丈夫赵瑞蕻赴东德任教，她独自带孩子；风雨夜想出“呼啸山庄”"},{"t":"1955","d":"《呼啸山庄》译本出版，译名沿用至今"},{"t":"1996","d":"开始与余斌做口述访谈"},{"t":"2022","d":"《一百年，许多人，许多事：杨苡口述自传》出版"},{"t":"2023.1.27","d":"在南京去世，享年103岁"}],"quotes":["我虽是个平凡的人，却也有许许多多的人可念，许许多多的事想说。","这就是种玩法，我一直觉得翻译就是好玩。","我记住的经常是些好玩的事，就像你们现在说的‘八卦’。"],"writingUse":"写「翻译家」最容易写成「安静的幕后英雄」。杨苡不是。她把翻译说成「好玩」，把人生说成「有人可念，有事想说」；她出身天津银行行长家，却烦别人写她「贵族」；她活到103岁，记住的多是「好玩的事」。适合写那种不装、不苦、把大历史讲成家常的人；也适合写「她不是被时代推着走，是一直按自己的性子活」的角色。","novel":{"want":"把《呼啸山庄》译成中文，把那些人和事记下来；后来是“我虽是个平凡的人，却也有许许多多的人可念，许许多多的事想说”。","fear":"被人写成“贵族”、被传奇化；不怕老，怕的是那些人和事被忘掉。","contradiction":"她出身天津银行行长家，却烦别人写她“贵族”；她把翻译说成“好玩”，却一遍遍改稿、较真到人名和时间。","pressureChoice":"1953年丈夫去东德，她独自带两个孩子；一个风雨夜，她把Wuthering Heights译成“呼啸山庄”，1955年出版。","scene":"南京大学家属区十来平方米的小客厅，她和余斌一聊20多年；说到好玩的事，她笑得像回到学生时代。","relations":"巴金：17岁时给她回信的人；沈从文：建议她转外文系的人；余斌：陪她聊了20多年、整理口述自传的人。","confidence":"A"},"sources":[{"publisher":"中国作家网（中国文化报）","title":"杨苡：译《呼啸山庄》 铸文学传奇","url":"http://www.chinawriter.com.cn/n1/2023/0713/c403994-40034583.html"},{"publisher":"中工网（成都商报）","title":"翻译《呼啸山庄》的她走了","url":"https://www.workercn.cn/c/2023-01-29/7715434.shtml"}]}]};</script>

<script>
(function(){
'use strict';

/* ==================== 数据层 ==================== */
var DATA = { site:{name:'人间样本',subtitle:''}, updatedAt:'', categories:['原生家庭','商界狠人','情感战场','社会切片','娱乐圈','历史与传奇'], items:[] };
var CRAFT = { updatedAt:'', intro:'', categories:[], crafts:[], recipes:[] };
var STARS = {};        // 收藏状态
var VIEW = 'featured'; // featured | all | hot | starred | cat:xxx | craft | recipe
var CAT = '全部';
var CRAFT_CAT = '全部';
var KEY = 'renjian_stars_v1';
var THEME_KEY = 'renjian_theme_v1';
var DENSITY_KEY = 'renjian_density_v1';
var PROGRESS_KEY = 'renjian_progress_v1';
var CERT_SEAL = '结业';   // 证书印章上的字：结业 / 过稿 / 已通关 / 完稿
var TRACK = 'screen';       // screen | genre | literary | editor
var PROGRESS = {};          // { craftId: true }
var DENSITY = 'comfort';   // comfort | compact

/* ==================== 演示模式（?mask=1）====================
   投稿/演示场景下隐藏真人姓名：只改渲染，不动 data.json。
   规则：卡片标题显示「样本 01」，正文里出现的真名统一替换为「某人」。 */
var MASK = /(^|[?&])mask=1(&|$)/.test(location.search || '');
var MASK_NAMES = null;     // 真名 + 代称，长名优先替换

function buildMaskNames(raw){
  var seen = {}, list = [];
  (raw || []).forEach(function(it){
    [it.name, it['姓名'], it.alias, it['代称']].forEach(function(k){
      k = String(k == null ? '' : k).trim();
      if(k.length < 2 || seen[k]) return;
      seen[k] = 1; list.push(k);
    });
  });
  list.sort(function(a,b){ return b.length - a.length; });
  MASK_NAMES = list;
}
function maskText(s){
  if(!MASK || !MASK_NAMES) return s;
  var out = String(s == null ? '' : s);
  for(var i=0;i<MASK_NAMES.length;i++){
    if(out.indexOf(MASK_NAMES[i]) >= 0) out = out.split(MASK_NAMES[i]).join('某人');
  }
  return out;
}
function maskCode(i){ return '样本 ' + ('0'+(i+1)).slice(-2); }

function esc(s){
  return maskText(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function normItem(it,i){
  var o = {
    id: it.id || ('it_'+(i+1)),
    name: it.name || it['姓名'] || '佚名',
    alias: it.alias || it['代称'] || '',
    identity: it.identity || it['身份'] || '',
    category: it.category || it['类型'] || '社会切片',
    date: it.date || it.日期 || '',
    heat: parseInt(it.heat!=null?it.heat:it['炸裂度'],10) || 50,
    headline: it.headline || it['标题'] || '',
    summary: it.summary || it['摘要'] || '',
    traits: Array.isArray(it.traits)?it.traits:(Array.isArray(it['性格'])?it['性格']:[]),
    methods: Array.isArray(it.methods)?it.methods:(Array.isArray(it['处事方式'])?it['处事方式']:[]),
    story: Array.isArray(it.story)?it.story:(Array.isArray(it['故事线'])?it['故事线']:[]),
    quotes: Array.isArray(it.quotes)?it.quotes:(Array.isArray(it['原话'])?it['原话']:[]),
    writingUse: it.writingUse || it['小说用法'] || '',
    novel: (it.novel && typeof it.novel === 'object') ? it.novel : null,
    sources: Array.isArray(it.sources)?it.sources:(Array.isArray(it['信源'])?it['信源']:[])
  };
  o.heat = Math.max(0, Math.min(100, o.heat));
  if(MASK){                       /* 演示模式：标题换成"样本 01"，代称清空，正文由 esc() 抹名 */
    o.name = maskCode(i);
    o.alias = '';
  }
  return o;
}
function applyPayload(obj, from){
  if(!obj) return false;
  var arr = Array.isArray(obj) ? obj
          : Array.isArray(obj.items) ? obj.items
          : Array.isArray(obj['样本']) ? obj['样本'] : null;
  if(!arr) return false;
  if(MASK) buildMaskNames(arr);   /* 真名表必须从原始数据建，normItem 之后名字已被替换 */
  DATA.items = arr.map(normItem).filter(function(x){ return x.name; });
  DATA.updatedAt = obj.updatedAt || obj['更新日期'] || '';
  if(typeof obj.site === 'object' && obj.site && obj.site.subtitle) DATA.site.subtitle = obj.site.subtitle;
  if(Array.isArray(obj.categories) && obj.categories.length) DATA.categories = obj.categories;
  DATA.from = from || '';
  buildCats();
  renderAll();
  setTimeLabel();
  return true;
}

/* ==================== 载入 ==================== */
function applyCraft(obj){
  if(!obj) return false;
  CRAFT.crafts = Array.isArray(obj.crafts) ? obj.crafts : [];
  CRAFT.recipes = Array.isArray(obj.recipes) ? obj.recipes : [];
  CRAFT.tracks = Array.isArray(obj.tracks) ? obj.tracks : [];
  CRAFT.fieldNotes = Array.isArray(obj.fieldNotes) ? obj.fieldNotes : [];
  CRAFT.categories = Array.isArray(obj.categories) ? obj.categories : [];
  CRAFT.intro = obj.intro || '';
  CRAFT.updatedAt = obj.updatedAt || '';
  var cc = document.getElementById('cCraft'), cr = document.getElementById('cRecipe');
  if(cc) cc.textContent = CRAFT.crafts.length;
  if(cr) cr.textContent = CRAFT.recipes.length;
  return true;
}
function setTimeLabel(){
  var el = document.getElementById('sideTime');
  var src = DATA.from === 'embedded' ? '内置' : (DATA.from ? DATA.from : '');
  var d = DATA.updatedAt || '—';
  el.innerHTML = '更新 <b>' + esc(d) + '</b>' + (src ? '（'+esc(src)+'）' : '') + ' · 共 <b>' + DATA.items.length + '</b> 条';
}
var BANNER_KEY='renjian_banner_off_v1';
function showBanner(){
  // 只在本地双击（file://）时提示怎么更新数据。
  // 线上是 http(s)，数据已内嵌、用户不需要知道加载细节，不打扰。
  if(location.protocol !== 'file:') return;
  var off=false;
  try{ off = localStorage.getItem(BANNER_KEY)==='1'; }catch(e){}
  if(!off) document.getElementById('banner').classList.add('show');
}
function autoLoad(){
  // ① 内嵌数据：file:// 双击打开时唯一能零交互显示的办法，优先级最高
  if(window.EMBEDDED_DATA){ applyPayload(window.EMBEDDED_DATA,'embedded'); }
  if(window.EMBEDDED_CRAFT){ applyCraft(window.EMBEDDED_CRAFT); }
  var banner = document.getElementById('banner');
  // ② http(s) 环境尝试拉最新覆盖；file:// 下必然失败，内嵌数据已接管
  if(typeof fetch !== 'function'){ showBanner(); return; }
  try{
    fetch('./data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      return r.text();
    }).then(function(t){
      if(applyPayload(JSON.parse(t),'data.json')) banner.classList.remove('show');
    }).catch(function(){ showBanner(); });
    fetch('./craft.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      return r.text();
    }).then(function(t){
      if(applyCraft(JSON.parse(t))) renderAll();
    }).catch(function(){});
  }catch(e){ showBanner(); }
}
/* 手动选择文件（file:// 下 fetch 被 CORS 拦，只能走用户授权） */
function pickFile(){
  var inp = document.getElementById('fileInput');
  inp.value='';
  inp.click();
}
function loadFile(file){
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var obj = JSON.parse(fr.result);
      if(applyPayload(obj, file.name)) document.getElementById('banner').classList.remove('show');
      else alert('数据格式无法识别：需要 items 数组。');
    }catch(e){ alert('JSON 解析失败：'+e.message); }
  };
  fr.readAsText(file,'utf-8');
}

/* ==================== 渲染 ==================== */
function buildCats(){
  var pills = document.getElementById('catPills');
  var nv = document.getElementById('navCats');

  // 配方视图没有筛选维度，收起工具栏
  if(VIEW === 'recipe'){
    pills.innerHTML = '';
    pills.setAttribute('hidden','');
    nv.innerHTML = '';
    updateCounts();
    return;
  }
  pills.removeAttribute('hidden');

  // 方法视图：三个轨道 + 编辑怎么说
  if(VIEW === 'craft'){
    var tabs = (CRAFT.tracks||[]).map(function(t){
      var n = CRAFT.crafts.filter(function(c){ return c.track === t.id; }).length;
      return '<button class="pill'+(TRACK===t.id?' on':'')+'" data-track="'+t.id+'">'
        + esc(t.name)+' <span class="n">'+n+'</span></button>';
    }).join('');
    tabs += '<button class="pill pill-alt'+(TRACK==='editor'?' on':'')+'" data-track="editor">'
      + '编辑怎么说 <span class="n">'+(CRAFT.fieldNotes||[]).length+'</span></button>';
    pills.innerHTML = tabs;
    pills.querySelectorAll('.pill').forEach(function(b){
      b.onclick = function(){ TRACK = b.getAttribute('data-track'); renderAll(); syncHash(); };
    });
    nv.innerHTML = '';
    updateCounts();
    return;
  }

  var counts = {};
  DATA.items.forEach(function(x){ counts[x.category]=(counts[x.category]||0)+1; });
  var cats = (DATA.categories||[]).filter(function(c){ return counts[c]; });
  Object.keys(counts).forEach(function(c){ if(cats.indexOf(c)<0) cats.push(c); });

  pills.innerHTML = '<button class="pill'+(CAT==='全部'?' on':'')+'" data-cat="全部">全部 <span class="n">'+DATA.items.length+'</span></button>'
    + cats.map(function(c){
        return '<button class="pill'+(CAT===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+' <span class="n">'+counts[c]+'</span></button>';
      }).join('');
  pills.querySelectorAll('.pill').forEach(function(b){
    b.onclick = function(){
      CAT = b.getAttribute('data-cat');
      if(VIEW !== 'all' && VIEW.indexOf('cat:') !== 0) VIEW = 'all';
      syncNavActive(); renderAll(); syncHash();
    };
  });

  nv.innerHTML = cats.map(function(c){
    return '<button class="nav-item" data-view="cat:'+esc(c)+'">'
      + '<span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7"/></svg></span>'
      + esc(c) + '<span class="cnt">'+counts[c]+'</span></button>';

    b.onclick = function(){ VIEW = b.getAttribute('data-view'); CAT='全部'; setActiveNav(); renderAll(); syncHash(); };
  });

}
function updateCounts(){
  var set = function(id, v){ var e = document.getElementById(id); if(e) e.textContent = v; };
  set('cAll', DATA.items.length);
  set('cHot', Math.min(10, boardPool().length));
  set('cFeatured', latestItems().length);
  set('cStar', Object.keys(STARS).filter(function(k){return STARS[k];}).length);
  set('cCraft', CRAFT.crafts.length);
  set('cRecipe', CRAFT.recipes.length);
}
function latestItems(){
  if(!DATA.items.length) return [];
  var ds = DATA.items.map(function(x){return x.date;}).filter(Boolean).sort();
  var last = ds[ds.length-1] || DATA.items[0].date;
  return DATA.items.filter(function(x){ return x.date === last; });
}
/* 收录按天成批。批次 = 不同的 date，最近的排在前面 */
function batchDates(){
  var ds = [];
  DATA.items.forEach(function(x){ if(x.date && ds.indexOf(x.date) < 0) ds.push(x.date); });
  return ds.sort(function(a,b){ return b.localeCompare(a); });
}
/* 最近 n 批的全部条目（热榜用，避免老条目长期霸榜） */
function recentBatches(n){
  var keep = batchDates().slice(0, n);
  return DATA.items.filter(function(x){ return keep.indexOf(x.date) >= 0; });
}
function setActiveNav(){
  document.querySelectorAll('#navViews .nav-item, #navCats .nav-item, [data-view="starred"]').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-view')===VIEW);
  });
}
function heatCls(h){ return h>=85 ? '' : (h>=70 ? 'mid' : 'low'); }

/* ==================== 检索 ==================== */
function normQ(){
  var q = (document.getElementById('q').value || '');
  return q.toLowerCase().replace(/\s+/g, ' ').trim();
}
/* 空格分词后要求全部命中（AND）；不写空格时就是原来的子串匹配 */
function matchAll(hay, q){
  if(!q) return true;
  var terms = q.split(' '), i;
  for(i=0;i<terms.length;i++){ if(hay.indexOf(terms[i]) < 0) return false; }
  return true;
}
/* 人物全文索引：故事线（时间+发生了什么）和信源标题也进索引 */
function personHay(x){
  var parts = [x.name, x.alias, x.identity, x.category, x.headline, x.summary, x.writingUse]
    .concat(x.traits, x.methods, x.quotes);
  x.story.forEach(function(t){
    parts.push(typeof t === 'string' ? t : ((t.t||'') + ' ' + (t.d||'')));
  });
  x.sources.forEach(function(t){
    parts.push((t.publisher||'') + ' ' + (t.title||'') + ' ' + (t.url||''));
  });
  return parts.join(' ').toLowerCase();
}
function craftHay(c){
  var usedBy = CRAFT.recipes.filter(function(r){ return (r.techniques||[]).indexOf(c.id) >= 0; });
  return [c.title,c.source,c.author,c.category,c.oneLiner,c.example,c.quote,c.linkHint]
    .concat(c.howto||[])
    .concat((c.links||[]).map(itemName))
    .concat(usedBy.map(function(r){ return r.title; }))
    .join(' ').toLowerCase();
}
function craftMatch(c, q){ return matchAll(craftHay(c), q); }
function recipeHay(r){
  return [r.title,r.formula,r.structure,r.why]
    .concat(r.beats||[])
    .concat((r.techniques||[]).map(craftText))
    .concat((r.cast||[]).map(function(x){ return (x.role||'') + ' ' + (x.from ? itemName(x.from) : ''); }))
    .join(' ').toLowerCase();
}
function recipeMatch(r, q){ return matchAll(recipeHay(r), q); }

/* 空结果时告诉用户其他层有没有 —— 人物搜不到不代表库里没有 */
function showEmptyHint(el){
  var q = normQ();
  if(!q){ el.textContent = '这里还没有样本'; return; }
  var nc = CRAFT.crafts.filter(function(c){ return craftMatch(c, q); }).length;
  var nr = CRAFT.recipes.filter(function(r){ return recipeMatch(r, q); }).length;
  if(!nc && !nr){ el.textContent = '没有匹配「' + q + '」的内容'; return; }
  el.innerHTML = '人物样本里没有匹配「' + esc(q) + '」'
    + (nc ? '，写作方法里有 <b>' + nc + '</b> 条' : '')
    + (nr ? '，角色配方里有 <b>' + nr + '</b> 条' : '')
    + '<br><button class="empty-act" data-empty-go>去这些层看</button>';
  var b = el.querySelector('[data-empty-go]');
  if(b) b.onclick = function(){
    VIEW = nc ? 'craft' : 'recipe';
    CAT = '全部'; CRAFT_CAT = '全部';
    syncNavActive(); renderAll(); syncHash();
    try{ window.scrollTo(0,0); }catch(e){}
  };
}
