function currentList(){
  var list = DATA.items.slice();
  if(VIEW === 'featured'){ list = latestItems(); }
  else if(VIEW === 'hot'){ list.sort(function(a,b){ return b.heat-a.heat; }); }
  else if(VIEW === 'starred'){ list = list.filter(function(x){ return STARS[x.id]; }); }
  else if(VIEW.indexOf('cat:')===0){ list = list.filter(function(x){ return x.category === VIEW.slice(4); }); }

  if(CAT !== '全部'){ list = list.filter(function(x){ return x.category === CAT; }); }

  var q = normQ();
  if(q){ list = list.filter(function(x){ return matchAll(personHay(x), q); }); }
  // 默认按日期倒序，同一天里炸裂度高的在前（hot 视图保留纯热度序）
  if(VIEW !== 'hot'){
    list.sort(function(a,b){
      var d = (b.date||'').localeCompare(a.date||'');
      return d !== 0 ? d : (b.heat - a.heat);
    });
  }
  return list;
}

/* ==================== 炸裂榜（独立页面） ====================
   口径：默认「最近三批」，避免老条目长期霸榜；可以切到全时。
   前 3 名用大卡，04-10 用紧凑行 —— 参照 aihot 热点榜的分层。 */
var HOT_SCOPE = 'recent';
function boardPool(){
  return HOT_SCOPE === 'all' ? DATA.items.slice() : recentBatches(3);
}
function boardTop(n){
  return boardPool().sort(function(a,b){ return b.heat - a.heat; }).slice(0, n);
}
function renderBoard(){
  var pool = boardPool();
  var top = boardTop(10);
  var feed = document.getElementById('feed');
  var empty = document.getElementById('empty');
  empty.hidden = true;

  var scopeTxt = HOT_SCOPE === 'all'
    ? '全部 ' + pool.length + ' 条样本里'
    : '最近 ' + Math.min(3, batchDates().length) + ' 批（' + pool.length + ' 条候选）里';

  var hero = '<div class="board-hero">'
    + '<div class="bh-kicker"><span class="pd"><i></i><i></i></span>实时炸裂</div>'
    + '<h1>炸裂榜</h1>'
    + '<div class="board-sub">'
    +   '<p>' + scopeTxt + '性格最极端、最有戏的 ' + top.length + ' 个人</p>'
    +   '<div class="bh-meta"><span>更新 ' + esc(DATA.updatedAt || '—') + '</span><span>·</span><span>按炸裂度排序</span></div>'
    + '</div>'
    + '<div class="bh-meta" style="margin-top:12px"><span class="bh-tabs">'
    +   '<button type="button" data-scope="recent" class="' + (HOT_SCOPE==='recent'?'on':'') + '">最近三批</button>'
    +   '<button type="button" data-scope="all" class="' + (HOT_SCOPE==='all'?'on':'') + '">全时</button>'
    + '</span></div></div>';

  var newestDate = batchDates()[0];
  function badges(it){
    var b = '';
    if(it.heat >= 90) b += '<span class="pbadge hot">爆</span>';
    if(it.date === newestDate) b += '<span class="pbadge new">新</span>';
    return b;
  }
  function bar(v){ return '<span class="pbar"><i style="width:'+Math.max(2,Math.min(100,v))+'%"></i></span>'; }

  var podium = top.slice(0,3).map(function(it,i){
    var isHero = i === 0;
    return '<article class="pcard'+(isHero?' hero':'')+'" data-goto="'+esc(it.id)+'">'
      + '<div class="pc-top"><span class="pr">NO.'+String(i+1).padStart(2,'0')+'</span>'+badges(it)+'</div>'
      + '<div class="pn">'+esc(it.name)+'<span class="pc">'+esc(it.category)+'</span></div>'
      + (it.alias && it.alias !== it.name ? '<div class="pa">'+esc(it.alias)+'</div>' : '')
      + '<div class="ph">'+esc(it.headline)+'</div>'
      + (isHero && it.summary ? '<p class="ps">'+esc(it.summary)+'</p>' : '')
      + '<div class="pfoot">'
      +   '<span class="pmeta">'+it.sources.length+' 个信源'+(it.quotes.length?' · '+it.quotes.length+' 条原话':'')+'</span>'
      +   '<span class="phe"><b>'+it.heat+'</b>'+bar(it.heat)+'<em>炸裂度</em></span>'
      + '</div>'
      + '</article>';
  }).join('');

  var rest = top.slice(3).map(function(it,i){
    return '<li data-goto="'+esc(it.id)+'">'
      + '<span class="bn">'+String(i+4).padStart(2,'0')+'</span>'
      + '<span class="bm"><span class="bt">'+esc(it.name)+'</span>'
      +   '<span class="bs">'+esc(it.headline)+'</span></span>'
      + '<span class="bc">'+esc(it.category)+'</span>'
      + '<span class="bh">'+it.heat+'<span class="bar"><i style="width:'+Math.max(2,Math.min(100,it.heat))+'%"></i></span></span></li>';
  }).join('');

  var note = '<div class="board-foot"><p class="board-note"><b>炸裂度怎么算</b>：衡量的是性格与处置方式的争议戏剧性（60–96），'
    + '不是成就值 —— 「顶级人类」封顶 95，不会盖过争议榜首。榜单只排前十。</p>'
    + '<a class="board-all" href="#/all">看全部样本 →</a></div>';

  feed.innerHTML = hero
    + (podium ? '<div class="bgrid">'+podium+'</div>' : '')
    + (rest ? '<ol class="blist">'+rest+'</ol>' : '')
    + note;

  bindChips(feed);
  feed.querySelectorAll('[data-scope]').forEach(function(b){
    b.onclick = function(){ HOT_SCOPE = b.getAttribute('data-scope'); renderAll(); };
  });
}

function renderFeed(){
  var list = currentList();
  var feed = document.getElementById('feed');
  var empty = document.getElementById('empty');
  if(!list.length){ feed.innerHTML=''; empty.hidden=false; showEmptyHint(empty); return; }
  empty.hidden = true;

  feed.innerHTML = '<ul class="feed">' + list.map(itemHTML).join('') + '</ul>';

  feed.querySelectorAll('[data-more]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-more');
      var d = document.getElementById('detail-'+id);
      var open = d.classList.toggle('show');
      b.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
      b.childNodes[0].nodeValue = open ? '收起档案' : '展开完整档案';
      var card = b.closest ? b.closest('.card') : null;
      if(card) card.classList.toggle('expanded', open);
    };
  });
  feed.querySelectorAll('[data-star]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-star');
      STARS[id] = !STARS[id];
      if(!STARS[id]) delete STARS[id];
      save();
      b.classList.toggle('on', !!STARS[id]);
      b.setAttribute('aria-pressed', STARS[id] ? 'true' : 'false');
      b.querySelector('svg').setAttribute('fill', STARS[id]?'currentColor':'none');
      document.getElementById('cStar').textContent = Object.keys(STARS).length;
      if(VIEW==='starred') renderFeed();
    };
  });
}

function renderTitle(){
  var t = document.getElementById('pageTitle'), s = document.getElementById('pageSub');
  if(VIEW==='featured'){ t.textContent='最新收录'; s.textContent='最近一批观察样本，按收录日期排列'; }
  else if(VIEW==='all'){ t.textContent='全部样本'; s.textContent='共 '+DATA.items.length+' 条人物档案'; }
  else if(VIEW==='hot'){ t.textContent='炸裂榜'; s.textContent='最近三批里最炸的十个 · 点卡片看完整档案'; }
  else if(VIEW==='starred'){ t.textContent='我的收藏'; s.textContent='标记过的人物会留在这里（存在本机浏览器）'; }
  else if(VIEW==='craft'){
    var tr = trackById(TRACK);
    t.textContent = '写作方法';
    s.textContent = (TRACK==='editor') ? '行业经验，不是理论 —— 读的时候当行规看' : (tr.desc || '按轨道一课一课学');
  }
  else if(VIEW==='recipe'){ t.textContent='角色配方'; s.textContent='把素材组合成叙事结构 · 点角色名跳到对应人物'; }
  else if(VIEW==='changelog'){ t.textContent='更新日志'; s.textContent='这个站是什么时候变成现在这样的 · 新的在最上面'; }
  else if(VIEW.indexOf('cat:')===0){ t.textContent=VIEW.slice(4); s.textContent='按类型浏览'; }
}
function renderAll(){
  renderTitle(); buildCats();
  var head = document.getElementById('pageHead');
  if(head) head.hidden = (VIEW === 'hot');
  if(VIEW==='craft'){ renderCrafts(); }
  else if(VIEW==='recipe'){ renderRecipes(); }
  else if(VIEW==='changelog'){ renderChangelog(); }
  else if(VIEW==='hot'){ renderBoard(); }
  else { renderFeed(); }
  syncNavActive();
}
function syncNavActive(){
  document.querySelectorAll('.nav-item').forEach(function(b){
    var v = b.getAttribute('data-view');
    if(v) b.classList.toggle('active', v===VIEW);
  });
  // 移动端底部导航：cat:xxx 归类到「全部」
  var mv = (VIEW.indexOf('cat:')===0) ? 'all' : VIEW;
  document.querySelectorAll('#tabbar .tb').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-view')===mv);
  });
  var cur = (VIEW==='craft') ? CRAFT_CAT : CAT;
  document.querySelectorAll('#catPills .pill').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-cat')===cur);
  });
}

/* 内容侧的变化不再手写：直接按 data.json 的收录日期生成，避免日志落后于数据 */
function contentLog(){
  var by = {};
  DATA.items.forEach(function(x){
    if(!x.date) return;
    (by[x.date] = by[x.date] || []).push(x);
  });
  return Object.keys(by).sort(function(a,b){ return b.localeCompare(a); }).map(function(d){
    var arr = by[d].slice().sort(function(a,b){ return b.heat-a.heat; });
    return {
      date: d, n: arr.length, more: arr.length > 6,
      names: arr.slice(0,6).map(function(x){ return x.name; }).join('、')
    };
  });
}
function renderChangelog(){
  var feed = document.getElementById('feed'), empty = document.getElementById('empty');
  empty.hidden = true;
  var TAG = { new:['new','新增'], chg:['chg','调整'], fix:['fix','修复'] };
  var site = {}, auto = {};
  CHANGELOG.forEach(function(d){ site[d.date] = d.items; });
  contentLog().forEach(function(x){ auto[x.date] = x; });
  var dates = Object.keys(site).concat(Object.keys(auto))
    .filter(function(d,i,a){ return a.indexOf(d) === i; })
    .sort(function(a,b){ return b.localeCompare(a); });
  feed.innerHTML = dates.map(function(d){
    var items = (site[d] || []).map(function(it){
      var g = TAG[it.t] || TAG.chg;
      return '<div class="log-item"><div class="log-h">'
        + '<span class="log-tag '+g[0]+'">'+g[1]+'</span>'+esc(it.h)+'</div>'
        + (it.p ? '<div class="log-p">'+esc(it.p)+'</div>' : '') + '</div>';
    }).join('');
    var a = auto[d];
    if(a){
      items += '<div class="log-item"><div class="log-h">'
        + '<span class="log-tag add">收录</span>新增 ' + a.n + ' 条样本</div>'
        + '<div class="log-p">' + esc(a.names) + (a.more ? ' 等，共 ' + a.n + ' 条' : '') + '</div></div>';
    }
    return '<div class="log-day"><div class="log-date">'+esc(d)+'</div><div class="log-body">'+items+'</div></div>';
  }).join('');
}

/* ==================== 路由：#/p/<id> #/c/<id> #/r/<id> #/cat/<类> ====================
   视图也写进 URL，这样：① 浏览器后退键不再直接退出站点
   ② 每条样本 / 方法 / 配方都有自己的链接，可以复制发给朋友或加书签 */
var HASH_READY = false, HASH_SELF = null;
function dec(x){ try{ return decodeURIComponent(x); }catch(e){ return x; } }
function writeHash(h){
  if(!h || location.hash === h) return;
  HASH_SELF = h;
  try{ location.hash = h; }catch(e){}
}
function syncHash(){
  if(!HASH_READY) return;
  var h;
  if(VIEW.indexOf('cat:') === 0) h = '#/cat/' + encodeURIComponent(VIEW.slice(4));
  else if(VIEW === 'changelog') h = '#/log';
  else if(VIEW === 'craft') h = '#/craft/' + encodeURIComponent(TRACK || 'screen');
  else if(VIEW === 'all' && CAT !== '全部') h = '#/all/' + encodeURIComponent(CAT);
  else h = '#/' + (VIEW || 'featured');
  writeHash(h);
}
function applyHash(){
  var raw = (location.hash || '').replace(/^#/, '');
  if(!raw || raw === '/') return false;
  var p = raw.split('/').filter(Boolean).map(dec);
  var v = p[0];
  if(v === 'p'){
    if(p[1] && itemName(p[1])) gotoItem(p[1], true);
    else { VIEW='all'; CAT='全部'; CRAFT_CAT='全部'; clearQuery(); renderAll(); }
    return true;
  }
  if(v === 'c'){
    if(p[1] && craftName(p[1])) gotoCraft(p[1], true);
    else { VIEW='craft'; CAT='全部'; CRAFT_CAT='全部'; clearQuery(); renderAll(); }
    return true;
  }
  if(v === 'r'){
    if(p[1] && recipeName(p[1])) gotoRecipe(p[1], true);
    else { VIEW='recipe'; CAT='全部'; CRAFT_CAT='全部'; clearQuery(); renderAll(); }
    return true;
  }
  if(v === 'craft' && p[1]){
    TRACK = p[1]; VIEW='craft'; CAT='全部'; CRAFT_CAT='全部'; clearQuery(); renderAll(); return true;
  }
  if(v === 'log' || v === 'changelog'){
    VIEW='changelog'; CAT='全部'; CRAFT_CAT='全部'; clearQuery(); renderAll(); return true;
  }
  if(v === 'cat' && p[1]){
    VIEW='cat:'+p[1]; CAT='全部'; CRAFT_CAT='全部'; clearQuery(); renderAll(); return true;
  }
  if(v === 'all' && p[1]){
    VIEW='all'; CAT=p[1]; CRAFT_CAT='全部'; clearQuery(); renderAll(); return true;
  }
  if(['featured','all','hot','craft','recipe','starred'].indexOf(v) >= 0){
    VIEW=v; CAT='全部'; CRAFT_CAT='全部'; clearQuery(); renderAll(); return true;
  }
  return false;
}
window.addEventListener('hashchange', function(){
  if(location.hash === HASH_SELF){ HASH_SELF = null; return; }
  applyHash();
});

/* ==================== 复制链接 ==================== */
function linkFor(spec){
  var i = spec.indexOf(':');
  var t = spec.slice(0, i), id = spec.slice(i+1);
  var pre = t === 'p' ? '#/p/' : (t === 'c' ? '#/c/' : '#/r/');
  return location.href.split('#')[0] + pre + encodeURIComponent(id);
}
function legacyCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand && document.execCommand('copy');
    ta.remove();
    return !!ok;
  }catch(e){ return false; }
}
function copyLink(spec){
  var url = linkFor(spec);
  var done = function(){ toast('链接已复制'); };
  var fail = function(){ toast('复制失败，请手动复制：' + url); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ legacyCopy(url) ? done() : fail(); });
      return;
    }
  }catch(e){}
  legacyCopy(url) ? done() : fail();
}

  var chips = (c.links||[]).map(chipHTML).join('');

function confetti(){
  var cv = document.getElementById('confetti');
  if(!cv) return;
  var reduce = false;
  try{ reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduce) return;
  var ctx = cv.getContext('2d');
  if(!ctx) return;
  var W = cv.width = cv.offsetWidth, H = cv.height = cv.offsetHeight;
  var COLORS = ['#176b75','#b3402a','#b8873a','#2f7d5c','#4fb3bf'];
  var parts = [];
  for(var i=0;i<130;i++){
    parts.push({
      x: W/2 + (Math.random()-0.5)*120, y: H*0.42,
      vx: (Math.random()-0.5)*9, vy: -Math.random()*11 - 3,
      s: 3 + Math.random()*5, r: Math.random()*Math.PI,
      vr: (Math.random()-0.5)*0.3, c: COLORS[i % COLORS.length], life: 1
    });
  }
  var t0 = Date.now();
  function frame(){
    var el = Date.now() - t0;
    ctx.clearRect(0,0,W,H);
    parts.forEach(function(p){
      p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life = Math.max(0, 1 - el/2200);
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.62);
      ctx.restore();
    });
    if(el < 2200 && !document.getElementById('certOverlay').hidden) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,W,H);
  }
  requestAnimationFrame(frame);
}

      })
      .then(function(res){
        var t = (res[0] && res[0].data) ? res[0].data.length : 0;
        var a = (res[1] && res[1].data) ? res[1].data.length : 0;
        if (a > 0) show(t, a);
      })
      .catch(function(e){
        /* 统计失败不影响主内容，保持隐藏；留一行 debug 方便排查 */
        try{ console.debug('[visit-stat] skipped:', e && (e.message || e.code || e)); }catch(_){}
      });
  }

  /* 等 SDK 就绪再跑：sdk.js 是 defer 加载，load 事件不一定等得到它 */
  function waitSdk(n){
    if (window.WorkBuddyCloud && WorkBuddyCloud.createWorkBuddyCloud) { boot(); return; }
    if (n > 40) return;                       /* 最多等 10 秒，等不到就放弃 */
    setTimeout(function(){ waitSdk(n + 1); }, 250);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ waitSdk(0); });
  } else {
    waitSdk(0);
  }
})();
</script>
</body>
</html>
