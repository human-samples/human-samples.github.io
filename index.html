<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"/>
<!-- 内容是真人负面评价，禁止被搜索引擎收录；本地双击打开不受影响 -->
<meta name="robots" content="noindex,nofollow"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>人间样本 — 真实人物的性格切片与处事样本</title>
<meta name="description" content="收集争议性、戏剧性的真实人物及其处事方式，供小说人物塑造参考。"/>
<style>
/* ============ 设计令牌（参考 aihot.news）============ */
:root{
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --font-serif: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;

  --bg:#faf9f6; --bg-sunk:#f3f3ef; --bg-muted:#e9ede9;
  --surface:#fff; --surface-2:#fdfdfb; --sidebar:#fdfdfb; --daybar:#f0f2ee; --field:#eef1ed;
  --ink:#202a30; --ink-2:#303c42; --ink-3:#59656b; --ink-4:#657176;
  --line:#dfe4e1; --line-strong:#d1d9d5; --line-soft:#e9ede9;
  --accent:#176b75; --accent-ink:#145f68; --accent-soft:#176b7514; --accent-softer:#176b750d;
  --note:#526f72; --prose-ink:#26323a;
  --hot:#b3402a; --hot-soft:#b3402a14;
  --amber:#b8873a; --amber-ink:#7c5a24; --amber-soft:#b8873a1a;
  --ok:#2f7d5c; --ok-soft:#2f7d5c1a; --ok-ink:#2a6e51;
  --rank-1:#b3402a; --rank-2:#a3642f; --rank-3:#96702e; --rank-rest:#6b7684;

  --r-mark:5px; --r-control:8px; --r-tile:10px; --r-card:12px; --r-panel:14px; --r-sheet:16px;
  --sh-card:0 1px 2px #202a3006;
  --sh-card-hover:0 3px 12px #202a300e;
  --sh-soft:0 4px 12px #1c27330f;
  --sh-thumb:0 1px 2px #1c27331a, 0 1px 1px #1c27330a;
  --sh-pop:0 12px 32px #1c27331f;
  --sidebar-w:196px;
  --ease:cubic-bezier(.25,1,.5,1);
}
[data-theme="dark"]{
  --bg:#13191c; --bg-sunk:#1a2226; --bg-muted:#222c31;
  --surface:#1b2327; --surface-2:#1e272c; --sidebar:#171f23; --daybar:#1a2226; --field:#222c31;
  --ink:#e8ece9; --ink-2:#cfd6d3; --ink-3:#9aa6a4; --ink-4:#7f8c8a;
  --line:#2a353a; --line-strong:#374348; --line-soft:#232d32;
  --accent:#4fb3bf; --accent-ink:#6cc6d0; --accent-soft:#4fb3bf1f; --accent-softer:#4fb3bf12;
  --note:#8fa3a5; --prose-ink:#dbe4e1;
  --hot:#e2705a; --hot-soft:#e2705a1a;
  --amber:#cfa257; --amber-ink:#e0be86; --amber-soft:#cfa2571f;
  --ok:#57a882; --ok-soft:#57a8821a; --ok-ink:#7cc3a2;
  --rank-1:#e2705a; --rank-2:#cf8f56; --rank-3:#c2a456; --rank-rest:#8c99a7;
  --sh-card:0 1px 2px #00000040;
  --sh-card-hover:0 4px 16px #00000055;
  --sh-soft:0 4px 14px #00000040;
  --sh-thumb:0 1px 2px #00000060;
  --sh-pop:0 14px 36px #00000070;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-sans);
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ============ 布局 ============ */
.app{display:flex;min-height:100dvh}

/* ---------- 侧边栏 ---------- */
.sidebar{
  position:sticky; top:0; height:100dvh; width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  display:flex; flex-direction:column;
  background:var(--sidebar); border-right:1px solid var(--line);
  padding:20px 12px 14px;
}
.logo{display:flex;align-items:center;gap:9px;height:50px;padding:0 4px;margin-bottom:14px;color:var(--ink)}
.logo .mark{
  width:26px;height:26px;border-radius:8px;flex:0 0 26px;
  background:linear-gradient(140deg,var(--accent),var(--accent-ink));
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 2px 6px #176b7533;
}
.logo .txt{display:flex;flex-direction:column;line-height:1.15}
.logo .txt b{font-size:15px;font-weight:700;letter-spacing:.02em}
.logo .txt em{font-style:normal;font-size:9.5px;letter-spacing:.14em;color:var(--ink-4);text-transform:uppercase}
.nav{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.nav-label{padding:13px 10px 4px;font-size:11px;color:var(--ink-4);letter-spacing:.04em}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;
  border-radius:var(--r-control);font-size:13.5px;color:var(--ink-3);
  transition:background .15s,color .15s;text-align:left;width:100%;
}
.nav-item:hover{background:var(--bg-sunk);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav-item .ic{width:20px;flex:0 0 20px;display:grid;place-items:center;color:var(--ink-4)}
.nav-item.active .ic{color:var(--accent)}
.nav-item .cnt{margin-left:auto;font-size:11.5px;color:var(--ink-4);font-family:var(--font-mono)}
.nav-item.active .cnt{color:var(--accent)}
.side-foot{padding-top:10px;border-top:1px solid var(--line-soft);margin-top:8px}
.side-foot .row{display:flex;gap:6px}
.sbtn{
  flex:1;height:32px;border-radius:var(--r-control);border:1px solid var(--line);
  background:var(--surface);font-size:12px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:5px;
  transition:background .15s,color .15s,border-color .15s;
}
.sbtn:hover{background:var(--bg-sunk);color:var(--ink);border-color:var(--line-strong)}
.side-time{margin-top:8px;font-size:11px;color:var(--ink-4);line-height:1.5;padding:0 2px}
.side-time b{color:var(--ink-3);font-weight:600}

/* ---------- 主区 ---------- */
main{flex:1;min-width:0;padding:26px 28px 90px}
.wrap{max-width:1240px;margin:0 auto;width:100%}
.page-h1{font-size:24px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.page-sub{margin-top:6px;font-size:13px;color:var(--ink-4);line-height:1.6}
/* 访问统计：今日/累计访问人数（数据来自云数据库，失败则整天隐藏） */
.visit-stat{margin-top:10px;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:12px;color:var(--ink-4);font-family:var(--font-mono);line-height:1}
.visit-stat .vs-i{display:inline-flex;align-items:center;gap:4px;background:var(--bg-sunk);
  border:1px solid var(--line-soft);border-radius:999px;padding:4px 9px}
.visit-stat .vs-i b{color:var(--accent);font-weight:650;font-size:12.5px}
.visit-stat .vs-dot{opacity:.45}
/* 更新日志：左侧日期 + 右侧条目，窄屏上下堆叠 */
.log-day{display:flex;gap:18px;padding:16px 0;border-top:1px solid var(--line-soft)}
.log-day:first-child{border-top:none;padding-top:2px}
.log-date{flex:0 0 86px;font-family:var(--font-mono);font-size:12px;color:var(--ink-4);padding-top:3px;letter-spacing:.02em}
.log-body{flex:1;min-width:0}
.log-item{margin:0 0 16px}
.log-item:last-child{margin-bottom:0}
.log-h{font-size:15px;font-weight:640;color:var(--ink);line-height:1.55}
.log-tag{display:inline-block;font-size:11px;line-height:1;padding:3px 7px;border-radius:5px;margin-right:7px;vertical-align:1.5px;font-weight:600}
.log-tag.new{background:var(--ok-soft);color:var(--ok-ink)}
.log-tag.chg{background:var(--accent-soft);color:var(--accent-ink)}
.log-tag.fix{background:var(--amber-soft);color:var(--amber-ink)}
.log-tag.add{background:var(--hot-soft);color:var(--hot)}
.log-p{margin-top:5px;font-size:13px;color:var(--ink-3);line-height:1.75}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:16px 0 20px;flex-wrap:wrap}
.pills{
  display:inline-flex;gap:2px;padding:3px;border-radius:999px;
  background:var(--bg-sunk);box-shadow:inset 0 0 0 1px var(--line-soft);
  overflow-x:auto;max-width:100%;min-width:0;flex:0 1 auto;
}
.pills::-webkit-scrollbar{display:none}
.pill{
  position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 15px;
  border-radius:999px;font-size:13.5px;color:var(--ink-3);white-space:nowrap;transition:color .15s;
}
.pill:hover{color:var(--ink)}
.pill .n{font-family:var(--font-mono);font-size:11px;opacity:.65}
.pill.on{color:var(--ink);font-weight:600}
.pill.on::before{
  content:"";position:absolute;inset:0;border-radius:999px;background:var(--surface);
  box-shadow:var(--sh-thumb),inset 0 0 0 1px var(--line);z-index:-1;
}
.pills{isolation:isolate}
/* 作者样式的 display 会盖掉 UA 的 [hidden]{display:none}，必须显式声明 */
.pills[hidden]{display:none}
.pill{isolation:isolate}
.search{position:relative;width:230px;flex:0 0 auto}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-4);pointer-events:none}
.search input{
  width:100%;height:38px;border-radius:999px;border:0;outline:none;
  background:var(--bg-sunk);box-shadow:inset 0 0 0 1px var(--line-soft);
  padding:0 14px 0 36px;font-size:13.5px;color:var(--ink);transition:box-shadow .15s,background .15s;
}
.search input::placeholder{color:var(--ink-4)}
.search input:focus{background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accent-soft)}

/* ---------- 炸裂榜（独立页面） ----------
   2026-10-20：原来首页顶部挂一个「最炸的几条」小框，每个视图都在，
   现在收进「炸裂榜」这一个页面，前三大卡 + 04-10 紧凑行。 */
@keyframes ping{75%,100%{transform:scale(2.1);opacity:0}}
.board-hero{margin:2px 0 18px}
.bh-kicker{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;color:var(--hot);text-transform:uppercase}
.bh-kicker .pd{position:relative;display:flex;width:7px;height:7px}
.bh-kicker .pd i{position:absolute;inset:0;border-radius:999px;background:var(--hot)}
.bh-kicker .pd i:first-child{animation:ping 1.6s cubic-bezier(0,.0,.2,1) infinite;opacity:.4}
.board-hero h1{margin:9px 0 6px;font-size:28px;font-weight:700;letter-spacing:-.02em}
.board-hero p{margin:0;font-size:13.5px;color:var(--ink-3)}
.board-sub{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bh-meta{display:flex;align-items:center;gap:14px;margin-top:11px;font-size:12px;color:var(--ink-4);font-family:var(--font-mono);flex-wrap:wrap}
.bh-tabs{display:inline-flex;padding:3px;border-radius:999px;background:var(--bg-sunk);box-shadow:inset 0 0 0 1px var(--line-soft)}
.bh-tabs button{font-size:12px;padding:4px 11px;border-radius:999px;color:var(--ink-4);font-family:var(--font-sans)}
.bh-tabs button.on{background:var(--surface);color:var(--ink);font-weight:620;box-shadow:0 1px 2px #202a3014}

/* 前三大卡：No.01 占左列两行，02/03 叠在右列 */
.bgrid{
  display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);
  grid-template-rows:1fr 1fr;gap:11px;margin-bottom:16px;
}
.pcard{
  display:flex;flex-direction:column;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:15px 17px;cursor:pointer;transition:border-color .15s,box-shadow .2s var(--ease);
}
.pcard:hover{border-color:var(--line-strong);box-shadow:var(--sh-card-hover)}
.pcard.hero{grid-row:1 / span 2;padding:20px 22px}
.pcard .pc-top{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.pcard .pr{font:800 13px/1 var(--font-mono);color:var(--rank-1);letter-spacing:.04em}
.pcard .pbadge{font-size:10.5px;line-height:1;padding:3px 7px;border-radius:5px;font-weight:600}
.pcard .pbadge.hot{background:var(--hot-soft);color:var(--hot)}
.pcard .pbadge.new{background:var(--ok-soft);color:var(--ok-ink)}
.pcard .pn{font-size:16px;font-weight:680;line-height:1.4;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pcard.hero .pn{font-size:19px}
.pcard .pn .pc{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--bg-sunk);color:var(--ink-3)}
.pcard .pa{margin-top:3px;font-size:12px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .ph{
  margin-top:9px;font-size:14.5px;line-height:1.65;color:var(--ink-2);font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pcard.hero .ph{font-size:18px;line-height:1.55;margin-top:12px;-webkit-line-clamp:3;color:var(--ink)}
.pcard .ps{
  margin-top:9px;font-size:13px;line-height:1.75;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.pcard .pfoot{margin-top:auto;padding-top:14px;display:flex;align-items:flex-end;gap:12px}
.pcard .pmeta{font-size:11.5px;color:var(--ink-4);font-family:var(--font-mono);line-height:1.5}
.pcard .phe{margin-left:auto;text-align:right;min-width:72px}
.pcard .phe b{display:block;font:800 26px/1 var(--font-mono);color:var(--ink)}
.pcard.hero .phe b{font-size:40px;color:var(--hot)}
.pcard .pbar{display:block;width:100%;height:3px;border-radius:99px;background:var(--bg-muted);margin-top:7px;overflow:hidden}
.pcard .pbar i{display:block;height:100%;border-radius:99px;background:var(--hot);opacity:.85}
.pcard .phe em{display:block;margin-top:5px;font-style:normal;font-size:10px;color:var(--ink-4);letter-spacing:.08em}

.blist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.blist li{
  display:grid;grid-template-columns:40px minmax(0,1fr) 64px 96px;gap:14px;align-items:center;
  padding:12px 16px;border-top:1px solid var(--line-soft);cursor:pointer;transition:background .15s;
}
.blist li:first-child{border-top:0}
.blist li:hover{background:var(--bg-sunk)}
.blist .bn{font:700 12.5px var(--font-mono);color:var(--ink-4);text-align:center}
.blist .bm{min-width:0}
.blist .bt{font-size:14.5px;font-weight:640;transition:color .15s}
.blist li:hover .bt{color:var(--accent)}
.blist .bs{
  margin-top:2px;font-size:12.5px;color:var(--ink-4);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.blist .bc{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--bg-sunk);
  color:var(--ink-3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blist .bh{font:700 15px var(--font-mono);color:var(--hot);text-align:right}
.blist .bh .bar{display:block;height:3px;border-radius:99px;background:var(--bg-muted);margin-top:5px;overflow:hidden}
.blist .bh .bar i{display:block;height:100%;border-radius:99px;background:var(--hot);opacity:.8}
.board-foot{margin-top:16px;padding-top:13px;border-top:1px solid var(--line-soft);
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.board-note{margin:0;max-width:640px;font-size:12px;line-height:1.8;color:var(--ink-4)}
.board-note b{color:var(--ink-3);font-weight:600}
.board-all{font-size:12.5px;color:var(--accent);white-space:nowrap}

/* ---------- 卡片列表 ----------
   2026-10-20：去掉日期分组条、左侧序号、时间轴。
   那三样是资讯站「今天发生了什么」的骨架，对写作者只是噪声。 */
.feed{display:flex;flex-direction:column}
.slot{padding:0 0 14px}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--sh-card);padding:15px 18px 14px;
  transition:box-shadow .2s var(--ease),border-color .2s,transform .2s var(--ease);
}
.card:hover{box-shadow:var(--sh-card-hover);border-color:var(--line-strong)}
.card-head{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.4;min-height:22px;flex-wrap:wrap}
.who{display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:nowrap}
.who b{font-size:13.5px;font-weight:650;color:var(--ink);white-space:nowrap}
.who em{font-style:normal;font-size:12px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px;min-width:0}
.who .idt{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;min-width:0}
.badge{
  display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 8px;border-radius:999px;
  font-size:11px;font-weight:500;line-height:1;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;
}
.badge.cat{background:var(--bg-sunk);color:var(--ink-3)}
.badge .dt{width:5px;height:5px;border-radius:999px;background:currentColor;flex:0 0 5px}
.heat{
  display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:999px;
  background:var(--hot-soft);color:var(--hot);box-shadow:inset 0 0 0 1px #b3402a26;font-size:11px;
}
.heat b{font-family:var(--font-mono);font-size:12.5px;font-weight:800;line-height:1}
.heat i{font-style:normal;opacity:.8}
.heat.mid{background:var(--amber-soft);color:var(--amber-ink);box-shadow:inset 0 0 0 1px #b8873a26}
.heat.low{background:var(--bg-sunk);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-soft)}
.card-head .sp{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.star{
  display:grid;place-items:center;width:26px;height:26px;border-radius:var(--r-control);
  color:var(--ink-4);transition:background .15s,color .15s;
}
.star:hover{background:var(--bg-sunk);color:var(--ink-2)}
.star.on{color:var(--amber)}
.copy{
  display:grid;place-items:center;width:26px;height:26px;border-radius:var(--r-control);
  color:var(--ink-4);transition:background .15s,color .15s;
}
.copy:hover{background:var(--bg-sunk);color:var(--accent)}
.headline{
  margin-top:8px;font-size:17px;font-weight:650;line-height:1.5;letter-spacing:-.005em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.summary{
  margin-top:6px;font-size:14.5px;line-height:1.75;color:var(--ink-3);white-space:pre-line;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
/* 展开完整档案时，标题和摘要都放开 */
.card.expanded .headline{display:block;-webkit-line-clamp:unset;overflow:visible}
.card.expanded .summary{display:block;-webkit-line-clamp:unset;overflow:visible}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tr{
  font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--accent-softer);
  color:var(--accent-ink);box-shadow:inset 0 0 0 1px #176b751f;white-space:nowrap;
  max-width:200px;overflow:hidden;text-overflow:ellipsis;
}
.methods{margin-top:12px;padding:11px 13px;border-radius:var(--r-tile);background:var(--bg-sunk);border-left:2px solid var(--hot)}
.methods .mh{font-size:11.5px;font-weight:700;color:var(--hot);letter-spacing:.03em;margin-bottom:6px}
.methods li{position:relative;padding-left:14px;font-size:13.5px;line-height:1.7;color:var(--ink-2);margin-top:5px}
.methods li::before{content:"";position:absolute;left:3px;top:.62em;width:4px;height:4px;border-radius:999px;background:var(--line-strong)}
.more{
  margin-top:12px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-4);
  transition:color .15s;
}
.more:hover{color:var(--accent)}
.more svg{transition:transform .2s var(--ease)}
.more.open svg{transform:rotate(180deg)}
.detail{margin-top:13px;border-top:1px solid var(--line-soft);padding-top:13px;display:none}
.detail.show{display:block;animation:fade .28s var(--ease)}
.card-foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.card-foot .more{margin-top:0}
.heat-mini{margin-left:auto;font-size:11.5px;color:var(--ink-4);font-family:var(--font-mono)}
.heat-mini b{font-weight:700;color:var(--ink-3);margin-left:3px}
.ht-hi .heat-mini b{color:var(--hot)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sec + .sec{margin-top:15px}
.sec h4{font-size:12px;font-weight:700;color:var(--ink-4);letter-spacing:.04em;margin-bottom:7px}
.tl li{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;font-size:13.5px;line-height:1.7;padding:4px 0}
.tl .t{font-family:var(--font-mono);font-size:12px;color:var(--ink-4);padding-top:2px}
.tl .d{color:var(--ink-2)}
blockquote{
  margin:0;padding:8px 13px;border-left:2px solid var(--accent);background:var(--accent-softer);
  border-radius:0 var(--r-mark) var(--r-mark) 0;font-family:var(--font-serif);
  font-size:14.5px;line-height:1.8;color:var(--prose-ink);
}
blockquote + blockquote{margin-top:7px}
.usebox{font-size:13.5px;line-height:1.8;color:var(--ink-2);padding:11px 13px;border-radius:var(--r-tile);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-soft)}
.nconf{font-weight:400;color:var(--ink-4);font-size:11px;margin-left:4px}
.novel{padding:9px 13px;border-radius:var(--r-tile);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-soft)}
.novel .nrow{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:13.5px;line-height:1.72;color:var(--ink-2)}
.novel .nrow:first-child{border-top:0;padding-top:0}
.novel .nrow:last-child{padding-bottom:0}
.novel .nrow b{font-size:11.5px;font-weight:700;color:var(--hot);letter-spacing:.02em;white-space:nowrap}
@media (max-width:640px){.novel .nrow{grid-template-columns:64px minmax(0,1fr);gap:8px}}
.srclist li{font-size:12.5px;line-height:1.6;padding:4px 0;display:flex;gap:8px;align-items:baseline}
.srclist .pub{flex:0 0 auto;color:var(--ink-4);font-size:11.5px;padding:2px 7px;border-radius:var(--r-mark);background:var(--bg-sunk);white-space:nowrap}
.srclist a{color:var(--accent);border-bottom:1px solid transparent;transition:border-color .15s}
.srclist a:hover{border-color:var(--accent)}
.srclist .nt{color:var(--ink-3)}

/* ---------- 写作方法 / 角色配方 ---------- */
.oneliner{margin-top:9px;font-size:15.5px;line-height:1.75;color:var(--ink-2)}
.src-tag{
  font-size:11.5px;color:var(--ink-4);background:var(--bg-sunk);padding:3px 9px;border-radius:999px;
  white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;
}
.steps{counter-reset:step;margin-top:7px}
.steps li{position:relative;padding-left:24px;font-size:13.5px;line-height:1.75;color:var(--ink-2);margin-top:7px}
.steps li::before{
  counter-increment:step;content:counter(step);
  position:absolute;left:0;top:2.5px;width:16px;height:16px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-ink);
  font-size:10.5px;font-weight:700;font-family:var(--font-mono);line-height:16px;text-align:center;
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;
  background:var(--accent-softer);color:var(--accent-ink);box-shadow:inset 0 0 0 1px #176b751f;
  transition:background .15s;cursor:pointer;
}
.chip:hover{background:var(--accent-soft)}
.chip::before{content:"";width:4px;height:4px;border-radius:999px;background:currentColor;flex:0 0 4px}
.chip.tech{background:var(--amber-soft);color:var(--amber-ink);box-shadow:inset 0 0 0 1px #b8873a26}
.chip.tech:hover{background:#b8873a2e}
.chip.tech::before{border-radius:2px;transform:rotate(45deg)}
.techbox{margin-top:12px}
.techbox h4{color:var(--amber-ink)}
.techbox .chips{margin-top:7px}
.usedbox{margin-top:12px}
.usedbox h4{color:var(--amber-ink)}
.usedbox .chips{margin-top:7px}
.practice{
  margin-top:12px;padding:11px 13px;border-radius:var(--r-tile);
  background:var(--bg-sunk);border-left:2px solid var(--accent);
}
.practice .ph{font-size:11.5px;font-weight:700;color:var(--accent-ink);letter-spacing:.03em;margin-bottom:5px}
.practice p{font-size:13.5px;line-height:1.78;color:var(--ink-2)}
.formula{margin-top:9px;font-size:15.5px;font-weight:650;line-height:1.65;color:var(--ink)}
.cast{margin-top:8px}
.cast li{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--ink-2);
}
.cast li:last-child{border-bottom:0}
.beats{counter-reset:beat;margin-top:6px}
.beats li{position:relative;padding-left:24px;font-size:13.5px;line-height:1.75;color:var(--ink-2);margin-top:6px}
.beats li::before{
  counter-increment:beat;content:counter(beat);
  position:absolute;left:0;top:2.5px;width:16px;height:16px;border-radius:999px;
  background:var(--hot-soft);color:var(--hot);
  font-size:10.5px;font-weight:700;font-family:var(--font-mono);line-height:16px;text-align:center;
}
.hint{margin-top:12px;font-size:13px;line-height:1.7;color:var(--note);padding-top:11px;border-top:1px solid var(--line-soft)}

/* ---------- 空状态 / 引导 ---------- */
.banner{
  display:none;align-items:center;gap:10px;
  margin-bottom:16px;padding:9px 11px;border-radius:var(--r-tile);
  background:var(--bg-sunk);box-shadow:inset 0 0 0 1px var(--line-soft);
  font-size:12.5px;line-height:1.6;color:var(--ink-3);
}
.banner.show{display:flex}
.banner b{color:var(--ink-2);font-weight:600}
.banner code{font-family:var(--font-mono);font-size:12px;background:var(--surface);padding:1px 5px;border-radius:4px;color:var(--accent-ink)}
.banner .bx{margin-left:auto;flex:0 0 auto;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink-4);font-size:16px;line-height:1}
.banner .bx:hover{background:var(--bg-muted);color:var(--ink)}
.empty{padding:60px 20px;text-align:center;color:var(--ink-4);font-size:14px;line-height:1.9}
.empty-act{
  margin-top:14px;display:inline-flex;align-items:center;gap:6px;
  font-size:13px;color:var(--accent);background:var(--surface);
  border:1px solid var(--accent);border-radius:999px;padding:6px 15px;transition:background .15s;
}
.empty-act:hover{background:var(--accent-soft)}

/* ---------- 移动端顶栏 ---------- */
.mobilebar{
  display:none;position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:0 16px;
}
.mobilebar .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px}
.mobilebar .r{display:flex;justify-content:flex-end;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--ink-3)}
.iconbtn:hover{background:var(--bg-sunk);color:var(--ink)}
.mobilebar .lg{margin-top:0;padding:0}

/* ============ 移动端底部导航：桌面隐藏，≤1023px 显示 ============ */
.tabbar{display:none}

@media (max-width:1023px){
  .sidebar{display:none}
  .mobilebar{display:block}
  main{padding:12px 0 calc(70px + env(safe-area-inset-bottom,0px))}
  .wrap{padding:0 16px}
  .page-h1{font-size:20px}
  .search{width:100%}
  .toolbar .search{display:none}
  .toolbar .pills{flex:1 1 100%;width:100%}
  .toolbar{gap:10px;margin:12px 0 16px}
  .slot{padding:5px 0 12px}
  .who .idt{max-width:100%}
  .heat i{display:none}

  /* 底部导航 */
  .tabbar{
    display:flex;align-items:stretch;
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:var(--sidebar);border-top:1px solid var(--line);
    padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -1px 3px #202a300d;
  }
  .tabbar .tb{
    flex:1 1 0;min-width:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:5px 1px;border-radius:var(--r-control);
    color:var(--ink-4);transition:color .15s,background .15s;
  }
  .tabbar .tb .lb{
    font-size:10px;line-height:1.15;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  .tabbar .tb.on{color:var(--accent);background:var(--accent-softer)}
  .tabbar .tb:active{background:var(--accent-soft)}
}
@media (max-width:640px){
  .bgrid{grid-template-columns:1fr;grid-template-rows:auto}
  .pcard.hero{grid-row:auto;padding:16px 15px}
  .pcard.hero .phe b{font-size:32px}
  .pcard .ps{display:none}
  .blist li{grid-template-columns:30px minmax(0,1fr) 52px;gap:10px;padding:11px 13px}
  .blist .bc{display:none}
  .board-hero h1{font-size:23px}
  .card{padding:13px 14px 12px}
  .headline{font-size:16px}
  .summary{font-size:14px}
  .card-head{gap:6px}
  .card-head .sp{gap:5px}
  .who em{max-width:150px}
  .tl li{grid-template-columns:60px minmax(0,1fr);gap:9px}
}
/* ---------- 密度：舒适 / 紧凑 ---------- */
.density{
  display:inline-flex;padding:3px;border-radius:999px;background:var(--bg-sunk);
  box-shadow:inset 0 0 0 1px var(--line-soft);flex:0 0 auto;
}
.density button{font-size:12px;padding:4px 11px;border-radius:999px;color:var(--ink-4);line-height:1.25}
.density button.on{background:var(--surface);color:var(--ink);font-weight:620;box-shadow:0 1px 2px #202a3014}
/* 紧凑：只留标题和性格标签，用来快速扫库 */
body.density-compact .summary,
body.density-compact .methods,
body.density-compact .traits{display:none}
body.density-compact .slot{padding-bottom:8px}
body.density-compact .card{padding:12px 15px 11px}
body.density-compact .headline{font-size:15.5px;margin-top:6px;-webkit-line-clamp:1}
body.density-compact .card-foot{margin-top:9px}

/* ---------- 课时卡 / 出处 / 练习 ---------- */
.lesson-no{font:700 11.5px/1 var(--font-mono);color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:6px;letter-spacing:.04em}
.lesson-done{
  margin-left:auto;font-size:12px;color:var(--ink-4);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px;display:inline-flex;gap:5px;align-items:center;
  transition:color .15s,border-color .15s,background .15s;
}
.lesson-done:hover{border-color:var(--line-strong);color:var(--ink-2)}
.lesson-done.on{color:var(--ok-ink);border-color:var(--ok);background:var(--ok-soft)}
.prov{margin-top:9px;font-size:12px;color:var(--ink-4);display:flex;gap:7px;flex-wrap:wrap;align-items:baseline;line-height:1.6}
.prov .pv{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg-sunk);color:var(--ink-3);letter-spacing:.04em;white-space:nowrap}
.prov .pv.book{background:var(--accent-soft);color:var(--accent-ink)}
.prov .pv.academic{background:var(--amber-soft);color:var(--amber-ink)}
.drill{margin-top:13px;padding:12px 14px;border-radius:var(--r-tile);background:var(--accent-softer);border-left:2px solid var(--accent)}
.drill .dh{font-size:11.5px;font-weight:700;color:var(--accent-ink);letter-spacing:.04em;margin-bottom:5px}
.drill p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.drill .do{margin-top:7px;font-size:11.5px;color:var(--ink-4);font-family:var(--font-mono)}
.checks li,.pitfalls li{position:relative;padding-left:20px;font-size:13.5px;line-height:1.75;color:var(--ink-2);margin-top:4px}
.checks li::before{content:"□";position:absolute;left:2px;color:var(--ok)}
.pitfalls li::before{content:"✗";position:absolute;left:2px;color:var(--hot);font-size:12px}

/* 轨道标题与进度 */
.track-head{margin:0 0 16px}
.track-head h2{margin:0 0 5px;font-size:19px;font-weight:680;letter-spacing:-.01em}
.track-head p{margin:0;font-size:13px;color:var(--ink-3);line-height:1.7;max-width:660px}
.track-bar{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:12px;color:var(--ink-4)}
.pill-alt{border-style:dashed;color:var(--amber-ink)}
.track-bar .tb{flex:1;height:4px;border-radius:99px;background:var(--bg-muted);overflow:hidden;max-width:240px}
.track-bar .tb i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;transition:width .4s var(--ease)}
.track-bar .certbtn{font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 11px}

/* 证书 */
.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:22px;
  background:#0d1417cc;backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.cert{position:relative;z-index:2;width:100%;max-width:460px;text-align:center;color:var(--ink);opacity:1 !important}
.cert-inner{
  position:relative;border-radius:14px;padding:30px 30px 24px;box-shadow:0 30px 80px #00000066;
  /* 证书不依赖主题令牌，避免任何继承/变量问题导致「白底白字」 */
  background:#fffdf7;color:#202a30;border:1px solid #d8d2c2;
}
[data-theme="dark"] .cert-inner{background:#20282c;color:#eef2ef;border-color:#3a474d}
.cert-inner .ck,.cert-inner .cert-sub,.cert-inner .cert-list{color:inherit}
[data-theme="dark"] .cert-inner .ck,[data-theme="dark"] .cert-inner .cert-sub{color:#9aa6a4}
.cert-inner::before{
  content:"";position:absolute;inset:7px;border:1px dashed var(--line);border-radius:9px;pointer-events:none;
}
.cert .ck{font-size:10.5px;letter-spacing:.24em;color:var(--ink-4);text-transform:uppercase}
.cert h2{
  margin:10px 0 4px;font-size:30px;font-weight:700;letter-spacing:.04em;
  font-family:var(--font-serif);
}
.cert .cert-sub{margin:0;font-size:13px;color:var(--ink-3);line-height:1.8}
.cert-list{
  margin:16px auto 0;max-width:330px;text-align:left;columns:2;column-gap:18px;
  font-size:11.5px;line-height:1.85;color:var(--ink-3);
}
.cert-list li{padding-left:12px;position:relative;break-inside:avoid}
.cert-list li::before{content:"";position:absolute;left:0;top:.72em;width:4px;height:4px;border-radius:99px;background:var(--accent)}
.cert-foot{
  margin-top:20px;padding:14px 84px 0 0;border-top:1px dashed var(--line);
  display:flex;align-items:baseline;justify-content:space-between;
  font-size:11px;color:var(--ink-4);font-family:var(--font-mono);
}
.cert .cert-sign{font-family:var(--font-serif);font-size:13px;color:var(--ink-3);letter-spacing:.12em}
.cert-seal{
  position:absolute;right:24px;bottom:58px;width:52px;height:52px;border-radius:999px;
  border:2px solid #b3402a;color:#b3402a;display:grid;place-items:center;
  font-size:13.5px;font-weight:800;letter-spacing:.06em;line-height:1.1;
  text-align:center;transform:rotate(-14deg);opacity:.82;
}
.cert .cert-close{
  margin:22px auto 0;height:38px;padding:0 26px;border-radius:999px;
  background:#176b75;color:#fff;font-size:13px;font-weight:600;display:block;
}
[data-theme="dark"] .cert .cert-close{background:#3a9aa6}
[data-theme="dark"] .cert-seal{border-color:#e2705a;color:#e2705a}
[data-theme="dark"] .cert-inner::before{border-color:#3a474d}
[data-theme="dark"] .cert-foot{border-top-color:#3a474d}
[data-theme="dark"] .cert-list li::before{background:#4fb3bf}
.cert-inner{animation:certIn .42s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes certIn{from{transform:translateY(14px) scale(.94)}to{transform:none}}
.cert-seal{animation:sealIn .5s .18s cubic-bezier(.2,.9,.3,1.2) both;opacity:.82}
@keyframes sealIn{from{transform:rotate(-40deg) scale(1.6)}to{transform:rotate(-14deg) scale(1)}}

/* 编辑怎么说 */
.fn{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--r-card);padding:15px 17px;margin-bottom:12px}
.fn h3{margin:0 0 4px;font-size:15.5px;font-weight:660}
.fn .src{margin-top:6px;font-size:11.5px;color:var(--ink-4)}
.fn .why{margin-top:9px;font-size:12px;color:var(--amber-ink);background:var(--amber-soft);display:inline-block;padding:2px 8px;border-radius:5px}

/* 系统开启「减少动态效果」时不放动画 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>

<!-- ========== 移动端顶栏 ========== -->
<div class="mobilebar">
  <div class="in">
    <div class="logo lg"><span class="mark">人</span><span class="txt"><b>人间样本</b></span></div>
    <div class="search" style="width:auto">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="qMobile" placeholder="搜索…" style="width:150px;height:36px"/>
    </div>
    <div class="r">
      <button class="iconbtn" id="btnLog" title="更新日志">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 1.8"/></svg>
      </button>
      <button class="iconbtn" id="btnThemeM" title="切换主题">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="app">
  <!-- ========== 侧边栏 ========== -->
  <aside class="sidebar">
    <div class="logo">
      <span class="mark">人</span>
      <span class="txt"><b>人间样本</b><em>Samples</em></span>
    </div>
    <nav class="nav">
      <div class="nav-label">内容</div>
      <div class="nav-group" id="navViews">
        <button class="nav-item active" data-view="featured">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M13 2.5L4.5 13.5H11l-1 8L19.5 10.5H13z"/></svg></span>
          最新收录<span class="cnt" id="cFeatured">0</span>
        </button>

<script id="embeddedCraft">window.EMBEDDED_CRAFT = {"updatedAt":"2026-10-20","intro":"这些不是要你照搬的公式，是从麦基、埃格里、特鲁比、福斯特、刘和平和一线写作课里挑出来的、能立刻用在素材上的方法。每条都挂了库里的人物——点关联的素材名，直接跳到那一页去练。","_字段说明":{"oneLiner":"一句话说出这条方法的核心","howto":"具体操作步骤，可以照着做","example":"示例或检验方法","quote":"原作者原话，可引用","links":"关联素材 id 数组，对应 data.json 里的 items.id","linkHint":"用这条素材具体怎么练"},"crafts":[{"id":"forster-round-flat","title":"扁平人物不是差人物，是尖刺","source":"E.M.福斯特《小说面面观》","author":"E.M. Forster，1927","category":"造人","oneLiner":"不是所有角色都该立体。扁形人物只给一个维度，但要把那一个维度推到极致。","howto":["先做「意外测试」：他能不能做出让读者意外、但事后一想又合理的事？能→圆形；只能按预判行动→扁形","扁形人物：一个特质 + 一个极端表达，全靠这一根刺扎进读者记忆","别给配角写四页心理小传——那不是写得不好，是放错了位置","荤素搭配：全扁则浅，全圆则难啃"],"example":"岳不群就一个字：伪。伪到连自己都信了，从「君子剑」到自宫，每个举动都围绕这个字。柯镇恶就一个字：刚。瞎了眼、武功不入一流，但怼天怼地从不认怂。他们没有成长弧光，但能让人记一辈子。","quote":"扁平人物最大的优势之一就是不论他们何时登场，都极易辨识。","links":["bilei-guke","gaotie-mianti-nv","fuzhou-jingqu-xiaobian"],"linkHint":"「避雷帖顾客」就别写成有苦衷的复杂人物——她做尖刺更有效。一个维度：她永远觉得自己只是说了实话。而「高铁免提女乘客」那句「我打电话和你有什么关系」，也是典型的单维度人物，一句台词就立住了。","track":"literary","order":1,"provenance":{"type":"book","ref":"E.M.福斯特《小说面面观》（1927）","note":"扁平人物与圆形人物"},"drill":{"task":"给人物写两个动作：一个一句话就能认出他，一个只在压力下才出现的反常动作。","time":"15 分钟","output":"两句话"},"check":["扁平人物的标签能一句话说完，而且每次出场都一致","圆形人物至少让读者惊讶一次，但回头看不矛盾","两个动作不能互换"],"pitfalls":["把扁平人物写成没有逻辑的纸片","圆形人物的「惊讶」来自作者改设定，不是人物成长","所有人都是圆形，反而没有轻重"]},{"id":"iceberg-10-percent","title":"冰山：你了解 100%，只给 10%","source":"海明威冰山理论的人物版","author":"Hemingway","category":"造人","oneLiner":"作者要充分了解人物的过去，但只给读者看其中百分之十。","howto":["先写一份完整的背景小传——只给自己看","正文里只投放「解释当前行为」的那一小块碎片","分次穿插，不要一次性倾倒：读者还没开始在意这个人，所以没有地方安放这些信息","不要把童年一件事写成能解释全部行为的总方程式，那会关掉读者的推理空间"],"example":"等读者产生好奇之后再给，同样的信息能发挥好几倍的作用。被说明得越少的人物反而显得越有生气——因为剩下的部分由读者自己填上。","quote":"开篇就把人物的过去倾倒出来，读者还没开始在意这个人，所以没有地方安放这些信息。","links":["dong-mingzhu"],"linkHint":"董明珠「36 岁遭遇家庭变故，南下珠海」——库里只给了这一句，正文里也就给这一句。不要交代是什么变故、她当时哭了几天。留白的地方，读者会自己写。","track":"literary","order":2,"provenance":{"type":"book","ref":"欧内斯特·海明威《午后之死》（1932）","note":"冰山理论；本条是把「八分之七在水下」用到人物上"},"drill":{"task":"给人物写 10 条背景，只挑 1 条放进正文，其余留着自己知道。","time":"20 分钟","output":"10 条 + 1 条"},"check":["正文里没有大段回忆","那条放进去的信息是被动作或对话带出来的","读者能感觉到水下还有东西"],"pitfalls":["把 10 条全写进第一章","水下什么都没有，只是故作深沉","留白变成信息缺失，读者看不懂"]},{"id":"credit-is-structural","title":"功劳不是被偷的，是被结构让出去的","source":"玛蒂尔达效应（Matilda Effect）· 科学社会学","author":"玛格丽特·罗西特（1993 年提出该概念）","category":"被抹掉的人","oneLiner":"署名从来不取决于谁做得多，取决于谁有提交权、谁握着关键数据、谁先开口讲故事。","howto":["先定「提交权」：谁有资格把成果写成论文、报给委员会、在会上宣布。没有这个位置的人，做得再多也只是「协助」。","再定「数据权」：关键底片、原始记录、样品在谁手里。拿走它的人不需要懂，只需要能拿给别人看。","最后定「叙事权」：谁先讲出这个故事，谁就定义了谁是主角。晚开口的人只能纠正细节，改不了框架。","写戏时把三权拆给三个人，冲突就不需要反派——每个人都在做自己份内合理的事。"],"example":"51号照片在富兰克林手里，提交权在威尔金斯手里，叙事权在沃森手里。三权分置，于是照片的拍摄者成了别人论文的注脚。","quote":"女性科学家的贡献常常被忽略、被否认，或者干脆从记录里消失。——罗西特对玛蒂尔达效应的概括","links":["rosalind-franklin","esther-lederberg","henrietta-leavitt"],"linkHint":"用富兰克林（数据被转手）、莱德伯格（提交权在丈夫手上）、莱维特（连职位都没有）三个人的位置差，练「同一件事、三种权力位置」的写法。","track":"literary","order":3,"provenance":{"type":"academic","ref":"玛蒂尔达效应 · Margaret Rossiter (1993), Social Studies of Science","note":"不是写作理论，是科学社会学里的归因机制，用来写「功劳被让出去」的人物"},"drill":{"task":"挑一件你笔下人物的功劳，写三行：谁做了什么 / 谁被记住 / 为什么。","time":"15 分钟","output":"三行"},"check":["三行里出现了三个不同的角色","被记住的那个不是做得最多的那个","原因写的是制度或习惯，不是某个坏人"],"pitfalls":["把结构性让渡写成个人恶意","被抹掉的人只会哭","最后用一句旁白替她讨回公道"]},{"id":"egri-three-dimensions","title":"三维度填表：生理、社会、心理","source":"拉约什·埃格里《编剧的艺术》","author":"Lajos Egri，1942","category":"造人","oneLiner":"人物不是设定出来的，是长出来的。生理决定社会位置，社会塑造心理，心理决定行为——缺一层，人就飘。","howto":["生理层：性别、年龄、身高体重、长相、健康、缺陷、口音、体味、怕冷怕热。问一句「如果她矮十公分，还会是现在这个人吗」","社会层：家庭出身、在哪长大、读过什么学校、职业、社会交往、政治宗教金钱观、父母对两性/金钱/成就的看法","心理层：前两层共同作用的产物——野心、挫折、性情、态度、情结、不安全感","写完每个行为都回查一次：这三层能不能推出这个行为？推不出就是硬编"],"example":"检验法：「如果换掉她的社会层条件——比如她女儿不是奥运冠军——她还会说这句话吗？」如果答案是「还会」，说明你没写出这个人的特异性，写的是通用的「控制型母亲」。","quote":"如果我们知道这三个维度能够为人类的每一个行为提供理由，我们就能很轻易地写好任何一个人物，对其动机追根溯源。","links":["xiao-yingjie","dai-luwa-mother"],"linkHint":"拿肖英杰练：她的社会层是「运动员家长体制 + 女儿六岁离家 + 全家生计押在一个人身上」。这一层铺出来，她那句「我这个妈妈是笨蛋」才不是单纯的做作——她是真的不知道怎么当妈，因为她从来没当过。","track":"screen","order":1,"provenance":{"type":"book","ref":"拉约什·埃格里《编剧的艺术》（1946）","note":"人物三维度：生理、社会、心理"},"drill":{"task":"给你的人物填三列：生理（年龄/外貌/健康）、社会（身份/收入/家庭）、心理（野心/恐惧/习惯性动作）。","time":"15 分钟","output":"一张三列表"},"check":["三列都填满，没有空项","至少一条生理特征会限制他的选择（腰伤、口吃、怕吵）","心理列写的是「他会怎么做」，不是形容词"],"pitfalls":["只写性格形容词，不写生理和社会条件","三维度互不相关，没有一条能逼出选择","把三维度当成一次性交给读者的人物小传"]},{"id":"egri-four-conflicts","title":"四种冲突，只有两种能用","source":"拉约什·埃格里《编剧的艺术》","author":"Lajos Egri","category":"对手与冲突","oneLiner":"原地打转和突然发疯都是废戏。冲突必须渐进，并且有预兆。","howto":["静态冲突：人物来回绕圈子、说车轱辘话，剧情无发展 → 不能用","跳跃冲突：靠突转推进，人物像突然换了个人 → 不能用","渐进冲突：有步骤、一层层加码地升级","预兆冲突：让读者提前闻到味道，再引爆","穷尽一切可能性、堵上一切漏洞，让故事只能朝一个方向走"],"example":"埃格里做了个实验：把《玩偶之家》第三幕后半段的过渡台词全部抽掉，做出一个「跳跃冲突」精简版。两相对照，立刻显出易卜生是怎么一步步把娜拉所有出路都堵死，只留「离家出走」这一条的。","quote":"一个好的剧本不应该用静态冲突，也不应该用跳跃冲突。","links":["dai-luwa","lu-suyoung"],"linkHint":"代露娃翻车千万别写成「突然被扒」——那是跳跃冲突。按渐进铺：先完整给她的说法让人共情，再让妈妈的账本进场，再放网友逐条比对，最后才引爆。这样读者才能体验到「我也被骗了」的羞耻感。","track":"screen","order":2,"provenance":{"type":"book","ref":"拉约什·埃格里《编剧的艺术》（1946）","note":"冲突的四种形态"},"drill":{"task":"拿你正在写的一场戏，分别用「静止 / 跳跃 / 升级 / 前置」四种方式各写一句，看哪一种最像戏。","time":"20 分钟","output":"四句话"},"check":["至少写出一段「升级冲突」——每一轮代价更大","没有「两个人吵得很凶但什么都没变」","冲突结束时，至少一方的处境变了"],"pitfalls":["把争执当冲突：音量很大，没人付出代价","跳跃冲突：上一秒绝交，下一秒和好，中间没有台阶","全是外部动作，人物内心没有二选一"]},{"id":"mckee-character-truth","title":"人物塑造 ≠ 人物真相","source":"罗伯特·麦基《故事》","author":"Robert McKee，1997","category":"造人","oneLiner":"你写的一切可观察特征——年龄、职业、口音、习惯、价值观——都只是面具。真相只在压力下的选择里显形。","howto":["先列「人物塑造」清单：外表、行为举止、语言风格、职业、态度、价值观、住在哪、住得怎样","再问「人物真相」：面具之下这个人是谁？忠诚还是背叛？有爱还是冷酷？勇敢还是怯懦？","设计一个必须二选一、且两边都要付代价的处境","让他选。选完别解释","在外显印象和真实选择之间留落差——落差越大，人物越立体"],"example":"《教父》开场，迈克尔穿军装、带女朋友、反复说「这不是我的人生」——这是人物塑造。父亲被枪杀后，他走进那家小餐馆亲手开枪——这才是人物真相。开枪之前的所有自我陈述，当场作废。","quote":"压力越大，其选择越能更加深刻而真实地揭示其性格真相。","links":["huang-chunmei","ju-junye","xiao-huijun","gelesi-bang","guo-yuxin","angelababy","li-xiaoran"],"linkHint":"S妈是这道落差的活教材：镜头前哭「我已是半死的人，只求一个居住的地方」，镜头后聘了顶尖律师团防止财产被争走。两件事都是真的，而这正是人物有厚度的地方——别让她的哭变成伪装，要让她哭的时候是真的难受。","track":"screen","order":3,"provenance":{"type":"book","ref":"罗伯特·麦基《故事》（1997）","note":"人物塑造与人物真相"},"drill":{"task":"给人物写两句台词：一句是他自我介绍时说的，一句是被逼到墙角时说的。两句必须互相打脸。","time":"10 分钟","output":"两句台词"},"check":["两句直接冲突，不能靠解释调和","第二句是在压力下说的，不是作者安排的","行为和你给他的标签有落差"],"pitfalls":["把所有信息写进台词，读者没有推断空间","压力不够大，真相出不来","落差靠旁白解释，而不是靠选择"]},{"id":"choice-under-pressure","title":"没有代价的选择，证明不了任何东西","source":"罗伯特·麦基《故事》","author":"Robert McKee","category":"压力与选择","oneLiner":"想立住人物，要做的不是描写他，而是设计一个他必然要失去点什么的处境。","howto":["设计两难：两种不可调和的欲望，或两种同等惨烈的代价","场景必须完成「价值转移」——生/死、爱/恨、忠诚/背叛、自由/束缚。开场和收场必须不同","检查：这个场景开始时角色处于什么状态？结束时还是那个状态吗？——是，这场戏无效，删","故事推进靠「鸿沟」：他按经验制定计划，现实给出意外回应，他必须升级行动，螺旋上升"],"example":"诚实又不吃亏时的诚实，不构成信息。在有代价的地方放弃了什么，那才是这个人。","quote":"结构不是外在于角色的枷锁，而是专门为了迫使他暴露真相而设计的压力装置。","links":["huang-chunmei","wang-xiaofei","wuxi-zhu-nvshi","muduoke","liu-nvshi-cq","zuo-qi"],"linkHint":"S妈被夹在「要保住自己住的房子」和「不能让外孙的财产被具俊晔争走」之间——两边都是自己人，选哪边都要付代价。把代价提到这个位置，她的两副面孔才不是虚伪，是没办法。","track":"screen","order":4,"provenance":{"type":"book","ref":"罗伯特·麦基《故事》（1997）","note":"压力下的选择揭示真相"},"drill":{"task":"把人物的一个选择拆成两个都要付代价的选项，写清楚各自失去什么。","time":"10 分钟","output":"两行：选 A 失去…，选 B 失去…"},"check":["两边都有代价，而且不对称","选择之后，他失去了某个具体的东西","这个选择改变了他和另一个人的关系"],"pitfalls":["假两难：一边明显是对的","代价是抽象的（失去尊严），不是具体的（失去那笔钱）","选择之后没有任何后果"]},{"id":"truby-opponent","title":"对手够好，主角才会同样出色","source":"约翰·特鲁比《故事写作大师班》","author":"John Truby","category":"对手与冲突","oneLiner":"好对手不是坏人，是另一个正确的人。定义主角和构思故事的诀窍，在于构思对手。","howto":["让对手变得不可或缺：他是全世界最能攻击主角重大弱点的人，而且毫不留情","让对手具有人性：和主角一样复杂、重要","价值取向恰好与主角相反——注意是「相反」，不是「邪恶」","赋予他一个有力、但有致命缺陷的道德论点","给他一些与主角相似的地方，让他成为主角的分身（doppelganger）"],"example":"网球比喻：主角是世界第一，对手是周末玩家 → 主角随便打打，观众睡着。对手是世界第二 → 两个人被迫打出最好的球，观众疯掉。","quote":"如果这个关系设定正确，故事几乎肯定没问题。如果这个关系设定错误，故事几乎肯定会失败。","links":["bilei-guke","liu-jishou","fu-sheng","zhao-jingli-jianglaolao"],"linkHint":"「避雷帖顾客」的立场是「我发布的仅仅是本人真实的消费体验评价」——这个道德论点很有力（消费者当然有权评价），但有致命缺陷（她没预见到传播的后果）。这种对手比恶毒反派难写，也真实得多。","track":"screen","order":5,"provenance":{"type":"book","ref":"约翰·特鲁比《故事写作大师班》（2007）","note":"对手与主角共享同一个目标"},"drill":{"task":"给主角写一个对手，要求他追求同一个目标、理由相反。","time":"15 分钟","output":"三行：他要什么 / 为什么 / 他和主角哪里像"},"check":["对手和主角争同一个东西","对手的动机能自圆其说","两人至少有一个共同点（出身、伤疤、欲望）"],"pitfalls":["反派只是「坏人」，没有自己的目标","对手太弱，主角赢了没有分量","两人完全不像，冲突变成打怪"]},{"id":"truby-seven-steps","title":"弱点 / 欲望 / 需求：三分法","source":"约翰·特鲁比《故事写作大师班》","author":"John Truby","category":"造人","oneLiner":"欲望是他以为自己想要的，需求是他真正缺的。两者错开，故事自己就会动起来。","howto":["弱点：故事开头就压着他的、他自己看不见的缺陷","欲望：这个故事里他想要的具体目标，观众看得见、能一起追的那个","需求：他真正需要变成什么样的人，通常他自己不知道","动机别钉死在单一原因上——作者越是把动机固着于具体原因，人物在读者心里就越小","高潮就是把人物放在「只能从想要的和需要的里挑一个」的位置上"],"example":"检查法：如果说不出他想要什么，那还不是人物，只是设定；如果他想要的和需要的是同一个东西，那他不是有弧光，只是有一项任务。","quote":"欲望是角色以为自己想要什么，需求是他真正需要成为什么样的人。混淆二者，故事就会沦为事件堆砌。","links":["lu-suyoung","zong-fuli"],"linkHint":"卢素英：她「想要」的是维持这个家的完整，「需要」的是承认这二十年回不来了。发现丈夫出轨后她先自责、为了孩子等了几年——这几年就是欲望压着需求。全篇的推力全在这儿。","track":"screen","order":6,"provenance":{"type":"book","ref":"约翰·特鲁比《故事写作大师班》（2007）","note":"七步人物网"},"drill":{"task":"按七步给故事填人物：主角 / 对手 / 盟友 / 假盟友 / 对手的对手 / 情感对象 / 导师。","time":"20 分钟","output":"七个角色位，每个一句话"},"check":["七个位置里至少三个有名字、有动机","假盟友有具体的背叛理由","盟友和对手之间有自己的一条线"],"pitfalls":["所有配角都为主角服务，没有自己的欲望","假盟友的背叛来得太突然","七个人里一半是工具人"]},{"id":"want-vs-need-arc","title":"想要 vs 需要：错开才有弧光","source":"约翰·特鲁比《故事写作大师班》","author":"John Truby，2007","category":"弧光与转变","oneLiner":"把「得到想要的」和「得到需要的」设计成互相冲突，故事会自动变成一连串选择。","howto":["想要：外显的、推动情节的——升职、复仇、夺冠、被认可","需要：他实际缺的、通常他自己不知道的——被原谅、承认自己那一份责任、明白一个人也没关系","两者必须错开。不错开，就没有弧光","三种弧光：正向（选择需要，放开欲求）／负向（抓死欲求，丢掉需要）／平坦（两者本没错开，错开的是周围的人）"],"example":"高潮场面大体上都长一样：把人物放在一个只能从「想要的」和「需要的」里挑一个的位置上。","quote":"如果他想要的与他需要的是同一样东西，那这个人物有的就不是弧光，只是一项任务。","links":["dai-luwa-mother","lu-suyoung"],"linkHint":"代露娃之母是「平坦型弧光」的标准样本——她自己从头到尾没变，变的是女儿和观众看她的眼光。写这类角色要靠别人的弧光来照亮她。","track":"screen","order":7,"provenance":{"type":"book","ref":"约翰·特鲁比《故事写作大师班》（2007）","note":"欲望与需求（原标「英文写作课通行理论」，已改回原书）"},"drill":{"task":"写三句话：他想要__；他需要__；他会在第几章发现两者不是一回事。","time":"10 分钟","output":"三句话"},"check":["想要和需要不是同一个东西","需要在结尾被满足，想要可能落空","发现的那一刻，是他最痛的一场戏"],"pitfalls":["想要 = 需要，人物没有弧光","需要靠别人告诉他，不是自己撞出来","弧光在结局突然完成，前面没有铺垫"]},{"id":"snyder-beat-sheet","title":"15 拍节拍表：把一部戏拆成 15 个必须发生的位置","source":"布莱克·斯奈德《救猫咪》（2005）","author":"Blake Snyder","category":"结构","track":"screen","order":8,"provenance":{"type":"book","ref":"布莱克·斯奈德《救猫咪》（2005）","note":"Blake Snyder Beat Sheet，15 拍"},"oneLiner":"不是公式，是检查表。每一拍都有一个必须完成的功能——缺哪一拍，读者就在哪里走神。","howto":["开场画面：主角当前的平衡状态，一个画面说完","主题陈述：让某个人说出这个故事到底在讲什么","铺垫：铺开主角的日常，同时暴露他的缺陷","催化剂：一件事打破平衡，故事正式开始","争论：主角拒绝、犹豫、给自己找借口","第二幕转折：他主动进场，不再被推着走","B故事：情感线或副线登场，通常是主角的软肋","游戏：兑现类型承诺——读者买这本书就是来看这一段","中点：假胜利或假失败，赌注升级","坏人逼近：压力从外部转向内部，朋友开始散","一无所有：他失去最重要的东西，通常和开场画面呼应","灵魂黑夜：他承认自己的缺陷，无处可躲","第三幕转折：他用新的方式做旧的事","结局：解决主冲突，代价付清","终场画面：和开场画面形成对照——变化的证据"],"drill":{"task":"用 15 拍给你的一卷填一遍，每拍一句话。填不出来的那几拍，就是故事还没想清楚的地方。","time":"30 分钟","output":"15 行"},"check":["15 拍全部填得出来","中点之后赌注明显变大","一无所有那一拍，主角失去的是他在开场就提到过的东西"],"pitfalls":["把节拍表当填空模板，为凑拍而写","没有「游戏」段落，读者一直在等的东西始终不来","结局和开场没有呼应，读完没有「变化」的感觉"],"example":"斯奈德用《别闯阴阳界》等片逐拍拆解；他强调 15 拍是检查表而不是公式——它的用处是让你发现哪一拍没写。","quote":"节拍表不是让你照着写，是让你写完之后能查出哪里漏了。","links":["xiao-yingjie","wu-an","zhao-jingli-jianglaolao"],"linkHint":"拿这三个人各填一次第 11 拍「一无所有」：肖英杰失去的是家里的话语权，吴岸失去的是时间，赵经理失去的是「体面」这层皮。同一个位置，三个人失去的东西完全不同——这就是那一拍要你回答的问题。"}],"recipes":[{"id":"mother-daughter-deadlock","title":"母女死局","formula":"控制型母亲 × 沉默供养者 × 想要情感回应的女儿","cast":[{"role":"母亲 A：示弱即索取","from":"xiao-yingjie"},{"role":"母亲 B：沉默托底，不会说软话","from":"dai-luwa-mother"},{"role":"女儿：要情绪价值，用镜头讨说法","from":"dai-luwa"}],"structure":"三个人其实是同一个母题的三种位置。真正的冲突不在母女之间，在两套「爱」的定义之间——一套给的是生存，一套要的是回应，两本账永远对不上。","beats":["女儿先讲她的版本，观众站她","外部证据进场，母亲那本账被翻开，观众转向","母亲自己开口——但她说不出软话，一开口就变成指责，或者干脆沉默","女儿发现：她要的东西，这个人是真的给不出来","没有和解，只有各退一步的距离"],"why":"这个结构的杀伤力在于：两个人都没错，但两个人都被毁了。写它要抵住「给谁定罪」的诱惑——一旦你判了谁对谁错，戏就塌了。","techniques":["egri-four-conflicts","mckee-character-truth","want-vs-need-arc"],"links":["xiao-yingjie","dai-luwa-mother","dai-luwa"]},{"id":"performance-vs-contract","title":"表演型深情 × 沉默履约","formula":"一个在镜头前签字，一个在银行里转账","cast":[{"role":"表演者：把放弃做成公开仪式，半年后撤销","from":"ju-junye"},{"role":"履约者：不打感情牌，只设信托、按季度报备","from":"wang-xiaofei"}],"structure":"两人争夺同一笔钱，用的却是两种完全相反的武器——一个是叙事，一个是制度。叙事赢得掌声，制度赢得结果。","beats":["公开放弃继承，全网感动，占据道德高地","另一方沉默，只做制度安排（信托、报备、限定用途）","半年后反转，撤销公证，理由是不可抗力（悲痛、看不懂文件）","沉默方继续不回应，只继续履约","结局由文件决定，不由掌声决定"],"why":"「叙事 vs 规则」的教科书级对照。写商战、家族戏、任何有「公道」主题的故事都能直接套。注意：别把履约者写成圣人，他只是在防守——他没赌人性，只信规则。","techniques":["truby-opponent","mckee-character-truth","choice-under-pressure"],"links":["ju-junye","wang-xiaofei"]},{"id":"sleeper-revenge","title":"蛰伏者的复仇","formula":"忍八年，出手一次，赢下棋局，输掉人心","cast":[{"role":"蛰伏者：从14岁开始学会闭嘴","from":"zong-fuli"}],"structure":"她在所有人以为她不存在的时候，把业务摸透了。等对手先动手，她等的就是这一下。清算之后，所有指标都赢了，但身边没有人。","beats":["第一幕：沉默期。眼睁睁看着一切发生，不辩解、不冲动，扎根基层吃透业务","第二幕：对手先出手（家族内斗公开化），她等的时机到了","第三幕：清算——董事会大换血、产线关停、商标转移、人清空","尾声：财报上赢了，代价清单也出来了（离职、诉讼、国资红线、人心）"],"why":"复仇故事的现代版本。动机干净（二十年看着父亲的情人和私生弟妹长大）、手段系统（法律、股权、商标）、代价真实。写她的时候别写狠，写她在沉默期那八年里每天怎么过的。","techniques":["want-vs-need-arc"],"links":["zong-fuli"]},{"id":"cyberbullying-chain","title":"网暴链条上的三方","formula":"一句实话 → 一次放大 → 一条命","cast":[{"role":"起点：我只是说了真实的消费体验","from":"bilei-guke"},{"role":"承受者：没有为自己辩解的能力","from":"hu-nvshi"},{"role":"放大器：随手点了个赞的陌生人","from":""}],"structure":"三个人谁都不是坏人。第一方说了实话，第二方没有辩解能力，第三方只是顺手参与了。链条上每个人都有充分的理由——这才是它最狠的地方。","beats":["小事发生（一份十块钱的菜）","评论文本化，脱离现场，开始在平台间流动","数字开始滚动：差评、转发、跟帖","承受者试图用最朴素的逻辑自证（「份量对得起天地良心」），失败","不可逆的事发生","舆论调转枪口，第二场网暴开始——这次烧的是第一个人"],"why":"写它最难的地方是抵住「给谁定罪」的诱惑。一旦你让读者可以指着某个人骂，这个故事就降级成了道德剧。真正的写法是让每个人都说得出理由。","techniques":["egri-four-conflicts","truby-opponent"],"links":["bilei-guke","hu-nvshi"]},{"id":"iron-fist-cost","title":"铁腕与她的代价","formula":"只跟事较劲的人 × 被碾过去的人","cast":[{"role":"铁腕 A：砸空调、打断废话、突击查食堂","from":"dong-mingzhu"},{"role":"铁腕 B：否决干股、关产线、裁老员工","from":"zong-fuli"}],"structure":"她们的所有决策在逻辑上都成立，问题在于——没有人替被清掉的人说话。她们的强势从来不针对人，只针对不合理的事，但事是人做的。","beats":["定标准，把规则推到极端","得罪所有人，被抵制、被孤立、被骂","事办成了，指标赢了","代价显现：离职、诉讼、人心流失","她依然认为自己做对了——而且她可能真的做对了"],"why":"写「对但无情」的角色。别写她们的脾气，写她们打断别人时那半秒的空白——那半秒里她们在想什么，决定了这个人是英雄还是怪物。","techniques":["choice-under-pressure"],"links":["dong-mingzhu","zong-fuli"]},{"id":"stolen-name","title":"被抹名的人","formula":"说出答案的人 × 拿走署名的人 × 迟到四十年的承认","structure":"三幕递进：答案是她的 → 署名不是她的 → 承认回来时她已经不需要了。全剧不设反派台词，只设位置差。","cast":[{"role":"说出答案的人：手里有数据，没有提交权","from":"wu-jianxiong"},{"role":"拿走署名的人：不需要懂，只需要在场","from":""},{"role":"迟到的承认：一个元素名、一颗小行星、一段颁奖词","from":"lise-meitner"}],"beats":["第一幕：她做出别人做不到的东西。用一次具体操作证明——不是「她很聪明」，而是「她连续三个月每晚校准同一台仪器」。","第二幕：成果离开她的手。写转手的那一刻：一张照片被借走、一份记录被「顺便」带走、一次会议没有通知她。全场没有争吵。","第三幕：她继续做下一件事，并且做得更好。这是最难写的部分——不给她翻身，给她工作。","尾声：承认到了。奖章、命名、纪录片。让她已经不在场，或者在场但只说一句「我只是想把数据做对」。"],"why":"这条配方的力量不在控诉，在结构：读者会自己把那笔账算出来，作者一句都不用喊。反派越体面，读者越难受。","techniques":["credit-is-structural","mckee-character-truth","choice-under-pressure"],"links":["wu-jianxiong","rosalind-franklin","lise-meitner","jocelyn-bell","cecilia-payne","henrietta-leavitt","esther-lederberg","katalin-kariko"]}],"tracks":[{"id":"screen","name":"编剧版","for":"剧本、短剧、影视向","desc":"从人物怎么立，到整部戏的节拍。每一条都能追到原书。"},{"id":"genre","name":"类型小说版","for":"悬疑、言情、幻想单本","desc":"正在编写中，暂未开放。"},{"id":"literary","name":"严肃文学版","for":"纯文学短篇与长篇","desc":"视角、细节、留白与语言。部分课时还在编写。"}],"fieldNotes":[{"id":"merge-real-people","title":"从真人到人物：拆关键词再重组","source":"叶伟民（作家说）／福斯特性格分析法","author":"写作方法论","category":"造人","oneLiner":"扁形人物合并同类项；圆形人物先拆静态与动态两组关键词，再对应融合，别做静态叠加。","howto":["扁形做法：把甲、乙、丙身上同一种特质的言行拎出来，取「最大公约数」，集于一人","圆形做法：先拆关键词，分清「横向静态（同时并存的）」和「纵向动态（前后变化的）」","静态叠加会导致前后矛盾、自我分裂——所以变化的那部分必须单独拎出来排时间线","融合的功夫没有量化标准，只能靠反复实操碰壁内化"],"example":"骆驼祥子：老实、坚忍、自尊、好强 →（三起三落后）麻木、潦倒、狡猾、堕落。「好强」和「堕落」不是同时存在的两个标签，是一条线的前后两端。","quote":"如果也用简单静态提取叠加的方式，容易前后矛盾，自我分裂。","links":["xiao-yingjie","dai-luwa-mother","li-le-you"],"linkHint":"库里肖英杰、代露娃之母、李勒优的养母，本质是同一个母题（控制型母亲）的三个变体。横向取「控制」的最大公约数，纵向各自加一条变化线——合成一个比任何一个真人都更狠的母亲。","sourceLabel":"叶伟民（作家说）／福斯特性格分析法","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"},{"id":"situation-lab","title":"戏剧情境就是人性的实验室","source":"马骏（中央广播电视总台影视剧纪录片中心）","author":"2025 中国广播电视精品创作大会","category":"压力与选择","oneLiner":"只有具体情境中的人，没有绝对性格，也没有单向度的人。","howto":["不要先定「她是个狠人」，先定「她被放进什么局里」","换情境换面貌：同一个人在同一本书里，至少要有三种场景下的三种样态","人的深度与厚度，决定故事的深度与厚度","别片面化刻画——真正站到那个人的视角下，想他在那一刻内心是什么"],"example":"「看别人来知道自己应该怎么活。」读者认同和模仿的是一个处境里做出的选择，不是一个形容词。","quote":"戏剧情境就是人性的实验室，只有具体情境中的人，没有绝对性格和单向度的人。","links":["zong-fuli","dong-mingzhu","liu-dingshuo","zhao-jingli-jianglaolao"],"linkHint":"宗馥莉在家族内斗里是隐忍的，在董事会里是清场的，在员工面前是砍福利的。三个情境、三种样态、同一个内核——这比写她「很强势」有用得多。","sourceLabel":"马骏（中央广播电视总台影视剧纪录片中心）","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"},{"id":"growth-costs","title":"成长必须有代价","source":"一线网文写作课（番茄小说 / QQ阅读写作课堂）","author":"网文写作方法论","category":"弧光与转变","oneLiner":"没有代价的成长不叫成长，叫发福利。","howto":["五阶段：起点 → 事件触发 → 冲突升级 → 关键转折 → 最终蜕变","正面驱动：暴富、暗恋成真 → 心态变化","负面驱动：灭门、背叛、突逢变故 → 被迫成长","重大转变必须有具体事件触发，不能靠「她想通了」"],"example":"给人物写一个「100 字核心创伤」，之后所有重大决策都要符合这个创伤的逻辑。","quote":"成长不能一蹴而就，要通过重大事件推动。","links":["li-le-you","lu-suyoung"],"linkHint":"李勒优那句「接受一切事与愿违」然后搬出去独居——转变的触发点必须落到一件具体的事上（养母在几万人直播间数落她），不能写成一句顿悟。","sourceLabel":"一线网文写作课（番茄小说 / QQ阅读写作课堂）","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"},{"id":"light-and-dark","title":"主角可以有缺点，反派要有闪光点","source":"网文人物构造方法论","author":"类型写作通行原则","category":"弧光与转变","oneLiner":"没有绝对的好人，也没有绝对的坏人——但主角不能有「读者无法接受的恶」。","howto":["主角可以有：自私、腹黑、小心眼、爱装。不能有：滥杀无辜、背叛朋友","反派可以有：孝顺、重情义、有原则。但不能掩盖他的核心恶行","配角可以有私心，为利益和主角冲突，但最终要站回来","每个人物都要有「底线」和「禁忌」：什么事他绝对不做？什么人他绝对不伤？——一旦突破，就是人设崩塌"],"example":"《狂飙》高启强 = 鱼贩子（身份）+ 胆小懦弱（表面性格）+ 心狠手辣（隐藏性格）。巨大的反差让这个角色立住了。","quote":"他必须「有血有肉地犯错」，然后「有血有肉地承担」。","links":["xiang-tai","wang-chu-ran"],"linkHint":"向太（陈岚）为张家齐出头，同时自曝旧事为自己立人设——「打抱不平」和「借势」同时成立。这种颗粒度才有人味，别急着给她定性。","sourceLabel":"网文人物构造方法论","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"},{"id":"micro-detail","title":"加细节，不加形容词","source":"番茄小说写作课（讲师：未小兮）","author":"一线写作课","category":"细节与技法","oneLiner":"微表情、小动作、内心的挣扎，远比「他很生气」有力。","howto":["不写「她很伤心」，写她做了什么","在动作、神态、心理三层里挑一两个最准的，不要全上","只加对剧情和人物有意义的细节——不必每句话都加","只写对话和情节、不写人物状态，是新人最典型的毛病"],"example":"差：「他问：你不会骗我的，对吗？」好：「他目光在她身上掠过，看见了她袖口里因为紧张而攥紧的手指，眼底的温度降了几分，语气却一如寻常：你不会骗我的，对吗？」","quote":"动作的微表情、神态的细微变化、内心的挣扎纠结，远比直白的『他很生气』更有力量。","links":["ju-junye","wang-xiaofei","chen-xianglu","anne-carson","zhang-yuan","wu-an"],"linkHint":"具俊晔在法院门口逐页签字、全程录像——不要写他「很深情」，写他签字那只手，和旁边那台一直开着的摄像机。一个动作就把全部信息给完了。","sourceLabel":"番茄小说写作课（讲师：未小兮）","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"},{"id":"backstory-dosing","title":"填过往：回忆要分次投放","source":"番茄小说写作课","author":"一线写作课","category":"细节与技法","oneLiner":"没有无缘无故的善恶，也没有毫无理由的选择——但过往要一点一点放。","howto":["每个人物的言行都源于过往：童年印记、原生创伤、执念遗憾、成长转折","不要一次性全盘托出，多次穿插在情节中","每次投放同时干三件事：解释动机、增加共情、留下悬念","删掉对剧情和性格无意义的回忆，也别加得太频繁"],"example":"差：「女主看到男主递来的牛奶，突然愣住，拒绝了他。」好：「女主看到男主递来的热牛奶，指尖猛地一颤——小时候被继母捏着鼻子强行灌下馊牛奶的画面又一次浮上来。她后退一步，摇了摇头：我不喜欢喝牛奶。」","quote":"千万不要加一些对剧情推动没有意义、对塑造人物性格特点没有作用的回忆。","links":["xiao-yingjie","zheng-jianping"],"linkHint":"「13.1 克金项链」是完美的投放物——一个道具同时完成两层信息：她真的爱过女儿（13 届、第一名），以及她从未真正交付过（项链锁在抽屉里十年）。写的时候别解释，就把项链和抽屉并排放着。","sourceLabel":"番茄小说写作课","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"},{"id":"voice-equals-identity","title":"语言风格即身份","source":"QQ阅读写作课堂（言行一致法则）","author":"一线写作课","category":"细节与技法","oneLiner":"设定冷面总裁，开口像萌妹子——角色当场精分。","howto":["语言风格：用词、口音、节奏要符合身份背景","行为轨迹：同类情境下的选择要和性格同轨","性格驱动行为：每个选择都能用性格解释得通","两层动机叠着写：表层（要钱、要权、要复仇）+ 深层（渴望被认可、害怕再次失去）"],"example":"《狂飙》高启强的每句台词都透着算计和狡黠——因为性格如此，观众才信他说的每一个字。","quote":"言行一致，别让角色精分。","links":["dong-mingzhu","hu-nvshi","wu-yue","li-xiaoran","yuantong-wangdian-zhuguan"],"linkHint":"董明珠打断下属那句「行了，少废话」——五个字，她整个人就站在那儿了。胡女士的「份量对得起天地良心」——同一类委屈，两个阶层两种说法。把这两句放一起看，就知道什么叫语言即身份。","sourceLabel":"QQ阅读写作课堂（言行一致法则）","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"},{"id":"erased-genius-no-lament","title":"被抹名的人不哭，他们把愤怒换算成精度","source":"从吴健雄、富兰克林、迈特纳的公开记录里归纳","author":"本库归纳","category":"被抹掉的人","oneLiner":"真正的强者被拿走署名后不写控诉信，他们让下一步工作精确到无人能否认。","howto":["把「委屈」翻译成一个可量化动作：再做一次实验、再提一档精度、再补一组对照。情绪越重，动作越具体。","让愤怒只出现在最不相干的场合：给别人的贺信、给学生的叮嘱、一句自嘲。永远不在公开场合。","给她一条「不解释」的边界：别人问起，她只回答事实，不评价对方。沉默本身就是压力。","最重的一句话放到最轻的载体上——脚注、致谢、贺信、退休演讲。读者会替她把音量调大。"],"example":"吴健雄被问诺奖，只回「我从没为了得奖做研究」；真正的那句「我的工作被人忽视，依然深深伤害了我」，写在她给另一位诺奖得主的贺信里。","quote":"当我的工作因为某些原因而被人忽视，依然是深深地伤害了我。——吴健雄","links":["wu-jianxiong","lise-meitner","cecilia-payne"],"linkHint":"三个人的共同点：没有一个人公开指控。拿这三条素材练一件事——把最重的话放到最轻的场合，看杀伤力怎么翻倍。","sourceLabel":"从吴健雄、富兰克林、迈特纳的公开记录里归纳","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"},{"id":"liuheping-loneliness","title":"站到人物的孤独里","source":"刘和平（《大明王朝1566》《北平无战事》编剧）","author":"刘和平谈艺录","category":"本土经验","oneLiner":"用诗人的眼光找人物心灵的真实，用田野调查的态度认识生活背后的文化成因。","howto":["进入人物时先找他的「孤独」——孤独是人类最本质的属性","呈现人物身处时代困境中的「无力感」与复杂弧光","哪怕是反派也让人恨不起来，因为观众能从中照见自身","不写「非人之人」，对笔下人物始终抱有温情与敬意"],"example":"刘和平写《大明王朝1566》，工作间摆香案，一边供嘉靖像一边供海瑞像，洗手焚香磕头才开始写作。「我一进入创作间，对着香案跪下去，自己进入一个孤独的状态和境界，才可能跟他们对话。」他说《北平无战事》里最难对话的是电话里的蒋经国，因为那个时候蒋经国也极其孤独。","quote":"我觉得好像孤独才是我们人类最本质的属性。","links":["hu-nvshi","huang-chunmei"],"linkHint":"写胡女士之前先回答一个问题：她一个人守摊到深夜的时候，脑子里在想什么？这段要是写不出来，人物就立不住——你写的只是她的遭遇，不是她。","sourceLabel":"刘和平（《大明王朝1566》《北平无战事》编剧）","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"},{"id":"liuheping-attitude","title":"停下来写「人物以外的人生态度」","source":"刘和平（2025 中国广播电视精品创作大会）","author":"刘和平","category":"本土经验","oneLiner":"写出典型环境下不同典型人物、不同的人生态度，作品才有内涵。","howto":["不要把所有配角都写成主角的陪衬","给每个重要配角一套完整的、能自洽的人生态度","让人生态度互相碰撞，而不是让人物互相吼","「要学会停下来写剧」——别一直往前推情节"],"example":"现实主义创作要透过社会表象的真实，揭示文化成因的真实和人物心灵的真实。","quote":"要学会停下来写剧，写出人物以外的人生态度。","links":["dai-luwa-mother","dai-luwa"],"linkHint":"代露娃和她妈妈各有一套完整的人生哲学：「爱要被看见」对上「爱是砸锅卖铁」。谁都不是谁的背景板——两套哲学对撞的那一刻，才是这场戏真正的高潮。","sourceLabel":"刘和平（2025 中国广播电视精品创作大会）","note":"行业经验 / 个人归纳，没有可查的书面出处，不计入方法层"}]};</script>

ate":"2026-10-14","heat":82,"headline":"代露娃妈妈破产做月嫂供女，女儿控诉反遭全网心疼","summary":"曾经的女老板，家里资金链断裂后脱下职业装去做月嫂，24小时连轴转，在雇主家低声下气，攒下十几万供女儿全托艺考培训，甚至备好「考不上就卖房送出国」的预案。走红后女儿上交的工资卡，她分文未动。全程陪录综艺，面对女儿的控诉一言不发。","traits":["沉默托底","体力型爱","情感表达功能缺失","把苦咽下去"],"methods":["用体力而非语言表达爱：月嫂一单接一单，攒钱直接打进艺考账户","把退路提前铺好：高考只考两百多分，家里已经做好卖房送出国预案","面对镜头上的指控不辩解、不哭诉，只是沉默——被网友读作「哀莫大于心死」","替女儿承担生活杂务：女儿养的六条狗是她带，女儿过年回不了家是她去剧组做饭","不动女儿的工资卡——用最笨的方式证明自己不是索取者"],"story":[{"t":"早年","d":"生意尚可时是体面女老板，让女儿读片区最好的小学初中，学十几年民族舞和画画，陪读送饭、补习记笔记"},{"t":"家道中落","d":"资金链断裂，放下身段转行做月嫂，在雇主家背忌口单、伺候产妇与新生儿"},{"t":"艺考期","d":"攒下十几万供女儿全托艺考培训；高考成绩不理想，家里备好卖房送出国预案"},{"t":"走红后","d":"女儿上交工资卡，她分文未动"},{"t":"2026年10月","d":"被女儿在综艺上公开「原生家庭控诉」，她在观察室全程表情平静，承受了巨大舆论压力"}],"quotes":["（网友转述月嫂行规）产妇糖尿病、宝宝牛奶蛋白过敏、老爷子痛风、老太太回民——记错一样就会被投诉、被退单、被扣钱。","（舆论）她讲我不吃香菜你偏放，却忽略了母亲在客户家背过产妇忌葱蒜、宝宝湿疹停海鲜，回到自己的灶台，脑子已经像写满字的黑板擦不干净。"],"writingUse":"『不会说爱的供养者』。她的悲剧在于：她能给的全部是物质，而她女儿要的全部是情感，两本账永远对不上。适合写成沉默的底层母亲形象——不控诉、不辩解、不流泪，所有台词加起来不超过十句，但每一场戏都压得人喘不过气。她是「爱需要被接收到」这个命题的反面教材。","sources":[{"publisher":"新浪娱乐","title":"代露娃妈妈破产做月嫂供女，女儿控诉反遭全网心疼","url":"https://ent.sina.cn/2026-10-05/detail-iniueeuc2856779.d.html"},{"publisher":"搜狐娱乐","title":"代露娃上综艺哭诉艺考只能睡1.5米小床，网友查到当年她母亲辛苦做月嫂供她追梦","url":"https://yule.sohu.com/a/1085876164_121165410"}],"novel":{"want":"让女儿站上舞台，不再吃自己吃过的苦；用劳动把女儿托起来。","fear":"成为女儿的负担；自己的付出被女儿全盘否定。","contradiction":"能记住雇主家所有人的忌口，却记不住女儿不吃香菜；能给的全是物质，女儿要的全是情感。","pressureChoice":"被女儿在综艺上公开控诉时，不辩解、不哭诉，沉默；继续替女儿带六条狗、去剧组做饭。","scene":"在雇主家背忌口单：产妇糖尿病、宝宝牛奶蛋白过敏、老爷子痛风、老太太回民；记错一样就被退单。","relations":"女儿代露娃：她托举的人，也是公开否定她的人；雇主一家：她必须记住所有忌口的人。","confidence":"C"}},{"id":"liu-jishou","name":"留几手","alias":"留几手","identity":"网络评论人 · 为张母站台反被扒旧账","category":"社会切片","date":"2026-10-14","heat":74,"headline":"留几手为张家齐妈妈喊冤反遭群嘲","summary":"直播中情绪激动为张家齐妈妈发声，称「妈妈花女儿钱很正常」「不应拿现代标准苛责一位普通母亲」「如果花的是儿子的钱舆论会不会这么激烈」。话音刚落就被网友翻出婚内伤害前妻、花光对方嫁妆且离婚未归还的旧账，被斥为「同类相护」。","traits":["逆风站队","流量投机","道德立场先行","被反噬"],"methods":["挑一个全民一边倒的事件，站在少数派一方，用『你们双标』制造冲突入口","把具体指控偷换成抽象议题：网友说的是『一边消耗一边打压』，他辩的是『花女儿钱正不正常』","用性别议题转移焦点：反问『如果花的是儿子的钱呢』","攻击信源可信度：指节目剪辑放大矛盾，暗示观众被牵着走"],"story":[{"t":"2026年10月1日","d":"直播中为张家齐妈妈肖英杰发声，称『妈妈花女儿钱很正常』，质疑网友用现代标准苛责普通母亲"},{"t":"数小时内","d":"相关话题冲上热搜，评论区出现大量反驳：网友抨击的从不是花女儿的钱，而是长期打压与消耗"},{"t":"同日","d":"其婚内伤害前妻、花光嫁妆未归还的旧账被翻出，被网友斥为『同类相护』"},{"t":"后续","d":"被质疑刻意唱反调蹭流量，遭群嘲"}],"quotes":["妈妈花女儿钱很正常。","（网友反讽）不知道的人还以为每天保存张家齐奖金快累死了。"],"writingUse":"『蹭反调的代价』。适合写成那种靠唱反调立人设的意见领袖——他不是不知道会翻车，他赌的是骂声也是流量。想写网络舆论战时，他是最好用的打火机：只要他一开口，原本对立的双方会短暂合流来烧他。","sources":[{"publisher":"新浪娱乐","title":"留几手为张家齐妈妈喊冤反遭群嘲","url":"https://ent.sina.cn/2026-10-02/detail-inittzpz7943421.d.html"}]},{"id":"zong-fuli","name":"宗馥莉","alias":"宗馥莉","identity":"娃哈哈二代掌权人 · 宏胜系实际控制人","category":"商界狠人","date":"2026-10-14","heat":93,"headline":"娃哈哈办公楼突然被查封，宗馥莉的铁腕手段激起众怒","summary":"14岁远赴海外，八年里眼看着父亲情人陪读、私生弟妹接连出生、父亲为外人设立专属信托安排闲职，全程沉默。父亲离世后雷霆出手：董事会大换血、清空关联异己、关停争议产线、更名关联企业、转移核心商标资产。对家族狠，对老员工同样不留情面。","traits":["蛰伏型","雷霆清算","规则至上","不留余地","情绪不外露"],"methods":["藏于九地：年少蛰伏不冲动、不辩解，默默打磨能力、回国后扎根基层吃透业务，不急于夺权","故意留痕引对方主动起诉——让对手自曝家丑、败坏口碑，自己全程隐身占据道德高地","推翻几十年基本盘：否决实行多年的干股分红制，强制数千名老员工转签至自己掌控的公司","去创始人化：把核心产线、商标逐步剥离到个人控股体系，切断老体系控制权","对既有承诺零妥协：员工公积金、经济补偿被压缩，引发数十起劳资纠纷与强制执行"],"story":[{"t":"14岁起","d":"远赴海外留学八年，期间父亲情人陪读，私生弟妹接连出生，全程沉默不发声"},{"t":"归国后","d":"不急于夺权，扎根基层吃透业务，多年蛰伏"},{"t":"2024年","d":"父亲离世后全面接管，否决施行数十年的干股分红制，董事会大换血"},{"t":"2025年","d":"关停全国18家娃哈哈产线，将生产渠道收归宏胜集团"},{"t":"2026年","d":"遗产纠纷香港、杭州双线诉讼；同期因拖欠员工公积金超200万，办公楼被法院查封三年"}],"quotes":["心里有只老虎，偶尔放出，及时收回。","（舆论）爽剧滤镜之下，这盘看似全胜的棋局早已布满看不见的裂痕。"],"writingUse":"『隐忍型复仇者』的当代版本。她的好处是动机干净、手段系统、代价真实——赢下棋局但失去人心。适合写成商战线的女主人设：年轻时学会闭嘴，掌权后不解释，所有清算都等对方先出手。也可以写成反派的另一面：她做的每件事都有商业逻辑，唯一的问题是没有人替被清掉的人说话。","sources":[{"publisher":"今日头条","title":"宗馥莉把孙子兵法用到了极致？听听冯唐怎么评价","url":"https://www.toutiao.com/w/1877546198951048/"},{"publisher":"今日头条","title":"娃哈哈办公楼突然被查封，宗馥莉的铁腕手段激起众怒","url":"https://www.toutiao.com/w/1876461153271808"}],"novel":{"want":"证明自己能掌权，把公司变成「她的」；清理旧秩序。","fear":"被当成「父亲的女儿」，被旧势力架空。","contradiction":"年少时学会闭嘴，掌权后不解释；对家族狠，对老员工也不留情；「心里有只老虎，偶尔放出，及时收回」。","pressureChoice":"父亲离世后，不等、不妥协，全面接管；否决施行几十年的干股分红制，强制数千员工转签。","scene":"14岁在国外，父亲的情人陪读，私生弟妹接连出生；她全程沉默。","relations":"父亲宗庆后：她一直活在其阴影下的人；老员工：被她清掉的人；私生弟妹：她拒绝承认的人。","confidence":"B"}},{"id":"dong-mingzhu","name":"董明珠","alias":"董明珠","identity":"格力电器董事长 · 商界铁娘子","category":"商界狠人","date":"2026-10-14","heat":79,"headline":"全网都笑她固执、霸道！72岁董明珠：看似不近人情，实则人间清醒","summary":"36岁遭遇家庭变故南下珠海，从基层销售员做到千亿企业掌门。砸毁上千台有瑕疵的空调、强推先款后货扭转行业欠款陋习、把混乱的空调渠道规范化。她的强势从不给面子：下属开会铺垫半天，她直接打断「行了，少废话」。","traits":["只跟事较劲","不近人情","硬到底","务实到冷酷","反形式主义"],"methods":["质量问题零容忍：发现上千台空调有细微瑕疵，直接下令全部砸毁，绝不流入市场","用强势规则换长期秩序：在全行业反对时强推先款后货，硬生生扭转行业陋习","砍掉一切客套：会议上打断铺垫，「行了，少废话」，要求直接摆问题说干货","突击检查不留缓冲：不通知管理层突查员工食堂，发现荤素同价让不吃肉的员工吃亏，当场责令彻查、荤素分开计价，并回头复查整改结果","公私彻底切割：不搞家族企业，不让亲戚沾公司一分钱红利"],"story":[{"t":"36岁","d":"遭遇家庭变故，南下珠海进入格力，从基层销售员起步"},{"t":"上任初期","d":"发现上千台空调存在细微瑕疵，下令全部砸毁"},{"t":"行业整顿期","d":"强势推行先款后货，遭全行业抵制，最终扭转空调行业欠款陋习"},{"t":"多年间","d":"跨界造车、手机、芯片，多数项目效果不及预期，被质疑盲目扩张"},{"t":"近期","d":"新增头衔『珠海市格力技工学校校长』，被央媒转发"}],"quotes":["（被问要不要找个伴侣）为什么要找老公？","安慰解决不了问题，解决问题才是最大的安慰。","行了，少废话。"],"writingUse":"『单一价值观的极致执行者』。她身上没有灰色地带——所有问题都是技术问题，所有分歧都是效率问题。适合写成让主角又敬又怕的上级，或者写成一面镜子：她的逻辑无懈可击，但被她碾过去的人也没有错。写她时别写她的脾气，写她打断别人时那半秒的空白。","sources":[{"publisher":"今日头条","title":"全网都笑她固执、霸道！72岁董明珠：看似不近人情，实则人间清醒","url":"https://m.toutiao.com/article/7682969535468700204"},{"publisher":"搜狐文化","title":"没想到，央媒刚高调官宣董明珠新身份","url":"https://cul.sohu.com/a/1067811269_122541357"}]},{"id":"lu-suyoung","name":"卢素英","alias":"韩国总统千金","identity":"韩国前总统卢泰愚之女 · SK集团会长前妻","category":"情感战场","date":"2026-10-14","heat":90,"headline":"韩国史上最贵离婚！总统千金获判9440亿：丈夫公开承认出轨，还和小三生了孩子","summary":"父亲是总统，丈夫是韩国第二大财阀掌门人。发现丈夫爱上别人后，她先是自责、想为孩子们维持家庭，等了几年才慢慢接受关系终结。离婚官司几经反转，最终获判9440亿韩元（约6.44亿美元），韩国史上规模最大的离婚财产分割之一。","traits":["隐忍","自我归因","体面到底","慢半拍地清醒"],"methods":["发现被背叛后第一反应是自我归因：觉得是不是自己哪里做得不够好","为了孩子维持家庭的完整，明知对方不想回来仍然等","用法律而非舆论解决：主张几十年的家庭管理与对外活动同样参与了财富形成","在漫长的诉讼反转中保持体面，不诉诸媒体情绪","最后才收拾住了37年的家，翻出婚纱与孩子画着爱心的旧画"],"story":[{"t":"40多年前","d":"在美国校园里与崔泰源相遇，两人相信过「True Love」"},{"t":"婚姻中","d":"承担家庭管理与抚养孩子，参与SK集团相关的对外活动"},{"t":"背叛发生时","d":"丈夫公开承认出轨并与他人育有子女，她先是自责、拒绝接受"},{"t":"2022年","d":"一审仅获财产分割665亿韩元"},{"t":"2024年","d":"二审数字一度暴涨至1.38万亿韩元，随后最高法院推翻了关键部分"},{"t":"2026年7月24日","d":"终审判定9440亿韩元，约6.44亿美元"}],"quotes":["（孩子旧画上的字）True Love。","9440亿可以买很多东西，却买不回一个人在婚姻里度过的几十年。"],"writingUse":"『体面型受害者』。她的故事最狠的地方在于：她的身份几乎每一个都离普通人很远，但她经历的东西普通得惊人——自责、舍不得、为了孩子等一等。适合写成那种不哭不闹、慢慢自我拆解的女性角色：真正的崩塌不在争吵那天，而在她收拾旧物、翻出婚纱的那个下午。","sources":[{"publisher":"网易新闻","title":"韩国史上最贵离婚！总统千金获判9440亿：丈夫公开承认出轨，还和小三生了孩子","url":"https://c.m.163.com/news/a/L4DU4PB205188DJH.html"}],"novel":{"want":"先想保住家庭，后来想分得应得的、要一个说法。","fear":"公开羞辱、家庭破碎、被看成「被抛弃的总统女儿」。","contradiction":"最体面的人，打了最贵的离婚官司；先自我归因，后慢慢清醒。","pressureChoice":"明知丈夫不回来，仍为孩子维持几年；最后选择离婚诉讼，而不是舆论战。","scene":"最后收拾住了37年的家，翻出婚纱与孩子画着爱心的旧画，上面写着「True Love」。","relations":"崔泰源：她等了多年的人；孩子：她维持婚姻的理由；律师：她最后选择的人。","confidence":"C"}},{"id":"ju-junye","name":"具俊晔","alias":"具俊晔","identity":"大S（徐熙媛）遗孀","category":"情感战场","date":"2026-10-14","heat":87,"headline":"具俊晔不再隐瞒！签放弃继承半年后申请撤销","summary":"大S离世后，他专程到法院公证放弃继承，只保留豪宅终身居住权，把约2.2亿新台币份额让给两个孩子，全网赞他深情。不到半年，他委托律师推翻这份公证，理由是签文件时悲痛过度、不懂中文、并非完全自愿——最终拿回约1.5亿新台币产权。","traits":["深情表演","精准反转","契约工具化","善于为自己找情绪理由"],"methods":["把放弃做成公开表演：当着媒体面逐页签字、全程录像，先占据道德高地","时机精准：等舆论热度散尽、公证尘埃落定后再启动撤销程序","用不可抗力作为违约理由：『悲痛过度、中文不熟、看不懂法律文书、基于信任就签了』","不只争自己的份：还试探性提出希望获得两名未成年子女名下资产的处置权限","同框露面维持体面：由前妻妹夫牵头每周家族聚餐，他照常接送S妈、同桌吃饭，让外界看到「相处融洽」"],"story":[{"t":"2026年1月","d":"到法院公证放弃继承，仅保留豪宅终身居住权（另附条款：一旦再婚立刻搬走），把约2.2亿新台币份额让给两个孩子"},{"t":"2026年7月12日","d":"台媒爆出他已委托律师准备推翻放弃公证，理由为签文件时情绪崩溃、中文不熟"},{"t":"2026年7月22日","d":"大S名下4.6亿新台币的信义区豪宅完成继承过户，产权分三份：他、女儿、儿子各三分之一"},{"t":"同期","d":"每月119万新台币房贷仍由汪小菲持续代缴，他分文未出却取得约1.5亿产权"},{"t":"持续中","d":"遗产调解庭持续开庭，双方对峙房产、股票、存款与遗产税分摊"}],"quotes":["大S打拼一生，所有财产都该留给两个孩子。","（他的撤销理由）签文件时沉浸在丧妻的悲痛里，中文又不好，看不懂法律文书。","（舆论）一边是镜头前的泪光与誓言，一边是法庭上的调解书与诉求清单。"],"writingUse":"『合法但难看的操作者』。他最值钱的不是钱，是他知道什么时候该演、什么时候该动手。适合写成那种在葬礼上哭得最凶、在律师楼里最冷静的角色。写他不用写伪善，就写他每次出现都恰好有镜头——他不是在演给谁看，他是习惯了有人看。","sources":[{"publisher":"腾讯新闻","title":"大S遗产风波落幕，具俊晔成为赢家坐享其成","url":"https://view.inews.qq.com/a/20260801A03PNB00"},{"publisher":"360娱乐","title":"具俊晔不再隐瞒！签放弃继承半年后申请撤销","url":"https://yule.360.com/detail/5141551"}]},{"id":"huang-chunmei","name":"黄春梅","alias":"S妈","identity":"大S与小S之母 · 遗产纠纷中被排除的一方","category":"情感战场","date":"2026-10-14","heat":76,"headline":"大S豪宅正式完成过户，具俊晔被曝分走约1.5亿，S妈无份","summary":"大S生前给她买的孝亲房市值约2.1亿新台币，因手续多年未办完，人先走了。按法律她是第二顺位继承人，有配偶有子女在前，她一分钱都分不到。面对镜头她说「我已是半死的人，只求一个居住的地方」，私下却被曝聘请顶尖律师团队，目的是防止外孙们的财产被争走。","traits":["双线操作","示弱为表暗中布局","母亲式算计","在规则外找缝隙"],"methods":["对媒体示弱、对法院强硬：台前流泪说『不喜欢打官司』，幕后已排兵布阵","把诉求包装成最低限度的生存需求：不谈遗产份额，只求『一个居住的地方』","面对关键问题一律回避：被问及遗产细节时只回三个字『不知道』","以保护外孙为名义介入：律师团队对外宣示的目的是防止财产被争走"],"story":[{"t":"生前","d":"大S为她买下市值约2.1亿新台币的『国家艺术馆』孝亲房，但过户手续拖了几年没办完"},{"t":"大S离世后","d":"法律上她为第二顺位继承人，前两位顺位存在的情况下分不到任何遗产，住了十几年的房子随时可能不保"},{"t":"2026年","d":"面对镜头哭诉『我已是半死的人，只求一个居住的地方』"},{"t":"同期","d":"被曝私下聘请顶尖律师团队，防止具俊晔争走外孙们的财产"},{"t":"被问及细节时","d":"只回三个字：『不知道』"}],"quotes":["我已是半死的人，只求一个居住的地方。","（被追问遗产细节）不知道。"],"writingUse":"『老练的博弈者』。她演的不高明，但她知道镜头在哪里。适合写成家族剧里的老太太：台词永远是求饶，动作永远是落子。她的可怕之处是——她哭的每一场都真的很难受，而她哭完就去做该做的事，两件事并不矛盾。","sources":[{"publisher":"网易","title":"大S豪宅正式完成过户，具俊晔被曝分走约1.5亿，S妈无份","url":"https://www.163.com/dy/article/L38FBTTD0536HUEJ_pdya11y.html"},{"publisher":"今日头条","title":"具俊晔反转夺产！4.6亿豪宅落袋，还贷的却是汪小菲","url":"https://m.toutiao.com/article/7681992603520254464"}]},{"id":"wang-xiaofei","name":"汪小菲","alias":"汪小菲","identity":"大S前夫 · 两名未成年子女的法定代理人","category":"情感战场","date":"2026-10-14","heat":71,"headline":"大S遗产风波落幕，具俊晔成为赢家坐享其成，汪小菲子女吃哑巴亏","summary":"离婚多年房贷从未断供。前妻离世后，他为两个孩子设立双重信托专户，每季度向法院报备，支出用途严格限定在教育、医疗、日常三类，监护人本人也不得直接动用本金。房子他一天没住过，却持续代缴每月119万新台币的房贷。","traits":["不赌人性","只信规则","沉默执行","用制度代替表态"],"methods":["把资产装进制度：为孩子设立双重信托，版权收益、存款、未来商业权益全部纳入未成年人专属资产池","主动接受外部监督：每季度向法院报备资金流向，任何支出都要留凭证","用持续履约代替表态：离婚协议约定的房贷从没断过一天，前妻走后仍继续代缴","不做情绪回应：对方律师高调诉讼期间，他一张感情牌都没打","划定边界而非争夺：从不干涉对方家族生活，只锁定孩子的那部分"],"story":[{"t":"2021年","d":"两人离婚，协议约定房产归大S、房贷由他承担，此后每月119万新台币从未断供"},{"t":"大S离世后","d":"为两个孩子设立信托专户，每季度向法院报备，资金限定用于教育、医疗、日常开销"},{"t":"2026年7月8日","d":"通过律师发五点声明，明确子女继承的三分之二遗产全部进信托，由法院选任的特别代理人审核把关"},{"t":"2026年7月22日","d":"配合完成豪宅继承过户登记；两个孩子已被接回北京，转学至海淀区学校"},{"t":"持续","d":"每月119万新台币房贷继续代缴，房产不存在被拍卖风险"}],"quotes":["（法律界评价）这不是防具俊晔，是防任何可能动摇孩子财产权益的风险——包括监护人变更、债务牵连、甚至未来婚姻变动。","他没赌人性，只信规则。"],"writingUse":"『沉默的对手』。他和具俊晔构成一组绝妙的对照：一个表演深情、一个沉默履约。适合写成那种不解释、不控诉、不出现在舆论场里的男性角色——他所有的戏都在文件里、在账户流水里、在每季度一次的报备里。写他时不要给台词，给动作。","sources":[{"publisher":"360娱乐","title":"具俊晔不再隐瞒！签放弃继承半年后申请撤销","url":"https://yule.360.com/detail/5141551"},{"publisher":"腾讯新闻","title":"大S遗产风波落幕，具俊晔成为赢家坐享其成，汪小菲子女吃哑巴亏","url":"https://view.inews.qq.com/a/20260801A03PNB00"}]},{"id":"hu-nvshi","name":"胡女士","alias":"宜宾炸串摊主","identity":"四川宜宾33岁女摊主 · 网暴致死当事人","category":"社会切片","date":"2026-10-14","heat":94,"headline":"四川宜宾一女摊主因一份10元炸菜被差评后跳河轻生，当地警方已介入调查","summary":"摆摊四年多，是全家生计依靠，常年每天睡不足6小时。因一位顾客对菜量不满在多平台发『避雷帖』，评论区涌入大量跟风差评。10月9日她跳河轻生，遗言里写：这两天我经历了网暴……我每天睡觉不超过6小时，最后换来这样的避雷视频。","traits":["底层韧性","缺乏为自己辩解的能力","把委屈咽下去","被忽略的承受者"],"methods":["用最朴素的逻辑自证清白：「提供给该顾客的两份炸菜份量对得起天地良心」","不反击、不起诉、不对线，把委屈一点点收进心里","事发前仍在安排日常：嘱咐丈夫把新买的土豆放到库房","丈夫后来复述她的状态：突然蜂拥而至的差评在当地传开，『可能她心里就有这个包袱了』"],"story":[{"t":"16岁前","d":"不到16岁就离家打工，多年来为生计奔波"},{"t":"摆摊四年多","d":"卖炸串炸洋芋，是全家生计依靠，常年每天睡眠不足6小时"},{"t":"2026年10月6日","d":"接待一位女顾客，对方因对菜量不满在多平台发布避雷帖，引发大量跟风差评"},{"t":"此后数日","d":"评论区出现『服务差』『味道不好』『吃了拉肚子』等指责，差评在当地传开"},{"t":"2026年10月9日","d":"嘱咐丈夫把新买的土豆放到库房，不久后跳河轻生"}],"quotes":["这两天我经历了在我心中的网暴，吃炸菜说没有加土豆，下面一些评论拥上来，有说服务差的，有说味道不好吃的。","我每天睡觉不超过6小时，最后换来这样的避雷视频。","（网友）这个世界不是所有人都有奋力为自己辩解的能力，也不是所有人都拥有绝不低头的生命力。"],"writingUse":"写这类人务必克制。她身上最有力量的不是悲剧本身，是那句『提供给你的份量对得起天地良心』——一个没有话语权的人，能用的全部武器只有良心。适合写成小说里那个只出现三页、却让读者记一整本书的配角：不争、不闹、不解释，然后在最平常的一天里做了一件不可逆的事。","sources":[{"publisher":"澎湃新闻","title":"宜宾一女摊主被顾客差评后跳河轻生，留下遗言称『每天睡不过6小时却换来这样的避雷视频』","url":"https://www.thepaper.cn/newsDetail_forward_34244883"},{"publisher":"今日头条","title":"四川宜宾一女摊主因一份10元炸菜被差评后跳河轻生，当地警方已介入调查","url":"https://www.toutiao.com/article/7696333144362091059"}]},{"id":"bilei-guke","name":"避雷帖顾客","alias":"发避雷帖的女顾客","identity":"宜宾摊主事件中首发差评的消费者","category":"社会切片","date":"2026-10-14","heat":68,"headline":"四川33岁女摊主获差评后跳河轻生，6元炸土豆何以夺走一条鲜活生命？","summary":"因10元炸菜未加土豆，在多平台发布避雷帖，帖文引来大量跟风差评。摊主轻生后，她成为舆论转向的靶心，发文回应称自己无恶意、无煽动、无捏造，『不该因为一场意外悲剧被无限追责、被全网审判』。","traits":["维权感极强","对后果零预判","自我豁免式辩解","被卷入第二次网暴"],"methods":["把私人不满升级为公共公告：在小额消费纠纷中直接发布『避雷』内容","用平台放大个人情绪：多平台同步发布，主动召集外部评判","面对后果时切割责任：强调『真实消费体验』『无捏造事实』，把自己定义为评论者而非链条起点","以受害者处境结束回应：『我不该因为一场意外悲剧被无限追责』"],"story":[{"t":"2026年10月6日","d":"因10元炸菜菜量问题在多平台发布避雷帖，称老板娘『玩不起』『堆得多了就不让夹菜』"},{"t":"帖子发酵后","d":"评论区出现大量针对摊主的差评"},{"t":"2026年10月9日","d":"摊主跳河轻生"},{"t":"2026年10月13日","d":"发文回应：我发布的仅仅是本人真实的消费体验评价，无任何恶意、煽动、捏造；我不该因为一场意外悲剧被无限追责、被全网审判"},{"t":"随后","d":"该回应内容已不可见，她本人成为新一轮舆论围剿的对象"}],"quotes":["避雷某某铜锅洋芋，老板娘玩不起。","我发布的仅仅是本人真实的消费体验评价，无任何恶意、无任何煽动、无任何捏造事实。","（评论）当初跟风差评的人，和现在跟风讨伐的人，其实都是同样的人。"],"writingUse":"『无意识的施害者』。全书最值得写的人物之一——她做错了什么？好像什么都没做错。她说的是实话，她只是想让别人知道，她没想过会死人。适合写成那种在悲剧发生后最难受的配角：不是愧疚，而是发现自己的『合理行为』被卷进了一条她无法理解的因果链。","sources":[{"publisher":"澎湃新闻","title":"宜宾一女摊主被顾客差评后跳河轻生，留下遗言称『每天睡不过6小时却换来这样的避雷视频』","url":"https://www.thepaper.cn/newsDetail_forward_34244883"},{"publisher":"腾讯新闻","title":"四川33岁女摊主获差评后跳河轻生，6元炸土豆何以夺走一条鲜活生命？","url":"https://news.qq.com/rain/a/20261014A04Q6600"}]},{"id":"li-le-you","name":"李勒优","alias":"「今天不熬夜」· 变形计云南女孩","identity":"《变形计》走出的云南女孩 · 被网红养母长期「安排出镜」的流量当事人","category":"原生家庭","date":"2026-10-14","heat":90,"headline":"网传母女闹掰，新号四天涨40万粉，本人回应关系挺好","summary":"《变形计》里被晋妈一件外套裹住的云南女孩，长大后长期在面馆端盘子拍视频、没有工资，200万粉账号收益归养母儿子，自己名下只挂1%股份。养母直播数落她作息颠倒、停了零花钱。她只发一句「接受一切事与愿违」，搬出去独居，新号四天涨粉40万。","traits":["沉默切割","用动作代替声明","不辩解的撤离","对恩情不否认也不续费","把账算在心里"],"methods":["不撕破脸：全程没有一句公开指责，媒体追问只说「和晋妈关系挺好的，其他不便多谈」","用六个字代替一篇长文：发「接受一切事与愿违」，随即搬出晋妈家，在大连自己租房住","重开赛道而不是抢旧账号：原200万粉账号的管理权与收益都在对方手里，她不争，直接开新号「今天不熬夜」","把批判藏进自我提醒：新号文案写「不要回到小时候那样无能为力、那样惊恐、那样卑微的察言观色、毫无尊严」——不点名，但对象明确","先算清自己拿不到什么再走：名下无实际运营公司、仅持1%股份、与面馆和传媒公司无商业关联，确认资产都挂不到自己名下，于是只带走自己"],"story":[{"t":"2014年底","d":"参加《变形计》与大连少年崔晋互换生活，零下三度的大连机场，晋妈吴丽脱下外套裹住只穿凉鞋的她，看哭全国"},{"t":"节目结束后","d":"晋妈因单亲身份不符合法定收养条件，未能办成收养，转为长期资助：学费生活费由晋妈出，寒暑假接去大连"},{"t":"2022年","d":"考入大连一所本科院校，正式住进晋妈家，课余去面馆帮忙并配合拍短视频；在面馆端盘子、招呼粉丝打卡，从2022干到2026，没有工资，日常开销靠亲属卡"},{"t":"多年间","d":"晋妈直播里提过的别墅、奔驰、面馆，查下来都没落到她名下；送车承诺最终到手的是一辆车龄十几年的旧高尔夫，而崔晋生日家里提的是库里南"},{"t":"2026年9月","d":"晋妈在几万人的直播间说25岁的她作息颠倒、白天睡觉晚上拼豆、不愿来面馆帮忙，并承认已停了她几个月零花钱，还说「网友该感谢的是我儿子崔晋」"},{"t":"2026年10月2日","d":"发文「接受一切事与愿违」，评论区写「没有一个地方是属于我的归属」，随后搬出晋妈家，在大连自己租房"},{"t":"2026年10月上旬","d":"新号「今天不熬夜」四天涨粉超40万；晋妈近30天掉粉8.9万、崔晋掉粉6.8万，母子二人先后把评论区设为仅互关可评论"}],"quotes":["接受一切事与愿违。","没有一个地方是属于我的归属。","不要回到小时候那样无能为力，那样惊恐，那样卑微的察言观色，毫无尊严。","（对媒体）和晋妈关系挺好的，其他不便多谈。","（她自己说过）我手里有很多银行卡，但张张没钱。"],"writingUse":"写「被恩情困住的成年人」的第一选择。她最罕见的是那份克制：不控诉、不翻旧账、不卖惨，也不否认对方确实付出过——她只是不再续费那段关系。适合写成沉默型主角：全篇台词不超过十句，戏全在动作里（搬家、开新号、停更旧号）。也适合当「割席」戏的范本——最狠的告别不是对骂，是六个字的文案加一次搬家。写法上别把她写成白眼狼，也别写成纯受害者，她的力量恰恰来自两边都不站。","sources":[{"publisher":"新浪新闻","title":"网传母女闹掰，新号四天涨40万粉，本人回应关系挺好","url":"https://sina.cn/news/detail/5351769288476197.html"},{"publisher":"搜狐文化","title":"一句文案，把李勒优和晋妈的拉扯说透了","url":"https://cul.sohu.com/a/1085140066_122971191"},{"publisher":"搜狐娱乐","title":"晋妈仿佛不再维持镜头前热心善良的养母人设","url":"https://yule.sohu.com/a/1086344108_121166748"}]},{"id":"xiang-tai","name":"陈岚","alias":"向太","identity":"中国香港影视投资人向华强之妻 · 娱乐圈话事人","category":"娱乐圈","date":"2026-10-14","heat":86,"headline":"向太说张家齐妈妈谎话连篇：「建议张家齐不要和妈妈联络，钱可以照给」","summary":"张家齐母女争议最热时，她发视频直指张家齐妈妈「谎话连篇」，列三点控诉：表演式关心、长期打压、经济掌控。建议极具体——断亲、不再联络，但赡养费照给。为增强说服力，她自曝年轻时被母亲逼去当舞女还债的旧事，称离家独居后人生才「光明、敞亮」。","traits":["公开点名","把情绪变成方案","过来人姿态","不吃「第一次当父母」这套","边界感教主"],"methods":["不劝和、只给操作方案：别人在圆场，她直接给三步——减少联络、情感切割、钱照给","把指责落到具体言行上：不说「她不好」，而是逐条对照节目细节（称不知女儿住址、被引导才勉强夸一句、旧家书写满训诫）","用亲身经历压场：自曝年轻时被母亲逼去当舞女还债、养父下跪求她答应，以「我走出来了」证明切割可行","提前堵住反驳：主动驳回「第一次当父母」这个挡箭牌——「生养孩子是父母自己的选择，就得负责，区别只在于有没有真心」","点名而非暗示：不写小作文、不含沙射影，直接指名道姓，并说明「换作是我，管你是不是录节目，我当场就跟你干起来」"],"story":[{"t":"2026年10月13日晚","d":"在社交平台发布视频，公开点名批评张家齐母亲肖英杰，称其在综艺中表现的关心「全是演的」「谎话连篇」"},{"t":"视频中","d":"列三点控诉：以「不知道女儿住址」推卸责任、长期否定打压女儿、拿走女儿全部收入"},{"t":"视频中","d":"给出建议：张家齐可以考虑断亲、不再联络，「钱可以照给」"},{"t":"视频中","d":"自述早年经历——被母亲逼去当舞女还债，养父下跪求她答应，一度崩溃产生轻生念头；离家独居后人生才转向光明"},{"t":"2026年10月14日","d":"相关话题冲上热搜，舆论两极：一派称「教科书级边界感」，一派质疑「外人凭什么管别人家事」「向太自己儿子不成才有什么资格」"}],"quotes":["张家齐真的修养蛮好的。要是我，管你是不是录节目，我就跟你干起来。","我觉得张家齐可以考虑断亲，不要和妈妈联络，钱可以照给。","你以为你是抱怨女儿不孝顺，其实你暴露了你根本不关心你的女儿。","很多人拿『第一次当父母』当挡箭牌，这话别信——区别只在于你有没有真心去关爱孩子。"],"writingUse":"写「敢下判断的人」。她的语言体系里没有灰色地带，任何复杂关系都能被她一句话切成可执行的选项。适合写成小说里的「锋利的旁观者」：主角身边需要一个把话说死的人，她不解决问题，只负责让主角没法再假装看不见。写她时别写她的道理，写她的语气——她不是在讨论，是在下裁决。同时要留一道疤：她的武断全都来自自己的经历，那是她所有结论的起点。","sources":[{"publisher":"腾讯新闻","title":"向太说张家齐妈妈谎话连篇：「建议张家齐不要和妈妈联络，钱可以照给」","url":"https://news.qq.com/rain/a/20261014A03ET000"},{"publisher":"新浪娱乐","title":"向太怒斥张家齐妈妈谎话连篇，建议断亲引爆热议","url":"https://ent.sina.cn/2026-10-14/detail-inivcxxt8536001.d.html"},{"publisher":"搜狐娱乐","title":"向太直接点名张家齐妈妈，说她谎话连篇","url":"https://yule.sohu.com/a/1087501579_123013385"}]},{"id":"wang-chu-ran","name":"王楚然","alias":"王楚然","identity":"演员 · 从78万条恶评到「天使笨蛋」的口碑翻盘样本","category":"娱乐圈","date":"2026-10-14","heat":82,"headline":"接替金晨全网质疑，首播带动节目热度暴涨！王楚然笨蛋美人太圈粉","summary":"2023年因角色争议被骂到恶评超78万条，她一直不解释、不发长文。2026年5月发律师声明、公示17项证据立案，并公布625／600度近视加干眼症，解释「翻白眼」是摘镜聚焦的自然反应。10月上综艺狼人杀全投错，她接住「天使笨蛋」标签翻盘。","traits":["被骂不硬刚","用可验证的事实代替辩解","接住负面标签","把自己摊开","延迟满足"],"methods":["被骂最凶时不解释：78万条恶评、表情包、外号一概不回应，先让情绪自己过去","把争议翻译成客观事实：不辩解态度，只公布近视625度／600度加干眼症，把「翻白眼」从道德指控变成生理现象","用法律处理谣言、不用情绪处理谣言：发律师声明、公示17项证据对造谣账号立案，其余一概不吵","主动接住对方递来的负面标签：沈腾喊「翻白眼教科书来了」，她当场对着镜头连翻几个白眼","该认的当场认：狼人杀一票没投对、被叫「笨蛋美人」，不解释、不打圆场，让标签就这么留着"],"story":[{"t":"2023年","d":"因电视剧《我的人间烟火》中的角色争议被大规模吐槽，批评从角色投射到本人，社交平台恶评超过78万条"},{"t":"2023—2025年","d":"不辩解、不退圈、不发长文，被叫「请假惯犯」也不回应；同期靠《柳舟记》（豆瓣开分7.9）《成何体统》等作品慢慢把口碑垫回来"},{"t":"2026年5月","d":"发律师声明，公示17项证据对恶意造谣账号提起诉讼并立案；同时公布双眼近视625度、600度加干眼症，解释「翻白眼」实为摘镜后努力聚焦的自然反应"},{"t":"2026年7月","d":"官宣接替金晨成为《现在就出发4》唯一女常驻，被全网唱衰「偶像包袱重、融入不了熟人局」，她不作回应"},{"t":"2026年10月","d":"节目开播，狼人杀抽到好人牌却先咬胡先煦、又换白敬亭、最后投错，一票没投对，被节目组封为「哑光时刻」；被投出局时她说「我是小心谨慎，不是鬼鬼祟祟」"},{"t":"2026年10月","d":"面对沈腾「翻白眼教科书」的调侃当场接梗，做饭翻车、平地落水的「0米台跳水」等名场面出圈，站内热度破27000刷新该平台综艺最快纪录，口碑逆转"}],"quotes":["我是小心谨慎，不是鬼鬼祟祟。","认识前是哑巴，认识后是喇叭。","（网友评价）观众要的不是完美，是能看懂的活人。"],"writingUse":"写「用三年时间翻身」的路径范本。她的方法论特别干净：不该说的不说；该拿证据的地方只拿证据；对方递过来的刀，接住当梗用。适合写成被舆论碾压后缓慢回血的角色——不靠一次爆红翻盘，靠一笔一笔把账算清。写她时把「解释」全部删掉，只保留动作：律师函、近视度数、当场翻的那个白眼、投错的那一票。她的核心台词是「不解释」。","sources":[{"publisher":"新浪娱乐","title":"王楚然的综艺表现如何帮她扭转口碑？","url":"https://ent.sina.cn/2026-10-14/detail-inivcxxr7838595.d.html"},{"publisher":"新浪娱乐","title":"王楚然自己在采访中如何看待综艺里的反差表现？","url":"https://ent.sina.cn/2026-10-14/detail-iniveefr8510461.d.html"},{"publisher":"今日头条","title":"接替金晨全网质疑，首播带动节目热度暴涨！王楚然笨蛋美人太圈粉","url":"https://www.toutiao.com/article/7695355177506800171/"}]},{"id":"luo-wan-yu","name":"罗婉瑜","alias":"神农集团天价离婚当事人","identity":"云南最大养猪企业神农集团实控人何祖训前妻 · 23.83亿股权分割当事人","category":"情感战场","date":"2026-10-14","heat":83,"headline":"23.83亿元！A股再现「天价离婚」","summary":"2026年9月她向法院起诉要求解除婚姻关系并分割财产，法院主持下达成调解：何祖训所持神农集团2.61亿股的30%（7830.5万股、市值约23.83亿元）归她单独所有，30日内过户；同时两人签一致行动协议，她要把提案权与表决权交回何祖训。","traits":["程序化","只争份额不争权","零噪音","把离婚做成一次资本手术","清楚自己要什么"],"methods":["不开舆论战、只走司法程序：全程没有爆料、没有小作文，直接起诉解除婚姻关系并分割财产","一次性把事做完：诉状只提两项——解除婚姻、分割财产，不追加、不拉扯，在法院主持下达成调解结案","只要股权不要经营权：拿到30%股份对应的全部权益，同时签一致行动协议，把提案权、表决权交回前夫，未经同意不提出任何提案","用协议锁住自己那份资产的价值：一致行动安排在她持股且何祖训仍为实控人期间持续生效——公司控制权稳，她手上那23.83亿才不会缩水","把对方的履约能力写进条款：协议列明六项终止条件，其中一条就是「何祖训未按调解书履行任一义务」"],"story":[{"t":"2026年9月23日","d":"神农集团公告，罗婉瑜起诉何祖训、要求解除婚姻关系并进行财产分割的离婚纠纷案，已由昆明市官渡区人民法院立案"},{"t":"2026年10月12日盘后","d":"神农集团披露进展公告：双方在法院主持下达成调解，何祖训所持2.61亿股中的30%（7830.5万股）及对应全部权益归罗婉瑜单独所有，需于收到调解书之日起30日内完成过户"},{"t":"按10月12日收盘价30.43元/股计","d":"分割股份对应市值约23.83亿元；何祖训仍持约1.827亿股，神农集团实际控制人未发生变化"},{"t":"同期","d":"双方签署《一致行动协议》：罗婉瑜在董事会、股东会行使提案权、表决权时与何祖训保持一致，未经同意不提出任何提案"},{"t":"公告同日","d":"神农集团上半年营收24.89亿元、同比降11.02%，归母净利润亏损8.09亿元；公司称本次诉讼仅涉及股东个人权益，对生产经营无重大影响"}],"quotes":["（调解书）何祖训持有的云南神农农业产业集团股份有限公司261016651股股票，其中30%即78304995股股票及对应的全部权益归罗婉瑜单独所有。","（一致行动协议）如未经何祖训同意，罗婉瑜不向公司董事会、股东会提出任何提案或临时提案。","（财经媒体）A股再现天价离婚。"],"writingUse":"写「最体面的一次分手」。她提供了另一种复仇模板：不撕、不哭、不曝光，把二十年的婚姻当成一个资产包——走程序、要份额、签协议、走人。适合写成那种在谈判桌上比丈夫更冷静的女性角色：她的狠不在嗓门，在她签字时的顺序。也适合当家族企业线的关键配角，她一个人决定了公司控制权会不会散，而她只要钱、不要权。写她时注意别写成圣人，她要的是最优解，不是公道。","sources":[{"publisher":"澎湃新闻","title":"23.83亿元！A股再现「天价离婚」","url":"https://www.thepaper.cn/newsDetail_forward_34242874"},{"publisher":"南方+","title":"A股再现天价离婚，女方分走近24亿","url":"https://www.nfnews.com/content/J3WYZk80oz.html"},{"publisher":"澎湃新闻（今日头条）","title":"神农集团61岁实控人离婚，女方分得市值近24亿元股票","url":"https://www.toutiao.com/article/7696099019428217387"}]},{"id":"gaotie-mianti-nv","name":"高铁免提女乘客","alias":"开免提打1小时电话的女子","identity":"2026年10月12日G735次列车免提通话纠纷当事人，未公开姓名","category":"社会切片","date":"2026-10-14","heat":80,"headline":"官方通报女子高铁开免提电话1小时 公共空间引发争议","summary":"10月12日，G735次列车上，一名女乘客开免提与男友通话约一小时。前排乘客提醒后双方口角，她反问「我打电话和你有什么关系」；对方回「这里是公共空间，不是你家客厅」。视频14日冲上热搜第一，12306回应称乘务员只能劝阻。","traits":["边界感缺失","把公共空间当自家客厅","用反问压制规劝","拿「没规定不许」当理由","全程不失态"],"methods":["用反问替代解释：「我打电话和你有什么关系」——不回应问题本身，先把提醒的人变成越界者","把规则的空白当成许可：强调打电话不违法、非静音车厢没有禁令，用「没规定不许」覆盖「影响到别人」这个事实","用时长摊牌：一小时的通话本身就是态度，不解释也不收敛，等对方先失控","情绪始终平稳：不辱骂、不提嗓门到失控，让对方的愤怒成为这场争吵的全部证据","等外部介入才收手：列车工作人员到场调解后才挂断电话，此后未再发生"],"story":[{"t":"2026年10月12日13时许","d":"北京南开往上海虹桥的G735次列车从济南西站发车后，10号车厢一名女性旅客开手机免提与男友通话，时长约一小时"},{"t":"同车厢","d":"前排女乘客起身提醒，双方发生争吵；她说「我打电话和你有什么关系」，对方回「这里是公共空间，不是你家客厅」"},{"t":"列车巡视时","d":"工作人员发现两名女性旅客争吵并进行处置调解；经提醒劝阻，开免提的旅客挂掉电话，后续未再发生类似情况（铁路部门通报）"},{"t":"2026年10月14日","d":"相关视频登上热搜第一；12306客服回应称，非静音车厢没有禁止打电话、开免提的硬性规定，旅客可联系工作人员劝阻，或劝导其到车厢连接处通话，并称乘务员没有执法权"},{"t":"2026年10月14日","d":"前排女乘客（疑似当事人）发文称视频只录了一半，自己先说的是「你可不可以不要再开着免提打电话了，已经一个小时了」，全程没有辱骂对方"}],"quotes":["我打电话和你有什么关系？","（前排乘客）这里是公共空间，不是你家客厅。你要打免提电话，你就去没有人的地方打。","（12306客服）我们没有执法权，没有权限让她不打这个电话。","（前排乘客）视频只录了一半……我全程没有辱骂她一句。"],"writingUse":"标准的「公共空间无边界者」。她不骂人、不犯法、不失控，只把「关我什么事」四个字摆在桌上——最难写的对手就是这种，主角所有的道理都无处着力。适合写成旅途偶遇、隔壁工位、同住的亲戚：冲突不来自恶意，而来自两个人对「什么是公共」根本没有共同定义。也适合当群像戏的开关：一个人越界，一车厢的人各自决定要不要出声。","sources":[{"publisher":"新浪新闻","title":"「女子高铁上和男友开免提打1小时电话」热搜第一，12306客服：可联系列车工作人员劝阻，或劝导乘客到车厢连接处通话","url":"https://news.sina.cn/2026-10-14/detail-inivcxxn0493283.d.html"},{"publisher":"网易（铁路部门通报）","title":"铁路部门通报「女子高铁上和男友开免提打1小时电话」：经提醒劝阻，旅客挂掉电话","url":"https://m.163.com/dy/article/L96Q8RTD0530WJIN.html"},{"publisher":"网易","title":"「这里不是你家客厅！」女子高铁上开免提打1小时电话，前排女乘客忍无可忍出声制止","url":"https://www.163.com/dy/article/L96MHSMM05149AAQ.html"},{"publisher":"中华网","title":"官方通报女子高铁开免提电话1小时 公共空间引发争议","url":"https://new
