s.china.com/socialgd/10000169/20261014/49793568.html"}]},{"id":"foshan-jubaoren","name":"佛山12345举报人","alias":"送1.9元汽水的老病患","identity":"佛山复星禅诚医院老病患，送药房职员一罐1.9元汽水后举报其违规收礼","category":"社会切片","date":"2026-10-14","heat":74,"headline":"患者送一罐1.9元汽水后举报药房工作人员收礼？佛山卫健部门回应","summary":"一名长期在佛山复星禅诚医院复诊的老病患，主动给药房一名梁姓工作人员送了一罐1.9元的健力宝汽水，随后通过12345举报其违规收礼。卫健局回复称工作人员未主动索取、属盛情难却接收，已对其严厉批评；律师称此举属「诱导式投诉」。","traits":["规则武器化","钓鱼式维权","目的先于是非","以合规之名行追责之实","全程不露面"],"methods":["亲手制造违规事实：先把「礼」送到对方手里，让被举报的行为由自己启动","不对话、只走程序：不跟对方当面交涉，直接通过12345工单把私人摩擦升级为行政事项","让第三方下结论：自己不评价，等机构给出「违规收礼」的认定，用文书代替吵架","把目的藏在流程里：赠送在前、举报在后，中途没有请托、没有利益交换，举报只为追责","不留一句自辩：整件事在舆论场只留下一张工单截图，她本人没有说话"],"story":[{"t":"此前","d":"该患者多次到佛山复星禅诚医院复诊，是医院的老病患"},{"t":"某次复诊","d":"主动向医院药房一名梁姓工作人员赠送一罐价值1.9元的健力宝蜂蜜口味汽水"},{"t":"随后","d":"通过12345市民热线举报该工作人员违规收礼"},{"t":"2026年10月13日","d":"禅城区卫生健康局向媒体确认举报与回复内容属实；工单回复称该工作人员未主动开口索取、主观认为系老病患感谢而盛情难却接收，医院无权强制退还，但已对该行为严厉批评，并多次组织全院学习《医疗机构工作人员廉洁从业九项准则》"},{"t":"2026年10月13日","d":"澎湃新闻等媒体跟进报道；河南泽槿律师事务所律师付建认为这属于诱导式投诉，举报人主动送出财物、刻意制造违规场景再发起举报，是滥用公共投诉资源"}],"quotes":["（12345工单回复）该名工作人员未主动开口索取上述物品（健力宝蜂蜜口味汽水），主观认为这是老病患对于医务人员的感谢，因盛情难却而接收。","（律师付建）举报人主动送出财物，刻意制造违规场景，再发起举报，这是滥用公共投诉资源。","（网友）有人建议以后10块钱以下的东西不应构成投诉，否则会严重破坏医患关系。"],"writingUse":"「合规刺客」——不亲手打人，只把规则递到对方手上，等对方自己伸手去接。适合写成那种在职场、小区、家族里永远占理的角色：她从不违规，她只是让别人违规。也适合当群像里的「制度漏洞测试者」，她的每一次举报都在追问同一个问题——规则到底是保护人的，还是给人当刀使的。","sources":[{"publisher":"澎湃新闻","title":"佛山一医生收患者1.9元汽水遭举报，律师：无利益交换且价值极低，不应追责","url":"https://www.thepaper.cn/newsDetail_forward_34243289"},{"publisher":"网易（现代快报）","title":"患者送一罐1.9元汽水后举报药房工作人员收礼？佛山卫健部门回应","url":"https://www.163.com/dy/article/L951FM0C053469KC.html"},{"publisher":"中华网","title":"患者送1.9元汽水后举报工作人员收礼 诱导式投诉引争议","url":"https://news.china.com/socialgd/10000169/20261013/49792479.html"},{"publisher":"搜狐","title":"患者送1.9元汽水后举报医院药房工作人员违规收礼，广东佛山12345回复工单显示：医院已对医生严厉批评","url":"https://www.sohu.com/a/1087276889_114890"}]},{"id":"tian-keyu","name":"田柯宇","alias":"「字节投毒实习生」","identity":"前字节跳动实习生，被指干扰大模型训练遭辞退；后以NeurIPS最佳论文得主身份创业","category":"社会切片","date":"2026-10-14","heat":90,"headline":"对话田柯宇：我发誓我说的都是真的","summary":"2024年，字节跳动称一名实习生恶意干扰团队模型训练任务，将其辞退并起诉索赔800万元，他被叫作「投毒实习生」。2026年10月12日，他首次在播客中详细回应，称「这不是投毒，也不涉及攻防」。","traits":["技术型偏执","拒绝被命名","攒够筹码再开口","用作品反击","细节控"],"methods":["对定义开战：拒绝「投毒」这个词，把整件事还原成一个技术动作，而不是一个道德故事","沉默两年、攒够筹码再一次性开口：等到论文、公司、播客都到位之后才回应","逐条否认具体指控：对「抢夺集群资源」「持续两月恶意攻击」等说法点名否认，不为模糊的整体指控辩白","把争议转成作品：在被全网定性的那两年里完成研究，拿下顶会最佳论文","用新的公开记录覆盖旧标签：创业上热搜、播客上热搜，让「最佳论文作者」「创业者」替换掉「投毒实习生」"],"story":[{"t":"2024年（争议爆发）","d":"字节跳动回应称，涉事实习生恶意干扰商业化技术团队研究项目的模型训练任务，已被辞退并提起诉讼、索赔800万元"},{"t":"争议期间","d":"网传「涉及8000多张GPU、损失上千万美元」等说法；他的offer被取消；随后他以VAR视觉自回归相关工作拿下NeurIPS最佳论文"},{"t":"法院判决（据媒体报道）","d":"判令其赔偿50万元并没收其全部工资；字节跳动方面亦澄清部分网传损失说法不实"},{"t":"2026年10月12日","d":"播客《elsewhere 别处发生》发布对谈，他首次详细回应事件起因、经过与网传争议细节，表示「首先，这不是一个投毒，也不涉及攻防」"},{"t":"2026年10月12日之后","d":"回应内容再度冲上热搜，讨论量过十万；他已入局世界模型方向创业，据媒体报道项目估值约2亿美元"}],"quotes":["首先，这不是一个投毒，也不涉及攻防。","（播客节目标题，对谈中他自称）我发誓我说的都是真的。"],"writingUse":"「被集体定了罪的技术主角」。最耐写的不是他有没有罪，而是他在被命名之后怎么活：不喊冤、不煽情，只一条条拆技术细节。适合写成那种把争论拖进自己擅长语言里的角色——对方谈道德，他谈日志；对方要表态，他要复现。也适合当「反转结构」的支点：先让全世界用一个词概括他，再让读者跟着这个词一点点错下去。","sources":[{"publisher":"腾讯新闻（elsewhere 别处发生）","title":"田柯宇回应被指向字节大模型投毒（2026年10月12日播客节目）","url":"https://news.qq.com/rain/a/20261013V09MWS00"},{"publisher":"哔哩哔哩 · elsewhere 别处发生","title":"对话田柯宇：我发誓我说的都是真的","url":"https://www.bilibili.com/video/BV1R9pf6SEVh/"}]},{"id":"fanxi-kafei","name":"梵夕咖啡店经营者","alias":"「一人一座一消费」咖啡店","identity":"青岛黄岛区鱼鸣嘴梵夕咖啡店店主，因「一人一座一消费」拒绝夫妻二人共同落座","category":"商界狠人","date":"2026-10-14","heat":66,"headline":"夫妻点一杯58元咖啡仅允许一人落座","summary":"国庆客流高峰，李先生与妻子在青岛鱼鸣嘴一家咖啡店点一杯58元咖啡，被告知「一人一座一消费」，两人只能一人落座；二人未消费离开，到店外二三十米的长凳坐下后，店员又上前称该处属消费区。店家称已撤下标识，律师指其属变相最低消费。","traits":["规则至上","消费边界前移","以「提前告知」换合规","先执行后退让","客流中心主义"],"methods":["把经营规则写成入场条件：店门口公示「一人一座一消费」，用一纸提示换取执行时的正当性","把消费边界推到店外：夫妻走到店门口二三十米外的长凳坐下，店员仍上前告知该区域属于消费区、不能免费落座","用「提前告知不违规」自辩：认为只要事先写明，就不构成强制消费","被质疑后立刻撤：收到反馈先把标识撤下，再慢慢拟新提示，把一场热搜处理成一张纸的事","留一道弹性口子：对外称是为防止游客不消费霸占座位，高峰期才严格管，特殊人群可以通融"],"story":[{"t":"国庆假期客流高峰","d":"李先生与妻子途经青岛市黄岛区鱼鸣嘴梵夕咖啡店，进店后选了一杯58元的香草籽咖啡准备付款"},{"t":"点单时","d":"店员告知需遵从「一人一座一消费」，两人只点一杯只能一人落座；夫妻二人最终未在该店消费"},{"t":"随后","d":"两人走到店门口二三十米外的一条长凳上坐下，商家工作人员随即上前告知该区域属于消费区、不能免费落座，二三分钟后二人离开"},{"t":"2026年10月12日","d":"李先生发帖吐槽，经视直播等媒体跟进报道，话题冲上热搜"},{"t":"2026年10月13日","d":"店家回应称该提示张贴时间不长，收到反馈后已主动撤下标识，此前设置提示是认为提前告知不违规，目前门店正在拟定新的提示内容；市场监管部门表示「一人一座一消费」合理与否不能一刀切判定"}],"quotes":["（店家回应）此前设置提示，认为提前告知不违规，目前门店正在拟定新的提示内容。","（市场监管部门）「一人一座一消费」合理与否不能一刀切判定。","（律师）把座位和人头消费绑死，这是变相最低消费，属于霸王条款。"],"writingUse":"「小生意里的规则暴君」。他不是恶人，他只是在为一张桌子算账——可当规则被他推到店门外二三十米的那条长凳上，规则就变成了权力。适合写成景区、小城、家族商铺里的老板角色：主角不是跟他吵架，而是忽然发现，任何地方都没有一个「不消费也能坐」的位置。","sources":[{"publisher":"腾讯新闻（经视直播）","title":"夫妻点一杯58元咖啡只能一人落座，商家回应「一人一座一消费」争议：规则已撤，后续将优化；市监部门回应","url":"https://news.qq.com/rain/a/20261012A098Q800"},{"publisher":"新浪财经（中国新闻周刊）","title":"夫妻点一杯58元咖啡仅允许一人落座","url":"https://finance.sina.com.cn/jjxw/2026-10-12/doc-iniuytnv5190513.shtml"}]},{"id":"zheng-jianping","name":"郑建坪","alias":"郑钦文的虎爸","identity":"网球运动员郑钦文之父，前湖北省二级田径运动员，自费铺出女儿的职业生涯","category":"原生家庭","date":"2026-10-14","heat":88,"headline":"郑钦文父亲为何在她夺冠后泼冷水？","summary":"2026年10月11日，郑钦文首夺中网女单冠军，父母现场见证，合影时父亲双手把奖杯举过头顶、比女儿举得还高。据报道，庆祝时郑建坪已开始跟女儿谈明年的目标，女儿回「能不能先让我享受一下目前夺冠的这个时候」。","traits":["目标导向型控制","长期主义","情感让位于成绩","不动声色的极端投入","严父"],"methods":["用下一个目标覆盖当下的成就：夺冠现场不庆祝、不夸奖，直接谈「明年要怎么样」","押上全部身家做长期投入：走体制外路线、变卖房产、放弃稳定工作，自负教练团队与海外比赛的巨额开销","用下跪换资源：为求师上门多次被拒后，据媒体报道带着妻子女儿一起跪在教练面前","在赛场上做情绪纠偏：女儿比分落后且消极比赛时，他从看台冲到场地边当众发火——据媒体报道当场动了手，理由是怕她把信心输没了，事后他独自回到看台哭了","对媒体把成绩归给女儿：接受采访时说「我们从来没有给钦文定过目标，我们希望她为自己想要的目标而努力，而不是被父母的压力驱动」"],"story":[{"t":"2002年","d":"郑钦文出生；父亲郑建坪是前湖北省二级田径运动员，退役后在十堰经营汽配等生意"},{"t":"6—8岁","d":"郑钦文开始打网球；郑建坪先后为她求师李娜启蒙教练夏溪瑶、省队教练余丽桥——据媒体报道，为让余丽桥收下女儿，他曾带着妻子和女儿一起跪在教练面前"},{"t":"职业化之后","d":"放弃体制内培养路径、改走自负担的体制外路线，教练团队、机票食宿全部自己承担，欧洲比赛费用据报每年至少300万元起；据媒体报道，最困难时他卖掉了房子，一家人长期两地分居"},{"t":"某次全国比赛","d":"郑钦文比分落后、状态消极，郑建坪从看台冲到场地边当众发火，据媒体报道当场动手；据其自述理由，是怕女儿就此把信心输没了，事后他独自回到看台哭了"},{"t":"2024年8月","d":"郑钦文在巴黎奥运会夺得网球女单金牌；郑建坪接受长江网采访时称，「愿为国家再打3个小时」是发自肺腑的话"},{"t":"2026年10月11日","d":"郑钦文直落两盘击败安德烈耶娃，首夺中国网球公开赛女单冠军，成为赛事举办20届以来首位本土女单冠军；父母现场见证，合影时父亲双手把奖杯举过头顶，比女儿举得还高"},{"t":"2026年10月13—14日","d":"夺冠后的家庭互动被大量报道，「父亲在夺冠庆祝时就规划明年」「时不时泼一下冷水」引发关于「中国式父亲」的讨论"}],"quotes":["（2024年，长江网）愿为国家再打3个小时。","（2024年，新华社）我们从来没有给钦文定过目标，我们希望她为自己想要的目标而努力，而不是被父母的压力驱动。","（据媒体报道，全国比赛现场）如果水平不如对手，用尽全力还是输了，那是英雄；如果消极比赛，那是对网球、对观众、对自己不负责任。"],"writingUse":"「成绩型父亲」——和「张家齐妈妈」正好是一对镜子：一个是软刀子，一个是硬目标。他不索取、不示弱、不表演，只把下一座山指给你看，然后用全部身家押上去。适合写成主角最敬畏也最不敢辜负的人：他不打感情牌，他打的是「我为你卖过房」这张永远还不清的牌。可写的情节是主角夺冠之后第一次想停下来，却发现父亲的日历上没有空格。","sources":[{"publisher":"新华社","title":"追光 | 十年前那个小姑娘，如何成为郑钦文","url":"http://www.news.cn/20240127/88a5e3c23337497689cf2a83af725d0c/c.html"},{"publisher":"长江网","title":"郑钦文父亲：「愿为国家再打3个小时」发自肺腑","url":"http://news.cjn.cn/whpd/yw_19947/202408/t4961177.htm"},{"publisher":"凤凰网（新华社记者独家采访）","title":"比赛结果从来不是故事的全部——2026中网女单决赛，郑钦文首夺中网冠军","url":"https://feng.ifeng.com/c/8xAbTcIigoL"},{"publisher":"网易","title":"郑钦文的赛后采访，笑死我了！她在线吐槽自己的爸爸（含一家三口跪求教练、卖房等过往）","url":"https://www.163.com/dy/article/L94KSS8705560OKZ.html"},{"publisher":"新浪新闻","title":"郑钦文父亲为何在她夺冠后泼冷水？","url":"https://k.sina.com.cn/article_7879776469_1d5abd8d506801hifm.html"}],"novel":{"want":"把女儿推上世界第一，用下一个目标覆盖当下的成就。","fear":"女儿浪费天赋、消极比赛、半途而废。","contradiction":"对媒体说「从来没有给钦文定过目标」，实际把全部身家押上、夺冠现场谈明年；最硬的父亲，事后独自哭。","pressureChoice":"放弃体制内路径、卖房、自费；据媒体报道，为求师带全家下跪；女儿消极比赛时当众发火。","scene":"中网夺冠合影，父亲双手把奖杯举过头顶，比女儿举得还高；庆祝时已经开始谈明年，女儿说「能不能先让我享受一下」。","relations":"女儿郑钦文：他推上山顶的人；教练：他下跪求过的人；媒体：他对外说「没定目标」的对象。","confidence":"A"}},{"id":"xiao-huijun","name":"刘某慧","alias":"小慧君","identity":"变装/二次元网红 · 因虚构性骚扰指控被判败诉，账号封禁后改名复出","category":"娱乐圈","date":"2026-10-16","heat":91,"headline":"当年哭着说被性骚扰，如今却复出收徒教网红，小慧君打了谁的脸？","summary":"2020年，1300万粉网红发视频哭诉被公司老板性骚扰，对方公司被网暴到解散。两年后聊天记录曝光：这是为低成本解约编排的剧本。法院判赔近66万、全网道歉半年，她一字未道；账号封禁后改名转小红书，粉丝回到250万，置顶是「如何教人做网红」。","traits":["表演型指控","把清白当武器","剧本化操作","零成本退出","判决到手也不认账"],"methods":["用眼泪代替举证：不发文字、直接对着镜头哭，只说「没有哪个女孩会拿自己的清白开玩笑」，把情绪本身做成第一手证据","拉同伙做交叉印证：同公司另一对网红夫妇同步发声指控公司，制造「多人指证」的舆论幻觉","在私域里排练公共表达：微信群「血战赤度」里逐条商量话术，明确叮嘱「文案得够惨，最好把抑郁症也写上」","目标不是讨公道而是压价：整场控诉的真实目的是不付违约金就走人，把名誉当筹码换解约成本","判决生效后不执行不道歉：法院要求公开道歉赔偿，她一条没做；千万粉账号被封后改名换平台，粉丝重新攒到250万，置顶内容教人如何做网红"],"story":[{"t":"2020年","d":"在抖音靠妆前妆后反差极大的变装视频走红，粉丝一度超过1300万；同年发视频哭诉被签约公司老板孙灏羽长期性骚扰，称对方暗示她脱衣服、逼她签霸王合同"},{"t":"2020年","d":"同公司网红夫妇「老婆爱吃巧乐兹」同步发声力挺；舆论一边倒，孙灏羽遭网暴，公司声誉崩塌、旗下主播集体解约"},{"t":"反转","d":"孙灏羽晒出微信群「血战赤度」聊天记录：群内她与姚某杰盘算如何把解约代价压到最低，并叮嘱「文案得够惨，最好把抑郁症也写上」"},{"t":"2022年6月","d":"法院认定其指控的性骚扰系虚构，判决公开道歉并赔偿5万元；她未履行"},{"t":"2025年4月","d":"孙灏羽宣布最终维权结果：平台封禁其抖音、快手两个千万粉账号，法院判赔近66万元、全网公开道歉半年；因账号已被封禁无法执行，最终改为登报"},{"t":"2026年10月","d":"被发现已改换名字在小红书复出，粉丝超250万，置顶视频为「如何教人做网红」，话题再度冲上热搜"}],"quotes":["没有哪个女孩会拿自己的清白开玩笑。（其控诉原话，后被法院认定指控虚构）","（群聊记录）文案得够惨，最好把抑郁症也写上。","（网友评论）第一步老板骚扰自己，第二步没有人拿清白开玩笑，第三步我有抑郁症。"],"writingUse":"写「用受害叙事做杠杆的人」。她的可怕不在于谎言本身，而在于她精准地知道社会愿意相信什么——眼泪、清白、抑郁，每一样都是免检通道。适合写成那种让读者先替她愤怒、再替自己羞辱的角色。也适合当舆论战戏的开场：不用写她多坏，只写她哭的那条视频和群里那句「文案得够惨」，两相对照，人物就立住了。写法上注意——她不是疯子，她只是把成本算得比谁都清楚。","sources":[{"publisher":"搜狐娱乐","title":"哭着说被性骚扰，笑着教人做网红，她的新号粉丝破了二百五十万","url":"https://yule.sohu.com/a/1088280762_120546681"},{"publisher":"搜狐娱乐","title":"当年哭着说被性骚扰，如今却复出收徒教网红，小慧君打了谁的脸？","url":"https://yule.sohu.com/a/1087741732_122660469"},{"publisher":"腾讯新闻","title":"女Coser因造谣老板骚扰自己，称没有人拿清白开玩笑被封禁后，再次活跃互联网引热议","url":"https://new.qq.com/rain/a/20261014A0E79C00"}]},{"id":"wuxi-zhu-nvshi","name":"朱女士","alias":"无锡「婚外胚胎案」原配","identity":"无锡女子 · 确诊肺癌后发现丈夫与他人伪造结婚证做辅助生殖，坚持「要道歉不要钱」","category":"情感战场","date":"2026-10-16","heat":88,"headline":"无锡「婚外胚胎案」再起冲突：男方被指三次上门拉电闸堵摄像头，原配只要一句道歉","summary":"2019年确诊肺癌，2025年发现丈夫与第三者伪造结婚证，在上海做辅助生殖、培育出婚外冷冻胚胎。她要求销毁胚胎，起诉丈夫、第三者与医院，并申请刑事立案监督。男方多次上门催她「开个价」协商了结，她的回答始终是：不谈钱，先让第三者道歉。","traits":["拒绝对价","只要是非不问价格","程序化反击","硬到底","不接受私了"],"methods":["对「私了价」当场回绝：男方反复说「你开个价，我们协商了结」，她每次都顶回去——不谈钱，先让第三者道歉","把家务事升级为法律事项：起诉丈夫、第三者与医院，案由含人格权纠纷，并申请刑事立案监督、递交重婚与伪造证件相关材料（男方与第三者因伪造证件被行政拘留5日）","拆解对方的骚扰动作并留证：男方9月三次上门，出现拉断电闸、封堵门铃摄像头；她判断这是诉讼博弈里的取证／反取证动作，主动把细节对外讲清","用「只销毁不移植」划边界：要求销毁胚胎，医院封存、未擅自移植，把伦理问题锁死在制度里而不是情绪里","不靠舆论要同情、只靠事实立对错：面对水军洗白与三个月网暴，她的公开表达始终只有一句——钱能算清财产损失，算不清她生病时丈夫在外面造另一个家"],"story":[{"t":"约20年前","d":"与丈夫登记结婚，婚后育有一子"},{"t":"2019年","d":"确诊肺癌"},{"t":"2025年","d":"发现丈夫与第三者伪造结婚证，在上海一家医院做辅助生殖、培育出婚外冷冻胚胎；她要求销毁胚胎，医院封存、未擅自移植"},{"t":"2025年","d":"男方与第三者因伪造证件被行政拘留5日；她起诉丈夫、第三者与医院，案由含人格权纠纷；男方另在无锡起诉离婚"},{"t":"2026年9月","d":"男方三次上门，其间出现拉断电闸、封堵门铃摄像头等行为，话术和去年一样：你开个价"},{"t":"2026年10月14日","d":"她再次对外发声：我不谈钱，你让第三者跟我道歉；同时披露三个月来持续遭遇网暴，被造谣「出轨在先」"},{"t":"2026年10月16日","d":"媒体跟进报道；其诉丈夫重婚被告知不予立案、诉第三者返还财产等待开庭、人格权纠纷案已开庭尚未宣判"}],"quotes":["他一直让我开价，可我想要的是道歉。","我不谈钱，你让第三者跟我道歉。","对于原配而言，内心最想要的往往是一份公道和一个道歉，不管是男方还是第三者。"],"writingUse":"写「拒绝被标价的人」。她提供的是一种极难写的强硬：不摔东西、不骂街、不哭给镜头看，只把对方递过来的那张支票一次次推回去。适合写成那种在离婚／谈判戏里让对手完全失算的角色——对方所有的筹码都是钱，而她从一开始就没打算要钱。可写的戏是：男方第三次上门拉电闸，她在黑暗里坐着，想的不是害怕，是这次终于能留下证据。","sources":[{"publisher":"网易（青科新闻）","title":"无锡「婚外胚胎案」再起冲突：男方被指三次上门拉电闸堵摄像头，原配只要一句道歉","url":"https://www.163.com/dy/article/L99LLSI20550MD9M.html"},{"publisher":"中华网","title":"婚外胚胎案女方称被网暴3个月 核心诉求仅求道歉","url":"https://news.china.com/socialgd/10000169/20261016/49797164.html"},{"publisher":"网易","title":"婚外胚胎案朱女士讲述最新进展","url":"https://www.163.com/dy/article/L99BF7LE05568W0A.html"}]},{"id":"liu-hangsi-gaoguan","name":"刘某","alias":"原航空公司高管 · 重婚案被告人","identity":"曾任多家航空公司高管 · 与情人育有三子被判重婚罪，二审前提《自白》翻案","category":"情感战场","date":"2026-10-16","heat":84,"headline":"原航司高管与情人育有三子被判重婚罪，男方称妻子长期出轨，独子非亲生，案件将二审","summary":"2026年7月，上海青浦法院一审认定他与情人胡某以夫妻名义共同生活并育有三子，双方各判有期徒刑一年。他不服上诉，提交《自白》《公开开庭申请》与专家论证意见，称婚姻早已名存实亡、妻子婚后长期出轨且独子非亲生，还称案发别墅是妻子主动为情人租的。","traits":["反手叙事","认一半保一半","材料战","抢先定义舆论","不认罪"],"methods":["承认最容易承认的那一半：先把「我出轨了，我认」摆出来，用无法否认的事实为后一半说法背书","把对方从受害者改写成加害者：主张妻子婚后长期出轨、独子非亲生，自己是「为了留下骨肉」才发生婚外情","把关键物证重新解释：称案发别墅是妻子主动出钱为情人租的，借此否掉一审「以夫妻名义共同生活」的事实婚姻认定","用正式文书替代情绪：不靠采访哭诉，提交《自白》《公开开庭申请》、专家论证意见书及相关附件，并申请二审公开开庭","抢先给舆论定框架：直言「全社会都在讲男人的义务、责任，一讲女性的义务就被认为是男权」，指对方在塑造「被迫害的原配」形象"],"story":[{"t":"婚姻期间","d":"与妻子孟某结婚并育有一子；他称妻子自婚后第二年起长期出轨，独子并非自己亲生"},{"t":"案发前","d":"与胡某长期交往并生育三名子女；一审认定二人在上海青浦一处别墅内以夫妻名义共同生活"},{"t":"2026年7月21日","d":"上海市青浦区人民法院一审认定其与胡某犯重婚罪，分别判处有期徒刑一年；判决结合微信聊天记录、保姆及物业人员证言、子女学校登记资料、预防接种记录及经济往来等证据"},{"t":"上诉后","d":"向上海市第二中级人民法院申请公开开庭审理；主张2013年至2020年胡某另住谢卫路，2020年8月后才搬入涉案别墅，他同期长期在外地工作，仅偶尔探望子女，不构成持续稳定同居"},{"t":"2026年10月14日","d":"封面新闻等媒体从知情人处获得其《自白》《公开开庭申请》与专家论证意见书；妻子孟某回应「谎言充斥网络，官方已经制止了，二审判决会有答案」"},{"t":"截至发稿","d":"二审尚未公布开庭时间"}],"quotes":["我出轨了，我认，但是我从来没有公开和胡女士的关系，我不认为这是一件光彩的事。","现在好像全社会都在讲男人的义务、责任，一讲女性的义务，就被认为是「男权」等等。","（妻子孟某回应）谎言充斥网络，官方已经制止了，二审判决会有答案。"],"writingUse":"写「自己写判决书的人」。他最值得写的地方不是他出没出轨，而是他出了问题之后的处理方式：认下最便宜的那一半，把剩下的一整套说法装订成文件递上去。适合写成那种在家族审判、公司清算里永远不吵架的角色——他不解释，他举证；他不喊冤，他要求公开开庭。写他时别给他一场爆发戏，给他一间书房和一沓编号完整的附件。","sources":[{"publisher":"封面新闻","title":"航司前高管与情人养3名子女被判重婚，丈夫回应：妻子长期出轨，租别墅同住系被下套","url":"https://www.thecover.cn/news/CCymlggw65qH90qSdq8Jkw=="},{"publisher":"今日头条（西安晚报）","title":"原航司高管与情人育有三子被判重婚罪，男方称妻子长期出轨，独子非亲生，案件将二审","url":"https://www.toutiao.com/article/7696877152838418959"}]},{"id":"songdao-huikong","name":"松岛辉空","alias":"松岛辉空","identity":"日本乒乓球选手 · 2026年WTT中国大满贯男单冠军，闪光灯争议中被网暴的一方","category":"社会切片","date":"2026-10-16","heat":80,"headline":"中国大满贯最离谱争议：冠军点强行叫停，反转后才发现，所有人都骂错了人","summary":"WTT中国大满贯决胜局，他在对手抛球发球的瞬间大喊、指向看台，吃到黄牌。对方团队公开质疑他使用「盘外战术」，一夜之间他从新科冠军变成全网口诛笔伐的对象。三天后现场视频公布：看台前后三次亮起闪光灯，制造干扰的是对方两名小队员。","traits":["全程不辩","忍到临界点才动手","把事交回规则","由家人代打","被围观者"],"methods":["全场一个字不回：质疑、外号、表情包一概不理，不发声明、不接受采访反击，让比赛结果自己站住","先忍两次、第三次才出手：决胜局10:7闪光灯第一次亮起时他没有任何示意；10:8第二次亮起，他只起身向裁判提醒；直到10:9对手抛球发球的瞬间第三次亮起，他才叫停比赛","让母亲去做自己不擅长的事：他继续沉默，母亲公开晒出现场原始视频，要求赛事方解决赛场闪光灯干扰问题","不做追加追责：真相反转后没有反过来要求对方经纪人道歉，也没有发起反击，把处理权交回赛事方与规则"],"story":[{"t":"2026年10月","d":"WTT中国大满贯男单决赛，他与林昀儒打到决胜局；10:7、10:8、10:9 三个节点看台先后三次亮起闪光灯"},{"t":"冠军点","d":"对手抛球准备发球的瞬间第三次闪光灯亮起，他突然大喊并向看台示意、强行叫停比赛，吃到黄牌"},{"t":"赛后","d":"对方经纪人公开发声，怀疑这是对手的盘外战术；舆论一边倒，他被指「靠盘外招偷冠军」「胜之不武」，遭遇大规模网暴"},{"t":"2026年10月14日","d":"现场实拍视频公开——违规使用闪光灯的是两名随队观赛的青少年队员；对方队伍发布正式公开致歉声明并安排两名少年接受心理疏导，「闪光灯事件真相大白」冲上热搜第一"},{"t":"反转后","d":"此前带节奏的经纪人始终保持沉默、未作任何道歉，引发新一轮质疑"}],"quotes":["（邓亚萍点评）他非常善于钻研规则，敢于在最高级别的赛事里用规则允许的方式争取优势，是非常难缠的对手。","（对方队伍致歉声明）两名小队员观赛时一时疏忽开启了闪光灯，向松岛辉空、林昀儒以及所有受波及的工作人员诚恳致歉。","（网友）一次误触尚可原谅，接二连三闪出灯光，这个解释实在很难完全说服人。"],"writingUse":"写「沉默的被审判者」。他的处境是很多主角的处境：什么都没做错，但所有解释都会被读成心虚。适合写成那种在舆论场上完全没有还手能力的角色——他不擅长说话，他擅长等，等一个能证明自己的画面出现。写他时把台词删干净，只留三个动作：10:8 起身提醒裁判、10:9 喊停、以及赛后什么都没说。","sources":[{"publisher":"搜狐娱乐","title":"中国大满贯最离谱争议：冠军点强行叫停，反转后才发现，所有人都骂错了人","url":"https://yule.sohu.com/a/1087727053_121935301"},{"publisher":"今日头条（体坛1号站）","title":"热搜第一！松岛辉空闪光灯事件真相大白，林昀儒经纪人仍未道歉","url":"https://www.toutiao.com/article/7696436821181399567"}]},{"id":"gelesi-bang","name":"格蕾丝·邦（Gracie Bon）","alias":"巴拿马「巨臀网红」","identity":"巴拿马网红 · 千万粉丝，家乡 7.7 级地震后在废墟前拍摄个人写真引爆众怒","category":"社会切片","date":"2026-10-16","heat":85,"headline":"千万粉丝女网红在地震废墟前摆拍，挨骂后反问：你帮了什么？","summary":"巴拿马 7.7 级地震后，坐拥近 1200 万粉丝的她发了一组站在废墟上的摆拍照，配文写「物质可以恢复，生命无价」。评论区一边倒骂她「把废墟当摄影棚」。她没有删帖、没有道歉，先解释「有本人出镜才有曝光度，才能推动募捐」，再发视频反问批评者到底帮过什么。","traits":["把流量当工具","拒绝道歉","反向质问","自我正当化","边捐物资边挨骂"],"methods":["视觉与文案故意错位：照片是站在断墙碎砖上双手高举、跪在破损房屋前侧身远眺，配文却是「物质可以恢复，但生命无价」「向需要帮助的人伸出援手」——用道德文案给争议照片上保险","被骂后不删帖不道歉，改去解释动机：公开说明很多媒体只说「巴拿马没事」，没展示灾区惨状；自己出镜是为了让内容获得更高曝光，从而推动募捐","把批评者推上被告席：反问「你们为巴拿马做了什么」——不接「消费悲剧」的指控，转而去审查对方的行动记录","补一层委屈叙事：发视频称大家不谈失去家园的家庭、只盯着她一张照片，「有些人只会敲键盘骂人，却回答不了你到底帮了什么忙」","先做实事再发表情：事发前已拍视频展示采购大量瓶装水和大米、亲自送进灾区分发、公布接受捐赠地址——但这些内容的传播量远不如那张废墟照"],"story":[{"t":"2026年10月9日","d":"巴拿马中部埃雷拉省附近发生 7.7 级地震，此后余震不断；近 900 户住宅受损、至少 27 人受伤，政府宣布进入国家紧急状态"},{"t":"震后","d":"她拍视频展示自己采购大量瓶装水、大米等物资，亲自送到灾区分发给受灾家庭，并公布接受捐赠的地址"},{"t":"2026年10月11日","d":"在社交平台发出多张灾区照片：穿蓝色牛仔裤和白色露脐衬衫，站在一堆残骸上双手高举，或跪在破损房屋前侧身看向远方"},{"t":"同日","d":"评论区一边倒指责她「在别人的灾难里摆拍」「把废墟当摄影棚」「为了流量消费悲剧」"},{"t":"2026年10月13日","d":"打破沉默回应：出镜是为了获得更高曝光推动募捐，反问批评者「你们为巴拿马做了什么」；随后再发视频强调自己没有从这些帖子里赚钱"},{"t":"2026年10月14日","d":"腾讯新闻、网易等媒体跟进讨论「网红经济与灾难伦理的老冲突」"}],"quotes":["这是地震后我的国家的现实。物质可以恢复，但生命无价。活在当下，感恩拥有的，向需要帮助的人伸出援手。","如果只有废墟照片，传播效果远不如我本人出镜。我不是在拍写真，是在告诉大家：你们看，巴拿马现在是这样的。","大家不谈失去家园的家庭，却只盯着我的一张照片。有些人只会敲键盘骂人，却回答不了「你到底帮了什么忙」这个问题。"],"writingUse":"写「把善意和自恋焊死在一起的人」。她的可怕不在于坏，而在于她真心觉得自己在做好事，并且能把每一句批评都翻译成对她审查资格的质疑。「灾场 + 摆拍姿势 + 道德文案」这三件套就是她完整的人格。适合写成一个让人没法干脆讨厌的角色——你越愤怒，她越有名；你撤回愤怒，她的物资确实送到了。可写的戏是：她把物资发完，转身对助理说，刚才那张再拍一遍，光不对。","sources":[{"publisher":"腾讯新闻","title":"千万粉丝女网红在地震废墟前摆拍，挨骂后反问：你帮了什么？","url":"https://news.qq.com/rain/a/20261014A02YJM00"},{"publisher":"网易（译言）","title":"29岁「巨臀网红」巴拿马地震废墟中摆拍，引发众怒，打破沉默回应","url":"https://www.163.com/dy/article/L96JLIVC0541A1O8.html"}]},{"id":"muduoke","name":"鲁伯特·默多克","alias":"传媒大亨默多克","identity":"新闻集团与福克斯创始人 · 94 岁签字交出传媒帝国控制权","category":"商界狠人","date":"2026-10-16","heat":88,"headline":"默多克94岁签字交出控制权，三个年长子女各拿11亿美元离场，邓文迪的女儿们零票权却进了新信托","summary":"2024 年他想把两家公司的全部投票权集中给长子拉克兰，被内华达州法院驳回，三名年长子女出庭指他判断力不如从前。2025 年 9 月，新控股实体 LGC Holdco 落地：三个年长子女交出旧信托受益人资格、放弃全部投票权、不再插手公司事务，每人换约 11 亿美元现金。","traits":["不跟规则硬碰","用钱解决制度","趁活着办完","花钱买确定性","不赌第二次"],"methods":["先把「钱」和「权」拆成两本账：遗嘱管钱怎么分，信托管权归谁——他要处理的不是遗嘱，是信托，「钱可以平分，权不能」","法律路被堵死就立刻换战场：2024 年试图修改旧信托把投票权集中给拉克兰，遭内华达州法院驳回后不再上诉纠缠，转而在旧信托之外重建一个新控股实体","直接出价买断而不是说服：2025 年 9 月新控股实体 LGC Holdco 落地，持有福克斯 36%、新闻集团 33% 的 B 类投票股，投票权全部由拉克兰一人行使；三名年长子女签长期协议，交出受益人资格、放弃投票权，每人换约 11 亿美元现金——33 亿买断三张反对票","把交易设计成不可逆：协议买的不只是某一次表决，而是永久退出；并且趁自己还在时签字，避免去世后文件被挑战","用分红权安置不站队的人：邓文迪所生的格蕾丝、克洛伊没有投票权，却被写进新信托受益人名单，拿到千亿资产的分红资格"],"story":[{"t":"长期","d":"新闻集团与福克斯的核心股份装在一套立了几十年的家族信托里，六个子女都是受益人，谁都不能单独持股，投票权由受托人集体行使——票按人头算"},{"t":"2024年","d":"他试图修改旧信托，把两家公司全部投票权集中给长子拉克兰；普鲁登斯、伊丽莎白、詹姆斯出庭反对，指父亲判断力不如从前；内华达州法院驳回，法官用「精心设计的骗局」形容修改方案的操作方式"},{"t":"2025年9月","d":"新控股实体 LGC Holdco 落地，持有福克斯 36% 的 B 类投票股、新闻集团 33% 的 B 类投票股，投票控制权全部由拉克兰一人行使"},{"t":"2025年9月","d":"三名年长子女签署长期协议：交出旧信托受益人资格、放弃全部投票权、不再插手公司事务，每人换约 11 亿美元现金"},{"t":"2025年9月","d":"新信托受益人名单只剩下拉克兰与邓文迪所生的格蕾丝、克洛伊；两个女儿没有投票权，但有分红资格"},{"t":"2026年10月15日","d":"中文媒体重新梳理这场交接的细节，「33 亿买断三张反对票」「手里有票的被买走，几乎没露面的反而留下」成为讨论焦点"}],"quotes":["（媒体梳理其逻辑）遗嘱管钱怎么分，信托管权归谁。钱可以平分，权不能。","（媒体梳理）这笔钱买的不只是一次表决，是永久退出。趁人还在时签字，比去世后让文件被挑战更稳。","（内华达州法官评其 2024 年修改信托方案）精心设计的骗局。"],"writingUse":"写「用钱改写规则的老国王」。他最狠的不是权术，是止损速度：一条路被法院堵死，他不打第二场官司，直接开一张 33 亿美元的支票把对手买断。适合写成家族／公司权力戏里的终极庄家——不出面吵架、不动感情、只让律师把文件摆到桌上。可写的戏是他对长子说的那句话：我不会留给你一个需要投票的家族。","sources":[{"publisher":"腾讯新闻","title":"默多克94岁签字交出控制权，三个年长子女各拿11亿美元离场，邓文迪的女儿们零票权却进了新信托","url":"https://news.qq.com/rain/a/20261015A0E5UE00"},{"publisher":"搜狐娱乐","title":"睡完首富睡总统，从厂妹到顶级名媛，靠男人捞到268亿，她凭啥","url":"https://yule.sohu.com/a/1087398715_122542989"}],"novel":{"want":"在死之前把权力交接安排完，让帝国不因继承而乱；把「权」集中给长子拉克兰。","fear":"死后文件被挑战、家族内战、失去控制。","contradiction":"用钱买断「反对票」，却把没有投票权的两个小女儿放进受益人名单；最像「不讲感情」的人，最后用分红安置了不站队的人。","pressureChoice":"法院驳回修改信托后，不再上诉，直接建新实体、花33亿美元买断三个年长子女的投票权。","scene":"94岁，律师把文件摆到桌上，他签字；三个年长子女各拿11亿美元离场；两个小女儿零票权，但有分红。","relations":"拉克兰：他选中的继承人；三个年长子女：被他买断的人；邓文迪的两个女儿：没有票权、但有分红的受益人。","confidence":"B"}},{"id":"huang-zitao","name":"黄子韬","alias":"徐艺洋的丈夫 · 原「内娱活人」","identity":"艺人 · 靠「真性情、直率敢言」路人缘起家，因长期反复否认婚育传闻口碑翻车","category":"娱乐圈","date":"2026-10-16","heat":76,"headline":"媒体评：黄子韬徐艺洋口碑翻车 从「真性情」到「可信度归零」","summary":"黄子韬与徐艺洋的恋情、婚讯、怀孕传闻长期由本人及团队出面否认。2026 年 10 月 15 日，徐艺洋发文「落日漫过海面，爱的人都在身边」，配一张一家三口海边合照。次日相关话题登上热搜，媒体评论称其从「真性情」走到「可信度归零」。","traits":["反复辟谣","拖到藏不住才认","用真性情人设给否认做担保","不解释时间线","人设反噬"],"methods":["一律先否认：恋情、婚讯、怀孕消息多次传出，本人及团队反复出面辟谣，把「没有」当成默认答案","拿「真诚」给否认做担保：靠「内娱活人」「直率敢言」的形象积累路人缘，让每一次否认看起来像坦率而不是遮掩","收尾不开发布会，改发生活流内容：不做正式声明、不交代时间线，由徐艺洋发一条「落日漫过海面，爱的人都在身边~」配一家三口海边合照，把事实一次性交出去","热搜起来后仍然不解释：评论区「什么时候生的孩子」「之前被拍到为何一概否认」刷屏，本人与团队没有给出前后一致的说法","旧账被一并翻出：直播里的情绪化发言、公开聊妻子生理期等片段被重新审视，进一步加速口碑下滑"],"story":[{"t":"此前","d":"黄子韬与徐艺洋的恋情、婚讯、怀孕消息多次传出，本人及团队反复辟谣，前后言论形成强烈反差"},{"t":"2026年10月15日","d":"徐艺洋发文「落日漫过海面，爱的人都在身边~」，晒出一家三口海边合照"},{"t":"2026年10月16日","d":"「黄子韬下沉口碑」「黄子韬夫妇否认怀孕被指消耗信任」等相关词条登上热搜"},{"t":"同日","d":"新浪财经、网易等转载媒体评论：隐私权和「否认事实」是两码事。选择低调，公众顶多好奇；选择否认，公众就会觉得被欺骗"},{"t":"同日","d":"评论区出现「两口子的信誉分都扫不了一辆共享单车」「没懂，正常生的小孩为啥一直要否认」等刷屏留言"}],"quotes":["（徐艺洋发文）落日漫过海面，爱的人都在身边~","（媒体评论）艺人有隐私权，可以不主动公开婚育消息，这一点应该被尊重。但隐私权和「否认事实」是两码事。","（媒体评论）当公众需要一个明确的说法，涉事艺人或者经纪团队依旧全盘否认，其实就是表现出一种不自信、不诚恳的态度，严重消耗粉丝乃至公众的信任感。"],"writingUse":"写「把否认当习惯的人」。他不是撒谎成性，而是每一次都本能地选了最省事的那个答案，直到事实大到藏不住。适合写成感情线里那个永远让对手戏演员抓不住的男配——他不骗你，他只是永远比事实慢一步。可写的戏：合照发出去的那天晚上，他一个人把过去两年的辟谣微博一条条翻过去，然后没有删。","sources":[{"publisher":"新浪财经（猛犸新闻）","title":"媒体评：黄子韬徐艺洋口碑翻车 从「真性情」到「可信度归零」","url":"https://finance.sina.com.cn/jjxw/2026-10-16/doc-inivkwtm7796177.shtml"},{"publisher":"网易（滚动播报）","title":"媒体评：黄子韬徐艺洋口碑翻车 从「真性情」到「可信度归零」","url":"https://www.163.com/dy/article/L9C8291005568W0A.html"}]},{"id":"wu-liang","name":"武亮","alias":"张雪峰接班人 · 峰学蔚来总经理","identity":"峰学蔚来总经理 · 张雪峰离世后接棒运营，被指转移公司财产、争夺股权","category":"商界狠人","date":"2026-10-16","heat":76,"headline":"张雪峰离世后，武亮接手峰学蔚来被质疑转移公司财产、争夺股权，本人回应","summary":"张雪峰离世后武亮接手峰学蔚来，网上传出他转移公司财产、争夺股权，有人直接骂他「无法无天」。企查查显示其名下关联 11 家企业、9 家在业存续。2026 年 10 月 13 日他首次公开回应，不谈任何财产数字，只说首要任务是让公司活下去。","traits":["绕过指控换议题","感情牌加危机牌","把时间当筹码","以身体状态承担叙事","被托孤的外姓人"],"methods":["不接财产数字，直接换议题：面对「转移公司财产、争夺股权」的质疑，他一句都不逐条驳，只说现在最重要的目标是尽全力让峰学蔚来活下去","把个人清白问题改写成公司生死问题：强调今年是「峰哥第一年不在」，志愿填报一旦出问题，对峰学蔚来将是毁灭性打击","用感情牌给交权留一个不可辩驳的档期：「等张雪峰女儿长大后，我做什么都可以」——把「什么时候还权」推到一个孩子成年这个时间点上","用身体状态承担叙事：顶着斑秃出镜，说接手后压力大到掉头发，并说明接棒人选由张雪峰家属与董事会成员共同商定","把责任说到不属于自己：「当承担了很大责任时，你就不属于自己了」"],"story":[{"t":"2026年前","d":"长期跟随张雪峰，为峰学蔚来核心管理层；峰学蔚来面向 2026 届考生的「梦想卡」「圆梦卡」售价 12999 元、18999 元，相关付费咨询名额在多省市显示售罄"},{"t":"2026年3月","d":"张雪峰离世，武亮接棒运营公司"},{"t":"2026年7月","d":"工商变更：张雪峰退出后母亲刘巧丽担任法定代表人；女儿张姩菡与刘巧丽各持股 37.5%，张家合计握有 75% 绝对控制权；其妻李丽婧出面澄清遗产进入家族信托，由其代行监护权利"},{"t":"2026年10月上旬","d":"网上出现「武亮转移公司财产、争夺股权」的传言，有人直接骂他「无法无天」；企查查显示其名下关联 11 家企业、9 家在业存续，担任董事、总经理、监事等职务"},{"t":"2026年10月13日","d":"在《一天零一页 2026》节目预告片中首次公开回应，称首要任务是保障公司正常运营、让公司活下去"},{"t":"2026年10月15日","d":"媒体跟进梳理「管理公司和拥有公司是两本不同的账」，指公开报道未提供转移财产、非法侵占股权的证据"}],"quotes":["今年峰哥第一年不在，如果志愿填报出现问题，对峰学蔚来将是毁灭性的打击。","当承担了很大责任时，你就不属于自己了。","等张雪峰女儿长大后，我做什么都可以。"],"writingUse":"写「替人守业的外姓人」。他所有回答都在证明同一件事：现在不是清算我的时候。适合写成那种被托孤的管家／总经理角色——他是真的在拼命，也确实握着不该属于他的权力，而且他自己清楚这一点。可写的戏是他在办公室墙上贴了一张孩子成年的时间表，谁都不许动；有人问那之后呢，他说那之后我走。","sources":[{"publisher":"川观新闻","title":"张雪峰离世后，武亮接手峰学蔚来被质疑转移公司财产、争夺股权，本人回应","url":"https://cbgc.scol.com.cn/news/8055982"},{"publisher":"ZAKER","title":"武亮就接手峰学蔚来遭转移财产、争股权质疑首度公开回应：首要任务保障公司存续","url":"https://app.myzaker.com/news/article.php?pk=6acf6b838e9f096a630a4240"},{"publisher":"搜狐娱乐","title":"张雪峰走后半年峰学蔚来风波不断，武亮挨骂背后藏着怎样的危局","url":"https://yule.sohu.com/a/1087816653_122223784"}]},{"id":"chen-xianglu","name":"陈祥禄","alias":"「撞脸陈小春」的车间工人","identity":"福建宁德工厂工人 · 因长相酷似陈小春走红，被全网编造身世","category":"社会切片","date":"2026-10-16","heat":72,"headline":"「撞脸」陈小春当事人直播澄清身世：没有被抱养的经历，身上也没有网传的胎记","summary":"头戴红色安全帽、操作激光切割设备的福建工人因五官神态酷似陈小春走红。网友顺着陈小春早年「幼弟被送养」的自述，编出梅花胎记、幼时抱养、失散近五十年的弟弟等传言。10 月 15 日他与拍摄者合开一场直播，把谣言逐条否掉：没有胎记、没被抱养、家里还有两个哥哥一个姐姐。","traits":["只澄清一次","不接流量","用细节自证","朴素淡定","继续原生活"],"methods":["只开一场直播，一次说清：直面全网传言逐条否掉——不是陈小春的弟弟、身上没有网传的梅花胎记、也没有被公司辞退","用最日常的事实去反驳最离奇的故事：自述家中排行第四、上面还有两个哥哥和一个姐姐、从小在原生家庭长大、目前未婚","把「红」当成一件被安排的差事：直播里话不多、言语朴实，直言自己没有炒作的想法","不靠热度变现：直播收益由拍摄者全数转给他，他本人后续只计划拍户外日常短视频，社交账号基本不怎么玩","继续原来的生活：直播后仍在工厂务工，日薪 200 元左右；随后发文呼吁网友不要再传播不实传言","不追责推他下水的人：对同事、对拍摄者都没有提出任何要求，把处理权交给时间"],"story":[{"t":"2026年10月初","d":"一名入职仅一个月的新员工在福建宁德某工厂随手拍下头戴红色安全帽、操作激光切割设备的陈师傅，因五官神态酷似陈小春，视频意外走红"},{"t":"走红后","d":"网友结合陈小春早年公开自述「年少时家境贫寒、亲生弟弟被送养」，加上两人同姓陈、五十多岁、广东口音、耳垂同一位置有窝痕等巧合，编出「失散弟弟」「梅花胎记」「幼时被抱养」等传言，话题冲上热搜"},{"t":"2026年10月15日上午","d":"陈祥禄与视频拍摄者一同开直播正面回应，逐条澄清身世传言"},{"t":"2026年10月15日13时许","d":"在个人社交平台发布图文澄清：并非陈小春的弟弟、身上没有梅花胎记、也没有被公司辞退，呼吁网友不要再传播不实传言"},{"t":"同日","d":"拍摄者透露自己已从公司主动离职，「公司想让我删掉视频，给的压力太大了」；并表示本场直播收益全部交给陈师傅"},{"t":"后续","d":"社交平台出现多个疑似仿冒陈祥禄的账号，IP 地址与其所在地不符"}],"quotes":["（直播中）自己没有炒作的想法。","（拍摄者）当初只是觉得陈师傅长相酷似陈小春，随手拍下视频，没想到意外走红网络。","（拍摄者）公司想让我删掉视频，给的压力太大了。"],"writingUse":"写「被命运选中却拒收的人」。他没做错任何事，只是长了一张撞脸的脸，然后所有人都在替他写完整个人生。适合写成群像戏里突然被推到中心、却始终站在边缘的角色——全家人都在替他激动，他在算今天还能不能上夜班。可写的戏是直播结束那一刻，他把手机还给别人，只问：明天几点开工。","sources":[{"publisher":"网易订阅（河北新闻网）","title":"福建工厂车间工人撞脸陈小春走红，当事人陈祥禄发文澄清：不是陈小春弟弟，未被辞退，今后将不定期直播","url":"https://dy.163.com/article/L99USGCO05568W0A.html"},{"publisher":"今日头条","title":"「撞脸」陈小春当事人直播澄清身世：没有被抱养的经历，身上也没有网传的胎记","url":"https://www.toutiao.com/article/7696786999383654922/"},{"publisher":"新浪财经（荔枝视频）","title":"撞脸陈小春大哥直播回应争议 拍摄者：直播收益都会给大哥","url":"https://finance.sina.com.cn/jjxw/2026-10-15/doc-inivhyan4570458.shtml"}]},{"id":"wu-jianxiong","name":"吴健雄","alias":"物理学第一夫人","identity":"实验物理学家 · 宇称不守恒实验的完成者 · 美国物理学会首位女会长","category":"顶级人类","date":"2026-10-17","heat":95,"headline":"穿旗袍造原子弹？这个苏州姑娘，真牛！","summary":"1956年李政道、杨振宁提出弱相互作用下宇称可能不守恒，多数人当笑话听。吴健雄取消休假，带队在接近绝对零度下极化钴-60，1957年1月用实验证实电子出射方向与核自旋相反。同年10月诺贝尔奖只给了两位理论提出者。她一生没有公开抱怨，只在给另一位诺奖得主的贺信里写下那句「当我的工作因为某些原因而被人忽视，依然是深深地伤害了我」。","traits":["沉默","精确到偏执","不解释","把话写在数据里","以礼服人"],"methods":["把休假退掉：1956年圣诞前已订好去日内瓦的行程，听说这个实验方向后当场取消，把团队拉回哥伦比亚大学的低温实验室","用八个月排掉所有干扰项：把钴-60冷却到接近绝对零度，用强磁场让原子核自旋统一朝向，再数电子从哪个方向飞出来","不接受「差不多」：她的β衰变实验以精度著称，同行拿到她的数据默认不需要复核","被追问诺奖只回一句「我从来没有为了得奖去做研究工作」，然后立刻把话题转回实验","把受伤写在别人的贺信里，不写在公开信里——最重的一句话，放在最轻的场合"],"story":[{"t":"1912","d":"生于江苏太仓浏河镇，父亲办明德学校，坚持让女儿读书"},{"t":"1936","d":"只身赴美，入伯克利加州大学，师从劳伦斯、塞格瑞、奥本海默"},{"t":"1944","d":"以外籍身份参与曼哈顿计划，负责其中的核心测量工作"},{"t":"1956.12","d":"取消休假，带队做钴-60极化实验，月底拿到第一次结果：不对称非常明显"},{"t":"1957.1","d":"实验结果公布，宇称不守恒被证实；同年10月诺奖只授予李政道、杨振宁"},{"t":"1975","d":"当选美国物理学会历史上第一位女性会长，同年获美国国家科学勋章"},{"t":"1990","d":"紫金山天文台将第2752号小行星命名为「吴健雄星」"},{"t":"1997","d":"在纽约病逝，遗愿归葬故乡浏河"}],"quotes":["我的一生，全然投身于弱相互作用方面的研究，也乐在其中，我从来没有为了得奖而去做研究工作。","但是，当我的工作因为某些原因而被人忽视，依然是深深地伤害了我。"],"writingUse":"写「不被承认的功臣」最容易写错的地方，是让她愤怒、让她控诉。吴健雄不是。她把所有愤怒都换算成了精度：不吵，只让数据精确到没人能反驳。适合当主角的前辈、导师，或者那种全篇一句控诉都没有、读者却替她憋了一肚子气的角色。她的沉默不是软弱，是拒绝把评价权交出去。","sources":[{"publisher":"科普中国","title":"1997年2月16日 物理学家吴健雄逝世","url":"https://kepuchina.cn/kpcs/lcb/lcb5/201608/t20160810_14271.shtml"},{"publisher":"人民日报客户端","title":"穿旗袍造原子弹？这个苏州姑娘，真牛！","url":"https://www.peopleapp.com/rmharticle/30012739533"}],"novel":{"want":"把实验做到无可反驳；让工作被看见、被承认。","fear":"工作被忽视、被抹掉。","contradiction":"一生不公开抱怨，却把最重的受伤写在别人的贺信里；拒绝把评价权交出去，却在意评价。","pressureChoice":"1956年圣诞前取消去日内瓦的休假，把团队拉回低温实验室；诺奖只给理论提出者后，不公开争，继续做实验。","scene":"接近绝对零度，强磁场让钴-60原子核自旋统一朝向，数电子从哪个方向飞出来。","relations":"李政道、杨振宁：用她的实验拿诺奖的人；她的团队：陪她取消休假的人。","confidence":"A"}},{"id":"rosalind-franklin","name":"罗莎琳德·富兰克林","alias":"51号照片的拍摄者","identity":"物理化学家、晶体学家 · DNA 双螺旋结构的关键数据提供者","category":"顶级人类","date":"2026-10-17","heat":94,"headline":"剑桥的科学女杰：在不受认可的时代，她们技压群雄","summary":"1952年5月，富兰克林在伦敦国王学院拍下B型DNA的X射线衍射图，即后来被称为「有史以来最美的一张X射线图像」的51号照片。1953年1月，威尔金斯在她不知情的情况下把照片交给沃森，沃森与克里克随即重启几乎停摆的双螺旋模型。1962年诺贝尔奖颁给沃森、克里克、威尔金斯；她已于1958年因卵巢癌去世，年仅37岁，诺奖不追授。","traits":["手上有真东西","不结盟","拒绝被安排","把争议留给数据"],"methods":["把样品做到别人做不到的纯度：控制湿度、把DNA纤维拉直，一帧衍射图要曝光几十小时","用定量测量否掉权威模型：沃森和克里克的第一版三螺旋模型，被她用测量数据当场推翻，卡文迪许实验室一度被导师勒令停手","被排除在讨论之外就自己写：1953年4月《自然》同期发表三篇论文，她用数据支持双螺旋，没有去争作者顺序","换战场不换标准：被调离DNA项目后转去研究烟草花叶病毒，五年内做出病毒结构的关键成果","不回应人身攻击：沃森在《双螺旋》里把她写成不肯打扮、心机很重的「黑暗女士」，她没有公开反驳，只继续发论文"],"story":[{"t":"1920","d":"生于伦敦一个犹太裔银行家家庭，15岁就决定要当科学家"},{"t":"1951","d":"进入伦敦国王学院，接手DNA的X射线衍射研究，与威尔金斯就谁负责项目产生误会"},{"t":"1952.5","d":"拍下B型DNA的51号照片，并算出螺旋的关键参数"},{"t":"1953.1","d":"威尔金斯在富兰克林不知情的情况下把照片给沃森看"},{"t":"1953.4","d":"《自然》同期刊出沃森-克里克、威尔金斯团队、富兰克林-戈斯林三篇论文"},{"t":"1958.4","d":"因卵巢癌去世，年仅37岁；四年后诺奖颁出，不追授逝者"},{"t":"1968","d":"沃森出版《双螺旋》，书中的她被塑造成古怪、难相处的女人，引发长期争议"}],"quotes":["科学与日常生活不能、也不应该被分开。（1940年致父亲的信）","她所做的每一件工作都极端透彻与完美。——贝尔纳为她写的悼文"],"writingUse":"写「被偷走署名」，最容易踩的坑是把她写成委屈的人。富兰克林不委屈——她手上有一张谁都否认不了的照片，她要的是把测量做对。真正有杀伤力的写法：让她从头到尾不参与那场关于署名的争吵，只在论文的脚注里留一句；读者看到那里才会疼。她适合写成那种「不加入任何派系、因此被所有人绕过」的角色。","sources":[{"publisher":"科普中国","title":"剑桥的科学女杰：在不受认可的时代，她们技压群雄","url":"https://www.kepuchina.cn/article/articleinfo?business_type=100&ar_id=455921"},{"publisher":"中国新闻网","title":"DNA结构揭秘：跨学科探索擦出的火花","url":"https://www.chinanews.com.cn/cj/2022/10-28/9881635.shtml"}]},{"id":"lise-meitner","name":"莉泽·迈特纳","alias":"被诺奖漏掉的核裂变之母","identity":"物理学家 · 核裂变的理论解释者 · 德国第一位物理学女教授","category":"顶级人类","date":"2026-10-17","heat":93,"headline":"莉泽·迈特纳：核分裂的发现者与科学界的巾帼英雄","summary":"1938年，因犹太身份流亡瑞典的迈特纳与侄子弗里施在雪地里用纸笔算出：哈恩实验里「消失的质量」变成了能量，原子核确实裂开了。她给这种现象命名为核裂变。哈恩1939年1月发表结果时没有署她的名字，1944年独得诺贝尔化学奖。她三次被提名、三次落空；1966年才与哈恩、斯特拉斯曼共享费米奖。109号元素以她命名。","traits":["只认推导","不肯将就","拒绝为战争工作","不索要","把晚年交给学生"],"methods":["把难题带出实验室：在瑞典孔艾夫村的雪地里用纸笔演算，用液滴模型算出裂变释放的能量与质量亏损正好对得上","先给现象命名，再等世界跟上：与弗里施把这种分裂命名为 fission，两个月内在《自然》发文","拒绝为炸弹工作：美国邀她加入曼哈顿计划，她回绝——「我不想和炸弹扯上任何关系」","被漏掉也不改写事实：她继续在斯德哥尔摩做实验，从不公开指控哈恩剽窃，也从不否认两人三十年的合作","把晚年交给女学生：退休后到处讲课、鼓励女性进实验室，直到89岁在剑桥去世"],"story":[{"t":"1878","d":"生于维也纳，1906年成为维也纳大学第二批物理学女博士之一"},{"t":"1907","d":"到柏林，与化学家哈恩开始长达三十年的合作；因是女性，最初只能走侧门进实验室"},{"t":"1926","d":"成为德国第一位物理学女教授"},{"t":"1938","d":"因犹太身份被剥夺教职，流亡瑞典斯德哥尔摩"},{"t":"1938冬","d":"与侄子弗里施在雪地演算，提出「核裂变」，两个月后论文发表于《自然》"},{"t":"1939.1","d":"哈恩与斯特拉斯曼发表实验结果，作者名单里没有迈特纳，战后也未更正"},{"t":"1944","d":"哈恩独得诺贝尔化学奖；迈特纳三次被提名，三次落空"},{"t":"1966","d":"与哈恩、斯特拉斯曼共同获得费米奖"},{"t":"1997","d":"第109号元素被命名为鿏（Meitnerium）"}],"quotes":["我爱物理，我很难想象我的生活中没有物理会怎样。","我不想和炸弹扯上任何关系。"],"writingUse":"迈特纳适合写成「系统里的异类」：她的能力被需要，她的名字被回避。写她不要写控诉，写她一次次把正确的推导交出去让别人署名；写她在雪地里算出答案那一刻的兴奋——那个兴奋和后来的诺奖完全没有关系。这种角色的悲剧性在于，她连恨都不肯给出去。","sources":[{"publisher":"科普中国","title":"莉泽·迈特纳：核分裂的发现者与科学界的巾帼英雄","url":"https://m.kepuchina.cn/tuwendetail?id=633114"},{"publisher":"人民日报客户端","title":"美貌与智慧并存的「科学女神」：她们的力量不容忽视","url":"https://www.peopleapp.com/rmharticle/30020341852"},{"publisher":"《现代物理知识》","title":"物理学史中的二月：迈特纳与核裂变的发现","url":"http://mp.ihep.ac.cn/cn/article/pdf/preview/12302.pdf"}]},{"id":"jocelyn-bell","name":"乔瑟琳·贝尔·伯内尔","alias":"发现脉冲星的研究生","identity":"天体物理学家 · 脉冲星发现者 · 2018年基础物理学特别突破奖得主","category":"顶级人类","date":"2026-10-17","heat":92,"headline":"在荣获300万美元巨额科学奖金后，她做了一件事","summary":"1967年，24岁的博士研究生贝尔在剑桥检查射电望远镜每天30米长的纸带时，发现每1.337秒一次的规律脉冲。导师休伊什认为只是干扰，她坚持复核并加密观测，最终确认这是旋转的中子星——脉冲星。1974年诺贝尔物理学奖只给休伊什与赖尔。2018年她获基础物理学特别突破奖，把300万美元奖金全部捐出，设立基金资助物理学界的弱势群体博士生。","traits":["认数据不认权威","不放手","把补偿转手给下一个人","用玩笑扛住不确定"],"methods":["人工筛纸带：每天30米长的记录纸摊开来逐段看，靠眼睛从噪声里挑出那百分之一不规则的信号","当面顶回去：导师说「那只是干扰」，她答「我知道那不是干扰」，随后要求加密观测同一片天区","给未知起外号减压：团队把信号叫作「小绿人1号」，用玩笑撑过最没底的那几周","凌晨三点先去修机器：为了赶在信号出现的时段观测，她半夜到天文台，先修好出故障的设备再等","把奖金变成别人的机会：2018年拿到300万美元，全数捐给英国物理学会，指定给女性、少数族裔、难民和残疾学生"],"story":[{"t":"1967","d":"在剑桥做博士研究，从数公里长的纸带数据里发现周期1.337秒的脉冲信号，共找到四颗"},{"t":"1968","d":"论文发表，五位作者中休伊什排第一，她排第二"},{"t":"1974","d":"诺贝尔物理学奖授予休伊什与赖尔，贝尔不在名单内，天文学界公开质疑"},{"t":"2018","d":"获基础物理学特别突破奖，随即宣布把300万美元奖金全部捐出"},{"t":"2019","d":"奖金正式捐给英国物理学会，成立贝尔·伯内尔研究生奖学金基金"}],"quotes":["当时我没法立即反驳他，但我知道那不是干扰。","发现脉冲星的故事之所以会是这样，很大程度上是因为我属于少数群体，当时又是个博士生。"],"writingUse":"写「被抢功」的另一种解法：她不纠缠自己没得到的那个奖，而是把后来拿到的钱换成别人不必再吃同样的亏。这种角色不好写，因为她没有恨；但一旦写对，读者记住的不是诺奖委员会，而是她捐钱那天。适合当主角的镜像人物——同样的起点，一个选择记仇，一个选择拆掉门槛。","sources":[{"publisher":"人民日报客户端","title":"在荣获300万美元巨额科学奖金后，她做了一件事","url":"https://www.peopleapp.com/rmharticle/30009643907"},{"publisher":"央广网","title":"哪些诺贝尔奖颁错了：甚至害惨好多人","url":"https://m.cnr.cn/news/20151005/t20151005_520054936_yd.html"}]},{"id":"cecilia-payne","name":"塞西莉亚·佩恩-加波施金","alias":"算出恒星是氢做的女人","identity":"天文学家 · 恒星大气由氢氦主导的发现者 · 哈佛天文系首位女性系主任","category":"顶级人类","date":"2026-10-17","heat":91,"headline":"揭开太阳之谜的塞莉西亚·佩恩·加波施金","summary":"1923年，剑桥毕业的佩恩因为女性拿不到学位，只身去哈佛。1925年，25岁的她在博士论文《恒星大气》里用当时最新的萨哈电离方程算出：恒星大气绝大部分是氢和氦，而不是和地球一样的重元素。天文学权威罗素回信说「这显然是不可能的」。在压力下她在论文里写下「这个结论几乎肯定是不真实的」，但没有删掉推导。四年后观测证实她是对的，罗素公开承认错误。","traits":["敢下结论","被压回去也留证据","不吵架","用下一篇论文翻案"],"methods":["换一个国家换一张门票：剑桥不给女性授学位，她就去哈佛读博——不是为了头衔，是为了能继续算","把最新物理搬进天文：她把玻尔的量子理论整理成可用的工具，套在恒星光谱上","在论文里留下退让的痕迹：被罗素否掉后，她照要求写下「这个结论几乎肯定是不真实的」，但没有删掉推导过程","不辩论，继续发表：此后几年她用更多数据把结论做厚，等观测替她说话","把职位当工具不当奖赏：成为哈佛首位女性正教授、首位女性系主任后，她留下的是教科书《恒星与星系演化》"],"story":[{"t":"1900","d":"生于英国，1923年在剑桥完成天文学业，但当时剑桥不向女性授予学位"},{"t":"1923","d":"只身赴美，进入哈佛天文台，师从沙普利"},{"t":"1925","d":"25岁发表博士论文《恒星大气》，算出恒星主要由氢和氦组成"},{"t":"1925","d":"罗素回信「这显然是不可能的」，她被迫在论文中加上自我否定的限定语"},{"t":"1929","d":"新的观测数据证实她的结论，罗素公开承认自己错了"},{"t":"1956","d":"成为哈佛大学文理学院首位通过常规晋升管道获得正教授职位的女性，同年出任天文系主任"},{"t":"1979","d":"去世；她的博士论文后来被称为「天文学史上最卓越的博士论文」"}],"quotes":["这个结论几乎肯定是不真实的。（1925年，被权威施压后写进自己论文的一句）","年轻科学家的奖赏，是那种情绪上的震颤：你是世界历史上第一个看见某样东西、或理解某样东西的人。"],"writingUse":"佩恩这条最好用的不是「被压制」，而是那句被迫写下的自我否定。写一个角色在自己最重要的论文里亲手加一句「我可能是错的」，四年后同一个人被证明全对——这种弧光不需要任何外部冲突，全靠一个括号。适合写学术界、职场里那种「被上级一句『不可能』改掉方案」的年轻人。","sources":[{"publisher":"新浪新闻","title":"揭开太阳之谜的塞莉西亚·佩恩·加波施金","url":"https://k.sina.com.cn/article_7517400647_1c0126e4705902tlwc.html"},{"publisher":"BBC 中文","title":"女性与天文：改变我们宇宙观却鲜为人知的三位女科学家","url":"https://www.bbc.com/ukchina/simp/54148994"}]},{"id":"henrietta-leavitt","name":"亨丽埃塔·斯旺·莱维特","alias":"量天尺的制造者","identity":"哈佛天文台计算员 · 造父变星周光关系发现者 · 「观测宇宙学之母」","category":"顶级人类","date":"2026-10-17","heat":90,"headline":"仰望星空的半边天③ 亨丽埃塔·勒维特","summary":"那个年代女性不被允许操作望远镜，莱维特在哈佛天文台做「计算员」：看底片、算数据，时薪0.3美元，起初甚至没有工资。她逐张比对小麦哲伦云的底片，找出1777颗变星，发现其中47颗造父变星的周期越长、亮度越高。1912年她确认这条周光关系，人类第一次有了测量星系距离的尺子。哈勃用它证明银河系之外还有别的星系。她1921年死于癌症，终身没有拿到正式学术职位。","traits":["坐得住","在别人的边角料里做大事","不争名分","身体不好也照做"],"methods":["把重复劳动做成方法：同一片天空不同日期的底片逐张比对，靠亮度差把变星一颗颗挑出来","在海量样本里找同类：1777颗变星里认出47颗性质相同的星，把周期和亮度画在同一张图上","借「同距离」这个前提做跳跃：麦哲伦云里的星离地球差不多远，所以视亮度差就等于真亮度差","不要求署名位置：成果发在《哈佛天文台年鉴》，她只署名，不问职称","听不见也照算：旅行中患病导致失聪，此后三十年体弱多病，靠延长休假和远程工作维持研究"],"story":[{"t":"1868","d":"生于美国马萨诸塞州，大学最后一年才第一次选修天文学"},{"t":"1890s","d":"以志愿者身份进入哈佛天文台，后成为测光部负责人，时薪0.3美元"},{"t":"1908","d":"发表《麦哲伦云中的1777颗变星》，首次指出周期与亮度相关"},{"t":"1912","d":"确认造父变星的周期对数与平均亮度线性相关，即周光关系（勒维特定律）"},{"t":"1921","d":"因癌症去世，终身未婚，终身未获正式学术职位"},{"t":"1924","d":"哈勃用她的方法测出仙女座星云的距离，证明它在银河系之外"}],"quotes":["这两个变量的关系很容易用一条直线画出来，说明造父变星的亮度和周期之间关系很简单。","她拥有天文台最出色的头脑。（同事对她的评价）"],"writingUse":"莱维特是「体系里的隐形人」原型：没有头衔、没有望远镜、没有署名位置，但她手里那把尺子后来被所有人用。写这类角色别给她一场翻身戏——她一辈子没翻身。真正动人的是她并不知道自己在给全人类造尺子，她只是觉得这47颗星的周期和亮度画出来很整齐。适合写成主角身边那个「不说话但什么都会」的人。","sources":[{"publisher":"人民日报客户端","title":"仰望星空的半边天③ 亨丽埃塔·勒维特","url":"https://www.peopleapp.com/rmharticle/30020522428"},{"publisher":"BBC 中文","title":"女性与天文：改变我们宇宙观却鲜为人知的三位女科学家","url":"https://www.bbc.com/ukchina/simp/54148994"}]},{"id":"esther-lederberg","name":"埃丝特·莱德伯格","alias":"λ噬菌体的发现者","identity":"微生物学家 · λ噬菌体发现者 · 影印平板法发明者","category":"顶级人类","date":"2026-10-17","heat":88,"headline":"秘踪病毒的发现者 埃丝特·莱德伯格逝世","summary":"1950年，埃丝特在威斯康星做大肠杆菌实验时，注意到一些菌落莫名其妙地缺了一块，追下去发现一种能把自己嵌进细菌DNA、潜伏一阵再发作的病毒，她命名为λ噬菌体。1952年她与丈夫做出影印平板法：用一块天鹅绒把上百个菌落一次转到另一块培养皿上，这个方法至今仍在实验室用。1958年诺贝尔奖授予她的丈夫乔舒亚及另外两人，获奖说明里没有她。她此后在斯坦福始终没有拿到终身教职。","traits":["手极巧","不计较署名","被边缘化也不离场","实用主义"],"methods":["在「失败的培养皿」里找线索：别人当成污染扔掉的不规则菌落，她盯着那块缺口追下去","用手边的材料解决技术难题：家里做纺织的出身，让她想到用天鹅绒的绒面一次印走整盘菌落","让方法替自己说话：影印平板法被全世界实验室采用，教科书却常把功劳写在她丈夫名下","没有终身教职也继续做：到斯坦福后拿的是无任期研究岗，一干二十年","最后去管库：1970年代接手斯坦福质粒中心，整理、命名、分发全世界的质粒，做别人不愿做的地基工作"],"story":[{"t":"1922","d":"生于纽约布朗克斯，大萧条中长大，靠奖学金读亨特学院"},{"t":"1950","d":"在威斯康星大学获细菌遗传学博士，同年发现λ噬菌体"},{"t":"1952","d":"与丈夫乔舒亚共同做出影印平板法，成为细菌遗传学的标准工具"},{"t":"1958","d":"诺贝尔生理学或医学奖授予乔舒亚·莱德伯格等三人，埃丝特不在其中"},{"t":"1959","d":"随丈夫赴斯坦福，只拿到无任期的研究职位；同年与其他两位女性联名向医学院院长抗议女教师太少"},{"t":"1974","d":"被转为兼职教授，实质是降级，聘期取决于能否拿到经费"},{"t":"2006","d":"在斯坦福去世；她因影印平板法被科学史界当作「玛蒂尔达效应」的典型例子"}],"quotes":["实验上和方法上，她是实验室里的天才。——微生物学家福尔科对她的评价","莱德伯格博士享有与一位非常著名的丈夫共事的特权。这有时也是一种挫折，因为不可避免地，她得到的承认远少于她真正应得的。"],"writingUse":"写「夫妻店里的隐形合作者」有现成的模板：署名权在另一个人手里，她的贡献被写成「协助」。埃丝特最锋利的地方在于她从不退场——没终身教职也留在实验室，最后去管一个没人愿意管的质粒库，让全世界的研究者都得来她这里取样本。这种角色适合写成「用基础设施报复体系」的人：你们不给我位置，我就变成所有人都绕不开的那道门。","sources":[{"publisher":"《世界科学》","title":"秘踪病毒的发现者 埃丝特·莱德伯格逝世","url":"https://worldscience.cn/c/2007-01-01/601690.shtml"},{"publisher":"The Hindu","title":"Know the scientist: Esther Miriam Zimmer Lederberg","url":"https://www.thehindu.com/children/know-the-scientist-esther-miriam-zimmer-lederberg/article33298059.ece"}]},{"id":"katalin-kariko","name":"卡塔琳·考里科","alias":"mRNA 疫苗之母","identity":"生物化学家 · mRNA 疫苗技术奠基者 · 2023年诺贝尔生理学或医学奖得主","category":"顶级人类","date":"2026-10-17","heat":90,"headline":"卡里科寒窗40载钻mRNA冷门 终与魏斯曼同获诺贝尔","summary":"1955年生于匈牙利，1985年带着缝在女儿玩具熊里的积蓄去美国。她在宾夕法尼亚大学坚持研究mRNA，同行认为这是死路：经费申请一次次被拒，1995年被降职降薪，工资缩水到三分之一。没有经费，实验记录用复印机印、试管自己洗。1997年遇到免疫学家魏斯曼，两人解决了mRNA引发过度炎症的问题。2020年mRNA疫苗在11个月内完成传统需要十年的开发，2023年她与魏斯曼获诺贝尔生理学或医学奖。","traits":["认死理","把冷板凳坐穿","不算投入产出","越被否越具体"],"methods":["把全部家当缝进玩具熊：1985年离开匈牙利时外汇受限，她把手上的钱藏在女儿的玩偶里带出境","没有经费就用更便宜的做法：实验记录用复印机印，因为复印纸比实验记录本便宜；没有助手就自己洗试管","被降职也不换方向：1995年学校给出最后通牒，她接受降级、接受三分之一的工资，继续做mRNA","找一个能补自己短板的人：1997年主动找上免疫学家魏斯曼，一个懂RNA，一个懂免疫","把拒绝当数据：二十年里经费被拒、论文被退，她保留每一次拒绝的记录，用来校准下一个提案"],"story":[{"t":"1955","d":"生于匈牙利东部小城，父亲是屠夫；1973年考入塞格德大学"},{"t":"1985","d":"研究拿不到经费，被迫离开匈牙利，携丈夫和两岁女儿赴美，积蓄缝在玩具熊里"},{"t":"1990","d":"进入宾夕法尼亚大学医学院，全职研究mRNA"},{"t":"1995","d":"因长期拿不到经费被降职降薪，工资缩水到原来的三分之一"},{"t":"1997","d":"与免疫学家德鲁·魏斯曼合作，几年后解决mRNA引发过度免疫反应的关键问题"},{"t":"2005","d":"两人发表核苷修饰的关键论文，当时引用寥寥"},{"t":"2020","d":"mRNA疫苗在11个月内完成传统需十年的开发流程，全球数十亿人接种"},{"t":"2023","d":"与魏斯曼共同获得诺贝尔生理学或医学奖；获奖当天她仍在实验室改论文"}],"quotes":["你必须相信自己的工作，即使全世界都说不。","我更像是一个基础科学家，但我一直想做点什么来帮助患者。","我正在写论文，稍后回你。（诺奖委员会打来电话时她的回答）"],"writingUse":"考里科不适合写成「天才被埋没」——她不是天才型，是耐力型。写她的关键是写重复：同一个提案改到第几十版，同一种拒绝信收到第几百封，她还在改。这种角色撑起的是「长期主义」的戏，不是「逆袭」的戏。别给她设计一个顿悟时刻，她的高光应该出现在最普通的一天：实验室，改论文，电话响。","sources":[{"publisher":"中工网","title":"勇于「为实验室的冷板凳而活」","url":"https://www.workercn.cn/c/2023-10-09/8006794.shtml"},{"publisher":"中央社","title":"卡里科寒窗40载钻mRNA冷门 终与魏斯曼同获诺贝尔","url":"https://www.cna.com.tw/news/ahel/202310020316.aspx"}]},{"id":"fu-sheng","name":"傅盛","alias":"猎豹移动董事长","identity":"猎豹移动董事长兼CEO · 360安全卫士原产品负责人","category":"商界狠人","date":"2026-10-18","heat":84,"headline":"红衣周鸿祎左膝粉碎，傅盛深夜八个字：苍天有眼鸿膝当碎","summary":"早年在3721跟随周鸿祎，2005年接手没人管的360安全卫士，把它做成过亿用户的国民产品。2008年因股权与竞业谈崩离职，签了18个月竞业协议；2009年竞业期未满就在雷军支持下做可牛影像，后与金山安全合并为猎豹移动，2014年在纽交所上市。2026年3月凌晨在多个微信群点名周鸿祎，追讨「至少一个亿」，四天后发长文道歉。10月11日周鸿祎攀岩摔成左膝粉碎性骨折，他深夜在朋友圈写下「苍天有眼，鸿膝当碎」，约三小时后删除，截图已传遍全网。","traits":["记仇记得住年份","喝了酒才敢说","删得比说得快","把恩怨当账算"],"methods":["八个字里塞两个梗：把对方名字里的「鸿」和摔断的「膝」缝成一句谐音对仗，不点名、不带脏字，但谁都看得懂","先发后删：察觉不妥就删原帖，不解释不补充，让已经流出去的截图替自己说话","用群聊代替私聊：3月在多个微信群里直接点名，把十几年前的旧账摊到几百人面前，而不是打电话","骂完隔四天写长文认错：3月24日凌晨发《关于近日言论的说明》，交代「喝了点酒、电话被挂、被删好友」，最后补一句「跟着老周一起打仗的日子是我职业生涯最宝贵的记忆」","竞业期没满就开工：2008年离职签18个月竞业，2009年9月就做出可牛影像，直接进老东家同一条赛道"],"story":[{"t":"2000s","d":"进入3721跟随周鸿祎，后随其转入雅虎中国、奇虎"},{"t":"2005","d":"接手没人愿意做的360安全卫士项目，带两三个人做到过亿用户"},{"t":"2008","d":"因股权与竞业条款谈崩离职，签下18个月竞业协议"},{"t":"2009","d":"竞业期未满，在雷军支持下创办可牛影像"},{"t":"2011","d":"360在香港提起诉讼，双方从法庭打到媒体"},{"t":"2014","d":"可牛与金山安全合并成的猎豹移动在纽交所上市"},{"t":"2024","d":"1月同台为对方AI发布会站台，被媒体称为「世纪大和解」"},{"t":"2026-03","d":"凌晨在多个微信群点名追讨「至少一个亿」；四天后发长文道歉"},{"t":"2026-10-11","d":"周鸿祎攀岩摔成左膝粉碎性骨折，他当夜发八字朋友圈，三小时后删除"}],"quotes":["苍天有眼，鸿膝当碎。","跟着老周一起打仗的日子是我职业生涯最宝贵的记忆。"],"writingUse":"写「记仇的人」，千万别写成愤怒——愤怒会消，记仇不会。傅盛的关键是他能把二十年前的账记得比当事人还清楚：哪一年、哪一条款、差多少钱。写他不要写摔杯子和骂街，写他半夜睡不着掏出手机打字，写完删掉，然后第二天照常开会。这种人最可怕的不是嘴，是把私人情绪保存成档案的能力。适合写成反派身边那个「什么都记得」的二把手，或者主角最不愿在谈判桌上遇到的老对手。","sources":[{"publisher":"新浪新闻","title":"红衣周鸿祎左膝粉碎，傅盛深夜八个字：苍天有眼鸿膝当碎","url":"https://3g.sina.com.cn/news/detail/5353324796184108.html"},{"publisher":"网易","title":"56岁的周鸿祎攀岩从三米高处坠落造成左膝粉碎骨折，傅盛朋友圈留八字","url":"https://www.163.com/dy/article/L94NNJOI05563RA1.html"},{"publisher":"手机网易网","title":"周鸿祎攀岩摔伤膝盖，傅盛凌晨发文「苍天有眼，鸿膝当碎」，3小时后删除","url":"https://m.163.com/dy/article_cambrian/L92D45RQ05564S43.html"}]},{"id":"liu-dingshuo","name":"刘丁硕","alias":"前国乒陪练","identity":"前国乒队员 · 王楚钦长期陪练 · 乒乓球培训创业者","category":"社会切片","date":"2026-10-18","heat":78,"headline":"互撕升级！刘丁硕再度向张继科「开炮」：质疑卖鸡排并删除微信","summary":"2026年10月15日晚直播，刘丁硕不点名批评「有人」自2024年起蹭国乒热度、倚老卖老带节奏，并称对方退役不是因为伤病，是「打不过」。他同时质疑对方推出的90分钟25元乒乓球体验课扰乱行业定价——市面陪练一小时200元左右，而他正在筹备自己的球馆。张继科隔空回应「段位不够、上不了台面，我连搭理都不会搭理」。刘丁硕随后二度开播，称已删除对方微信，并质疑其带货鸡排、暗讽「321上链接」割韭菜。两人同为青岛人、同出鲁能体系，退役后都在做乒乓培训加直播。","traits":["不点名但句句对得上","拿行业定价当武器","越吵越具体","把私怨说成公义"],"methods":["全程不说名字：只给「2024年起」「倚老卖老」「退役不是因为伤」几个限定词，让弹幕替他把名字补上","把私怨换算成行业账：不说「你抢我生意」，说「25元90分钟、市面200元一小时，同行活不下去」","从对方最痛的地方切：不骂技术不骂成绩，只问「能赢球他为什么退役」","用动作补刀：直播里宣布已删对方微信，理由是「留着干嘛？给我发一条信息我怎么办，没法回啊」","对方约线下见面，他不去，回一句「我俩面对面硬刚，你看我虚吗」，把战场锁在自己能控的直播间"],"story":[{"t":"2026-10-15","d":"晚间直播不点名批评「有人」蹭国乒热度、倚老卖老，并质疑25元体验课扰乱定价"},{"t":"2026-10-16","d":"张继科在直播间隔空回应「段位不够、上不了台面」，并邀其到杭州当面沟通"},{"t":"2026-10-17","d":"刘丁硕二度开播，称已删对方微信，质疑其带货鸡排，暗讽「321上链接」割韭菜"},{"t":"2026-10-18","d":"互撕升级冲上热搜，双方均未收口"}],"quotes":["绿泡泡（指微信）我都删了知道吧，留着干嘛？给我发一条信息我怎么办，没法回啊。","我俩面对面硬刚，你看我虚吗。","不能一有点流量就「321上链接」对吧？割韭菜我看割得也很骄傲。"],"writingUse":"这是「用公义的语言打私人的仗」的标准样本，写的时候一定要让两层同时在场：嘴上说的是行业生态、晚辈出头、定价公道，镜头外是他在筹备球馆、对方低价课砸了他的定价空间。这种角色不需要坏，他真心觉得自己在讲道理——这恰恰是最难写也最好用的地方。台词设计上给他一条铁律：绝不说出对方的名字，让周围人替他说。","sources":[{"publisher":"新浪财经","title":"互撕升级！刘丁硕再度向张继科「开炮」：质疑卖鸡排并删除微信","url":"https://finance.sina.cn/2026-10-18/detail-inivreri6009676.d.html"},{"publisher":"新浪体育","title":"刘丁硕不点名指责张继科倚老卖老，双方直播隔空交锋","url":"https://sports.sina.cn/2026-10-18/detail-inivqptt6902380.d.html"},{"publisher":"新浪体育","title":"张继科回应刘丁硕事件的视频","url":"https://sports.sina.cn/2026-10-18/detail-inivqptt6925291.d.html"},{"publisher":"腾讯网","title":"刘丁硕直播开炮：张继科哪是因为伤病退役，就是打不过了","url":"https://new.qq.com/rain/a/20261017A0697E00"}]},{"id":"guo-yuxin","name":"郭宇欣","alias":"短剧女主","identity":"短剧演员 · 《与晋长安》主演","category":"娱乐圈","date":"2026-10-18","heat":82,"headline":"郭宇欣直播屏蔽导演引热议，舆论再掀波澜","summary":"2026年10月16日《雨你共赴好时节》庆功直播，网友发现导演翟诗帆、编剧叶非夜、男主王皓祯的名字在弹幕里发不出去，整场镜头只对着郭宇欣一人。17日凌晨叶非夜发博质问「屏蔽导演几个意思，做人忘本到这个地步也是没谁了」。粉丝贴出直播方案，写明开播与后台设置均由平台负责，艺人无权进入后台；至17日中午她与平台均未正式说明。此前7月一段录音流出，她私下评价同行，与其公开主张的「拒绝雌竞」形成反差；叶非夜另爆料她在剧组楼道当众吐槽导演与男主约二十分钟。","traits":["台前台后两套话","不解释","把切割做在技术层","越被扒越硬"],"methods":["把切割做成技术动作：不在镜头前回避谁，直接让名字在弹幕里消失，人还坐在画面正中","只给一句底线，其余不接：「没做过的事自己不承认」，不写长文、不接受专访","让粉丝团代替本人做动作：后援会管理员在粉丝群通知，拍到下班路透的粉丝不要传播","不撤戏不改档：风波后仍表示会继续拍短剧，也不看差评","把战场限定在直播：所有回应都发生在自己发起、自己能控场的直播里"],"story":[{"t":"2026-02","d":"《与晋长安》拍水下戏，不会游泳的她踩空落水，被男主严子贤推上岸"},{"t":"2026-07-04","d":"一段1分23秒的私下录音流出，内容涉及评价同行"},{"t":"2026-07-05","d":"编剧叶非夜发文爆料她在剧组楼道当众吐槽导演与男主约二十分钟；一部短剧撤档"},{"t":"2026-10-16","d":"《雨你共赴好时节》庆功直播，导演、编剧、男主名字在弹幕中被屏蔽"},{"t":"2026-10-17","d":"叶非夜发博质问「屏蔽导演几个意思」；她与平台均未作正式说明"}],"quotes":["没做过的事自己不承认。"],"writingUse":"这个角色的内核不是坏，是「分得清」——她把工作和人情切成两个抽屉，工作上照常合作、照常庆功，人情上一点不让。写她不要写撕破脸，写她在庆功宴上笑得最得体那一秒，同时后台的屏蔽词列表正在生效。剧本里可以给她一句台词都不给，全靠别人替她说话：编剧发博、粉丝澄清、平台沉默——三方各说各话，她本人始终坐在画面中间不开口。","sources":[{"publisher":"新浪娱乐","title":"郭宇欣直播屏蔽导演引热议，舆论再掀波澜","url":"https://ent.sina.cn/2026-10-17/detail-inivnzsm7285596.d.html"},{"publisher":"新浪娱乐","title":"郭宇欣与导演翟诗帆此前有何矛盾？","url":"https://ent.sina.cn/2026-10-17/detail-inivpfyi7246896.d.html"}]},{"id":"anne-carson","name":"安妮·卡森","alias":"Anne Carson","identity":"加拿大诗人 · 古典学者 · 2026年诺贝尔文学奖得主","category":"顶级人类","date":"2026-10-18","heat":87,"headline":"年度最「拽」诺贝尔奖得主！作品没火，穿搭却先出圈了","summary":"1950年生于多伦多，童年在安大略省多个小镇之间迁徙，中学时一位拉丁语老师课后教她古希腊语。她把诗、散文、论文、翻译、戏剧缝进同一本书，出版方认为「不好卖」，42岁才出版第一本诗集。她在多伦多大学读完古典学博士，论文写萨福，后来成书《爱欲的苦甜》。2026年10月8日获诺贝尔文学奖，瑞典文学院称她「在与古典传统的诙谐对话中，为当代文学创造了新的形式」。授奖时她人在冰岛，给文学院的回话是「我在冰岛。听风。」中文世界仅4部译作，重庆40余家公共图书馆只有5家藏有她的书。","traits":["拒绝被归类","不接电话","不用荣誉装饰自己","慢而不改"],"methods":["把文体拆掉重装：诗、散文、论文、翻译、戏剧混在同一本书里，让书店无法把它放上任何一个架子","拒绝别人给的称呼：写了一辈子诗，却拒绝被叫作「诗人」","不接电话：诺奖委员会打来时她正在家里扫地，嫌电话吵；领奖期间躲进山里散步观树，理由直说「这样就不用接电话了」","把作者简介压到一句：「安妮·卡森出生于加拿大，以教授古希腊语为生。」","用最小成本庆祝：被问得奖后生活有没有变奢华，答「有的。我换了新的袜子和枕套」","退学再回来：读书时不喜欢部分课程就两次退学去做商业艺术，花一整年设计一个麦片盒，觉得还是读书好，回去把博士读完"],"story":[{"t":"1950","d":"生于多伦多，父亲工作调动，全家在安大略省多个小镇间迁徙"},{"t":"1970s","d":"大学期间两次退学，转去做商业艺术，一年只设计一个麦片盒"},{"t":"1981","d":"回多伦多完成以萨福为对象的博士论文，后整理出版为《爱欲的苦甜》"},{"t":"1990s","d":"42岁才出版第一本诗集；长期被认为文体混杂、不好归类、不好卖"},{"t":"2026-10-08","d":"获诺贝尔文学奖，授奖词称她为当代文学创造了新形式；她正在冰岛听风"},{"t":"2026-10-16","d":"中文世界仅4部译作，重庆40余家公共图书馆仅5家有馆藏，书店紧急调货预售"}],"quotes":["我在冰岛。听风。","我觉得评委疯了，才会颁奖给我。","我会在死后10分钟才出名。","有的。我换了新的袜子和枕套。"],"writingUse":"写「不合群的天才」最容易写错的地方，是把她写成一个清高的怪人。卡森身上真正的反差是：她对名利毫无攻击性，只是没兴趣——电话响了她嫌吵，得奖了她去散步，理由是「这样就不用接电话」。这种角色最好用的地方在于她的「不可定义」是被动形成的：不是她要反叛，是她做的东西实在塞不进任何一个抽屉。写她时给她一个具体的、笨拙的日常动作（扫地、按住要被风吹飞的帽子），所有高光都从这些动作里漏出来。","sources":[{"publisher":"澎湃新闻","title":"安妮·卡森：古希腊同人女的诗歌游戏","url":"https://m.thepaper.cn/newsDetail_forward_34238829"},{"publisher":"中国作家网","title":"安妮·卡森简论：古典传统的当代重生与文学形式的再创造","url":"https://www.chinawriter.com.cn/n1/2026/1012/c404091-40812764.html"},{"publisher":"重庆日报","title":"新晋诺奖得主作品一书难求·「阅读错位」折射出怎样的思考","url":"https://epaper.cqrb.cn/cqrb/2026-10/16/012/content_rb_365367.htm"},{"publisher":"网易","title":"年度最「拽」诺贝尔奖得主！作品没火，穿搭却先出圈了","url":"https://dy.163.com/article/L95LAI0I051484S5.html"}]},{"id":"liu-nvshi-cq","name":"刘女士","alias":"重庆2岁坠楼男童母亲","identity":"2岁坠楼男童的母亲 · 刑事追责推动者","category":"社会切片","date":"2026-10-19","heat":86,"headline":"重庆父亲外出遛狗2岁男童从18楼坠亡，母亲以「过失致人死亡」报案，警方已受理","summary":"2026年9月13日下午，重庆一名2岁2个月男童被父亲独自留在家中，父亲出门遛狗12分钟，孩子从18楼坠亡。10月18日，孩子母亲刘女士告诉澎湃新闻，她已委托曾代理「重庆姐弟坠楼案」的律师申请刑事立案监督，派出所已受理她报称的「过失致人死亡案」。她把当天下午拆成15:00、15:23、15:26、15:36、15:38、15:41六个时间点。她说自己并不认为丈夫蓄意谋杀，但这不妨碍她追究过失致死。事发一个月她瘦了10斤，10月9日查出重度抑郁，已与丈夫断联。","traits":["按分钟记账","分清故意与过失","不接「这是意外」","一个人往前推","把情绪留在夜里"],"methods":["把当天下午拆成六个时间点：15:00 与父子分开、15:23 丈夫带孩子进门、15:26 丈夫出门遛狗、15:36 物业拨打110和120、15:38 丈夫返家、15:41 丈夫才发现孩子坠楼——用六个数把「12分钟」变成能逐格核对的账","先把自己不要的划掉：主动说「我觉得他不是蓄意谋杀」，放弃最重的指控，只守住「过失致人死亡」这一条","找打过同款官司的律师：委托曾代理「重庆姐弟坠楼案」的律师走刑事立案监督，而不是自己写举报信","把受案回执拍照交给记者：警方受案回执由她本人提供给媒体，让程序走到哪一步都有纸面可查","先发帖再面对镜头：最早在网上发帖讲经过，等事情上了热搜才接受采访，用舆论推程序，不拿舆论替程序","当场动手：孩子还躺在楼下时她打了丈夫三巴掌，对方回她「这是最后一下，你再动我一下，我就调监控，我要报警」","断联但不断话：事发后不再与丈夫来往，只保留一句「有时候我给他发一长串消息，他基本就回一两句」"],"story":[{"t":"2026-07","d":"因婆媳矛盾与育儿分担问题，她开始咨询离婚律师"},{"t":"2026-09-10","d":"夫妻再次爆发争吵"},{"t":"2026-09-13","d":"上午一家三口去海洋公园；下午3点她下车去开会，3:26 丈夫出门遛狗，3:36 物业报警，孩子从18楼坠亡"},{"t":"2026-09-17","d":"她告诉扬子晚报想推动刑事立案，警方初步认定是意外、不构成刑事违法"},{"t":"2026-10-09","d":"被查出重度抑郁，一个月瘦了10斤"},{"t":"2026-10-18","d":"委托曾代理「重庆姐弟坠楼案」的律师申请刑事立案监督，派出所受理「过失致人死亡案」"}],"quotes":["出于人性的善良，我觉得他不是蓄意谋杀，但这不代表，他过失致人死亡，我就不追究。","我想推动刑事立案，但警察调查后说这件事是个意外，目前不构成刑事违法。","孩子还在地上，我打了他三巴掌。到殡仪馆的时候我实在忍不了了，我感觉他心里没有痛。","有时候我给他发一长串消息，他基本就回一两句。"],"writingUse":"写「讨说法的人」最容易掉进两个坑：嚎哭的受害者，或者冷酷的复仇者。刘女士两种都不是——她的力量全部来自记账。她把一个母亲的崩溃，折成六个时间点、一条罪名、一个律师名字、一张回执。写这类角色时，让她在情绪最崩的时刻做一件极其行政化的事：拉开手机备忘录，把时间一格一格对上去。真正让人发冷的不是她哭，是她哭完还记得 15:36 是物业报的警，不是 15:38。适合放在「丧亲 + 程序」的双线里，她的对手不是丈夫，是「这事就是个意外」这句话。","sources":[{"publisher":"澎湃新闻","title":"重庆父亲外出遛狗2岁男童从18楼坠亡，母亲以「过失致人死亡」报案，警方已受理","url":"https://www.thepaper.cn/newsDetail_forward_34276558"},{"publisher":"观察者网","title":"2岁幼童因父亲外出遛狗从18楼坠亡，母亲以「过失致人死亡」报案","url":"https://www.toutiao.com/article/7697979778808300032"},{"publisher":"鲁中晨报","title":"父亲外出遛狗2岁幼童从18楼坠亡，最新进展：孩子母亲以「过失致人死亡」报案","url":"https://www.toutiao.com/article/7697997098343744000"}],"novel":{"want":"让「这是意外」变成「有人负责」，要刑事立案，不是赔偿。","fear":"儿子的死被归类为「意外」，没人负责；自己撑不住。","contradiction":"极度悲痛，却做极其行政化的事；说「他不是蓄意谋杀」，却坚持追究过失；打了他三巴掌，又说不认为他蓄意。","pressureChoice":"放弃「故意杀人」的最重指控，只守「过失致人死亡」；委托曾代理「重庆姐弟坠楼案」的律师走刑事立案监督。","scene":"孩子还躺在地上，她打了丈夫三巴掌；对方回她「这是最后一下，你再动我一下，我就调监控，我要报警」。","relations":"丈夫：她追究的人，也是她曾经最亲近的人；律师：替她把情绪翻译成程序的人；警方：她一次次去推动的机构。","confidence":"A"}},{"id":"zuo-qi","name":"左琦","alias":"京东采销左琦","identity":"京东采销员工 · 「热榜五问」的发布者","category":"商界狠人","date":"2026-10-19","heat":83,"headline":"抖音和京东公开互呛：被指「黑」京东后，抖音辟谣并提起诉讼，京东支持员工反诉","summary":"2026年10月16日，京东采销左琦在朋友圈连发质疑：一篇阅读量约1000、0评论的报道，凭什么在2026年5月28日登上今日头条热榜第29位。他圈出话题截图、用红框标出「阅读量1000」，连发「五问」，喊话「一起在法律面前对账」，并称「昨晚正好全程录了屏」。当天下午抖音黑板报宣布已就他「捏造事实、攻击抖音电商」提起诉讼、法院立案；当晚京东发言人声明支持员工反诉并向有关部门举报。一条朋友圈在48小时内变成双11前夜的巨头舆论战，平台中立性问题被推到台面。","traits":["先存证再开炮","只问机制不骂人","不删帖","把私怨算成行业账","越被起诉越不退"],"methods":["截图先圈再框：把热榜第29位的话题圈出来，再把文章页的「阅读量1000」用红框框住，一张图说完全部因果，不留解释空间","连发「五问」而不是写长文：问热榜规则谁制定、谁干预、能不能追溯、为什么每次都赶在大促节点、这次是不是巧合","删稿前先录屏：稿子第二天被删干净，他回一句「昨晚正好全程录了屏」，把「已经没了」变成「已经留下」","把私怨换算成行业账：不谈自己被冒犯，谈「既当裁判员又当运动员」的平台中立性","选朋友圈这个半公开的场子：不发微博、不开直播，在同行都在的地方说，让话先在小圈子里落地，再被截图带出去","把「巧合」单独拎出来问：京东双11发布会当天刚公布让利，平台当天就推负面，他把这个时间差当成一条独立证据","被起诉后不缩：京东晒出的最新朋友圈里，他继续追问，并直接喊话「一起在法律面前对账」"],"story":[{"t":"2026-05-28","d":"话题「商家指控京东干扰售价屏蔽店铺」登上今日头条热榜第29位"},{"t":"2026-10-15","d":"京东双11发布会公布让利活动"},{"t":"2026-10-16","d":"左琦在朋友圈连发质疑与「五问」，附热榜截图与红框标注；下午抖音黑板报宣布已起诉他，法院立案"},{"t":"2026-10-16 晚","d":"京东发言人声明支持员工反诉，并向有关部门举报，称「坚决反对某些平台操纵舆论」"},{"t":"2026-10-17","d":"他发现原稿已被删除，称「昨晚正好全程录了屏」，继续追问"}],"quotes":["一起在法律面前对账","数据、热搜规则都由平台方掌控，想篡改结果是轻而易举的事情。","昨晚正好全程录了屏。"],"writingUse":"写「一个人对着一台机器开炮」，最容易写成发牢骚。左琦的办法是给每句怨气装一个可核对的容器：截图、红框、五个问题、一段录屏。他不骂平台坏，他要求平台把规则贴出来。这种角色在小说里最好当引信——他本人不重要，重要的是他点燃的东西有多大。写他时给他一个极小的身份（一个采销）和一套极硬的方法（存档、编号、公开提问），力量就从这种不匹配里长出来。","sources":[{"publisher":"红星新闻","title":"抖音和京东公开互呛：被指「黑」京东后，抖音辟谣并提起诉讼，京东支持员工反诉","url":"https://www.toutiao.com/article/7697466408455668275/"},{"publisher":"新黄河·大鱼财经","title":"一条热搜引爆巨头之战：抖音京东为何对簿公堂又对峙舆论场","url":"https://www.sina.cn/news/detail/5355085572082174.html"},{"publisher":"搜狐","title":"抖音起诉京东采销，双十一前夜的电商舆论战与底层竞争变局","url":"https://www.sohu.com/a/1089219973_379822"}]},{"id":"wu-yue","name":"吴越","alias":"演员吴越","identity":"演员 · AI换脸带货的被冒名者","category":"娱乐圈","date":"2026-10-19","heat":79,"headline":"「太恶劣！」演员吴越发文怒斥！涉事账号已被永久封禁","summary":"2026年10月，微信视频号「花姐美肤日记」用AI合成吴越的脸和声音，以「明星同款、吴越推荐」卖护肤品，同一条视频末尾还拼进了疑似邓亚萍的带货画面，视频角落标着「含AI生成内容」。10月18日凌晨3时18分，吴越用本人微博发文：「一觉醒来，谁在利用Ai肆意抓人替自己做恶？这位'花姐'你骗了多少人的钱？请如数奉还！太恶劣！！！」当天话题「吴越质问花姐骗了多少钱」登上热搜；下午邓亚萍团队回应从未授权AI形象；微信团队确认账号已永久封禁、内容清空。","traits":["自己上场","不写声明写质问","把侵权换算成钱","一条就够","不替自己辩解"],"methods":["凌晨自己发：3时18分用本人微博发文，不走工作室通稿，第一句是「一觉醒来，谁在利用Ai肆意抓人替自己做恶？」","把侵权翻译成骗钱：不提肖像权、声音权，直接问「这位'花姐'你骗了多少人的钱？请如数奉还！」","用感叹号收尾：「太恶劣！！！」三个，不多不少","只发一条：热搜起来、账号被封之后她没有继续连发追打，把后续留给平台和另一位被冒名的当事人","一句都不替自己解释：整条微博没有「我从未代言」，因为她平时确实不带货，这个事实由别人替她说","把案子变成公共案子：她点名的是账号不是个人，媒体顺着这条线查出同一条视频里还拼进了邓亚萍"],"story":[{"t":"2026-10 上旬","d":"视频号「花姐美肤日记」发布AI合成视频，用吴越的脸和「声音」推销护肤品，末尾拼接邓亚萍带货画面"},{"t":"2026-10-18 03:18","d":"吴越本人微博发文怒斥，定位浙江，帖中贴出账号截图"},{"t":"2026-10-18 上午","d":"话题「吴越质问花姐骗了多少钱」登上微博热搜"},{"t":"2026-10-18 下午","d":"邓亚萍团队回应：从未对外授权AI形象及AI换背景，商业合作明确禁止AI使用"},{"t":"2026-10-18","d":"微信团队确认涉事账号永久封禁、内容清空不可见"}],"quotes":["一觉醒来，谁在利用Ai肆意抓人替自己做恶？","这位「花姐」你骗了多少人的钱？请如数奉还！","太恶劣！！！"],"writingUse":"写「被冒名的人」有两种俗套：一路哭诉，或者一路律师函。吴越走第三条——凌晨三点自己发一条，不解释自己没代言，只问对方骗了多少钱、什么时候还。她的台词感极强：短句、反问、三个感叹号，一句「请如数奉还」把人格权纠纷说成了讨债。这类角色适合当「一句话就把场子点着」的配角，出场一次，之后所有事都因她这句改道。写她时别给长篇独白，给她一条微博的长度。","sources":[{"publisher":"经济日报","title":"视频号回应AI仿冒吴越带货事件","url":"https://www.jingjiribao.cn/static/detail.jsp?id=690800"},{"publisher":"中新经纬","title":"邓亚萍方回应被AI带货：从没对外授权AI形象；吴越凌晨怒斥「太恶劣！」；涉事账号已被永久封禁","url":"https://www.163.com/dy/article/L9HOT8VG0519C6T9.html"},{"publisher":"深圳特区报","title":"「太恶劣！」演员吴越发文怒斥！涉事账号已被永久封禁","url":"https://www.toutiao.com/article/7698158275165979162"}]},{"id":"angelababy","name":"Angelababy","alias":"杨颖","identity":"演员 · 模特","category":"娱乐圈","date":"2026-10-19","heat":72,"headline":"Angelababy被酸有皱纹显老！直播认了「想哭」 真实状态网力挺","summary":"2026年10月18日，Angelababy（杨颖）在品牌直播与粉丝互动时被「显老」的评论触发。此前她的活动生图流出，高清镜头下的眼纹、法令纹被截出来讨论。她没有绕开也没有回怼，把原因归到镜头上：「现在镜头真的很高清，而且大家就是要求真的很高，就说'啊你有眼纹、有法令纹你显老'。」被问是不是难过得想哭，她笑着轻点眼角说「此时此刻想哭，但是没有关系」。话题在文娱榜最高第2位，在榜12小时33分钟；多数网友认为37岁有细纹正常，也有人认为她在博同情。","traits":["不硬撑","不回怼","先认委屈再收","用玩笑卸力","不修图对冲"],"methods":["先归因再表态：把「显老」归到镜头像素和公众要求上——「现在镜头真的很高清，而且大家就是要求真的很高」","把网友的话原样学一遍：「就说'啊你有眼纹、有法令纹你显老'」——用模仿代替反击","当场认下情绪：被问是不是难过得想哭，她说「此时此刻想哭」，不是笑着说「我不在意」","四个字收尾：「但是没有关系」，把话头从委屈扳回和解","配一个小动作：笑着轻点眼角，把哭做成半开玩笑，全程没有掉眼泪","不发精修图对冲：以往艺人遇到这类话题常发精修图淡化，她选择在直播里把话说完","早就备好答案：此前受访她说过「每个人都有自己的节奏，我不需要和别人比较」「我更喜欢现在的自己，因为经历了更多，也更懂自己想要什么」"],"story":[{"t":"2026-10 中旬","d":"线下活动生图流出，高清镜头下的眼纹与法令纹被截出讨论，「显老」话题升温"},{"t":"2026-10-18","d":"BIOLAB 品牌直播中与粉丝互动时被触发，正面回应并说出「此时此刻想哭，但是没有关系」"},{"t":"2026-10-18 当晚","d":"话题冲上微博热搜，文娱榜最高第2位，在榜12小时33分钟"},{"t":"2026-10-19","d":"讨论扩散到「少女感」审美绑架与男女演员双标，多家媒体发文声援"}],"quotes":["现在镜头真的很高清，而且大家就是要求真的很高，就说『啊你有眼纹、有法令纹你显老』。","此时此刻想哭，但是没有关系。","每个人都有自己的节奏，我不需要和别人比较。","我更喜欢现在的自己，因为经历了更多，也更懂自己想要什么。"],"writingUse":"「被说老了」是女演员的日常刑期，多数人的处理是发精修图或者不回应。她选了最难的第三种：在直播里承认想哭，然后自己把自己接住。这个角色最好用的地方是那句转折——「但是没有关系」不是逞强，是她当场把情绪结完账。写这类角色时给她一个半开玩笑的身体动作（笑着点一下眼角），让脆弱和体面同时成立；也别忘了她其实早有准备，那些「我更喜欢现在的自己」是说过很多遍的话，只是这一次被镜头撞上了。","sources":[{"publisher":"ETtoday星光云","title":"Angelababy被酸有皱纹显老！直播认了「想哭」 真实状态网力挺","url":"https://www.toutiao.com/article/7698203829585723938/"},{"publisher":"新浪娱乐","title":"Angelababy为何在直播中回应显老争议？","url":"https://ent.sina.cn/2026-10-19/detail-inivsnmf6414508.d.html"}]},{"id":"zhang-yuan","name":"张园","alias":"Zhang Yuan","identity":"中科院脑智卓越中心博士后 · 《科学》论文第一作者","category":"顶级人类","date":"2026-10-19","heat":88,"headline":"Science：徐宁龙团队首次揭示认知灵活性的神经元树突计算机制","summary":"1951年，张香桐提出顶端树突具有电兴奋性、能整合突触输入，此后75年没人拿到活体证据。2026年10月16日，中科院脑科学与智能技术卓越创新中心徐宁龙团队在《科学》发表论文，第一作者是博士后张园。她训练小鼠做「声音高低判断」任务，类别边界会无预警切换，动物只能靠奖励反馈推断隐藏规则；再用亚细胞分辨率双光子成像同步记录同一神经元的顶端树突与胞体，发现树突编码「推断出的抽象规则」、胞体表征听觉输入，两者非线性整合后输出决策。为证明树突不是旁观者，团队用光遗传学抑制顶端树突，胞体的选择信号随之显著减弱。审稿意见称这项工作「堪称一场英雄式的探索」。","traits":["肯做第137遍","不信巧合","先怀疑自己","接手无人区","把追问带到下一站"],"methods":["从最简单的范式起步：接手课题后不直接上复杂任务，先在简单任务里跑通，再一版一版往上加，直到「类别边界会无预警切换」","把动物训练成能回答问题的被试：一只小鼠要练约两个月，才稳定完成规则切换任务","在同一个细胞里同时看两处：用亚细胞分辨率双光子成像，同步记录同一神经元的顶端树突和深层胞体，而不是各记一个细胞再对比","选一种没人愿意碰的细胞：锁定听觉皮层第五层 ET 亚型锥体神经元——团队前期已证实这类细胞直接参与决策","看到不一致先不信自己：最初发现树突与胞体信号不一样时全组都很意外，因为此前不涉及规则推理的实验里二者往往一致；她做多轮重复验证才敢下结论","不只「看到」，还要「关掉」：用光遗传学激活 SST 中间神经元、特异性抑制顶端树突，再看胞体的选择信号是否减弱，把相关做成因果","认下代价：开颅、病毒标记、抓亚细胞钙信号，成功率极低；全球能跑通整套体系的实验室只有三四家","带着别人的问题走：导师吴建屏在组会上反复追问「树突到底在做什么样的信息处理」，她把这道追问接过来做了数年"],"story":[{"t":"1951","d":"张香桐发表树突电位论文，提出顶端树突具有电兴奋性并能整合突触输入；当时没有技术能直接验证"},{"t":"此后数十年","d":"吴建屏在组会上反复追问：「锥体神经元长得像一棵树，但这棵树的枝叶部分——树突，到底在做什么样的信息处理？」"},{"t":"读博至今","d":"徐宁龙带着这道追问做了近十年；团队成员张园接手课题，从简单任务开始反复迭代行为范式，前后数年"},{"t":"2026-10-16","d":"论文《Dendritic computation for abstract rule-based flexible decision-making》在《科学》在线发表，张园为第一作者"},{"t":"2026-10 之后","d":"张园将独立开展研究，方向是树突整合异常如何造成认知缺陷"}],"quotes":["能在行为过程中特异性记录，并且调控树突活动的实验，在现有文献中极为稀少，技术挑战巨大，这项研究堪称一场「英雄式的探索」。（《科学》审稿意见）","不是简单的1+1，两种信号共同作用时，会产生远超线性求和的输出。（徐宁龙）"],"writingUse":"「硬核技术流」最容易写虚，因为读者看不懂实验。张园的可用之处在于她的动作全是可以拍的：一只小鼠练两个月、开颅、往细胞里注病毒、在显微镜前等一个成功率极低的信号、发现数据和预期不符时先怀疑自己然后重复验证。写这类角色，别写她聪明，写她肯把同一件事做第 137 遍。她的戏剧张力不在「天才灵光」，在「一只小鼠两个月」这种时间换算率上——别人一年出三篇，她三年等一个不一致的信号。适合放在「长周期攻坚 × 短周期考核」的冲突里。","sources":[{"publisher":"中国科学院（转《科技日报》）","title":"新研究发现单个神经元即可完成高级认知计算","url":"https://www.cas.cn/cm/202610/t20261019_5122455.shtml"},{"publisher":"科学网·中国科学报","title":"为AI发展带来新启示，我国科学家破解大脑决策「微观密码」","url":"https://news.sciencenet.cn/htmlnews/2026/10/573150.shtm"},{"publisher":"腾讯新闻","title":"Science：徐宁龙团队首次揭示认知灵活性的神经元树突计算机制","url":"https://news.qq.com/rain/a/20261017A04BSW00"},{"publisher":"中国实验动物学会","title":"新研究证实树突计算为认知灵活性在细胞层面信息处理基础","url":"http://www.calas.org.cn/article/view?cid=8_22_8319"}]},{"id":"li-xiaoran","name":"李小冉","alias":"徐佳宁前妻 · 「长公主」","identity":"演员","category":"娱乐圈","date":"2026-10-20","heat":84,"headline":"李小冉官宣离婚!前夫被执行2111万,她一句“互不牵扯”后深夜开撕营销号","summary":"2026年10月19日19:40，李小冉在微博写了十二个字官宣离婚：「去年已离，互不牵扯，互不打扰，祝各自安好。」当晚相关话题冲到娱乐热搜第一。三个小时后，10月20日凌晨1:59，她再次发文——这一次对准的不是前夫，是营销号。原因是对方编出「工作室7月曾辟谣婚变」的剧本，用她的沉默做成「前后打脸」。她曾亲自去对方评论区留言澄清，评论被秒删。于是她回自己主页开火，只提一个要求：「工作室啥时候辟过谣了，你甩截图啊」。同期曝出前夫徐佳宁及任职公司新增被执行人信息、执行标的超2111万元，而她早在2025年中期就退出了相关公司股权——「互不牵扯」四个字说得起。","traits":["话少，一句顶一段","先体面，后翻脸","只认证据不认态度","被删了就不再求人","骂人不带脏字的反面——带脏字","提前把账切干净"],"methods":["用最短的话收尾：官宣只写十二个字「去年已离，互不牵扯，互不打扰，祝各自安好」，不解释原因、不控诉对方、不写小作文","先走最轻的一步：看到营销号编「工作室辟谣」，她先去对方博文评论区留言澄清，没有一上来就发律师函","被删后换阵地：评论被秒删，她不再私信不再求，直接回自己主页发文——「删除我评论对吧，你那么见不得人吗，真话就秒删」","挑凌晨1:59发：等话题开始沉、等对方睡了，第二天醒来全网只能看到她的版本","只提一个可验证的要求：「工作室啥时候辟过谣了，你甩截图啊」——把「离没离」的争论一把拽回证据层","用糙话把对方体面剥掉：「没有你就是只会造谣见不得光的乌龟」，不维持优雅，也不给对方留台阶","提前把财务切开：2025年中期已退出与徐佳宁相关的影视公司股权，所以敢在声明里写「互不牵扯」"],"story":[{"t":"2015-08","d":"比利时布鲁塞尔古堡婚礼，徐佳宁那句「给你五个亿，让你随便作」被传了十一年"},{"t":"2025-11","d":"两人在北京办完离婚手续；此前她已退出与徐佳宁相关的商业公司"},{"t":"2026-07","d":"网传两人离婚，双方均未回应——营销号为三个月后的「曾辟谣」剧本埋下伏笔"},{"t":"2026-10-19 19:40","d":"发十二字官宣，话题冲上娱乐热搜第一"},{"t":"2026-10-19 深夜","d":"营销号编出「工作室7月辟谣」的「前后打脸」剧本；她到评论区澄清，留言被秒删"},{"t":"2026-10-20 01:59","d":"发长文开撕，要求对方「甩截图」"}],"quotes":["去年已离，互不牵扯，互不打扰，祝各自安好。","一忍再忍不想占用公共资源，你们真是谎话张口就来，工作室啥时候辟过谣了，你甩截图啊！","删除我评论对吧，你那么见不得人吗，真话就秒删。","一天到晚就是胡说八道东拼西凑那点玩意，看到了还继续为了流量瞎编，你心是坏的吗！","没有你就是只会造谣见不得光的乌龟。"],"writingUse":"写「体面人发火」最好用的模板。她的火不是从头烧到尾的：先是十二个字的冷静，再是去别人地盘低声澄清，被删之后才炸——三段式，每一段都比上一段成本高。写这类角色要给她一个「只提一个要求」的习惯（你甩截图啊），因为真正厉害的人吵架不铺开战场，只锁一个点。也别忘了她提前一年就把股权退了：她敢说「互不牵扯」，不是因为硬气，是因为账早算完了。这种「狠是有准备的」比当场发飙更值得写。","sources":[{"publisher":"腾讯新闻","title":"李小冉官宣离婚!前夫被执行2111万,她一句“互不牵扯”后深夜开撕营销号","url":"https://news.qq.com/rain/a/20261020A03IY500"},{"publisher":"腾讯新闻","title":"李小冉官宣离婚后深夜硬刚,驳斥营销谣言,拒绝被随意编造故事","url":"https://news.qq.com/rain/a/20261020A03S0G00"},{"publisher":"360娱乐","title":"李小冉否认工作室曾辟谣离婚传闻 怒斥网友一天到晚胡说八道","url":"https://yule.360.com/detail/5257504"}]},{"id":"wu-an","name":"吴岸","alias":"《自然》论文的共同第一作者 · 已故","identity":"神经科学家 · 原加州大学圣地亚哥分校项目科学家","category":"顶级人类","date":"2026-10-20","heat":90,"headline":"31岁中国女学者命丧异国火灾,警方称系故意纵火;最新:其生前研究近期登上顶刊《自然》,导师曾流泪称“她走后,很多实验其他人做不了”","summary":"2026年10月14日，一篇神经科学论文在《自然》正式发表，署名8位作者，吴岸排在第二位，与 Qiyu Chen 并列共同第一作者。论文致谢写：「谨以此文纪念我们的朋友和同事吴岸，并向她尚在世的父母致以慰问」。她没能看到这一天——2023年3月16日，蒙特利尔老城一栋历史建筑五级大火，7人死亡，31岁的吴岸在遇难者名单里。她是去参加学术研讨会的：3月9日至14日在蒙特利尔开会，会上报告的项目，就是三年后发在《自然》上的这一篇。会后她通过爱彼迎在老城短宿一晚，计划次日飞回圣地亚哥。父亲接到她导师的电话，导师在电话里泪流满面，说了一句让这件事彻底沉下来的话：「吴岸走后，实验室很多实验无法开展，因为需要的技术只有吴岸会，其他人做不了。」","traits":["手里有一门别人接不住的手艺","追问题追到神经元那一级","没做完就敢公开讲","不解释，只做实验","让后来的人能沿着走"],"methods":["一路把题目往更硬的地方推：博士期间研究「不同的口味如何在大脑里体现」，到加州大学圣地亚哥分校后转向嗅觉系统如何灵活检测不同气味，最后集中到大脑运动系统","把问题拆到神经元一级：她要弄清的是「大脑中产生的特定神经元活动如何指导运动的产生」，不是行为层面的描述，也不是统计层面的相关","练出一门没有第二个人会的手艺：导师对父亲的原话是「她走后，实验室很多实验无法开展，因为需要的技术只有吴岸会，其他人做不了」","在项目没做完的时候就拿到会上讲：2023年3月9日至14日蒙特利尔那场研讨会，她报告的内容正是三年后《自然》论文的核心","把关键实验亲手做掉：同事的评价是「项目最初的想法和很多关键的实验都离不开她」","留下一条能被人接着走的路：同事说「我们后来的工作也一直是沿着她打下的基础往前走」——三年，8个人，把这件事做完了"],"story":[{"t":"2016","d":"获迈阿密大学神经科学博士学位，后在加州大学圣地亚哥分校任项目科学家"},{"t":"2023-03-09 至 14","d":"在蒙特利尔参加学术研讨会，报告中已包含后来《自然》论文的核心内容"},{"t":"2023-03-15","d":"会后通过爱彼迎在老城一家旅馆短宿一晚，计划次日飞回加州圣地亚哥"},{"t":"2023-03-16","d":"蒙特利尔老城一座历史建筑发生五级大火，吴岸失联；十余日后警方确认7人死亡，其中之一是她，31岁"},{"t":"2023-08-31","d":"蒙特利尔警方表示火灾系故意纵火，案件进入刑事调查阶段"},{"t":"2026-03-18","d":"63岁律师兼商人埃米尔·贝纳莫尔被捕，被控7项过失杀人罪、8项过失致人身体伤害；多次出庭，尚无宣判"},{"t":"2026-10-14","d":"论文在《自然》正式发表：8位作者，吴岸与 Qiyu Chen 并列共同第一作者"},{"t":"2026-10-18","d":"父亲收到吴岸同事消息，向南都记者展示论文与致谢"}],"quotes":["吴岸走后，实验室很多实验无法开展，因为需要的技术只有吴岸会，其他人做不了。","这个项目最初的想法和很多关键的实验都离不开她，我们后来的工作也一直是沿着她打下的基础往前走。","能在《自然》上发文是我们领域最高的成就之一，而吴岸正是推动这项研究的核心力量。","谨以此文纪念我们的朋友和同事吴岸，并向她尚在世的父母致以慰问。","不伤心我夫妻自己，只是为吴岸悲伤！"],"writingUse":"这是「被拿走的东西不是署名，是时间」的样本。她没有失去第一作者——三年后同事把她的名字放在第二位、并列共同一作，还在致谢里写了悼词。真正残忍的地方在于：一项只有她会做的技术，随她一起停摆了三年。写这类人物别写「天才」，写「不可替代的具体位置」——导师那句「很多实验其他人做不了」，比任何形容词都有用。她的性格也可以从选题路径里读出来：口味→气味→动作，一路往更难、更不可替代的地方走，这种人往往不擅解释，只会把手上的活做到没有第二个人能接手。","sources":[{"publisher":"今日头条 · 德州晚报","title":"31岁中国女学者命丧异国火灾,警方称系故意纵火;最新:其生前研究近期登上顶刊《自然》,导师曾流泪称“她走后,很多实验其他人做不了”","url":"https://www.toutiao.com/article/7698008063319540233/"},{"publisher":"网易新闻 · 南方都市报","title":"中国女学者命丧异国火灾,警方称系故意纵火;最新:其生前研究近期登上顶刊《自然》;导师曾流泪称“她走后,很多实验其他人做不了”","url":"https://c.m.163.com/news/a/L9I3VJ7305129QAF.html"}]},{"id":"yuantong-wangdian-zhuguan","name":"圆通余杭网点客服主管","alias":"把罚款规则讲给记者的网点主管","identity":"圆通速递杭州余杭仁和网点客服主管","category":"社会切片","date":"2026-10-20","heat":78,"headline":"孕妇被快递员找上门质问,吓到先兆流产,圆通深夜道歉","summary":"2026年10月9日，杭州余杭怀孕七个月的刘女士通过菜鸟裹裹下单寄纸质发票，快递员告知发票不能寄、订单已标记取件线上取消不了，让她打客服电话。她打过去，只问了一句为什么发票现在不能寄。电话挂断没多久，快递员罗师傅急促上门敲门，带着哭腔质问她为什么投诉——「该投诉会让他罚款400元，一天收入全部扣光」。当晚她被诊断为先兆流产，医嘱居家静养。10月17日《1818黄金眼》报道后，网点客服主管对记者把内部规则讲了出来：客户进线咨询即生成投诉工单，一条罚100元，网点没有撤销权限，只能向上申诉；她还主动提醒记者，向总部报单号就容易生成投诉工单。10月19日深夜圆通发声明，把这些话逐条否掉——「均不属实」，并公布精确到秒的数据：全事件只发生一笔考核20元，对象是网点客服，原因是「客诉工单处理超时」。","traits":["知无不言","把系统的底账讲给外人听","替一线算钱","顺手教记者怎么踩雷","讲完就被自己的组织定性成不实"],"methods":["记者问一句，她把工单逻辑从头讲一遍：「客户进线咨询即生成投诉工单，一条工单罚款100元」","把权限边界说清楚：「即便菜鸟没有登记投诉，流转至圆通系统后也会归类为投诉，网点没有撤销权限，只能向上申诉」","顺手把风险教给记者：「向圆通总部报快递单号就容易生成投诉工单」——主动提醒对方别说错话","替快递员把账算出来：客户只是咨询，系统里却成了投诉，一条400元，等于一天收入归零","对记者的提问不设防：分公司客服主管的身份、系统的运作方式、网点的申诉困境，全部倒出来","事后只做最小处置：网点称会对快递员批评教育，可考虑申请调整派送片区"],"story":[{"t":"2026-10-09","d":"刘女士下单寄纸质发票，被告知发票不能寄、线上取消不了，转打客服；她只问了一句「为什么现在不能寄」"},{"t":"2026-10-09 当天","d":"快递员罗师傅急促上门质问「为什么投诉」，带哭腔称一条投诉扣400元；刘女士报警，当晚急诊诊断先兆流产"},{"t":"2026-10-09 之后","d":"刘女士看到内部工单，问题类别标注为「业务员服务态度」；菜鸟裹裹核查确认她并未提交投诉"},{"t":"2026-10-17","d":"《1818黄金眼》报道；网点客服主管对记者讲出「进线即工单、一条100元、网点无权撤销」"},{"t":"2026-10-19 深夜","d":"圆通发声明致歉，称上述说法「均不属实」，公布唯一一笔考核20元（对象是网点客服，原因为工单处理超时）；快递员调离原区域，省区网管负责人被处罚，涉事网点与客服通报批评"},{"t":"2026-10-20","d":"双方协商：公司赔付500元，网点主管个人再补500元；刘女士要求涉事快递员调离本片区"}],"quotes":["客户进线咨询即生成投诉工单，一条工单罚款100元。","即便菜鸟没有登记投诉，流转至圆通系统后也会归类为投诉，网点没有撤销权限，只能向上申诉。","向圆通总部报快递单号就容易生成投诉工单。","该投诉会让他罚款400元，一天收入全部扣光。","平台严苛的考核机制，将矛盾转嫁到客户与快递员之间，存在明显隐患。"],"writingUse":"这是「体制里说真话的人」的教科书样本：她不是举报者，也不是受害者，她只是被记者问了一句，就把内部规则一条条讲了出来——包括那条「报单号就会变投诉」的提醒。结果是她的真话在24小时内被自己的公司定性为「不实言论」，她本人被通报批评。写这类角色，关键不在她说了什么，而在她说的时候毫无防备：她以为自己在解释系统，其实在交出系统。也别忘了她给的两个数字——100元和400元，一个系统的重量就是靠这种数字显形的。","sources":[{"publisher":"澎湃新闻","title":"孕妇被快递员找上门质问,吓到先兆流产,圆通深夜道歉","url":"https://m.thepaper.cn/newsDetail_forward_34287911"},{"publisher":"大众网 · 潮新闻","title":"圆通深夜回应“客户取消快递订单被记为投诉”事件:向客户道歉","url":"https://hb.dzwww.com/p/p5eqIfeTvGf.html"},{"publisher":"网易 · 第一财经资讯","title":"孕妇被快递员找上门质问，吓到先兆流产，圆通深夜道歉","url":"https://www.163.com/dy/article/L9M1C77P0519DDQ2.html"}]},{"id":"zhao-jingli-jianglaolao","name":"赵经理","alias":"「江捞捞」总部负责人","identity":"青岛航向远方企业管理咨询有限公司负责人","category":"商界狠人","date":"2026-10-20","heat":76,"headline":"“江捞捞”总部被质疑关门跑路!青岛一饭店老板投百万加盟,开店4个月倒闭维权受阻!公司回应:租金到期,正居家办公","summary":"山西王先生去年11月加盟「江捞捞」自助火锅，选址青岛城阳高新区览秀城，前后投入100多万元（另有报道称150万元），经营4个月资金链断裂闭店。开业前线上预售近80万元、定价59.9元/人；开业数天后他算账发现维持这个价必亏，于是上调定价，结果开业十多天预售退款就达五六十万元——他已经生疑，「但前期投入已很多，只能继续经营」。今年7月闭店后，他把价值数万元的存货交给公司代处理，去总部发现人去楼空，负责人把他拉黑。2026年10月19日，半岛全媒体记者找到公司负责人赵经理，得到的是另一套说法：没跑路，办公室租约到期，春节前是业务淡季，全体员工居家办公；「一切业务正常，不会推卸责任」；对方没有证据证明夸大宣传，巨额损失也没有依据由公司承担；王先生网上发帖影响公司形象，先消除影响，再谈存货和退费——目前暂不处理。","traits":["把话说满又不留把柄","用日程表解释消失","把因果顺序倒过来","给退款装一道前置条件","只接证据，不接情绪"],"methods":["先否掉定性，再补理由：「公司并未跑路」——理由是「租赁的办公场地到期」加「春节前是业务淡季」，结论是「所有员工居家办公」","用一句无主语的承诺收尾：「一切业务正常，不会推卸责任」——不断言细节、不落到具体动作、不给自己设期限","把举证责任推回去：「对方并没有证据证明公司夸大宣传」「王先生提出的巨额损失也没有依据证明应由公司承担」","把「不退款」改写成「有条件退款」：先要求王先生消除网上发帖对公司形象的影响，再「处理最后的存货，并协商退还相关费用」，且「目前暂不处理」","不靠口头承诺，靠合同定性：公司与加盟商签的是「创业指导服务协议」而非加盟合同，口径是「合同中从未有过盈利承诺」","对两家媒体说同一套话：10月初对《生活帮》，10月19日对半岛全媒体，说法完全一致——「已按合同履约」"],"story":[{"t":"2025-11","d":"王先生加盟「江捞捞」自助火锅，选址青岛城阳高新区览秀城；据其自述前后投入100多万元（另有报道称150万元）"},{"t":"2026 年初","d":"开业前线上预售近80万元、定价59.9元/人；开业数天后算账发现维持此价必亏，上调门店定价"},{"t":"开业十多天","d":"预售退款达五六十万元；王先生已生疑，「但前期投入已很多，只能继续经营」"},{"t":"2026-07","d":"经营4个月后资金链断裂闭店；价值数万元存货交由公司代处理"},{"t":"2026-10 初","d":"《生活帮》联系公司，工作人员称双方签的是「创业指导服务协议」而非加盟合同，已按合同履约"},{"t":"2026-10-19","d":"王先生到总部发现人去楼空、被负责人拉黑；半岛全媒体记者采访赵经理，得到「租约到期、居家办公」的回应"}],"quotes":["公司一切业务正常进行。到春节前这段时间正好是业务淡季，加上租赁的办公场地到期，公司决定所有员工居家办公。","一切业务正常，不会推卸责任。","对方并没有证据证明公司夸大宣传，王先生提出的巨额损失也没有依据证明应由公司承担。","如果消除这些影响，他们会处理最后的存货，并协商退还相关费用。目前暂不处理。","感觉对方一开始就在套路。"],"writingUse":"写「体面的对手」用这个。他全程没有一句狠话，甚至说了「不会推卸责任」——但每一个动作都在推：租约到期替代跑路，淡季替代停摆，合同定性替代口头承诺，先消除影响替代退钱。这类角色最可怕的不是凶，是每句话都合法。写法上给他一个固定句式：先否定指控的名词（不是跑路），再给一个日常理由（到期、淡季），最后落到一句没有主语的承诺。三段说完，记者也问不下去。另外注意那个被拉黑的细节——语言越客气的人，动作往往越干净。","sources":[{"publisher":"新浪财经 · 半岛全媒体","title":"“江捞捞”总部被质疑关门跑路!青岛一饭店老板投百万加盟,开店4个月倒闭维权受阻!公司回应:租金到期,正居家办公","url":"https://finance.sina.com.cn/wm/2026-10-20/doc-inivvhfz6673948.shtml"},{"publisher":"澎湃新闻","title":"“江捞捞”总部被质疑关门跑路!青岛一饭店老板投百万加盟,开店4个月倒闭维权受阻!公司回应:租金到期,正居家办公","url":"https://www.thepaper.cn/newsDetail_forward_34286630"},{"publisher":"闪电新闻","title":"投资150万元开“江捞捞”火锅店 “承诺月入七八十万元 实际月月亏损” 涉事公司:从未做出过相关承诺 “签的是创业指导服务协议 非加盟合同”","url":"https://sdxw.iqilu.com/w/article/YS0yMS0xNzQ0NjUxMg.html"}]},{"id":"fuzhou-jingqu-xiaobian","name":"福州景区新媒体小编","alias":"回「这点粉丝报什么名」的官号运营","identity":"福州日溪峡谷瀑布景区新媒体运营","category":"社会切片","date":"2026-10-20","heat":66,"headline":"福州一景区征集体验官,参选网友被怼“这点粉丝报什么名”,景区:年轻员工情绪化回复","summary":"福州日溪峡谷瀑布景区招茶室探店体验官，招募信息写明了门槛：粉丝数不少于300、拍照功底在线，入选可享门票与茶饮。一位只有26个粉丝的网友在招募帖下评论「好呀好呀带上我的好姐妹拍拍拍」，被景区官方账号回复「这点粉丝报什么名」，随后账号被拉黑。10月19日记者私信求证，发帖者未回复，但此前配文写得很清楚：一直想去玩，看到有活动就当个气氛组评论一下，「不符合条件不同意就好了，没想到被拉黑了」。景区工作人员当天回应：这是新媒体部门一位工作人员的情绪化回复，「这件事对我们（影响）很严重，工作人员是个小孩子，太年轻，目前已经离职了」。招募帖下相关评论已删除。","traits":["把粉丝数当门牌号","多回一句","拉黑代替不回复","用官号说私话","走了连名字都没留下"],"methods":["门槛写在招募信息里，也写在回复里：300粉是明规则，「这点粉丝」是暗话——同一件事说两遍，第二遍带刺","对不符合条件的报名不回绝，回一句嘲讽：「这点粉丝报什么名」","嘲讽完立刻拉黑：让对方连追问的入口都没有，评论区只留下自己那一句","用蓝V官号说私话：不切小号、不注明「个人观点」，回复直接挂在景区账号下","事后由单位出面定性：一句「小孩子，太年轻」把责任落在年龄上，再加一句「已经离职了」，把人和事一起收走"],"story":[{"t":"2026-10 中旬","d":"景区发布茶室探店体验官招募，门槛为粉丝≥300、拍照功底在线，福利为门票与茶饮"},{"t":"某日","d":"一位26粉网友在招募帖下评论「好呀好呀带上我的好姐妹拍拍拍」"},{"t":"10 分钟内","d":"景区官号回复「这点粉丝报什么名」，随后拉黑该网友"},{"t":"随后","d":"该网友发帖晒截图，话题发酵；景区招募帖下相关评论被删除"},{"t":"2026-10-19","d":"景区回应：系新媒体部门工作人员情绪化回复，「小孩子，太年轻，目前已经离职了」"}],"quotes":["这点粉丝报什么名......","好呀好呀带上我的好姐妹拍拍拍","这件事对我们（影响）很严重，工作人员是个小孩子，太年轻，目前已经离职了。","不符合条件不同意就好了，没想到被拉黑了。"],"writingUse":"一句话立住的配角样本。她全部的戏就是一句「这点粉丝报什么名」加一个拉黑动作，但人物已经完整了：她把岗位给的权力当成了自己的身价。写这种角色不用给背景、不用给动机，给她一个动作就够——不解释、不回复、直接拉黑。更好用的是后面那一层：单位用「小孩子，太年轻，已经离职了」把她交出去，人和事一起消失，连名字都没留下。这种「一句话闯祸、被组织一句话处理掉」的年轻人，是当代职场最容易被写成道具、也最容易被写成主角的一类人。","sources":[{"publisher":"腾讯新闻 · 潇湘晨报","title":"福州一景区征集体验官,参选网友被怼“这点粉丝报什么名”,景区:年轻员工情绪化回复","url":"https://news.qq.com/rain/a/20261019A05HVM00"},{"publisher":"今日头条 · 闪电新闻","title":"“这点粉丝报什么名”,网友报名参选景区体验官被怼懵","url":"https://www.toutiao.com/article/7698560114084610603"}]},{"id":"zhang-xue-canteen","name":"张雪","alias":"机车品牌创始人","identity":"机车品牌创始人 · 公司食堂米饭风波的发起者","category":"商界狠人","date":"2026-10-21","heat":74,"headline":"张雪回应米饭风波称“基本搞定”，公开招聘一名优秀的食堂主管，称“如果连同事们的伙食都照顾不好，那一定是个烂公司”","summary":"10月19日，张雪发视频向全网求助：公司一千多人的食堂，大锅蒸出来的米饭始终不如家用小电饭煲，谁有办法，他可以按方案买设备、选大米，还付咨询费。视频发出后不少人专程把大米送到公司。10月20日他再发视频回应：米饭问题「基本搞定」，同时公开招聘一名食堂主管，理由是「之前让行政优化了很多次，都没有好的结果」；他说吃饭是头等大事，「如果连同事们的伙食都照顾不好，那一定是个烂公司」，并请大家不要再送米——如果换米就能解决，团队自己就能办。","traits":["把内部问题公开化","24 小时内给结果","用招聘代替解释","把拒绝说成原则","把标准说成人话"],"methods":["把家丑放到台面上悬赏：视频里直说自家一千多人的食堂米饭不如家用电饭煲，谁有办法，可以买设备、选大米，还付咨询费","第二天就交结果：不等方案完美，先发一条「基本搞定」，把悬而未决的状态结束掉","用招聘动作兑现承诺：说问题解决了，紧接着公开招聘一名食堂主管——不是解释怎么解决的，是让组织里多一个负责的人","把「为什么以前不行」说成流程问题：「之前让行政优化了很多次，都没有好的结果」，再补一句「人不行就换掉」","拒收好意，但不伤人：网友送米，他说食堂并不需要大米；理由是「倘若仅靠换米就能改善口感，团队完全可以自行解决」","把标准降到一句大白话：「吃饭是头等大事」「如果连同事们的伙食都照顾不好，那一定是个烂公司」"],"story":[{"t":"2026-10-19","d":"发视频向全网征集思路，坦言大锅蒸的米饭和家用小电饭煲有差距，愿意为有效方案购置设备、支付咨询费"},{"t":"2026-10-19 之后","d":"网友大量留言建言，有人建议升级设备、有人分享加食用油等技巧，还有人专程把大米送到公司"},{"t":"2026-10-20","d":"再发视频回应：米饭「基本搞定」，公开招一名食堂主管；请大家不要再送米"},{"t":"2026-10-20","d":"解释此前失败的原因：让行政优化了很多次都没有好结果；「只要用心，就没有做不好的事，人不行就换掉」"}],"quotes":["只要用心，就没有做不好的事，人不行就换掉。","如果连同事们的伙食都照顾不好，那一定是个烂公司。","食堂并不需要大米……倘若仅靠换米就能改善米饭口感，团队完全可以自行解决。"],"writingUse":"写「把私事当公事办的老板」用这个。他不是在作秀，是真把一碗米饭当成公司治理的探针：能为一千人吃饭公开求人，说明他把「细节做不好」当成组织问题，而不是面子问题。写他时给他两个动作就够——先是当众承认「我们连米饭都做不好」，然后第二天带一个具体的人事动作回来（招一个人、换一个人）。这种人不靠发火立威，靠「我说了，而且我第二天就办了」立威。适合写成主角身边那个不讲情面但讲结果的上司。","sources":[{"publisher":"新浪财经 · 青岛早报","title":"张雪回应米饭风波称“基本搞定”，公开招聘一名优秀的食堂主管，称“如果连同事们的伙食都照顾不好，那一定是个烂公司”","url":"https://finance.sina.com.cn/wm/2026-10-20/doc-inivwyqz7700368.shtml"},{"publisher":"温州网","title":"张雪：不要再给我们送米了","url":"https://www.66wz.com/wendu/system/2026/10/21/105857455.shtml"}]},{"id":"wang-xingxing-admit","name":"王兴兴","alias":"宇树科技创始人","identity":"宇树科技创始人兼 CEO · 人形机器人第一股","category":"商界狠人","date":"2026-10-21","heat":79,"headline":"宇树王兴兴罕见“认错”：不想昙花一现，要做百年企业！","summary":"2026年8月19日宇树科技以「人形机器人第一股」登陆科创板，首日股价冲到1100元、市值摸到4449亿，随后两个月最大回撤接近70%。10月20日，创始人王兴兴在上海工博会上公开承认，过去十几年自己最大的失误是「不够相信AI」；在红杉的访谈里他说得更直白：「我非常不希望我们只是昙花一现的一家公司，我们希望是一个长久的企业，甚至是一个百年企业。」他同时把行业拐点从3-5年提前到1-2年，还谈到期权池整体预留接近10%留给未来的人，以及「烦恼是守恒的」。","traits":["抢在别人定性前先认错","把长期主义落到制度","用比喻讲工程","把困境说成守恒","不押单一爆款"],"methods":["在公开场合把「最大的失误」说成自己的判断错误，不推给市场、团队或对手：「过去十几年自己最大的失误，就是不够相信AI」","认错之后立刻宣布转向：把行业拐点从3-5年提前到1-2年，让「我错了」变成「我要改了」的时间表","给公司一句能被反复引用的短句：「不想昙花一现，我们想做一家百年企业」","把长期主义变成钱和人：期权池整体预留接近10%，不是给老员工少发，而是留给未来要引进的顶尖人才","用一句比喻解释技术路线：「软件决定机器人有多聪明，硬件决定这份聪明能不能真正用起来」","把困境说成守恒：「烦恼是守恒的」，公司做大只是换一种麻烦——先降低外界对「熬到某个节点就能躺平」的期待"],"story":[{"t":"2026-08-19","d":"宇树科技登陆科创板，发行价150.8元，上市首日股价冲到1100元，巅峰市值约4449亿"},{"t":"2026-09 至 10","d":"股价一路回落到420元附近，两个月最大回撤接近70%；上半年营收11.52亿、扣非净利润下滑19.34%，摩根大通给出减持评级"},{"t":"2026-10-13","d":"公开表示过去十几年低估了AI做机器人的能力"},{"t":"2026-10-20","d":"在上海工博会上当众认错；同一时期在红杉访谈里谈百年企业、期权池与「烦恼守恒」"}],"quotes":["过去十几年自己最大的失误，就是不够相信AI。","我非常不希望我们只是昙花一现的一家公司，我们希望是一个长久的，甚至是一个百年企业。","软件决定机器人有多聪明，硬件决定这份聪明能不能真正用起来。","烦恼是守恒的。","千万别把短期走红当成长期竞争力。"],"writingUse":"写「会认错的老板」用这个，但别写成诚恳道歉——他的认错是有时间差的战术：股价腰斩、被质疑「只会表演」，他才在公开场合承认判断失误，同一场发言里就把行业拐点从3-5年提前到1-2年。认错和转向是一句话的两半。写法上给他一个固定结构：先承认自己错在哪（不够相信AI），再给一个新的时间表（一两年见拐点），最后落一句能被人记住的口号（百年企业）。这种人最难写也最好用——他不是坏人，他是永远在给市场讲下一个故事的人。","sources":[{"publisher":"OFweek 机器人网 · 大厂财经社","title":"宇树王兴兴罕见“认错”：不想昙花一现，要做百年企业！","url":"https://robot.ofweek.com/2026-10/ART-898890-12001-30707868.html"}]},{"id":"fan-zhendong-toupai","name":"樊振东","alias":"小胖","identity":"乒乓球运动员 · 超级大满贯得主","category":"社会切片","date":"2026-10-21","heat":70,"headline":"樊振东发声抵制偷拍 呼吁尊重隐私边界","summary":"10月21日，樊振东在社交媒体发文抵制偷拍。他说换位思考，没有人愿意被偷拍；无论偷拍者的身份、心态或目的如何，这类行为本质上都是不尊重他人、侵犯隐私，即使是以爱为名或延迟发布。他强调「边界感强并不等同于冷漠」——理智的球迷或友善的路人不会举着手机开着摄像头跟他打招呼，他反而乐于回应；但一边拍摄一边喊话的人，他分不清是支持他的球迷还是为流量的自媒体。此前他多次呼吁抵制饭圈化，2024年还曾发文称身份证号被传播造谣。","traits":["划边界不带火气","先共情再立规","只判行为不判人","把界线说具体","同一件事说四年"],"methods":["先站到对方位置再立规矩：「换位思考，没有人愿意被偷拍」","只给行为定性，不给人定性：无论身份、心态、目的如何，都是不尊重他人、侵犯隐私","主动堵住可能的误读：「边界感强并不等同于冷漠」——先把「你是不是耍大牌」这条反驳掉","把界线画成具体动作：举着手机开着摄像头打招呼的不回应，正常互动他乐于回应","承认自己的局限而不是指控对方：「我确实无法分辨对方是支持我的球迷还是为了流量的自媒体运营者」","同一件事说很多年：2021年机场被围拍、2022年拜年、2024年身份证号被传播，每次都用公开文字说一遍"],"story":[{"t":"2021-09-13","d":"国乒从广州出发参加全运会，大批粉丝在机场近距离拍摄；当天他通过球迷会微博发声，说自己赛场之外也是普通人，需要私人空间"},{"t":"2022 春节","d":"给网友拜年时再次强调，希望球迷不要以关心之名做出不当言行，共同抵制饭圈化"},{"t":"2024-03","d":"发文称自己的身份证号被传播造谣，提醒触碰法律红线"},{"t":"2026-10-21","d":"再次发文抵制偷拍，提出「边界感强并不等同于冷漠」，并区分理智球迷与拍客"}],"quotes":["换位思考，没有人愿意被偷拍。","无论偷拍者的身份、心态或目的如何，这类行为本质上都是不尊重他人和侵犯隐私的行为，即使是以爱为名或延迟发布扩散。","边界感强并不等同于冷漠。","我确实无法分辨对方是支持我的球迷还是为了流量的自媒体运营者。"],"writingUse":"写「划边界的人」，别写成发火。他的方法是一层层把线画清楚：先共情（没人愿意被偷拍），再定性（这是侵犯隐私，不以爱为名豁免），再堵误读（边界感强不等于冷漠），最后给一个可执行的标准（举着手机开着摄像头的不回应，正常互动他乐意）。这类角色在小说里最有用的是「不动怒的拒绝」——他越平静，越显得那条线不可越过。适合写成主角身边那个不吵架、但谁也越不过他一步的人。","sources":[{"publisher":"中华网 · 新浪财经","title":"樊振东发声抵制偷拍 呼吁尊重隐私边界","url":"https://news.china.com/socialgd/10000169/20261021/49807034.html"}]},{"id":"xu-rongzhe-lecture","name":"许荣哲","alias":"踢桌子的写作老师","identity":"台湾作家 · 写作课讲师 · 「故事课」作者","category":"社会切片","date":"2026-10-22","heat":78,"headline":"没人听演讲 许荣哲发飙踹断女大生桌子还称「以后会谢我」 晚间道歉了","summary":"10月19日，作家许荣哲受邀到亚洲大学「永续发展」课程演讲。据三立新闻报道，一名女学生疑因不满他物化女性的言论而没有回应提问，他当场用力踢教室桌子，桌面脱离桌架。他先在脸书道歉，承认当时「既有情绪，也有演出的成分」、承认做得过头，向受惊学生和在场同学道歉并承诺负担医药费；但21日上午第二篇文又说「今天一定有很多人找我，因为我有事，下午才能回应」，接着让网友「先从我的书里找到解答」，贴出《故事课2》第13章内容与书籍照片，被批「什么时候了还在工商自己的书」。亚洲大学同日发声明切割，称他是单一课程受邀的校外讲者，已完成校安通报。","traits":["用冲突当教学法","失控后先认「演出成分」","道歉完顺手卖书","把解释拖到下午","让学生替他的方法作证"],"methods":["把课堂当剧场：据其著作《故事课2》所述，他曾在剧本创作课安排陌生人闯入教室、丢椅子、有人挂彩的冲突演出，等学员尖叫才喊「Cut」","失控后先给行为定性、再给动机：「既有情绪，也有演出的成分」——不否认踢桌，但把一半归给教学","道歉时给出可兑现的具体项：向学生道歉、承诺负担医药费","道歉之后立刻转场：第二篇文说「今天一定有很多人找我」，把回应推迟到下午","用作品代替回应：让网友「先从我的书里找到解答」，并贴出书中第13章与书籍照片","把学校拖进来当第三方：亚洲大学随后声明他是校外讲者、已完成校安通报，等于替这件事定了性"],"story":[{"t":"2026-10-19","d":"受邀到亚洲大学「永续发展」课程演讲，被指物化女性；一名女学生未回应提问，他当场踢桌致桌面脱离桌架"},{"t":"2026-10-20","d":"事件在网络曝光，校方介入"},{"t":"2026-10-21 上午 8 时许","d":"于脸书发文道歉，承认行为过头、有情绪与演出成分，承诺负担医药费"},{"t":"2026-10-21 上午 9 时许","d":"再发文称下午才能回应，请外界先从他的著作中找答案，并贴出书中内容与书籍照片，引发「借机行销」质疑"},{"t":"2026-10-21","d":"亚洲大学发声明：他是单一课程受邀校外讲者，不认同以不当言语或行为对待学生，已完成校安通报"}],"quotes":["既有情绪，也有演出的成分。","今天一定有很多人找我，因为我有事，下午才能回应。但大家的疑问，可以先从底下我的书里找到解答。","什么故事永远不会遗忘？答案是发生在自己身上的故事。"],"writingUse":"写「把课堂当舞台的老师」用这个。他真正的问题不是脾气，是他把「冲突」当成教学方法，然后自己先被冲突带走了。写这类角色有一个很好用的细节：他道歉时不否认事实，只把动机拆成两半——一半是情绪，一半是演出。这句话既是认错，也是辩解。更狠的一笔在第二天：他让所有人「先从书里找答案」，把一场道歉变成了新书宣传。这种人不是不知道分寸，是他相信自己的叙事能盖过别人的感受。","sources":[{"publisher":"三立新闻网","title":"作家許榮哲演講踢壞桌子道歉後又曬書！亞大發聲明切割：已完成校安通報","url":"https://rwdnews.sanlih.com.tw/news/1926013"},{"publisher":"中时新闻网","title":"没人听演讲 许荣哲发飙踹断女大生桌子还称「以后会谢我」 晚间道歉了","url":"https://www.chinatimes.com/cn/realtimenews/20261022000146-260405"}]},{"id":"huang-hongxuan-politics","name":"黄宏轩","alias":"抱怨政治文扰民的男星","identity":"台湾男演员","category":"娱乐圈","date":"2026-10-22","heat":66,"headline":"男星怨政治新闻「扰民」遭炎上！删文公开道歉","summary":"2026 九合一选举倒数 38 天，社群平台被政治内容洗版。黄宏轩在 Threads 发文抱怨「头好痛，每天打开社群，铺天盖地都是政治新闻」，说自己按了一百次「没兴趣」也没用，「真的很扰民」，还盼 11 月 28 日快点到。贴文曝光后惹怒部分网友，他在约 10 分钟后删文，并在留言区道歉：「可能我的措词让部分人感到不舒服了，不好意思。」他解释自己近期才变更户籍地址、这次没有投票资格，纯粹是社群内容让他感到压迫，重申想表达的只是个人使用感受，没有针对任何立场。","traits":["把私人烦躁发成公开抱怨","十分钟内删文","道歉时带上资格说明","反复强调「只是个人感受」"],"methods":["用生活化的痛感开场：「头好痛，每天打开社群，铺天盖地都是政治新闻」","把无力感量化：说自己按了一百次「没兴趣」，系统还是照推","把抱怨说成用户的正当需求：「我打开社群是想看有趣的事、吸收新资讯」","被骂后不解释立场，先处理情绪：「可能我的措词让部分人感到不舒服了，不好意思」","补一个能降低攻击面的事实：自己刚变更户籍、这次没有投票资格","把所有立场收回成个人体验：「想表达的只是个人的社群使用感受，并没有针对任何立场」"],"story":[{"t":"2026-10 中旬","d":"九合一选举进入倒数，社群平台政治内容密度骤增"},{"t":"2026-10-20 前后","d":"在 Threads 发文抱怨政治文洗版「真的很扰民」，希望 11/28 快点到"},{"t":"贴文曝光后约 10 分钟","d":"删除贴文，并在留言区公开道歉，说明自己没有投票资格"}],"quotes":["头好痛，每天打开社群，铺天盖地都是政治新闻。","可能我的措词让部分人感到不舒服了，不好意思。","原本想表达的只是个人的社群使用感受，并没有针对任何立场。"],"writingUse":"写「说错话的小人物」用这个，注意他不是坏人：他抱怨的东西大多数人私下也抱怨过，错在把它发到了公开时间线上。写法上给他三个节拍——先发（真实、带情绪）、再删（十分钟内，说明他知道怕）、最后道歉（先安抚情绪，再补一个对自己有利的事实：我没投票资格）。这类角色最好用的地方是「删得越快，越说明他清楚自己越界了」，而不是他不懂事。","sources":[{"publisher":"中时新闻网","title":"男星怨政治新闻「扰民」遭炎上！删文公开道歉","url":"https://www.chinatimes.com/cn/realtimenews/20261021002401-260404"},{"publisher":"三立新闻网","title":"受夠政治文洗版！黃宏軒怨「很擾民」挨轟　急刪文道歉：我沒投票資格","url":"https://rwdnews.sanlih.com.tw/news/1925806"},{"publisher":"FTNN 新闻网","title":"黃宏軒遭政治新聞洗版喊「擾民」！惹怒網友被炎上 10分鐘後急刪文道歉","url":"https://www.ftnn.com.tw/news/588983"}]},{"id":"wang-dongjian-diapers","name":"王东鉴","alias":"靠谱老王","identity":"深圳市步锐生物科技有限公司董事长 · 自媒体博主「靠谱老王」","category":"商界狠人","date":"2026-10-22","heat":82,"headline":"又一公司起诉“靠谱老王”，本人最新回应：铭记承诺！","summary":"自媒体博主「靠谱老王」（本名王东鉴，深圳市步锐生物科技有限公司董事长）此前以自测方式指多款纸尿裤检出甲酰胺，引发行业舆情。碧芭宝贝母公司爱朵集团称，事件造成全渠道销售额一度下滑六成、达人直播全部取消，已于10月20日向上海当地法院递交起诉文件；此前 Babycare 也已起诉，杭州中院9月20日受理。市场监管总局通报：复检 15 个品牌 58 批次样品均未检出甲酰胺；工信部组织专家复现其检测过程，发现检测方法未经严格确认、未将质荷比数据与甲酰胺精确质量数做偏差评估，无法得出检出结论。10月21日，王东鉴发文称会信守承诺、「铭记这份承诺，尊重调查组的调查结论」。","traits":["先把结论说死","把承诺顶到最高","被反证后只表态不辩解","博主与董事长两个身份切换"],"methods":["用自测数据把结论推到公共场：以「靠谱老王」的博主身份发布检测结果，让品牌方陷入自证","把承诺开到最大：「如果错了，坐牢都接受」——用极端代价换公众信任","被官方反证后不纠缠技术细节，只谈态度：「铭记这份承诺，尊重调查组的调查结论」","两个身份分工：以博主身份发声，以公司董事长身份回应经营，强调「公司正常运营」","不删帖、不消失：让官方结论与自己的承诺并列摆着，把「是否兑现」交给时间"],"story":[{"t":"2026 年内","d":"以自媒体「靠谱老王」名义检测并公开指多款纸尿裤含甲酰胺，引发行业舆情"},{"t":"2026-09-20","d":"Babycare 起诉「靠谱老王」及其两家关联公司，杭州中院受理"},{"t":"2026-10-20","d":"爱朵集团（碧芭宝贝母公司）向上海当地法院递交诉讼文件，称全渠道销售额一度下滑六成"},{"t":"2026-10 中旬","d":"市场监管总局通报：复检 15 个品牌 58 批次均未检出甲酰胺"},{"t":"2026-10-21","d":"王东鉴发文表示会信守承诺、尊重调查结论；同日称公司正常运营"}],"quotes":["此前我公开承诺：如果调查组最终定论纸尿裤中没有检出甲酰胺，我会公开道歉，并承担对应的法律责任。","如今官方结果已公布，我铭记这份承诺，尊重调查组的调查结论。","如果错了，坐牢都接受。"],"writingUse":"写「先开枪、后立誓的人」用这个。他最值得写的不是检测对不对，而是那句「如果错了，坐牢都接受」——承诺越重，兑现时的沉默越响。官方结论出来后，他没有辩解，也没有道歉，只说「铭记承诺、尊重结论」，把一句最硬的话变成了最软的姿态。这类角色在小说里适合写成舆论场的点火者：他不是坏人，他真心相信自己测出来的东西；但他也不打算为点火负责。写他的时候给他两个身份——台前是博主，台后是董事长，切换身份就是切换责任。","sources":[{"publisher":"同花顺 · 每日经济新闻","title":"因甲酰胺事件，销售额一度下滑六成”，又一公司起诉“靠谱老王”，本人最新回应：铭记承诺！他曾称“如果错了，坐牢都接受","url":"http://news.10jqka.com.cn/20261021/c680936080.shtml"}]},{"id":"liu-linlin-banned","name":"刘琳琳","alias":"130万粉「毒舌」主播","identity":"短视频主播 · 多平台合计约 130 万粉丝","category":"娱乐圈","date":"2026-10-23","heat":80,"headline":"130万网红“刘琳琳”翻车，账号被封！曾豪言年入千万，网友：活该","summary":"10月10日前后，主播刘琳琳在直播间与赵露思粉丝互喷，随后拿赵露思的爷爷（烈士）开玩笑，说出「化完妆去四川找爷爷」这类话。多个账号随即被禁止关注、作品清零。他先解释是「系统误判、假期客服不在、过阵子回来」，但账号接连被封，这个说法站不住。合作方「三海汇食品专营店」发声明「先烈不容调侃」终止合作，另一位网红也发文割席。此前他已有直播骂网友「祝你全家得病」、曝光网友 IP 的记录，还说过「你们越骂我，一天收入越稳」「一年大概千万」，而他自己晒出的直播年收入是 71.5 万元。","traits":["把冒犯当人设","拿收入暗示撑身价","翻车先怪系统","只对流量真诚","被切割前不道歉"],"methods":["拿最不能碰的东西换流量：直播里把烈士当梗，「化完妆去四川找爷爷」","把骂人包装成真性情：骂得越狠越像「不装」，观众骂他反而成了他没装的证据","用模糊数字撑身价：「一年大概千万」「存款九位数十位数」，从不说死，被扒了就说自己当初没坐实","翻车先怪系统：「系统误判、假期客服不在、过阵子回来」","等别人先表态：合作方先发「先烈不容调侃」终止合作，同行先发文割席，他始终没有正式道歉","对质量质疑打太极：被消费者打假时回「真真假假，假假真真，咱们将就吃」"],"story":[{"t":"2025-06","d":"直播中辱骂网友「祝你全家得病」，并曝光网友 IP；热度过后照常回归卖货"},{"t":"2026-10-10 前后","d":"直播与赵露思粉丝互喷，拿赵露思爷爷（烈士）开玩笑，事件性质升级"},{"t":"随后","d":"名下多个账号被禁止关注、作品清零；他解释为「系统误判、假期客服不在」"},{"t":"随后","d":"合作方「三海汇食品专营店」发声明「先烈不容调侃」终止合作；网红「单眼皮的小黄豆」发文割席"}],"quotes":["祝你全家得病。","你们越骂我，一天收入越稳。","系统误判、假期客服不在、过阵子回来。","真真假假，假假真真，咱们将就吃。"],"writingUse":"写「把冒犯当生意的人」，关键不是他嘴多脏，是他知道哪句话能换流量。这类角色最好用的地方在于「他始终不道歉」——不是嘴硬，是他算过账：道歉要掉粉，等风头过去还能回来。写法上给他一个固定套路：每句话都留后路（年入千万但不说死、系统误判但不说准），出事时有别人先跳出来切割，而他继续沉默。适合写成主角身边那个「早晚要塌」的搭档，或者反派阵营里负责试探底线的人。","sources":[{"publisher":"搜狐 · 新浪财经（财经八卦）","title":"130万网红“刘琳琳”翻车，账号被封！曾豪言年入千万，网友：活该","url":"https://www.sohu.com/a/1091150132_122014422"},{"publisher":"网易","title":"130万网红“刘琳琳”翻车","url":"http://www.163.com/dy/article/L9RSLR5H05568W0A_pdya11y.html"}]},{"id":"han-lu-chezhi","name":"韩路","alias":"车评人","identity":"汽车博主 · 前汽车之家主持人","category":"社会切片","date":"2026-10-23","heat":72,"headline":"时间久远管理也换人，韩路说和汽车之家消除误解了","summary":"10月19日深夜，车评人韩路发博控诉汽车之家：「两年前，汽车之家挂着韩路名义卖了重型游记节目，几百万的收入，从头到尾没跟我们说，并且希望0元购白嫖韩路。」这条微博转发 1365、评论 2176。两天后的 10月21日晚，他再发文：当天与汽车之家高管层沟通，「新的管理团队还是很积极的协调沟通，这点来说还是非常非常有担当的」；双方把争议细节展开得很细，「仔细研究了其中的认知偏差在哪」，因为「足够坦诚和努力想解决问题」，「最终达成了很好的共识，消除误解」，并表示「我们也希望汽车之家可以干得更好」。","traits":["先公开开炮","两天内收场","给对方留台阶","把仇说成误会","话不说绝"],"methods":["一条微博把事挑明：点名、给金额（几百万）、给时间（两年前）、给结论（0元购白嫖）","让私下压不住：公开发布，转发过千、评论两千，把处理权从对方手里拿走","谈成后立刻收手：两天后发文「达成共识，消除误解」，不追加、不继续爆料","把矛头从人挪到事：「仔细研究了其中的认知偏差在哪」——不谈谁坏，谈双方理解有偏差","主动给对方台阶：先夸「新的管理团队非常有担当」，再祝「汽车之家可以干得更好」"],"story":[{"t":"2026-10-19 23:23","d":"发博控诉汽车之家两年前以其名义卖重型游记节目、收入几百万却未告知，并要点名「0元购白嫖」"},{"t":"2026-10-20 至 21","d":"多位前员工、同行发文补充细节，事件持续发酵"},{"t":"2026-10-21 23:47","d":"发文称与汽车之家高管层沟通，双方坦诚复盘、找到认知偏差，达成共识、消除误解"}],"quotes":["汽车之家，你够黑的啊！两年前，汽车之家挂着韩路名义卖了重型游记节目，几百万的收入，从头到尾没跟我们说，并且希望0元购白嫖韩路。","新的管理团队还是很积极的协调沟通，这点来说还是非常非常有担当的。","双方把争议细节展开的非常详细，仔细研究了其中的认知偏差在哪。"],"writingUse":"写「公开开炮、又能体面收场的人」用这个。他的厉害之处不是敢骂，是骂完之后留了一扇门：先发一条转发上千的控诉把主动权拿走，两天后再用一条「达成共识」把门关上，还顺手夸对方新的管理团队有担当。这一套在商战里很常见——先把事闹大，再在谈判桌上换东西。写法上注意他从不评价对方人品，只说「认知偏差」，因为骂人会结仇，谈偏差不会。","sources":[{"publisher":"新浪新闻 · 财经网科技","title":"时间久远管理也换人，韩路说和汽车之家消除误解了","url":"https://www.sina.cn/news/detail/5356745555969614.html"},{"publisher":"腾讯新闻","title":"韩路和汽车之家迎来和解，双方已达成共识","url":"https://view.inews.qq.com/wxn/20261022A04D8300"}]},{"id":"enta-xpeng-lecture","name":"恩塔","alias":"说「老登」的 00 后产品经理","identity":"小鹏汽车 00 后产品经理","category":"社会切片","date":"2026-10-24","heat":68,"headline":"小鹏发布会上“00后”产品经理多次使用“老登”称呼、呼吁拒绝“登味审美” 事后致歉：有些话说得不合适 很内疚 跟大家说声对不起","summary":"小鹏一场新车发布会上，00 后产品经理恩塔多次强调「年轻人」「年轻审美」，并把「老登」当作反义词来对比、呼吁拒绝「登味审美」。何小鹏远程连线，特意说把舞台交给更年轻的产品团队。结果网友没记住新车功能和售价，只记住了这个词。次日她发布视频道歉：「有些话说得不合适，很内疚，跟大家说声对不起。」看看新闻的评论说得很直接：想出圈不能靠冒犯另一群人，这场「反老登」发布会反而把小鹏说成了「最老登的品牌」。","traits":["用标签制造对立","把年轻当卖点","翻车后迅速录视频","道歉只认语气不认逻辑"],"methods":["先立一个对立面：把「年轻人 / 年轻审美」和「老登」摆成反义词，让台下的人自己认领位置","把年龄段当卖点喊出来：反复强调「年轻人」，让发布会的主角从车变成团队","用公司背书放大音量：创始人远程连线，把舞台明确交给「更年轻的产品团队」","翻车后 24 小时内出视频：不写长文、不发通稿，用本人出镜承担","道歉只认语气、不认逻辑：「有些话说得不合适」——不解释为什么用这个词，也不承认标签本身有问题"],"story":[{"t":"2026-10-22 前后","d":"小鹏新车发布会，00 后产品经理恩塔多次使用「老登」作为年轻人的反义词，呼吁拒绝「登味审美」"},{"t":"发布会后","d":"片段出圈，讨论焦点从新车转向用词；何小鹏远程连线、把舞台交给年轻团队的表态也被翻出"},{"t":"2026-10-23","d":"恩塔发布视频道歉：「有些话说得不合适，很内疚，跟大家说声对不起」"}],"quotes":["有些话说得不合适，很内疚，跟大家说声对不起。"],"writingUse":"写「用力过猛的年轻人」用这个。她不是坏，是太想证明自己属于「新的一方」，于是把演讲变成了站队。最好写的是她的道歉：只承认「话说得不合适」，不承认「这个标签有问题」——因为在她心里，问题只是场合不对。这类角色适合写成主角身边那个能力不错、但总在关键时刻说错一句话的人；也可以写成「被公司推到台前挡枪的年轻人」，因为把舞台交给她的是老板，出来道歉的是她。","sources":[{"publisher":"网易 · 闪电新闻（转界面新闻）","title":"小鹏发布会上“00后”产品经理多次使用“老登”称呼、呼吁拒绝“登味审美” 事后致歉：有些话说得不合适 很内疚 跟大家说声对不起","url":"https://www.163.com/dy/article/L9UP1J6C0514CFC7.html"},{"publisher":"看看新闻 · 东方快评","title":"一句“老登”引争议！车企“出圈”不能靠“出界”","url":"https://www.kankanews.com/detail/xeyoj9VNZ29"}]},{"id":"huang-zitao-shengyin","name":"黄子韬","alias":"ACE-YOUNGKINGYOUNGBOSS","identity":"歌手 · 演员 · 经纪人公司老板","category":"娱乐圈","date":"2026-10-24","heat":71,"headline":"黄子韬直播回应争议：接受所有声音，希望大家都幸福","summary":"10月23日，黄子韬在直播中回应近期争议。他说：「其实最近真的有很多的声音，但是不管是好的声音还是不好的声音，我和我老婆都接受，希望大家在未来也能有一个非常美满的家庭，有一个喜欢、爱的人，能够幸福地生活。」此前一段时间，他的粉丝在超话里持续发问「是不是恨粉」，也出现「十年粉丝脱粉」的话题，争议围绕他与粉丝的关系展开。整场回应里，他没有解释任何一件具体的事，也没有指责任何一方，只把话收在「都接受」和一句祝福上。","traits":["把争议收成一句话","不解释细节","把两个人绑成一个单位","用祝福结束对话"],"methods":["先把所有声音都收进来：「不管是好的声音还是不好的声音，我和我老婆都接受」——不区分、不筛选，也不反驳","用「我和我老婆」把回应主体从「我」变成「我们」，让攻击面扩大也让人无从单独指责","不解释具体事件：整段话没有一件事实、没有一句澄清，把讨论从「发生过什么」挪到「以后怎样」","把话落到祝福上：「希望大家都能有一个美满的家庭」——用自己的处境替换对方的指责","说完就停：一场直播里只回应这一次，不追加、不连麦、不逐条反驳"],"story":[{"t":"2026-10 中旬","d":"粉丝在超话持续发问「是不是恨粉」，「十年粉丝脱粉」等话题发酵，争议围绕偶像与粉丝的关系"},{"t":"2026-10-23","d":"在直播中回应：「不管是好的声音还是不好的声音，我和我老婆都接受」，并祝大家有美满的家庭"}],"quotes":["其实最近真的有很多的声音，但是不管是好的声音还是不好的声音，我和我老婆都接受。","希望大家在未来也能有一个非常美满的家庭，有一个喜欢、爱的人，能够幸福地生活。"],"writingUse":"写「被粉丝审判的偶像」用这个。他的应对方式很值得写：不辩解、不逐条回应、不指责粉丝，只把所有的声音一次性收下，然后给一句祝福。这种姿态看着软，其实很强——他没有承认任何指控，也没有否认任何指控，只是把话题关掉。写法上注意那句「我和我老婆」：一个人扛不住的时候，把另一个人拉进来，既是保护也是绑定。适合写成被舆论逼到墙角、但始终不肯低头的角色。","sources":[{"publisher":"新浪新闻 · 现代快报","title":"黄子韬直播回应争议：接受所有声音，希望大家都幸福","url":"https://www.sina.cn/news/detail/5357288483196853.html"}]},{"id":"mao-buyi-wedding","name":"毛不易","alias":"婚礼致辞上热搜的歌手","identity":"歌手 · 词曲作者","category":"娱乐圈","date":"2026-10-25","heat":70,"headline":"歌手毛不易出席20多年好友婚礼致辞引争议：“虽然不是我的妻子”，但从校服到婚纱，是我生活中交集最多的人","summary":"10月20日晚，毛不易在北京出席相识二十多年的好友周佳奇的婚礼，并作为朋友上台致辞。他讲了两件旧事：高中时他厌学、情绪低落，当班长的佳奇跑到他家给他做了一顿菜；大学他在杭州实习，佳奇出差顺路，趁他上班把他的房间收拾干净。真正引发争议的是这一段——他提到两人从校服走到婚纱，「虽然不是我的妻子」，但从相识到今天，对方走的每一步他都看在眼里。舆论分成两派：一派认为婚礼的主场该属于新人，老友的分量压过了新郎；另一派认为他没讲套话，具体而真诚。10月24日，新娘公开回应，称毛不易是同学、挚友，也是她的娘家人，请大家理性。","traits":["用具体往事代替祝福套话","把二十年的分量摆上台","在别人的场子讲自己的账","一句话制造记忆点","本人始终不回应"],"methods":["不念套话，讲两件具体的事：她高中跑到他家做的那顿饭、大学趁他上班收拾的房间——全是细节，没有形容词","用时间线压场：初中认识、高中大学一路、先后到北京，二十多年，把友情讲成一条完整的线","在自己的祝福里放一个反差句：「从校服到婚纱，虽然不是我的妻子」——这句话被单独截出来传播","把「见证」说成双向的：她走的每一步他看在眼里，他走的每一步她也记在心里","把话题落到婚姻观上：说结婚在这个年龄和时代「意义已经越来越丰富」，把私人祝福拔到公共讨论","本人不回应：让视频和新人的说明去承接舆论，自己不追加任何解释"],"story":[{"t":"2026-10-20 晚","d":"在北京出席相识二十多年的好友周佳奇的婚礼，作为朋友上台致辞"},{"t":"2026-10-22 前后","d":"现场视频被传到网上，相关话题登上热搜，讨论集中在异性友谊边界与婚礼发言分寸"},{"t":"2026-10-24","d":"新娘周佳奇公开回应：毛不易是同学、挚友，也是她的娘家人，请大家理性；新郎呼吁不要断章取义"}],"quotes":["从校服到婚纱，虽然不是我的妻子。","她走的每一步，我都看在眼里；我走的每一步，她也记在心里。"],"writingUse":"写「在别人的场合讲自己的人」用这个。他不是要抢风头，是真情实感到收不住——二十年的细节太多了，一开口就停不下来。这种角色最好用的地方在于「他真的没恶意」，但场合不给他容错：婚礼的主角是新人，来宾的深情越具体，越显得越界。写他时给两个动作：一是只讲具体的事（那顿饭、那间房），不讲任何道理；二是被质疑后完全不解释，让新娘出来打圆场。这种「当事人沉默、旁人收场」的结构，比当场道歉更有戏。","sources":[{"publisher":"腾讯新闻","title":"歌手毛不易出席20多年好友婚礼致辞引争议：“虽然不是我的妻子”，但从校服到婚纱，是我生活中交集最多的人","url":"https://news.qq.com/rain/a/20261024A04VW700"},{"publisher":"新浪新闻","title":"毛不易在婚礼上具体说了什么引发网友争议？","url":"https://k.sina.com.cn/article_7879776356_1d5abd864068017zp0.html"}]},{"id":"yu-tao-xpeng","name":"于涛","alias":"「托马斯电火车」","identity":"小鹏集团副总裁","category":"商界狠人","date":"2026-10-26","heat":69,"headline":"小鹏副总裁于涛回应“老登”争议：系团队内部调侃，未指向外部用户","summary":"10月24日，小鹏集团副总裁于涛用社交账号「托马斯电火车」发长文，回应产品经理恩塔在 MONA L05 发布会上多次使用「老登」引发的争议。他不争这个词是否冒犯，直接把指向改掉：这是产品团队对内部核心负责人的调侃，完全没有指向外部用户；几位被称为「老登」的负责人「没一个不悦，反而在
